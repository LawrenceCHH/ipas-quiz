 1, "evidence": "Wikipedia K-means: requires k specified upfront, sensitive to initialization and outliers, biased toward convex/spherical clusters; mini-batch / GPU variants exist for scale."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** K-Means 有許多大規模/GPU 實作(如 Mini-Batch K-Means、FAISS k-means);其他三項皆是真實限制。\n\n**其他選項為何錯:**\n- A. K-Means 真實缺點。\n- B. K-Means 真實缺點。\n- C. K-Means 真實缺點。\n- D. ✓ 正解(不是限制)\n\n**記憶要點:** K-Means 困擾:K 要先給、初值敏感、離群敏感、凸形偏好。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q17", "topic": "ML/Unsupervised", "question_text": "DBSCAN 演算法相較 K-Means 的主要優勢為何?", "options": {"A": "需要事先指定 K", "B": "能找到非凸形群集且自動識別離群點(noise),不需事先指定群數", "C": "對初始值非常敏感", "D": "只能處理低維資料"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/DBSCAN", "page": 1, "evidence": "Wikipedia DBSCAN: density-based clustering that can find arbitrarily shaped clusters and labels low-density points as noise; does not require specifying the number of clusters."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** DBSCAN 以 ε-鄰域密度定義 core/border/noise,無需 K、可找任意形狀群、輸出離群點標記。\n\n**其他選項為何錯:**\n- A. K-Means 需 K,DBSCAN 不需。\n- B. ✓ 正解\n- C. 反向。\n- D. 高維仍可,但 ε 較難調。\n\n**記憶要點:** DBSCAN = Density + ε + minPts;處理任意形狀 + noise detection。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q18", "topic": "DL/Basics", "question_text": "下列關於 ReLU(Rectified Linear Unit)啟動函數的敘述,何者最正確?", "options": {"A": "ReLU(x) = max(0, x),計算簡單、能緩解梯度消失,但存在「dying ReLU」問題", "B": "ReLU 是線性函數,網路全用 ReLU 仍等價單層線性", "C": "ReLU 輸出範圍是 [-1, 1]", "D": "ReLU 與 sigmoid 完全等價"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Rectifier_(neural_networks)", "page": 1, "evidence": "Wikipedia Rectifier: ReLU(x) = max(0,x); non-linear, computationally cheap, mitigates vanishing gradient; suffers from 'dying ReLU' where neurons output zero for all inputs."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** ReLU 簡單高效,在 x>0 時梯度為 1,正向解決 sigmoid/tanh 梯度消失;但 x≤0 時梯度為 0,可能造成神經元永久不啟動(dying)。\n\n**其他選項為何錯:**\n- B. ReLU 是分段線性,整體非線性。\n- C. ReLU ∈ [0, ∞)。\n- D. 不等價。\n- A. ✓ 正解\n\n**記憶要點:** ReLU 優:快、無消失;缺:dying ReLU → LeakyReLU/GELU 改善。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q19", "topic": "DL/Basics", "question_text": "下列關於「反向傳播(Backpropagation)」的敘述,何者最正確?", "options": {"A": "Backprop 利用鏈式法則,從輸出層往輸入層逐層計算損失對每個權重的梯度", "B": "Backprop 不需要任何微分", "C": "Backprop 只能用於 CNN", "D": "Backprop 是一種正則化方法"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Backpropagation", "page": 1, "evidence": "Wikipedia Backpropagation: computes the gradient of the loss function with respect to each weight by the chain rule, computing the gradient one layer at a time, iterating backward from the output."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Backprop 是基於微積分鏈式法則的演算法,讓深度網路能以反向方向逐層算出每個參數梯度。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 核心就是微分。\n- C. 任何可微網路皆可用。\n- D. 是學習演算法,非正則化。\n\n**記憶要點:** Backprop = Chain rule + 反向逐層;Autograd 自動實作。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q20", "topic": "DL/Basics", "question_text": "下列哪一種權重初始化方法對「ReLU」啟動函數最為合適?", "options": {"A": "全部初始化為 0", "B": "Kaiming/He Initialization(考慮 ReLU 半邊截斷的變異數修正)", "C": "全部初始化為相同非零常數", "D": "極小亂數(σ=10⁻¹⁰)"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/1502.01852", "page": 1, "evidence": "He et al. (2015) \"Delving Deep into Rectifiers\": He / Kaiming initialization scales weights by √(2/n_in), specifically designed for ReLU-family activations."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** He init Var(W) = 2/n_in 抵消 ReLU 把一半輸出歸零所造成的變異減半,維持各層訊號變異穩定。Xavier 適合 tanh,He 適合 ReLU。\n\n**其他選項為何錯:**\n- A. 全 0 對稱不破對稱性問題,所有神經元等價。\n- B. ✓ 正解\n- C. 同上對稱性問題。\n- D. 訊號迅速消失。\n\n**記憶要點:** ReLU → He init;tanh/sigmoid → Xavier init。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q21", "topic": "DL/CNN", "question_text": "CNN 中卷積層(Conv Layer)的「權重共享(Weight Sharing)」帶來的主要好處為何?", "options": {"A": "讓網路參數隨輸入大小成倍增長", "B": "大幅減少參數量、強制平移不變性(Translation Invariance/Equivariance),適合影像特徵抽取", "C": "讓網路完全不能學習", "D": "把卷積轉成全連接"}, "correct_answer": "B", "source": {"file": "subjects/3-ml/study-guide.pdf", "page": 95, "evidence": "學習指引 4.3 節說明卷積層透過權重共享與稀疏連結,大幅降低參數量並具備平移不變性,適合影像處理。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 同一 filter 滑過整張影像 → 參數大降、且不論物件在哪都能用同一組權重抽特徵(translation equivariance)。\n\n**其他選項為何錯:**\n- A. 反向。\n- B. ✓ 正解\n- C. 描述錯誤。\n- D. 描述錯誤。\n\n**記憶要點:** CNN 三大特性:Local conn + Weight sharing + Pooling。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q22", "topic": "DL/CNN", "question_text": "ResNet 引入的「殘差連接(Residual Connection / Skip Connection)」主要解決什麼問題?", "options": {"A": "讓影像更銳利", "B": "緩解極深網路的梯度消失/退化問題,使「越深越好」成為可能", "C": "完全取代卷積", "D": "讓網路只能有 5 層"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/1512.03385", "page": 1, "evidence": "He et al. (2015) \"Deep Residual Learning for Image Recognition\": residual connections enable training of networks substantially deeper than previously possible by easing optimization (mitigating degradation)."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 殘差連接讓梯度可繞過幾層直接回傳,訓深網路時不再因「退化(degradation)」表現變差;ResNet-152、ResNet-50 之所以可行皆賴此設計。\n\n**其他選項為何錯:**\n- A. 與殘差連接目的不符。\n- C. 與殘差連接目的不符。\n- D. 與殘差連接目的不符。\n- B. ✓ 正解\n\n**記憶要點:** Residual = 直連旁路,使「身分映射」易學,深網不再退化。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q23", "topic": "DL/CNN", "question_text": "下列關於「池化(Pooling)」層的敘述,何者最正確?", "options": {"A": "Pooling 會增加可學習參數", "B": "Pooling 為下採樣操作,本身無可學習參數;Max Pooling 取區域最大,Average Pooling 取區域平均", "C": "Pooling 與卷積完全相同", "D": "Pooling 必須在第一層使用"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Convolutional_neural_network", "page": 1, "evidence": "Wikipedia CNN: pooling layers perform downsampling along spatial dimensions, with no learnable parameters; max pooling and average pooling are the most common forms."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Pooling 是無參數下採樣,主要功能是降空間維度與引入平移不變性。\n\n**其他選項為何錯:**\n- A. 無學習參數。\n- B. ✓ 正解\n- C. 卷積有 filter 參數。\n- D. 通常與卷積層交替。\n\n**記憶要點:** Pooling = 下採樣 + 無參數;Max 保留顯著、Avg 平滑。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q24", "topic": "DL/RNN", "question_text": "LSTM(Long Short-Term Memory)相較於 vanilla RNN 的主要創新為何?", "options": {"A": "完全取消所有閘控", "B": "引入 input gate、forget gate、output gate 與 cell state,以閘控資訊流,有效緩解長序列梯度消失問題", "C": "讓 RNN 變成 CNN", "D": "去掉所有非線性"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Long_short-term_memory", "page": 1, "evidence": "Wikipedia LSTM: introduces gates (input, forget, output) and a cell state that allows gradients to flow over many timesteps, mitigating vanishing gradient issues of vanilla RNNs."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** LSTM 的三閘控+cell state 設計讓梯度沿 cell state 線性流動,大幅緩解長距離依賴的梯度消失。\n\n**其他選項為何錯:**\n- A. 三閘是核心。\n- B. ✓ 正解\n- C. 不正確。\n- D. 不正確。\n\n**記憶要點:** LSTM = 3 gates(input/forget/output)+ cell state;GRU 是 simplified 版。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q25", "topic": "DL/Transformer", "question_text": "Self-Attention 的核心計算為 Attention(Q,K,V) = softmax(QKᵀ/√d_k) V,其中除以 √d_k 的目的為何?", "options": {"A": "純粹美觀", "B": "避免 QKᵀ 在 d_k 大時數值過大,使 softmax 進入飽和區(梯度趨 0)", "C": "讓計算更慢", "D": "把矩陣變成向量"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/1706.03762", "page": 1, "evidence": "Vaswani et al. (2017) §3.2.1: We scale dot products by 1/√d_k to counteract the effect that for large values of d_k, the dot products grow large in magnitude, pushing softmax into regions with extremely small gradients."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** d_k 越大,點積數值越大,softmax 容易飽和導致梯度幾乎為 0,除以 √d_k 使其數值穩定。\n\n**其他選項為何錯:**\n- A. 是必要設計。\n- B. ✓ 正解\n- C. 描述錯誤。\n- D. 描述錯誤。\n\n**記憶要點:** Scaled Dot-Product Attention 的「Scaled」就是 √d_k。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q26", "topic": "DL/Transformer", "question_text": "下列關於 Transformer Encoder 與 Decoder 差異的敘述,何者最正確?", "options": {"A": "兩者完全相同", "B": "Decoder 額外有「Masked Self-Attention」防止看未來資訊,以及「Encoder-Decoder Cross-Attention」連接編碼器輸出", "C": "Encoder 不需要 attention", "D": "Decoder 沒有 FFN"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/1706.03762", "page": 1, "evidence": "Vaswani et al. (2017) §3.1: The decoder is composed of two attention sublayers — masked self-attention to prevent positions from attending to subsequent positions, and encoder–decoder attention."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Decoder 多了兩件事:masked self-attention(因果遮罩)避免泄漏未來資訊、cross-attention 讓 decoder 看 encoder 的輸出。\n\n**其他選項為何錯:**\n- A. 結構不同。\n- B. ✓ 正解\n- C. Encoder 核心就是 self-attention。\n- D. Decoder 也有 FFN。\n\n**記憶要點:** Encoder=Self-Attn + FFN;Decoder=Masked Self-Attn + Cross-Attn + FFN。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q27", "topic": "DL/Optimization", "question_text": "Adam 優化器的核心想法為何?", "options": {"A": "純隨機梯度,不考慮歷史", "B": "結合 Momentum(梯度一階矩 EMA)與 RMSProp(梯度二階矩 EMA)做 per-parameter 自適應學習率", "C": "完全取消學習率", "D": "二階海森矩陣全展開"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/1412.6980", "page": 1, "evidence": "Kingma & Ba (2014) \"Adam: A Method for Stochastic Optimization\": Adam combines bias-corrected estimates of the first moment (momentum) and second raw moment (RMSProp) of the gradients to compute per-parameter adaptive learning rates."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Adam = Momentum + RMSProp + bias correction;每個參數有自己的學習率,實務上常用。\n\n**其他選項為何錯:**\n- A. 描述錯誤。\n- C. 描述錯誤。\n- D. 描述錯誤。\n- B. ✓ 正解\n\n**記憶要點:** Adam = 一階(momentum) + 二階(RMSProp) + bias 校正;常用 lr=1e-3。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q28", "topic": "DL/Optimization", "question_text": "下列關於「學習率排程(Learning Rate Schedule)」的敘述,何者「不正確」?", "options": {"A": "Warmup 在訓練初期逐步提高 LR,可穩定初期訓練", "B": "Cosine Decay 讓 LR 隨訓練步數以餘弦曲線衰減", "C": "Step Decay 在固定 step 處將 LR 減半或乘以衰減係數", "D": "Schedule 永遠應該讓 LR 越大越好"}, "correct_answer": "D", "source": {"file": "https://en.wikipedia.org/wiki/Learning_rate", "page": 1, "evidence": "Wikipedia Learning rate: common schedules include warmup, step decay, exponential decay, cosine annealing; aim is to use larger LR early and smaller LR later to refine."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** 多數 schedule 是「先大後小」精修,並非越大越好;太大會震盪/發散。\n\n**其他選項為何錯:**\n- A. 皆為標準 schedule 設計。\n- B. 皆為標準 schedule 設計。\n- C. 皆為標準 schedule 設計。\n- D. ✓ 正解(錯誤敘述)\n\n**記憶要點:** Warmup → Peak → Decay 是典型 LR schedule;Adam + warmup + cosine 是 Transformer 經典組合。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q29", "topic": "DL/Optimization", "question_text": "下列哪一項是「梯度爆炸(Exploding Gradient)」最常見的緩解方法?", "options": {"A": "完全不訓練", "B": "Gradient Clipping(梯度裁剪,將梯度範數限制在閾值內)", "C": "把所有權重設為零", "D": "完全去掉啟動函數"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Gradient_clipping", "page": 1, "evidence": "Wikipedia: gradient clipping limits the norm of gradients to a maximum threshold, commonly used in RNN/LSTM training to prevent exploding gradients."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Gradient Clipping 是 RNN/Transformer 訓練常規,把過大的梯度範數縮回閾值,避免一次大跳偏離。\n\n**其他選 . 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Lasso=L1=稀疏=特徵選擇;Ridge=L2=平滑=多重共線性;ElasticNet=兩者混合。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q41", "topic": "ML/Supervised", "question_text": "下列哪一項任務「最不屬於」監督式學習(Supervised Learning)?", "options": {"A": "依歷史房屋資料預測房價", "B": "依貼上標籤的影像訓練狗種分類器", "C": "對未標註的客戶交易資料做分群,找出消費者類型", "D": "依過去病例預測是否復發"}, "correct_answer": "C", "source": {"file": "https://en.wikipedia.org/wiki/Supervised_learning", "page": 1, "evidence": "Wikipedia: Supervised learning requires labeled training data (input-output pairs); clustering on unlabeled data is unsupervised."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** 沒有標籤的分群是 unsupervised(K-Means、DBSCAN)。其他三項皆有明確標籤(房價、狗種、復發)。\n\n**其他選項為何錯:**\n- A. 監督式學習。\n- B. 監督式學習。\n- D. 監督式學習。\n- C. ✓ 正解\n\n**記憶要點:** 有 label = supervised;無 label = unsupervised;部份 label = semi-supervised。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q42", "topic": "ML/Algorithms", "question_text": "下列關於 Random Forest(隨機森林)的「隨機」來源,何者「不包括」?", "options": {"A": "Bootstrap 樣本(Bagging:每棵樹隨機抽樣資料)", "B": "每次分裂時隨機選一子集特徵作為分裂候選", "C": "隨機改變樣本標籤", "D": "建立大量決策樹"}, "correct_answer": "C", "source": {"file": "https://en.wikipedia.org/wiki/Random_forest", "page": 1, "evidence": "Wikipedia Random forest: randomness sources are (1) bootstrap sampling of training data and (2) random feature subset at each split; labels are NOT changed."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** RF 不會改標籤;若改標籤就破壞了學習訊號。\n\n**其他選項為何錯:**\n- A. RF 真實設計。\n- B. RF 真實設計。\n- D. RF 真實設計。\n- C. ✓ 正解(不屬於)\n\n**記憶要點:** RF 兩大隨機:Bootstrap(資料)+ 特徵隨機子集(分裂)。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q43", "topic": "DL/Basics", "question_text": "下列關於 Batch Normalization(批次正規化)的敘述,何者最正確?", "options": {"A": "對 mini-batch 內每個特徵維度做正規化(零均值、單位變異),再以可學習的 γ、β 縮放偏移,可加速訓練並具輕微正則化效果", "B": "完全取代啟動函數", "C": "只能用於 RNN", "D": "讓網路無法訓練"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/1502.03167", "page": 1, "evidence": "Ioffe & Szegedy (2015) \"Batch Normalization\": normalizes activations of each layer for each mini-batch to zero mean / unit variance, learns affine transform γ, β; accelerates training and acts as a mild regularizer."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** BN 透過減少 internal covariate shift,可用較大 LR 訓練、加速收斂、提供輕度正則化;γ、β 讓網路保留表達彈性。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n\n**記憶要點:** BN = 每維 normalize + γβ 還原;RNN 通常用 LayerNorm。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q44", "topic": "DL/Basics", "question_text": "下列哪一個損失函數最適合「二元分類」?", "options": {"A": "Mean Squared Error", "B": "Binary Cross-Entropy(Log Loss)", "C": "Hinge Loss(僅適合 SVM)", "D": "KL Divergence 對機率分佈"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Cross_entropy", "page": 1, "evidence": "Wikipedia Cross entropy: binary cross-entropy (log loss) is the standard loss for binary classification with sigmoid outputs."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 二元分類最常用 BCE = −[y log p + (1−y) log(1−p)],搭配 sigmoid 輸出,梯度形式優美。\n\n**其他選項為何錯:**\n- A. MSE 對分類不合理,梯度也較差。\n- B. ✓ 正解\n- C. Hinge 是 SVM 設計。\n- D. KL 處理分佈,單純二類仍以 BCE 為主。\n\n**記憶要點:** 二類=BCE+Sigmoid;多類=CE+Softmax;迴歸=MSE/MAE。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q45", "topic": "Privacy/Compliance", "question_text": "下列關於「差分隱私(Differential Privacy, DP)」的敘述,何者最正確?", "options": {"A": "DP 通常是在演算法輸出加入精心設計的雜訊(如 Laplace/Gaussian),使單一資料點是否存在難以辨識,提供可量化的隱私保證", "B": "DP 完全不需要任何雜訊", "C": "DP 與隱私無關", "D": "DP 只能用於影像"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Differential_privacy", "page": 1, "evidence": "Wikipedia Differential privacy: a system is (ε, δ)-DP if adding *為什麼 A 是正解:** Demographic Parity 要求各群體被「預測為正」的比例相同,不考慮真實標籤。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** 三大公平準則:Demographic Parity、Equalized Odds、Predictive Parity;三者通常不可能同時滿足(不可能定理)。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q48", "topic": "Bias/Fairness", "question_text": "下列哪一項「最可能」是 ML 模型偏見(Bias)的「資料層」來源?", "options": {"A": "訓練資料中某弱勢族群代表性嚴重不足(under-representation)", "B": "GPU 廠牌不同", "C": "螢幕亮度設定", "D": "辦公室溫度"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Algorithmic_bias", "page": 1, "evidence": "Algorithmic bias: a major source is biased or unrepresentative training data — under-representation of minority groups causes models to perform poorly on them."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 弱勢族群代表性不足 → 模型對其學得不夠 → 預測偏差。經典案例:Joy Buolamwini 顯示商用人臉辨識對深膚色女性錯誤率高。\n\n**其他選項為何錯:**\n- B. 與資料偏見無關。\n- C. 與資料偏見無關。\n- D. 與資料偏見無關。\n- A. ✓ 正解\n\n**記憶要點:** Bias 來源:資料(代表性、標註)、演算法(目標、特徵)、部署(回饋迴路)。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q49", "topic": "Modeling/Selection", "question_text": "下列何者「最不適合」用於「線性可分(Linearly Separable)」的二類分類問題作為起手式?", "options": {"A": "邏輯迴歸(Logistic Regression)", "B": "線性 SVM", "C": "簡單的 Perceptron", "D": "12 層的深度卷積網路 + 大量資料增強"}, "correct_answer": "D", "source": {"file": "https://en.wikipedia.org/wiki/Occam%27s_razor", "page": 1, "evidence": "Occam's razor in ML: choose the simplest model that adequately fits the data; using a deep network on a linearly separable problem is unnecessarily complex."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** 線性可分問題用線性模型即可達到完美分類,投入大型深度網路屬過度工程,且更易過擬合、難解釋。\n\n**其他選項為何錯:**\n- A. 都是線性可分問題的合適模型。\n- B. 都是線性可分問題的合適模型。\n- C. 都是線性可分問題的合適模型。\n- D. ✓ 正解(殺雞用牛刀)\n\n**記憶要點:** Occam's razor:簡單模型優先;線性可分問題用線性模型。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q50", "topic": "Eval/Metrics", "question_text": "在「多類別分類(Multi-class Classification)」中,以下哪一種「macro 平均」與「micro 平均」F1 的差別敘述最正確?", "options": {"A": "Macro F1 對每類獨立計算 F1 再平均,等權重對待每類;Micro F1 把全部 TP/FP/FN 加總後算 F1,對大類別更敏感", "B": "兩者完全相同", "C": "Macro F1 一定大於 Micro F1", "D": "Micro F1 只考慮最少的那一類"}, "correct_answer": "A", "source": {"file": "https://scikit-learn.org/stable/modules/model_evaluation.html#precision-recall-and-f-measures", "page": 1, "evidence": "scikit-learn: macro-averaged F1 computes F1 per class then averages (equal weight); micro-averaged F1 aggregates TP/FP/FN over all classes, dominated by large classes."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Macro 平等對待每類別,小類別也有發言權;Micro 把所有預測一起算,大類別主導結果。Weighted 是按樣本數加權。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** 不平衡多類別評估:Macro 看公平、Micro 看整體、Weighted 按比例。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q51", "topic": "ML/Imbalanced", "question_text": "處理嚴重類別不平衡(例:詐欺交易 1%)的分類問題時,下列哪一項做法「最直接」針對問題本身,而非僅事後評估?", "options": {"A": "只盲目提高 Accuracy 為訓練目標", "B": "對少數類別做 over-sampling(如 SMOTE)、對多數類別做 under-sampling,或在損失函數中加入 class_weight", "C": "把所有樣本都標成多數類", "D": "直接放棄訓練"}, "correct_answer": "B", "source": {"file": "https://imbalanced-learn.org/stable/introduction.html", "page": 1, "evidence": "imbalanced-learn docs: resampling techniques (over-sampling with SMOTE/ADASYN, under-sampling) and cost-sensitive learning via class_weight are standard mitigation strategies for imbalanced datasets."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 直接從資料/損失層面處理:Oversampling 增加少數類別代表性、Undersampling 減少多數類別、class_weight 對少數類加重損失。\n\n**其他選項為何錯:**\n- A. Accuracy 在不平衡時嚴重誤導。\n- B. ✓ 正解\n- C. 反例。\n- D. 反例。\n\n**記憶要點:** 不平衡三招:Resampling(SMOTE/RUS)、Class weight、Threshold tuning。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q52", "topic": "ML/Imbalanced", "question_text": "下列關於 SMOTE(Synthetic Minority Over-sampling Technique)的敘述,何者最正確?", "options": {"A": "SMOTE 從原資料隨機複製少數類別樣本", "B": "SMOTE 在少數類別樣本與其 K 近鄰之間進行線性插值合成新樣本,以擴增少數類別", "C": "SMOTE 只能用於迴歸問題", "D": "SMOTE 會刪除多數類別樣本"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/1106.1813", "page": 1, "evidence": "Chawla et al. (2002) SMOTE: synthetic samples are generated by interpolating between a minority-class instance and its k nearest minority-class neighbors."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** SMOTE 不是複製,而是在「少數樣本與 K 近鄰」之間取 random α∈[0,1] 線性插值,擴大少數類別決策邊界。\n\n**其他選項為何錯:**\n- A. 複製是 ROS,不是 SMOTE。\n- B. ✓ 正解\n- C. 用於分類。\n- D. 不刪多數樣本(那是 RUS)。\n\n**記憶要點:** SMOTE = K 近鄰線性插值合成;ADASYN 是 SMOTE 改良強調困難區。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q53", "topic": "ML/Imbalanced", "question_text": "在嚴重不平衡的二類分類中,模型輸出機率後,「閾值調整(Threshold Tuning)」的主要動機為何?", "options": {"A": "想要更慢的訓練速度", "B": "預設 0.5 對不平衡並非最佳;依業務需要(高 Recall 或高 Precision)選擇不同閾值,在 PR/ROC 曲線上找最佳工作點", "C": "閾值與業務指標無關", "D": "閾值愈高愈好"}, "correct_answer": "B", "source": {"file": "https://scikit-learn.org/stable/modules/calibration.html", "page": 1, "evidence": "scikit-learn: threshold of 0.5 is rarely optimal under class imbalance; choose threshold to optimize business cost / target metric via precision-recall curve."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 對醫療(漏診代價高)應拉低閾值換 Recall;對冷郵件(誤判代價高)拉高閾值換 Precision。\n\n**其他選項為何錯:**\n- A. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- B. ✓ 正解\n\n**記憶要點:** 閾值 = Recall ↔ Precision 的拉桿;依業務代價選擇工作點。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q54", "topic": "ML/Imbalanced", "question_text": "Focal Loss(Lin et al., 2017)解決物件偵測等「極度不平衡」場景時,其數學形式 FL = -(1-p)^γ · log(p) 中的 γ 主要功用為何?", "options": {"A": "讓所有樣本權重相同", "B": "downweight 易分類樣本(p 大時 (1-p)^γ 小),迫使模型聚焦難分類樣本", "C": "增加正則化", "D": "把分類變迴歸"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/1708.02002", "page": 1, "evidence": "Lin et al. (2017) \"Focal Loss for Dense Object Detection\": modulating factor (1-p)^γ down-weights easy examples and focuses training on hard, misclassified examples."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** γ>0 時,易例(p→1)的損失被壓很低、難例的損失保留,讓梯度集中在尚未學好的樣本。\n\n**其他選項為何錯:**\n- A. 反向。\n- B. ✓ 正解\n- C. 不是正則化。\n- D. 仍是分類損失。\n\n**記憶要點:** Focal Loss = CE × (1-p)^γ;γ 越大,越懶得理會已分對的樣本。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q55", "topic": "ML/Anomaly", "question_text": "Isolation Forest 異常偵測演算法的核心想法為何?", "options": {"A": "異常點容易被「隨機切分」用較少次分裂就孤立出來,因此用「分裂路徑長度短」識別異常", "B": "異常點分裂路徑必然長", "C": "把所有資料當成異常", "D": "用標籤監督異常"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Isolation_forest", "page": 1, "evidence": "Wikipedia Isolation Forest: anomalies are easier to isolate by random splits, so they have shorter average path length in a random tree; this is the anomaly score."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** iForest 不算距離/密度,而是看「隨機切資料」時樣本多快被孤立,離群點通常很快(路徑短)。\n\n**其他選項為何錯:**\n- B. 反向。\n- C. 錯誤,iForest 是非監督的。\n- D. 錯誤,iForest 是非監督的。\n- A. ✓ 正解\n\n**記憶要點:** iForest = 隨機切+路徑短=異常;高效、大資料友善。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q56", "topic": "ML/Anomaly", "question_text": "用 Autoencoder 做「重建式異常偵測(Reconstruction-based Anomaly Detection)」的原理為何?", "options": {"A": "若資料分佈與訓練分佈相近,重建誤差小;若為異常,重建誤差大,可作為異常分數", "B": "Autoencoder 完全無法用來做異常偵測", "C": "重建誤差永遠為 0", "D": "需要手動標註異常"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Autoencoder", "page": 1, "evidence": "Wikipedia Autoencoder: when trained on normal data, autoencoders fail to reconstruct anomalous inputs well, making reconstruction error a natural anomaly score."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** AE 學會壓縮+重建常態樣本,異常輸入因不在學過的流形上而重建誤差較大,以閾值切分異常。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** AE 異常偵測 = 重建誤差 > 閾值 → 異常;非監督。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q57", "topic": "ML/Anomaly", "question_text": "One-Class SVM 用於異常偵測時的核心策略為何?", "options": {"A": "在特徵空間中學一個包覆「正常樣本」的最小超球/超平面,落於其外者視為異常", "B": "需要同等數量的正常與異常樣本", "C": "本質上只能做二類監督", "D": "輸出總是 0"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/One-class_classification", "page": 1, "evidence": "Wikipedia One-class classification: One-Class SVM (Schölkopf et al.) learns a decision boundary that encloses the normal data in feature space; points outside are anomalies."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** OC-SVM 只用「正常樣本」學決策邊界(經 kernel 投影到 RKHS),outside = 異常,屬非監督/半監督。\n\n**其他選項為何錯:**\n- B. 不需異常標籤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** OC-SVM = 學「常態包絡」、區分內/外。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q58", "topic": "DL/Transfer", "question_text": "下列關於「遷移學習(Transfer Learning)」的敘述,何者最正確?", "options": {"A": "需要從零開始訓練模型", "B": "先在大規模資料上預訓練(如 ImageNet/通用語料),再針對下游小資料任務微調,常能在資源有限時顯著提升表現", "C": "預訓練模型永遠不可微調", "D": "與大規模資料無關"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Transfer_learning", "page": 1, "evidence": "Wikipedia Transfer learning: pretrain on a source task with abundant data, then transfer/fine-tune on a target task with limited data; widely used in vision and NLP."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Transfer learning 借用大資料學到的通用特徵,小資料任務只需微調 = 更快收斂、更好泛化。\n\n**其他選項為何錯:**\n- A. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- B. ✓ 正解\n\n**記憶要點:** Transfer = Pretrain(大) + Fine-tune(小);ImageNet/BERT/GPT 都是經典基底。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q59", "topic": "DL/Transfer", "question_text": "進行遷移學習時,「凍結(Freezing)前幾層 + 只訓練後幾層」策略最適合下列哪一種情境?", "options": {"A": "下游資料極多,且分佈與預訓練資料差異很大", "B": "下游資料少,且分佈與預訓練資料相近(底層特徵可重用)", "C": "完全沒有預訓練模型可用", "D": "沒有 GPU"}, "correct_answer": "B", "source": {"file": "https://cs231n.github.io/transfer-learning/", "page": 1, "evidence": "Stanford CS231n: when target dataset is small and similar to source, freeze early layers and fine-tune later layers (or use as feature extractor)."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 底層常是邊緣/紋理等通用特徵可重用;資料少時不要訓太多參數避免過擬合。\n\n**其他選項為何錯:**\n- A. 資料多 + 分佈差大 → 全量 fine-tune 較適合。\n- C. 與凍結無關。\n- D. 與凍結無關。\n- B. ✓ 正解\n\n**記憶要點:** 資料少+像 → freeze 底層 + tune 頂層;資料多+不像 → 全量微調或重訓。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q60", "topic": "DL/Regularization", "question_text": "Dropout 在訓練與推論期的行為差異為何?", "options": {"A": "訓練期隨機丟棄神經元、推論期保留所有神經元並做相應縮放(inverted dropout)", "B": "訓練期不丟、推論期才丟", "C": "兩階段行為相同", "D": "Dropout 是訓練資料增強"}, "correct_answer": "A", "source": {"file": "https://www.jmlr.org/papers/v15/srivastava14a.html", "page": 1, "evidence": "Srivastava et al. (2014) Dropout: at training time, units are randomly dropped with probability p; at test time, weights are scaled (or inverted scaling at train time) to compensate."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Train 時隨機丟、Inference 時全用(現代實作多用 inverted dropout 在訓練時除以 (1-p) 自動補償)。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n\n**記憶要點:** Dropout train↔eval 不同;PyTorch 用 model.train() / model.eval() 切換。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q61", "topic": "DL/Regularization", "question_text": "下列何者為「Early Stopping」防止過擬合的核心做法?", "options": {"A": "在訓練前就終止訓練", "B": "在每個 epoch 監看驗證損失,當其連續幾個 epoch 未改善即停止訓練,保留驗證最佳權重", "C": "永遠不停止", "D": "隨機刪除權重"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Early_stopping", "page": 1, "evidence": "Wikipedia Early stopping: training stops when validation performance stops improving for a number of epochs (patience), often combined with checkpointing of best weights."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Early Stopping 用驗證集監看,過了「patience」未改善即停;隱含的 regularization 是「限制有效訓練步數」。\n\n**其他選項為何錯:**\n- A. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- B. ✓ 正解\n\n**記憶要點:** Early Stopping = Validation loss + patience + restore_best_weights。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q62", "topic": "DL/Regularization", "question_text": "下列關於「Weight Decay(權重衰減)」與「L2 正則化」的關係,何者最正確?", "options": {"A": "在 SGD 設定下,Weight Decay ≈ L2 正則化;但在 Adam 等自適應優化器下兩者並不等價(故有 AdamW)", "B": "兩者完全相同,沒有任何差別", "C": "Weight Decay 只能用於 CNN", "D": "L2 正則化會把所有權重變為 0"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/1711.05101", "page": 1, "evidence": "Loshchilov & Hutter (2019) \"Decoupled Weight Decay Regularization\": weight decay and L2 regularization are equivalent under vanilla SGD but differ under adaptive methods (Adam); AdamW decouples them."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** SGD 下兩者等價;Adam 下因每參數調整學習率,把 L2 加在 loss 與直接 decay 權重結果不同 → AdamW 解此問題。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** AdamW = Adam + Decoupled WD,Transformer 訓練常用。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q63", "topic": "DL/Regularization", "question_text": "Batch Normalization 為何「兼具一定的正則化效果」?", "options": {"A": "因為 mini-batch 統計量帶有雜訊,等同對訓練輸入引入隨機性", "B": "因為 BN 完全去除損失", "C": "因為 BN 完全等價於 Dropout", "D": "因為 BN 必須與 L1 配合"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/1502.03167", "page": 1, "evidence": "Ioffe & Szegedy (2015): the mini-batch noise in batch normalization acts as a form of regularization, sometimes reducing the need for Dropout."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** mini-batch 算的均值/變異是估計值,有 noise;這種雜訊作用類似 Dropout,提供輕度正則化。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** BN 副作用:加速收斂 + 輕度 regularization。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q64", "topic": "DL/SelfSupervised", "question_text": "下列關於自監督學習(Self-Supervised Learning, SSL)的敘述,何者最正確?", "options": {"A": "完全需要人工標籤", "B": "用資料本身產生監督訊號(pretext task,如預測遮罩、對比、旋轉、下一句),不需人工標註", "C": "只是強化學習的別名", "D": "比監督學習更需要標籤"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Self-supervised_learning", "page": 1, "evidence": "Wikipedia Self-supervised learning: derives supervision from the data itself via pretext tasks (masked prediction, contrastive learning, rotation prediction), without manual labels."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** SSL 用資料自帶結構造 task(MLM、SimCLR、MAE、CPC、BYOL),學通用表徵,常作為 pretraining。\n\n**其他選項為何錯:**\n- A. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- B. ✓ 正解\n\n**記憶要點:** SSL = 不標也能學;BERT/MAE/SimCLR 皆是經典例子。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q65", "topic": "DL/SelfSupervised", "question_text": "對比學習(Contrastive Learning,如 SimCLR、MoCo)的核心想法為何?", "options": {"A": "把正例(同一資料的不同 augmentation)拉近,把負例(其他資料)推開,於 embedding 空間中分佈良好", "B": "把所有樣本拉到同一點", "C": "把所有樣本散到隨機位置", "D": "與資料增強無關"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/2002.05709", "page": 1, "evidence": "Chen et al. (2020) SimCLR: contrastive objective brings differently augmented views of the same image close in embedding space and pushes different images apart (NT-Xent loss)."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** SimCLR/MoCo 都採對比目標,key 是「同個 anchor 不同視角為正例,batch 內其他為負例」。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Contrastive Learning = 正例近 + 負例遠;Augmentation 是產生正例的關鍵。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q66", "topic": "Training/Calibration", "question_text": "「模型校準(Model Calibration)」要解決什麼問題?", "options": {"A": "讓模型參數變多", "B": "讓模型輸出的「機率值」與「真實正例比例」一致(如 0.8 信心 → 大約 80% 為真)", "C": "讓模型推論更慢", "D": "把模型權重變為 0"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Calibration_(statistics)", "page": 1, "evidence": "Wikipedia Calibration: a probabilistic classifier is well-calibrated if among samples predicted with probability p, approximately p fraction are positive; methods include Platt scaling and isotonic regression."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Calibration 是「機率可信度」問題,深度模型常過度自信,需 Platt(logistic)、Isotonic、Temperature Scaling 校正。\n\n**其他選項為何錯:**\n- A. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- B. ✓ 正解\n\n**記憶要點:** Calibration:Platt、Isotonic、Temperature Scaling;ECE/MCE 是常用指標。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q67", "topic": "Training/Calibration", "question_text": "Expected Calibration Error(ECE)的計算方式為何?", "options": {"A": "把所有預測機率簡單平均", "B": "將預測機率分桶,對每桶計算「平均信心」與「實際正確率」的差,再以樣本數加權平均", "C": "把錯誤預測數除以總樣本數", "D": "與機率無關"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/1706.04599", "page": 1, "evidence": "Guo et al. (2017) \"On Calibration of Modern Neural Networks\": ECE bins predictions by confidence, computes |accuracy − confidence| per bin, weighted by bin size."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** ECE 量化「信心 vs 實際準確率」差距,經典實作分 10-20 桶。\n\n**其他選項為何錯:**\n- A. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- B. ✓ 正解\n\n**記憶要點:** ECE = Σ (|conf − acc| × n_bin / n_total);越小越校準。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q68", "topic": "Training/Tuning", "question_text": "「Learning Rate Range Test(LR Finder)」的主要用途為何?", "options": {"A": "找最大可行的學習率(不發散)上界,作為 schedule 的 peak LR", "B": "找最小可行的學習率", "C": "替換 Adam 優化器", "D": "完全消除學習率"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/1506.01186", "page": 1, "evidence": "Leslie Smith (2015) Cyclical Learning Rates: linearly ramp LR from small to large; track loss; the LR just before divergence is a good upper bound for cyclic schedules."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** LR Finder 從小到大線性掃 LR,記錄 loss → 損失下降最快、即將發散前的 LR 就是 peak LR 建議值。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** LR Finder = Range test;fastai 內建 lr_find()。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q69", "topic": "Training/Tuning", "question_text": "「Warm Restart(暖重啟)」學習率排程的主要好處為何?", "options": {"A": "讓 LR 永遠保持不變", "B": "在 cosine schedule 中週期性把 LR 重設回較高值,有助跳出局部最小並探索更廣權重空間", "C": "停止訓練", "D": "把模型重設為 0"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/1608.03983", "page": 1, "evidence": "Loshchilov & Hutter (2017) SGDR: cosine annealing with warm restarts periodically resets the learning rate, helping escape suboptimal minima."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** SGDR 用 cosine annealing + 多次 restart,每次 restart LR 拉回 peak,然後 cosine 降,讓優化器多次探索。\n\n**其他選項為何錯:**\n- A. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- B. ✓ 正解\n\n**記憶要點:** SGDR = Cosine + Warm Restart;對深度模型常見有效。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q70", "topic": "Eval/Metrics", "question_text": "ROC 曲線的 X 軸與 Y 軸分別代表什麼?", "options": {"A": "X: FPR(False Positive Rate);Y: TPR(True Positive Rate / Recall)", "B": "X: Precision;Y: Recall", "C": "X: F1;Y: Accuracy", "D": "X: 樣本編號;Y: 損失"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Receiver_operating_characteristic", "page": 1, "evidence": "Wikipedia ROC curve: plots TPR (recall, sensitivity) against FPR (1 - specificity) as the decision threshold varies."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** ROC = (FPR, TPR);PR 曲線才是 (Recall, Precision)。\n\n**其他選項為何錯:**\n- B. PR 曲線。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** ROC:X=FPR、Y=TPR;PR:X=Recall、Y=Precision。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q71", "topic": "Eval/Metrics", "question_text": "「混淆矩陣(Confusion Matrix)」對「多類分類」的延伸,正確敘述為何?", "options": {"A": "只能用於二類問題,多類無法表示", "B": "K×K 矩陣,row 為真實類別,column 為預測類別,對角線是 TP,可推 per-class precision/recall/F1", "C": "對角線是錯誤分類", "D": "只有總體 accuracy,沒有細節"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Confusion_matrix", "page": 1, "evidence": "Wikipedia Confusion matrix: rows are actual classes, columns are predicted (or vice versa), diagonal entries represent correct classifications."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** K×K 矩陣,對角為 TP,off-diagonal 揭示哪些類常被混淆;per-class precision/recall/F1 由此可計算。\n\n**其他選項為何錯:**\n- A. 多類可用。\n- B. ✓ 正解\n- C. 錯誤。\n- D. 錯誤。\n\n**記憶要點:** Confusion matrix = 多類診斷神器,看「誰被混成誰」。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q72", "topic": "Math/Statistics", "question_text": "「相關性不等於因果」最重要的提醒在於下列何者?", "options": {"A": "兩變數高相關必有因果", "B": "兩變數可能因為共同原因(confounder)、巧合或反向因果而高相關,因果需更嚴格實驗或設計推論", "C": "相關係數可直接作為因果證據", "D": "因果與資料無關"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Correlation_does_not_imply_causation", "page": 1, "evidence": "Wikipedia: correlation between two variables can arise from chance, reverse causation, or confounding; causal inference requires controlled experiments or causal modeling (DAGs, RCTs)."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** RCT、Causal DAG、Do-calculus、合成對照等是因果推論工具,單純相關係數不足以證明因果。\n\n**其他選項為何錯:**\n- A. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- B. ✓ 正解\n\n**記憶要點:** Causation 需 RCT / Causal model;Correlation 只是觀察。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q73", "topic": "Math/Statistics", "question_text": "下列關於「p 值(p-value)」的敘述,何者最正確?", "options": {"A": "p 值代表「H₀ 為真的機率」", "B": "p 值代表「在 H₀ 為真時,觀察到至少和當前一樣極端結果的條件機率」", "C": "p<0.05 即證明結果重要", "D": "p 值與資料量無關"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/P-value", "page": 1, "evidence": "Wikipedia p-value: probability of obtaining test results at least as extreme as observed, under the assumption that the null hypothesis is true."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** p 值是 P(資料|H₀),不是 P(H₀|資料);與「效應大小」也不同。\n\n**其他選項為何錯:**\n- A. 常見誤解。\n- C. 統計顯著 ≠ 實務重要。\n- D. 樣本越大越易顯著。\n- B. ✓ 正解\n\n**記憶要點:** p 值 = 在 H₀ 下「資料極端度」的條件機率;不是「H₀ 為真機率」。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q74", "topic": "Math/Statistics", "question_text": "下列關於「95% 信賴區間(Confidence Interval)」的敘述,何者最正確?", "options": {"A": "若多次抽樣以同方法建立信賴區間,長期約 95% 區間會涵蓋真實母體參數;不能直接解讀為「真值有 95% 機率落在區間內」", "B": "真值有 95% 機率落在區間", "C": "信賴水準愈低區間愈寬", "D": "與樣本數無關"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Confidence_interval", "page": 1, "evidence": "Wikipedia Confidence interval: in repeated sampling, 95% of computed intervals would contain the true parameter; not a Bayesian probability statement about the parameter."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 頻率學派下,參數是固定的;CI 是隨樣本變的隨機區間;Bayesian 的 credible interval 才可說「真值有 X% 機率在區間內」。\n\n**其他選項為何錯:**\n- B. 常見誤解。\n- C. 信賴水準愈高區間愈寬。\n- D. 樣本越大區間越窄。\n- A. ✓ 正解\n\n**記憶要點:** CI ≠ 機率區間;Credible interval(Bayes)才是。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q75", "topic": "Math/InfoTheory", "question_text": "下列關於「熵(Entropy)」的敘述,何者最正確?", "options": {"A": "熵衡量隨機變數的不確定性;均勻分佈熵最大、確定性分佈熵為 0", "B": "熵與不確定性無關", "C": "熵只能為負", "D": "離散分佈無法計算熵"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Entropy_(information_theory)", "page": 1, "evidence": "Wikipedia Information entropy: H(X) = -Σ p(x) log p(x) ≥ 0; maximum at uniform distribution, zero when one outcome has probability 1."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** H(X) ≥ 0;確定 = 0、均勻 = log(N);用於決策樹、KL 散度、交叉熵損失等基礎。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Entropy = 不確定性 = -Σ p log p;均勻最大、確定為 0。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q76", "topic": "Math/InfoTheory", "question_text": "KL 散度(Kullback-Leibler Divergence)主要量度什麼?", "options": {"A": "兩個機率分佈 P 與 Q 之間的不對稱差異度,值 ≥ 0,等於 0 ↔ P=Q", "B": "兩個分佈之間的對稱距離", "C": "兩個確定值之間的差", "D": "與機率分佈無關"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Kullback%E2%80%93Leibler_divergence", "page": 1, "evidence": "Wikipedia KL divergence: D_KL(P||Q) = Σ p(x) log[p(x)/q(x)] ≥ 0, equals 0 iff P = Q almost everywhere; not symmetric and not a metric."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** D_KL(P||Q) ≠ D_KL(Q||P),且不滿足三角不等式 → 非度量(metric)。常用於 VAE、Variational Inference、Cross-Entropy 推導。\n\n**其他選項為何錯:**\n- B. 不對稱,不是距離。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** KL = 相對熵;非對稱;Cross-Entropy = Entropy + KL。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q77", "topic": "ML/TimeSeries", "question_text": "下列關於 ARIMA 模型的敘述,何者最正確?", "options": {"A": "ARIMA(p,d,q) 結合自迴歸 AR(p)、差分 I(d)、移動平均 MA(q),適用於可經差分變平穩的時序", "B": "ARIMA 只能用於完全平穩資料且不需差分", "C": "ARIMA 與深度學習等價", "D": "ARIMA 不需任何參數調整"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Autoregressive_integrated_moving_average", "page": 1, "evidence": "Wikipedia ARIMA: combines autoregression of order p, differencing of order d, and moving-average of order q; non-stationary series can be made stationary by differencing."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** ARIMA(p,d,q) = AR + I + MA;d 是差分階數,把非平穩變平穩才適用 AR/MA。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** ARIMA 三參:p(AR 階)、d(差分)、q(MA 階);SARIMA 加季節項。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q78", "topic": "ML/TimeSeries", "question_text": "下列哪一項「最不建議」用於時序預測模型的特徵工程?", "options": {"A": "建立 lag features(t-1, t-7, t-30 等)", "B": "rolling mean / rolling std 等移動視窗統計量", "C": "計算「未來 7 天平均」作為當期特徵", "D": "週期/星期/節日標記"}, "correct_answer": "C", "source": {"file": "https://otexts.com/fpp3/", "page": 1, "evidence": "Forecasting Principles and Practice (Hyndman): features used at prediction time must be known at that time; using future values causes target leakage."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** 用「未來」資料當特徵就是 data leakage,預測時不可得,離線評估會被嚴重高估。\n\n**其他選項為何錯:**\n- A. 標準時序特徵工程。\n- B. 標準時序特徵工程。\n- D. 標準時序特徵工程。\n- C. ✓ 正解(反例)\n\n**記憶要點:** 時序特徵:lag / rolling / calendar 皆可;絕不能用未來資訊。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q79", "topic": "ML/TimeSeries", "question_text": "時序分解(Time Series Decomposition)通常將序列拆解為哪些成分?", "options": {"A": "Trend(趨勢)+ Seasonality(季節)+ Residual(殘差),可加性或乘性", "B": "只有趨勢", "C": "只有雜訊", "D": "完全不可分解"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Decomposition_of_time_series", "page": 1, "evidence": "Wikipedia: classical decomposition expresses Y_t = T_t + S_t + R_t (additive) or Y_t = T_t × S_t × R_t (multiplicative)."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** STL / classical decomposition 都把時序分為 trend、season、residual;加性適合振幅穩定、乘性適合振幅隨值放大。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** 時序分解:Trend + Season + Residual;Additive vs Multiplicative。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q80", "topic": "ML/Interpretability", "question_text": "SHAP(SHapley Additive exPlanations)的理論基礎為何?", "options": {"A": "賽局理論的 Shapley value,公平地把「預測值與基準的差」拆解到各特徵貢獻上", "B": "純粹基於相關係數", "C": "隨機亂猜", "D": "與模型本身無關"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/1705.07874", "page": 1, "evidence": "Lundberg & Lee (2017) \"A Unified Approach to Interpreting Model Predictions\": SHAP attributes the prediction to each feature based on Shapley values from cooperative game theory."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** SHAP 將每個特徵視為玩家,以 Shapley value 公平分配「模型預測對基準的偏差」到各特徵,具理論保證(local accuracy、symmetry、missingness、consistency)。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** SHAP = Shapley + Additive;global summary + local explanation。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q81", "topic": "ML/Interpretability", "question_text": "LIME(Local Interpretable Model-agnostic Explanations)的核心思路為何?", "options": {"A": "在被解釋樣本附近,用一個簡單的可解釋模型(如線性迴歸)局部擬合黑盒模型,以得到局部特徵權重", "B": "完全取代原模型", "C": "只看全域平均", "D": "需要原模型程式碼"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/1602.04938", "page": 1, "evidence": "Ribeiro et al. (2016) \"Why Should I Trust You?\": LIME approximates the black-box model locally around an instance with a simpler, interpretable surrogate model."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** LIME 對單一樣本做局部解釋:採樣鄰域 → 拿黑盒打分 → 用線性模型擬合 → 取線性係數作解釋。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** LIME = Local + Linear surrogate;與 SHAP 同屬 model-agnostic 解釋,但 LIME 不具 SHAP 的理論保證。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q82", "topic": "ML/Interpretability", "question_text": "「特徵重要性(Feature Importance)」在隨機森林中常見的兩種計算方式為何?", "options": {"A": "Mean Decrease in Impurity(MDI,基於分裂不純度下降)與 Permutation Importance(置換特徵看效能變化)", "B": "兩者完全相同", "C": "用 SVM 計算", "D": "用 cosine similarity 計算"}, "correct_answer": "A", "source": {"file": "https://scikit-learn.org/stable/modules/permutation_importance.html", "page": 1, "evidence": "scikit-learn: tree-based feature importances are commonly MDI; permutation importance shuffles each feature and measures drop in score, more robust to high-cardinality bias."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** MDI 是訓練期累計,可能偏向高 cardinality 特徵;Permutation 是事後評估,較穩健但較慢。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Tree 重要性兩派:MDI(快、有偏)、Permutation(慢、穩健)。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q83", "topic": "DL/Basics", "question_text": "Softmax 函數對輸入向量 z 的輸出特性,下列何者最正確?", "options": {"A": "輸出每元素 ∈ (0,1) 且總和為 1,屬機率分佈;但對大數值差異敏感(maximum 占絕對主導)", "B": "輸出可為負", "C": "總和不固定", "D": "等同 sigmoid 元素級"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Softmax_function", "page": 1, "evidence": "Wikipedia Softmax: σ(z)_i = e^{z_i}/Σ e^{z_j}; outputs in (0,1) summing to 1; emphasizes the largest input exponentially."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Softmax 把 logits 變機率分佈;指數放大最大值差距,故有「贏者通吃」傾向,常配合 temperature 調整 sharpness。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Softmax = 機率分佈 + 贏者通吃;temperature 控銳度。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q84", "topic": "DL/Optimization", "question_text": "「梯度消失(Vanishing Gradient)」在深層 sigmoid/tanh 網路發生的主要原因為何?", "options": {"A": "sigmoid/tanh 飽和區梯度趨近 0,層層相乘後越往底層越小,訓練停滯", "B": "梯度越深越大", "C": "與啟動函數無關", "D": "完全是隨機現象"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Vanishing_gradient_problem", "page": 1, "evidence": "Wikipedia Vanishing gradient: in deep networks with sigmoid/tanh activations, gradients shrink exponentially through layers because each derivative is < 1 in saturation regions."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** sigmoid'(x) ≤ 0.25,深層連乘後梯度 → 0;對策:ReLU 系列、ResNet、LSTM、適當初始化、BN。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Vanishing → ReLU + ResNet + 好初始化;Exploding → Gradient Clipping。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q85", "topic": "ML/Algorithms", "question_text": "Naive Bayes 對「文字分類」表現不俗,主要原因為何?", "options": {"A": "詞袋(Bag-of-Words)向量高維且稀疏,Naive Bayes 對此具備天然優勢、訓練快、推論快", "B": "Naive Bayes 一定優於所有深度模型", "C": "Naive Bayes 假設詞之間高度相關", "D": "Naive Bayes 需要 GPU"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Naive_Bayes_spam_filtering", "page": 1, "evidence": "Wikipedia Naive Bayes spam filtering: works well on text because BoW features are high-dimensional and sparse, the conditional independence assumption is acceptable, and training/inference are very fast."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 文字 BoW 稀疏 + 條件獨立假設在文字下「夠好用」,NB 訓練幾乎只需計算詞頻機率。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Naive Bayes 文字分類 baseline 強而快;Multinomial NB 處理計數、Bernoulli NB 處理 binary。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q86", "topic": "Privacy/Compliance", "question_text": "下列關於「k-匿名(k-Anonymity)」的描述,何者最正確?", "options": {"A": "資料表中任一記錄不能與少於 k-1 個其他記錄在準識別欄(quasi-identifiers)上完全相同,以降低重識別風險", "B": "k=1 即可保證隱私", "C": "k-匿名與重識別風險無關", "D": "k-匿名 = 完全加密"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/K-anonymity", "page": 1, "evidence": "Wikipedia k-Anonymity (Sweeney 1998): each record is indistinguishable from at least k-1 others on the quasi-identifiers, mitigating linkage attacks."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** k 越大、群組越大、重識別風險越低,但通常會降低資料效用 — k-匿名仍有 attribute disclosure 等弱點,需 l-diversity / t-closeness 補強。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** k-Anonymity → l-Diversity → t-Closeness → Differential Privacy,愈嚴格愈強。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q87", "topic": "Privacy/Compliance", "question_text": "「Secure Aggregation(安全彙整)」在聯邦學習中的主要功能為何?", "options": {"A": "讓中央伺服器只能解到「客戶端模型更新的總和」,而看不到個別更新,降低伺服器側觀測單一 client 的隱私風險", "B": "完全取代加密", "C": "客戶端不能訓練", "D": "與隱私無關"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/1611.04482", "page": 1, "evidence": "Bonawitz et al. (2017) \"Practical Secure Aggregation\": cryptographic protocol allows a server to compute the sum of client updates without learning any individual update."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Secure Aggregation 透過 secret sharing / masking,使 server 只能得到 aggregate,不知道任何單一 client update 內容。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** FL 隱私三件套:Local training + Secure Aggregation + Differential Privacy。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q88", "topic": "Bias/Fairness", "question_text": "「Equalized Odds(均等機會)」公平準則的定義為何?", "options": {"A": "不同人口群在「真陽率(TPR)」與「假陽率(FPR)」皆相同", "B": "預測為正比例相同(即 demographic parity)", "C": "Precision 相同", "D": "Accuracy 相同"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/1610.02413", "page": 1, "evidence": "Hardt et al. (2016) \"Equality of Opportunity in Supervised Learning\": equalized odds requires P(Ŷ=1|Y=y, A=a) = P(Ŷ=1|Y=y, A=b) for y ∈ {0,1}, i.e., equal TPR and FPR across groups."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Equalized Odds 同時要求 TPR 與 FPR 在各群一致;Equal Opportunity 是其放寬版,只看 TPR。\n\n**其他選項為何錯:**\n- B. 是 Demographic Parity。\n- C. 不是 Equalized Odds 定義。\n- D. 不是 Equalized Odds 定義。\n- A. ✓ 正解\n\n**記憶要點:** Equalized Odds = 同 TPR + 同 FPR;Equal Opportunity = 同 TPR(更鬆)。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q89", "topic": "Bias/Fairness", "question_text": "「Disparate Impact(差別影響)」常用 4/5 規則,其意涵為何?", "options": {"A": "若弱勢群被選率 / 強勢群被選率 < 80%,即有 disparate impact 之嫌(美國 EEOC 標準)", "B": "若弱勢群被選率高即不公平", "C": "與資料無關", "D": "4/5 是模型準確率"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Disparate_impact", "page": 1, "evidence": "Wikipedia: U.S. EEOC \"four-fifths rule\" — a selection rate for any protected group less than 80% of the rate for the group with the highest selection rate is generally evidence of adverse impact."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 4/5 規則(80% 規則)是美國 EEOC 對招聘等決策的法律標準,常用於檢測模型潛在歧視。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** 4/5 Rule:Disadvantaged / Advantaged < 0.8 → adverse impact 警訊。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q90", "topic": "Bias/Fairness", "question_text": "「反事實公平性(Counterfactual Fairness)」的定義為何?", "options": {"A": "在所有其他因素相同下,若改變保護屬性(如種族),模型對該個案的預測不變,則該決策對該個體是反事實公平的", "B": "與因果無關", "C": "僅看相關係數", "D": "完全等於 Demographic Parity"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/1703.06856", "page": 1, "evidence": "Kusner et al. (2017) \"Counterfactual Fairness\": a predictor is counterfactually fair if its output for an individual would not change in a counterfactual world where their sensitive attribute is different, holding all else equal."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Counterfactual Fairness 以因果圖為基礎,要求「改變敏感屬性」不影響預測 — 是個體層面的因果性概念。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Counterfactual Fairness:做因果反事實實驗,改種族後預測仍同。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q91", "topic": "ML/Algorithms", "question_text": "下列關於 LightGBM 與 XGBoost 的差異,何者「最正確」?", "options": {"A": "LightGBM 採 leaf-wise 生長與 histogram-based 分裂,通常更快且記憶體更省;XGBoost 預設 level-wise 較穩健", "B": "兩者完全一樣", "C": "LightGBM 不能處理類別特徵", "D": "XGBoost 不支援 GPU"}, "correct_answer": "A", "source": {"file": "https://lightgbm.readthedocs.io/en/latest/Features.html", "page": 1, "evidence": "LightGBM docs: uses leaf-wise tree growth with histogram-based split finding and native categorical feature handling, often faster and more memory-efficient than XGBoost."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** LightGBM 用 leaf-wise(挑損失下降最多的葉子分裂)+ histogram,速度與記憶體優於 XGBoost level-wise;但 leaf-wise 容易過擬合,需限制 max_depth/num_leaves。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** LightGBM = leaf-wise + histogram + 原生類別;深度需控制。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q92", "topic": "ML/Algorithms", "question_text": "下列關於「Calibrated Random Forest」的描述,何者最正確?", "options": {"A": "Random Forest 預設輸出機率傾向「過度均勻」,需用 Platt/Isotonic 校準才能得到可信機率", "B": "Random Forest 機率永遠完美校準", "C": "Random Forest 不能輸出機率", "D": "校準只對神經網路有效"}, "correct_answer": "A", "source": {"file": "https://scikit-learn.org/stable/modules/calibration.html", "page": 1, "evidence": "scikit-learn: ensemble classifiers like Random Forests tend to produce probabilities that are not well-calibrated; calibration via Platt or isotonic regression is often helpful."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** RF 的機率是「投票比例」,容易偏向 0.5 區間,實務上常用 CalibratedClassifierCV 校準。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** RF/Boosting/NB/NN 多需 calibration;Sklearn CalibratedClassifierCV 一行搞定。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q93", "topic": "Feature/Engineering", "question_text": "「Target Encoding(目標編碼,又稱 Mean Encoding)」最大的風險為何?", "options": {"A": "目標洩漏(Target Leakage):若不做 k-fold/out-of-fold 平均,直接用整體 target mean 編碼會造成驗證集評估虛高", "B": "永遠優於 One-Hot", "C": "完全沒有風險", "D": "只能用於數值特徵"}, "correct_answer": "A", "source": {"file": "https://contrib.scikit-learn.org/category_encoders/targetencoder.html", "page": 1, "evidence": "category_encoders docs: TargetEncoder is prone to overfitting/leakage and should use cross-validation, smoothing, or hold-out folds to compute means."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Target encoding 直接用 label 訊息,若不做 OOF 容易把 label 漏進特徵,驗證/測試估計嚴重高估。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Target Encoding:OOF + Smoothing(加先驗均值)是常見保命招。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q94", "topic": "DL/CNN", "question_text": "1×1 卷積(1×1 Convolution)在現代 CNN 中的常見用途為何?", "options": {"A": "在不改變空間尺寸下,做通道(channel)維度的線性組合,可進行降/升維、跨通道特徵融合", "B": "完全等於 max pooling", "C": "把所有像素變成 0", "D": "與卷積無關"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/1409.4842", "page": 1, "evidence": "Szegedy et al. (2015) GoogLeNet (Inception): 1x1 convolutions are used as dimension reduction modules to perform cross-channel feature combinations efficiently."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 1×1 卷積 = 對每個位置的所有通道做 1 個 fully-connected,可極大改變通道數,常用於 bottleneck(ResNet)、Inception。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** 1×1 conv = 通道線性組合;ResNet bottleneck 與 Inception 的關鍵元件。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q95", "topic": "DL/Transformer", "question_text": "BERT 與 GPT 在「微調(Fine-tuning)」下游任務的典型差異為何?", "options": {"A": "BERT 常加任務 head(如 [CLS] + 線性層做分類);GPT 多以「文字 in / 文字 out」的 prompt 形式微調或 prompt-tune", "B": "兩者完全一樣", "C": "BERT 不能做分類", "D": "GPT 不能做生成"}, "correct_answer": "A", "source": {"file": "https://huggingface.co/docs/transformers/tasks/sequence_classification", "page": 1, "evidence": "HuggingFace Transformers tutorials: encoder-only (BERT) models attach classification heads on [CLS]; decoder-only (GPT) models are typically prompted or instruction-tuned for downstream tasks."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** BERT(encoder)輸出 token 表徵 → 接 head;GPT(decoder)以續寫方式做任務,搭配 instruction tuning / few-shot 等。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** BERT = Encoder + Head;GPT = Decoder + Prompt;BART/T5 是 Encoder-Decoder。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q96", "topic": "DL/Embeddings", "question_text": "Sentence Transformer(如 SBERT)為何能在語意相似度任務上顯著優於原 BERT 的 [CLS] 向量?", "options": {"A": "SBERT 透過 Siamese / Triplet 對比訓練,直接在「句子相似」目標上學到有用的句向量,而 BERT [CLS] 未針對相似度目標訓練", "B": "SBERT 完全沒有訓練", "C": "BERT [CLS] 已經是最佳句向量", "D": "兩者完全相同"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/1908.10084", "page": 1, "evidence": "Reimers & Gurevych (2019) Sentence-BERT: BERT [CLS] embeddings perform poorly for STS tasks; siamese fine-tuning with a contrastive objective produces sentence embeddings that work well with cosine similarity."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** SBERT 把 BERT 包成 Siamese,以 cosine + MSE/Triplet 在 STS 等資料上微調,輸出可直接做相似度檢索。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** RAG 檢索的「句向量」首選不是 raw BERT [CLS],而是 SBERT / instructor 系列。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q97", "topic": "DL/Embeddings", "question_text": "高維 embedding 空間做相似度搜尋時,常用「向量索引」加速。下列何者是常見的近似最近鄰(ANN)資料結構/演算法?", "options": {"A": "HNSW(Hierarchical Navigable Small World)、IVF(Inverted File)、PQ(Product Quantization)", "B": "BFS / DFS 純粹 graph traversal", "C": "Heap sort", "D": "Bubble sort"}, "correct_answer": "A", "source": {"file": "https://github.com/facebookresearch/faiss/wiki", "page": 1, "evidence": "FAISS wiki: efficient similarity search uses approximate nearest neighbor (ANN) structures like IVF, HNSW, and PQ for memory- and speed-efficient retrieval."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** FAISS、Milvus、Qdrant 都支援這些 ANN 演算法;HNSW 通用,IVF/PQ 適合超大資料庫的記憶體壓縮。\n\n**其他選項為何錯:**\n- B. 與向量檢索無關。\n- C. 與向量檢索無關。\n- D. 與向量檢索無關。\n- A. ✓ 正解\n\n**記憶要點:** ANN 三招:HNSW(圖)、IVF(分群)、PQ(量化壓縮)。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q98", "topic": "ML/Algorithms", "question_text": "Logistic Regression 與線性 SVM 的本質差別主要在於下列何者?", "options": {"A": "Logistic 用 log-likelihood / cross-entropy 損失,可輸出機率;線性 SVM 用 hinge loss 找最大邊界,原生不直接輸出機率", "B": "兩者完全一樣", "C": "Logistic 是非線性、SVM 是線性", "D": "Logistic 需 GPU、SVM 不需"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Hinge_loss", "page": 1, "evidence": "Wikipedia Hinge loss: SVM minimizes hinge loss to find the maximum-margin separator; logistic regression minimizes log loss to estimate probabilities."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Logistic = log loss + 機率輸出;SVM = hinge loss + 最大邊界,雖可用 Platt scaling 推機率但不原生。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Logistic ↔ Log loss / Probabilities;SVM ↔ Hinge loss / Margin。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q99", "topic": "ML/Interpretability", "question_text": "下列關於 Permutation Importance 的「結果解讀」,何者最正確?", "options": {"A": "若打亂特徵 X 後驗證指標下降很多,表示模型對 X 高度依賴,X 重要;反之則可能不重要", "B": "Permutation Importance 越大代表特徵越無用", "C": "與驗證指標無關", "D": "需要重新訓練模型才能算"}, "correct_answer": "A", "source": {"file": "https://scikit-learn.org/stable/modules/permutation_importance.html", "page": 1, "evidence": "scikit-learn: permutation importance shuffles a feature column and measures the drop in model score; larger drops mean the model relies more heavily on that feature."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Permutation 是「事後」評估,不需重訓:打亂 X、看效能掉多少。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Permutation Importance = 不重訓的模型敏感度量;對 correlated features 仍需小心。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s3-q100", "topic": "Modeling/Selection", "question_text": "下列哪一項是「Hold-out Validation」與「Cross-Validation」的核心差異?", "options": {"A": "Hold-out 只切一次(train/valid/test);Cross-Validation 多次切分後平均,評估更穩定且利用率更高,但成本較高", "B": "兩者完全相同", "C": "Hold-out 不需要驗證集", "D": "Cross-Validation 不能用於小資料"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Cross-validation_(statistics)", "page": 1, "evidence": "Wikipedia Cross-validation: a single hold-out gives a single estimate with high variance; k-fold cross-validation averages over multiple folds, providing a lower-variance estimate at higher computational cost."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Hold-out 簡單但結果受切分影響;CV 對小資料更穩、更善用樣本,但訓練 K 次成本高。\n\n**其他選項為何錯:**\n- B. 錯誤。\n- C. 錯誤。\n- D. 錯誤。\n- A. ✓ 正解\n\n**記憶要點:** Small data → CV;Large data → Hold-out 即夠;時序則用 TimeSeriesSplit。", "subject_code": "s3", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q1", "topic": "Analytics/Methods", "question_text": "某零售業者欲對顧客購物籃進行關聯規則分析。已知商品 A 出現在 40% 的交易中，商品 B 出現在 30% 的交易中，A 和 B 同時出現在 18% 的交易中。請問規則「A → B」的提升度（Lift）最接近哪個值？", "options": {"A": "1.50", "B": "0.60", "C": "2.00", "D": "0.45"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 72, "evidence": "Lift = Confidence / P(B) = (P(A∩B)/P(A)) / P(B)"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\nLift = Confidence(A→B) / P(B)。Confidence = P(A∩B) / P(A) = 0.18 / 0.40 = 0.45。Lift = 0.45 / 0.30 = 1.50。Lift > 1 代表 A 與 B 的出現具有正相關性。\n\n**其他選項為何錯:**\n- D. 0.45 是 Confidence 值，不是 Lift\n- A. ✓ 正解\n- B. 0.60 無意義計算結果\n- C. 2.00 混淆了分子分母關係\n\n**記憶要點:** Lift = P(A∩B) / (P(A)×P(B)) = Confidence / P(後件)；Lift > 1 正相關，= 1 獨立，< 1 負相關。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q2", "topic": "Analytics/Methods", "question_text": "某電商平台對 10 萬名用戶進行 K-means 分群，分成 5 群後發現某一群的群內平方和（Within-Cluster Sum of Squares, WCSS）遠高於其他群。以下哪個處理方式最合適？", "options": {"A": "對該群再進行子分群，或增加 K 值重新分群", "B": "改用 DBSCAN 演算法，因為它不需要指定 K 值", "C": "移除 WCSS 最高的群，僅保留其餘四群", "D": "增加迭代次數，讓演算法收斂更完全"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 73, "evidence": "K-means 透過最小化群內距離平方和進行分群"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\n某群 WCSS 異常高，表示該群內部差異太大，可能包含多個自然子群。最直接的解法是增加 K 值（拆分該群）或對該群單獨再分群，降低群內異質性。\n\n**其他選項為何錯:**\n- D. 增加迭代次數只能讓演算法收斂，不能解決 K 值選擇不當的問題\n- A. ✓ 正解\n- B. 改用 DBSCAN 是策略轉變，但未必是最優解，且題目問最合適處理方式\n- C. 移除某群不是有效的分群策略，會丟失部分用戶資料\n\n**記憶要點:** WCSS 高 = 群內異質性高 = K 太小或初始質心不佳 → 增加 K 或重新初始化。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q3", "topic": "Analytics/Methods", "question_text": "某物流公司想利用時間序列分析預測未來三個月的包裹量。資料顯示每年年底有明顯尖峰，整體呈現上升趨勢。以下哪個 ARIMA 模型組合最能同時捕捉趨勢與季節性？", "options": {"A": "ARIMA(1,0,0)", "B": "ARIMA(0,1,0)", "C": "SARIMA(1,1,1)(1,1,1)[12]", "D": "ARIMA(2,2,2)"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 74, "evidence": "時間序列分解：趨勢、季節性、週期性與隨機成分"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:**\n資料同時具有趨勢（上升）和季節性（年底尖峰），需要 Seasonal ARIMA (SARIMA)。SARIMA(1,1,1)(1,1,1)[12] 的非季節部分處理趨勢，季節部分[12] 處理年度週期。\n\n**其他選項為何錯:**\n- A. ARIMA(1,0,0) 是簡單 AR(1)，無法處理趨勢或季節性\n- B. ARIMA(0,1,0) 只做一階差分去趨勢，無法捕捉季節性\n- C. ✓ 正解\n- D. ARIMA(2,2,2) 過度差分且無季節性參數\n\n**記憶要點:** SARIMA = ARIMA + 季節參數 [s]；年度資料用 [12]，季度用 [4]。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q4", "topic": "Analytics/Methods", "question_text": "某銀行以關聯規則分析信用卡消費模式，設定最小支持度（min_support）= 0.05、最小信賴度（min_confidence）= 0.6。若某規則的 Support = 0.04，該規則會被？", "options": {"A": "過濾掉，因為未達最小支持度門檻", "B": "提升 Confidence 後再判斷是否保留", "C": "轉換為逆向規則後重新評估", "D": "保留，因為 Confidence 可能超過 0.6"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 72, "evidence": "Support = P(A∩B)，Apriori 演算法先以最小支持度過濾候選項目集"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\nApriori 演算法首先過濾未達最小支持度的項目集，Support = 0.04 < min_support = 0.05，該規則直接被剪枝（pruning），不論 Confidence 高低。\n\n**其他選項為何錯:**\n- D. 錯誤；支持度不足的規則在 Apriori 中會先被剔除，不進入 Confidence 計算\n- A. ✓ 正解\n- B. Confidence 是後續計算，不影響 Support 門檻的過濾\n- C. 逆向規則有不同 Support，但原規則仍被過濾\n\n**記憶要點:** Apriori 的「反單調性」：若項目集支持度不足，其所有超集支持度也不足，可安全剪枝。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q5", "topic": "Analytics/Methods", "question_text": "某醫療機構利用 DBSCAN 演算法對患者就醫行為進行分群。若將參數 ε（鄰域半徑）設定過大，可能導致什麼問題？", "options": {"A": "產生過多雜訊點（noise points）", "B": "群數過多，分群過於細緻", "C": "原本應分開的群被合併成同一群", "D": "演算法無法收斂，進入無限迴圈"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 73, "evidence": "DBSCAN 以密度為基礎，ε 控制鄰域範圍"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:**\nε 過大時，每個點的鄰域涵蓋更多點，本來密度較低的「橋接」區域也變成核心點，導致原本應為不同群的點被連接，合併成一個大群（under-clustering）。\n\n**其他選項為何錯:**\n- A. ε 過大會減少雜訊點（更多點被包含在群內），而非增加\n- B. ε 過大會導致群數減少，而非增多\n- C. ✓ 正解\n- D. DBSCAN 無收斂問題，它是確定性演算法\n\n**記憶要點:** ε 大 → 鄰域大 → 群合併（under-clustering）；ε 小 → 鄰域小 → 群破碎、雜訊多（over-clustering）。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q6", "topic": "Analytics/Methods", "question_text": "某連鎖餐廳分析各分店的月營業額，發現資料高度右偏（正偏態）。若使用階層式分群（Hierarchical Clustering）且採用「完整連結」（Complete Linkage）策略，兩群之間的距離定義為何？", "options": {"A": "兩群中所有點對距離的平均值", "B": "兩群質心之間的距離", "C": "兩群中最近的兩點之間的距離", "D": "兩群中最遠的兩點之間的距離"}, "correct_answer": "D", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 73, "evidence": "階層式分群的連結方式：Single, Complete, Average, Ward"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:**\n完整連結（Complete Linkage / Maximum Linkage）定義群間距離為兩群中距離最遠的點對之距離。這種策略傾向產生較緊密、球形的群。\n\n**其他選項為何錯:**\n- A. 這是平均連結（Average Linkage）的定義\n- B. 這是質心連結（Centroid Linkage）的定義\n- C. 這是單一連結（Single Linkage / Minimum Linkage）的定義\n- D. ✓ 正解\n\n**記憶要點:** Single=最近點距離（鏈式效應風險），Complete=最遠點距離（緊密群），Average=平均距離（折衷），Ward=最小化群內方差（常用）。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q7", "topic": "Analytics/Methods", "question_text": "某電信公司以客戶通話時長、資料用量等特徵建立 K-means 分群模型。在決定最佳 K 值時，分析師使用「手肘法」（Elbow Method）。當 K 從 3 增加到 4 時，WCSS 從 1200 降至 900；從 4 增加到 5 時，WCSS 從 900 降至 870。應選擇哪個 K 值？", "options": {"A": "K = 4，因為此時 WCSS 下降幅度出現明顯轉折", "B": "K = 5，因為 WCSS 仍在下降", "C": "K = 6，因為需要繼續測試才能確定", "D": "K = 3，因為這是最小的 K"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 73, "evidence": "手肘法（Elbow Method）選擇 WCSS 下降幅度開始平緩的 K 值"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\nK=3→4 時 WCSS 下降 300（25%），K=4→5 時僅下降 30（3.3%），下降幅度急劇縮小，形成「手肘」。手肘法選擇邊際效益開始大幅減少的 K 值，即 K=4。\n\n**其他選項為何錯:**\n- D. K=3 時 WCSS 仍有大幅下降空間，分群效果不佳\n- A. ✓ 正解\n- B. K=5 的邊際改善極小（3.3%），增加複雜度不值得\n- C. 不需要繼續測試，手肘已明顯出現在 K=4\n\n**記憶要點:** 手肘法 = 找 WCSS 下降「由陡轉平」的轉折點，即邊際改善開始不顯著的 K。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q8", "topic": "Analytics/Methods", "question_text": "某超市資料科學家對購物籃資料進行關聯規則挖掘，發現規則「麵包 → 牛奶」的 Lift = 0.7。對此規則的正確解讀是？", "options": {"A": "購買麵包的顧客比未購買麵包的顧客較不可能購買牛奶", "B": "麵包與牛奶之間不存在任何關聯", "C": "牛奶的銷售量是麵包的 0.7 倍", "D": "購買麵包的顧客比未購買麵包的顧客更可能購買牛奶"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 72, "evidence": "Lift < 1 表示兩項目之間存在負相關"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\nLift = Confidence(麵包→牛奶) / P(牛奶)。Lift = 0.7 < 1，表示在購買麵包的條件下購買牛奶的機率低於牛奶的基礎購買率，兩者呈負相關。\n\n**其他選項為何錯:**\n- D. Lift > 1 才表示正相關，購買前件會增加後件購買率\n- A. ✓ 正解\n- B. Lift = 1 才表示獨立（無關聯），0.7 是有關聯但為負相關\n- C. Lift 不反映銷售量比例關係\n\n**記憶要點:** Lift > 1 = 正相關（互補品），Lift = 1 = 獨立，Lift < 1 = 負相關（替代品）。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q9", "topic": "Analytics/Methods", "question_text": "某房地產公司對全台城市的房價進行時間序列分析，發現每年第二季（Q2）房價均會上升。這種現象屬於時間序列的哪個成分？", "options": {"A": "季節性成分（Seasonality）", "B": "週期性成分（Cyclicality）", "C": "不規則成分（Irregular/Noise）", "D": "趨勢成分（Trend）"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 74, "evidence": "時間序列四大成分：趨勢、季節性、週期性、不規則"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\n季節性成分（Seasonality）是指在固定、已知的時間週期內重複出現的規律，例如每年 Q2 房價上升。這與趨勢（長期方向）和週期性（不固定長度的波動）不同。\n\n**其他選項為何錯:**\n- D. 趨勢是資料長期的上升或下降方向，不是週期重複\n- A. ✓ 正解\n- B. 週期性成分的週期長度不固定（通常超過一年），如景氣循環\n- C. 不規則成分是無法預測的隨機波動\n\n**記憶要點:** 季節性 = 固定週期（月/季/年）重複；週期性 = 不固定長度的長波動（如景氣循環）。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q10", "topic": "Analytics/Methods", "question_text": "某保險公司針對理賠資料進行分群分析，希望找出異常理賠行為。以下哪種演算法最適合，因為它能自動識別離群點而不需預先指定群數？", "options": {"A": "DBSCAN", "B": "階層式分群（Ward 連結）", "C": "主成分分析（PCA）", "D": "K-means（K=5）"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 73, "evidence": "DBSCAN 自動識別雜訊點，無需預設群數"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\nDBSCAN（Density-Based Spatial Clustering of Applications with Noise）不需指定群數，自動將低密度區域的點標記為雜訊點（noise points），適合異常偵測場景。\n\n**其他選項為何錯:**\n- D. K-means 需預設 K 值，且所有點都被強制分入某群，無離群點概念\n- A. ✓ 正解\n- B. 階層式分群需切割樹狀圖決定群數，且無自動離群點識別\n- C. PCA 是降維技術，不是分群演算法\n\n**記憶要點:** DBSCAN 三種點：核心點（Core）、邊界點（Border）、雜訊點（Noise）—雜訊點即離群點。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q11", "topic": "Analytics/Methods", "question_text": "某電商平台進行 RFM 分析（Recency, Frequency, Monetary），其中「Frequency」欄位的值域為 1–500 次，「Monetary」欄位為 100–500,000 元。若直接套用 K-means，哪個特徵會主導分群結果，為何？", "options": {"A": "Monetary，因為其數值範圍遠大於其他特徵", "B": "Frequency，因為次數比金額更具區分力", "C": "三者同等重要，K-means 自動平衡", "D": "Recency，因為時間資料最重要"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 57, "evidence": "特徵縮放對距離計算的影響，數值範圍大的特徵主導歐氏距離"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\nK-means 使用歐氏距離，距離計算受特徵的數值範圍影響。Monetary 範圍為 100–500,000（跨度 499,900），遠大於 Frequency 的 1–500（跨度 499），因此 Monetary 會主導距離計算，使分群幾乎只反映消費金額差異。\n\n**其他選項為何錯:**\n- D. Recency 數值範圍未知但通常不是最大的\n- A. ✓ 正解\n- B. Frequency 範圍僅 499，遠小於 Monetary\n- C. K-means 不會自動平衡，需手動標準化\n\n**記憶要點:** 使用 K-means 前必須標準化（Min-Max 或 Z-score），否則大範圍特徵會主導距離計算。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q12", "topic": "Analytics/Methods", "question_text": "某股票分析師對個股收盤價進行移動平均分析。「指數移動平均（EMA）」與「簡單移動平均（SMA）」最主要的差異是什麼？", "options": {"A": "EMA 對近期資料賦予較高權重，對市場變化反應更靈敏", "B": "SMA 只使用最近 N 天資料，而 EMA 使用全部歷史資料", "C": "EMA 消除了時間序列中的季節性成分", "D": "EMA 計算速度更快，適合大數據環境"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 74, "evidence": "移動平均：SMA 等權，EMA 指數加權近期資料"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\nEMA（指數移動平均）對近期數據給予指數遞減的較高權重，使其對最新資訊反應更快；SMA（簡單移動平均）對窗口內所有數據等權處理。\n\n**其他選項為何錯:**\n- D. 計算速度不是兩者的主要差異\n- A. ✓ 正解\n- B. SMA 使用最近 N 天（正確），但 EMA 雖理論上使用全部歷史但舊資料權重趨近於零，這是次要特點\n- C. EMA 不處理季節性，那是 STL 分解等方法的功能\n\n**記憶要點:** SMA = 等權平均（反應慢），EMA = 近期加權（反應快），適合趨勢追蹤。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q13", "topic": "Analytics/Methods", "question_text": "某市場研究公司對消費者進行問卷調查，想找出不同年齡層對產品類別的偏好差異。研究員選擇對應分析（Correspondence Analysis）。以下哪個說法最準確描述此方法的用途？", "options": {"A": "用於視覺化類別變數間的關聯結構", "B": "用於建立年齡層對銷售額的回歸預測模型", "C": "用於測試兩個類別變數是否獨立", "D": "用於將高維連續特徵降維至二維空間"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 75, "evidence": "對應分析用於分析類別資料的關聯性並以低維圖形呈現"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\n對應分析（Correspondence Analysis）是一種多變量統計技術，專門用於視覺化交叉表（列聯表）中類別變數之間的關聯結構，透過低維散點圖展示類別間的相似性。\n\n**其他選項為何錯:**\n- D. PCA 用於連續特徵降維，對應分析專注於類別變數\n- A. ✓ 正解\n- B. 回歸分析才是建立預測模型的方法\n- C. 卡方獨立性檢定才是測試類別變數是否獨立的方法\n\n**記憶要點:** 對應分析 = 類別版 PCA，將列聯表中的行列關係視覺化於低維圖。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q14", "topic": "Analytics/Methods", "question_text": "某物聯網平台針對工廠設備的感測器數據建立異常偵測系統。工程師選用孤立森林（Isolation Forest）演算法。孤立森林識別異常點的核心原理是什麼？", "options": {"A": "異常點在隨機決策樹中需要較少的分割次數才能被孤立", "B": "異常點的密度顯著低於其鄰域中的正常點", "C": "異常點的重構誤差在自編碼器中明顯高於正常點", "D": "異常點距群中心的歐氏距離明顯大於正常點"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 73, "evidence": "異常偵測方法：基於密度、距離、統計模型等方法"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\n孤立森林（Isolation Forest）的原理：異常點因為特徵值偏離正常範圍，在隨機選取特徵和分割值的決策樹中，只需極少次分割（短路徑長度）即可被孤立出來；正常點則需要較多分割。路徑長度越短，異常分數越高。\n\n**其他選項為何錯:**\n- D. 這是基於距離的異常偵測方法（如 k-NN 異常偵測）的原理\n- A. ✓ 正解\n- B. 這是 LOF（Local Outlier Factor）的原理\n- C. 這是自編碼器（Autoencoder）異常偵測的原理\n\n**記憶要點:** Isolation Forest = 孤立樹；異常點容易孤立（路徑短），正常點難孤立（路徑長）。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q15", "topic": "Analytics/Methods", "question_text": "某零售業者想找出「購買尿布的顧客也常購買啤酒」這類關聯。在 Apriori 演算法中，以下哪個步驟順序是正確的？", "options": {"A": "計算 Support → 過濾低支持度項目集 → 計算 Confidence → 過濾低信賴度規則", "B": "生成所有可能規則 → 計算 Support → 計算 Confidence → 計算 Lift", "C": "計算 Confidence → 計算 Support → 生成頻繁項目集", "D": "計算 Lift → 計算 Confidence → 計算 Support → 過濾"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 72, "evidence": "Apriori 演算法：先找頻繁項目集（最小支持度），再生成強規則（最小信賴度）"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\nApriori 演算法標準流程：(1) 計算所有項目的 Support，過濾低於 min_support 的項目；(2) 逐步擴展頻繁項目集（1-項目集→2-項目集→…）；(3) 對頻繁項目集生成規則，計算 Confidence，過濾低於 min_confidence 的規則；(4) 可選計算 Lift。\n\n**其他選項為何錯:**\n- D. 順序錯誤，Lift 是最後計算的\n- A. ✓ 正解\n- B. 先生成所有規則會計算量爆炸，Apriori 的關鍵是先剪枝\n- C. Confidence 依賴 Support，不可先計算\n\n**記憶要點:** Apriori = 先 Support 剪枝（頻繁項目集），再 Confidence 過濾規則，最後可計算 Lift 評估實用性。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q16", "topic": "Analytics/Methods", "question_text": "某航空公司對旅客的航班延誤資料進行聚類分析，希望探索資料中的自然群組。以下哪個特性是 K-means 演算法的固有限制？", "options": {"A": "K-means 假設群的形狀為球形（凸形），對非球形群效果差", "B": "K-means 每次執行結果完全相同，缺乏隨機性", "C": "K-means 要求所有特徵必須是類別型資料", "D": "K-means 無法處理超過 1,000 筆以上的資料"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 73, "evidence": "K-means 限制：需預設 K、假設球形群、對離群值敏感"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\nK-means 最小化群內歐氏距離，這等同假設每個群為球形（各向同性）。對於半月形、環形等非球形分佈，K-means 效果極差，此時 DBSCAN 或 Gaussian Mixture Model 更適合。\n\n**其他選項為何錯:**\n- D. K-means 可擴展至百萬筆資料（Mini-batch K-means）\n- A. ✓ 正解\n- B. K-means 使用隨機初始化，每次結果可能不同（需設定 random_state 固定）\n- C. K-means 要求連續型數值特徵，類別型資料需先編碼\n\n**記憶要點:** K-means 三大限制：需設定 K、假設球形群、對離群值敏感。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q17", "topic": "Analytics/Methods", "question_text": "某製造業工廠利用多元迴歸分析建立產品缺陷率的預測模型。模型的 R² = 0.85。若此模型用於預測訓練集以外的新資料，以下哪個說法最可能正確？", "options": {"A": "新資料的 R² 可能低於 0.85，因為訓練集的擬合程度通常優於測試集", "B": "新資料的 R² 將高於 0.85，因為新資料消除了訓練雜訊", "C": "R² 在新資料上無意義，需改用 RMSE 評估", "D": "新資料的 R² 將等於 0.85，因為模型已完全學習規律"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 76, "evidence": "模型泛化能力：訓練集 R² 通常高於測試集（過擬合風險）"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:**\n訓練集的 R² 反映模型對已見資料的擬合程度，通常高估了模型的真實預測能力。在新資料（測試集）上，模型性能通常下降，R² 會低於訓練集的值，這是過擬合（overfitting）的表現。\n\n**其他選項為何錯:**\n- D. 模型不可能完全學習所有規律，新資料有未見過的變異\n- A. ✓ 正解\n- B. 新資料不會提高 R²，通常相反\n- C. R² 在測試集上仍有意義，是重要的模型評估指標\n\n**記憶要點:** 訓練 R² > 測試 R² → 過擬合；用交叉驗證（Cross-Validation）估計真實泛化能力。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q18", "topic": "FeatureEng", "question_text": "某人力資源部門建立員工離職預測模型，其中「職位等級」欄位的值為：實習生、專員、主任、經理、副總、總監（具有明確順序）。以下哪種編碼方式最合適？", "options": {"A": "One-Hot 編碼，因為職位是類別型資料", "B": "目標編碼（Target Encoding），以離職率替代職位名稱", "C": "標籤編碼（Label Encoding），因為職位具有明確的順序關係", "D": "二元編碼（Binary Encoding），減少維度"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 57, "evidence": "Label Encoding 適用於具有順序關係的類別特徵（Ordinal）"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:**\n職位等級具有明確的順序（實習生 < 專員 < 主任 < 經理 < 副總 < 總監），屬於序數（Ordinal）類別特徵。Label Encoding 賦予有意義的數字序列（0,1,2,3,4,5），保留了順序資訊。\n\n**其他選項為何錯:**\n- A. One-Hot 會建立 6 個二元特徵，且丟失順序資訊，浪費維度\n- B. 目標編碼適合高基數名目類別特徵，且有 data leakage 風險\n- C. ✓ 正解\n- D. 二元編碼不保留有意義的順序關係\n\n**記憶要點:** 有順序 → Label Encoding；無順序（名目）且類別少 → One-Hot；無順序且類別多 → Target Encoding。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q19", "topic": "FeatureEng", "question_text": "某醫院建立糖尿病預測模型，訓練資料中「血糖值」欄位有少量離群值（值域通常 70-400，但有幾筆超過 1000）。下列哪種特徵縮放方法對這些離群值最不敏感？", "options": {"A": "Min-Max 正規化（最小-最大縮放）", "B": "Z-score 標準化（均值為 0，標準差為 1）", "C": "Robust Scaling（以中位數和 IQR 縮放）", "D": "對數轉換（Log Transformation）後再標準化"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 57, "evidence": "Robust Scaling 使用中位數和四分位距，對離群值不敏感"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:**\nRobust Scaling 使用中位數（代替均值）和 IQR（代替標準差）進行縮放：X' = (X - median) / IQR。中位數和 IQR 是離群值不敏感的統計量，不會被少數極端值扭曲。\n\n**其他選項為何錯:**\n- A. Min-Max 使用最小值和最大值，極端離群值會將所有正常值壓縮到接近 0 或 1 的狹窄範圍\n- B. Z-score 使用均值和標準差，都受離群值影響\n- C. ✓ 正解\n- D. 對數轉換有效但不是「縮放方法」分類中的選項，且需要正值\n\n**記憶要點:** Robust Scaling = 中位數 + IQR = 抗離群值；Min-Max = 易受離群值扭曲；Z-score = 中等受影響。", "subject_code": "s2", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s2-q20", "topic": "FeatureEng", "question_text": "某電商平台有一個「商品類別」欄位，包含 800 個不同類別（高基數）。若使用 One-Hot 編碼，將產生什麼主要問題？", "options": {"A": "產生 800 個稀疏二元特徵，導致維度詛咒（Curse of Dimensionality）", "B": "One-Hot 編碼會破壞特徵的順序資訊", "C": "One-Hot 編碼只適用於二元分類問題", "D": "模型無法處理類別型特徵，必須改用數值型"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/study-guide.pdf", "page": 57, "evidence": "One-Hot 編碼在高基數特徵上導致維度爆炸"}, "verified": true, "verification_neede

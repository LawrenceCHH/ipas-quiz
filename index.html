→監控→再訓練」的自動化流程串接,並確保線上模型的版本可追溯。技術主管建議引入 MLOps 框架。MLOps 在此 AI 開發生命週期中的核心角色為何?","options": {"A": "專注於訓練資料的標註與品質控管,以提升模型訓練效果","B": "透過自動化模型搜尋與參數調整,降低模型開發門檻","C": "建立機器學習流程的自動化與版本管理機制,支援模型部署、監控與持續更新","D": "確保模型在部署後維持穩定效能,減少後續維運與更新需求"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 7,"evidence": "answer column shows 'C' for question 22"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** MLOps 的核心角色是把「訓練→測試→部署→監控→再訓練」整個機器學習生命週期串接成自動化流程,並建立版本管理機制(資料、模型、程式碼版本可追溯),讓模型能夠持續部署、監控與迭代更新,這正是題目情境所需要的能力。\n\n**其他選項為何錯:**\n- A. 資料標註與品質控管屬於資料工程/標註流程的範疇,不是 MLOps 的核心定位。\n- B. 自動化模型搜尋與參數調整是 AutoML/超參數優化(HPO)的範疇,與 MLOps 著重的流程自動化及版本管理不同。\n- C. ✓ 正解\n- D. MLOps 強調的是持續監控與「持續更新」,而非「減少後續維運與更新需求」,描述方向相反。\n\n**記憶要點:** MLOps = ML 生命週期自動化 + 版本可追溯,串起訓練到監控再訓練的完整迴圈。","subject_code": "s1"},{"id": "exam-s1-115-1-q23","topic": "AI/Planning","question_text": "某製造業公司計劃將 AI 導入生產線瑕疵檢測流程,目前瑕疵樣本約 800 張(含各類瑕疵類型)、正常樣本約 15,000 張,現有 IT 基礎設施為地端伺服器且無 GPU,且生產線環境需於地端即時完成推論,檢測需求為每片零件須在 100 毫秒內完成檢測,且預算為中等、無法於短期內大規模採購硬體。工程師正在規劃第一階段的 AI 導入方案,請問下列哪一種規劃最為合適?","options": {"A": "從零訓練一個大型 CNN 模型,並採購高階 GPU 伺服器以滿足推論速度需求","B": "採用預訓練模型進行 Transfer Learning,針對瑕疵樣本進行 Fine-tuning,並使用模型量化(Quantization)或蒸餾(Distillation)技術壓縮模型以符合延遲需求,部署於地端","C": "因樣本數不足,建議先暫緩 AI 導入,待蒐集至少 10 萬筆瑕疵樣本後再啟動專案","D": "將所有影像上傳至雲端,使用第三方 AutoML 平台自動訓練並部署,以節省開發時間"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 8,"evidence": "answer column shows 'B' for question 23"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 情境限制是樣本少(瑕疵僅 800 張)、無 GPU、需地端即時推論(100ms 內)、預算中等。採用預訓練模型做遷移學習,只需少量瑕疵樣本微調就能取得不錯效果,再用量化或蒸餾壓縮模型,使其能在無 GPU 的地端環境內以低延遲完成推論,完全對應題目的所有限制條件。\n\n**其他選項為何錯:**\n- A. 從零訓練大型 CNN 需要大量標註資料,現有 800 張瑕疵樣本明顯不足;採購高階 GPU 也超出「無法短期大規模採購硬體」的預算限制。\n- B. ✓ 正解\n- C. 暫緩專案並等待蒐集到 10 萬筆樣本並不實際也沒有必要,遷移學習正是為了在小樣本情境下也能有效導入 AI 的解法。\n- D. 將影像上傳雲端違反「地端即時完成推論」的需求,且第三方 AutoML 平台通常無法保證滿足 100 毫秒的地端低延遲要求。\n\n**記憶要點:** 小樣本 + 無 GPU + 地端低延遲 → 遷移學習 + 模型壓縮(量化/蒸餾),是資源受限時的標準組合。","subject_code": "s1"},{"id": "exam-s1-115-1-q24","topic": "Deploy/MLOps","question_text": "某即時詐欺偵測系統對模型回應時間有嚴格限制,若推論延遲過高將影響交易核准流程。維運工程師在模型上線前進行延遲測試(Latency Testing)時,主要評估的目標為何?","options": {"A": "評估模型推論過程中的記憶體使用量,以確認部署資源是否足夠","B": "驗證模型對異常或攻擊輸入的穩定性與安全性","C": "評估模型在不同使用者族群上的預測結果是否一致","D": "評估模型從接收輸入到產生預測結果所需的回應時間是否符合系統要求"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 8,"evidence": "answer column shows 'D' for question 24"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 延遲測試(Latency Testing)顧名思義是測量系統從接收輸入到回傳預測結果所需要的時間,確認回應速度是否符合系統的時效性要求(此情境為避免影響交易核准流程),這是延遲測試最直接的評估目標。\n\n**其他選項為何錯:**\n- A. 記憶體使用量的評估屬於資源/容量測試(Resource/Load Testing),不是延遲測試的主要目標。\n- B. 對異常或攻擊輸入的穩定性屬於穩健性測試(Robustness Testing)或安全性測試,不是延遲測試的範疇。\n- C. 不同族群預測結果是否一致屬於公平性測試(Fairness Testing),與回應時間無關。\n- D. ✓ 正解\n\n**記憶要點:** Latency Testing 只看「回應時間」;資源用量、穩健性、公平性各有各自的測試類型,不要混為一談。","subject_code": "s1"},{"id": "exam-s1-115-1-q25","topic": "Risk/Compliance","question_text": "某企業欲將其 AI 輔助決策系統提交給外部稽核單位審查,並宣稱符合 NIST《AI 風險管理框架》(NIST AI RMF)中可驗證性(Verifiability)的要求。為讓第三方稽核人員能獨立重現模型評估結果,下列哪一項技術實踐最直接符合此要求?","options": {"A": "將模型測試準確率優化至 99%以上,以達到業界公認的高可靠標準","B": "建立可追溯的測試資料與評估流程,並記錄模型訓練與評估過程中的關鍵設定,以確保結果可被重現","C": "加快模型迭代速度,縮短版本發布週期以盡快累積外部驗證數據","D": "擴充訓練資料量至數百萬筆,以統計方式確保模型的泛化能力達標"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 8,"evidence": "answer column shows 'B' for question 25"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 可驗證性(Verifiability)的核心是讓第三方能夠獨立「重現」模型評估的結果,這需要完整記錄測試資料集、評估流程與訓練/評估過程中的關鍵設定(如超參數、隨機種子、資料版本),並確保這些紀錄可被追溯與查核,才能讓外部稽核人員依循相同條件重新跑出相同(或可解釋的)結果。\n\n**其他選項為何錯:**\n- A. 提高準確率是模型效能的表現,與「稽核人員能否獨立重現評估結果」沒有直接關係,準確率再高也不代表結果可被驗證重現。\n- B. ✓ 正解\n- C. 加快迭代速度、縮短發布週期屬於開發效率議題,與可驗證性(結果可重現)無關,甚至可能因缺乏完整紀錄而更難重現。\n- D. 擴充訓練資料量是提升泛化能力的做法,並不能讓稽核人員「獨立重現」評估過程,與可驗證性的定義不符。\n\n**記憶要點:** Verifiability(可驗證性)= 別人能照著你的紀錄重現結果,關鍵在「可追溯的資料 + 流程紀錄」,不是準確率或資料量。","subject_code": "s1"},{"id": "exam-s1-115-1-q26","topic": "Risk/Compliance","question_text": "某銀行導入一套 AI 授信審核系統,針對貸款申請人進行自動化決策。監理單位要求系統必須符合負責任 AI(Responsible AI)原則,特別是對被拒絕的申請人提供每筆決策的具體理由說明。從技術與合規的角度,此要求的核心能力需求為何?","options": {"A": "系統必須在收到申請後 10 秒內自動刪除申請人個資","B": "系統應隨機調整部分決策以確保多元性","C": "系統必須保證所有決策準確率達到 100%","D": "系統必須具備可解釋性(Explainability)能力,能提供特徵貢獻說明"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 8,"evidence": "answer column shows 'D' for question 26"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 要求對每筆拒絕決策提供「具體理由說明」,本質上就是要求系統具備可解釋性(Explainability),能將模型的判斷拆解成可理解的特徵貢獻(例如哪些因素導致此人被拒絕),這是負責任 AI 原則中「透明度/可解釋性」的核心技術能力需求。\n\n**其他選項為何錯:**\n- A. 自動刪除個資屬於資料保存/隱私政策的議題,與「提供拒絕理由」的可解釋性要求無關。\n- B. 隨機調整決策不但無助於說明理由,反而會破壞決策的一致性與可信度。\n- C. 100% 準確率在現實中不可能達成,且準確率高低與是否能「說明理由」是兩件不同的事。\n- D. ✓ 正解\n\n**記憶要點:** 「要說明為什麼拒絕」= 需要可解釋性(Explainability),能拆解特徵貢獻,而不是靠準確率或隨機性。","subject_code": "s1"},{"id": "exam-s1-115-1-q27","topic": "AI/Risk","question_text": "某醫院計劃導入一套 AI 醫療影像診斷輔助系統,用於輔助放射科醫師判讀 CT 影像。院方技術委員會討論在人命攸關且需確保最終臨床決策責任由人類承擔的情境下,從系統設計架構層面,最關鍵的安全機制為何?","options": {"A": "採用人機協作(Human-in-the-Loop, HITL)架構,由醫師最終審核決策","B": "模型信心低於閾值(Threshold)即自動關機","C": "隨機切換模型並以多數決決策","D": "對輸入影像加入隨機擾動"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 9,"evidence": "answer column shows 'A' for question 27"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 題目明確要求「最終臨床決策責任由人類承擔」,人機協作(Human-in-the-Loop)架構讓 AI 系統僅提供輔助判讀建議,最終診斷與治療決策仍由醫師審核確定,這是在人命攸關情境下,兼顧 AI 效率與人類問責的最關鍵安全機制。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 信心低於閾值就自動關機,無法保證系統在所有情境下都能持續提供輔助,也不涉及「人類承擔最終決策責任」的架構設計。\n- C. 隨機切換模型並多數決,屬於模型集成(Ensemble)的一種做法,與「確保人類擁有最終決策權」無關。\n- D. 對輸入加入隨機擾動通常是用於測試模型穩健性(如對抗樣本防禦),並非確保人類掌握最終決策權的機制。\n\n**記憶要點:** 「人命攸關 + 責任在人」的關鍵字,直接對應到 Human-in-the-Loop(人機協作)架構。","subject_code": "s1"},{"id": "exam-s1-115-1-q28","topic": "ML/Evaluation","question_text": "一位資料科學家使用 XGBoost 建立信用風險評分模型,並使用 SHAP 解釋模型對某申請人的預測結果。SHAP summary plot 顯示該樣本中「月收入」的 SHAP 值為-2.3,「負債比率」為+1.8,其中 SHAP 值代表各特徵對模型輸出值的影響程度與方向。關於對 SHAP 值的解讀,下列敘述何者正確?","options": {"A": "「月收入」的 SHAP 值-2.3 代表該特徵使此申請人的違約預測機率降低了 2.3%","B": "「月收入」的 SHAP 值-2.3 代表相對於基準值(base value),此特徵將模型輸出值往負方向推移了 2.3 個單位,表示月收入對該申請人有降低違約風險的貢獻","C": "SHAP 值為負代表該特徵對模型整體來說是不重要的特徵,應考慮從模型中移除","D": "負債比率」SHAP 值+1.8 代表負債比率是整個訓練集中對違約影響最大的特徵"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 9,"evidence": "answer column shows 'B' for question 28"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** SHAP 值衡量的是「該特徵相對於基準值(base value,通常是所有樣本的平均預測),把模型輸出往正或負方向推移了多少單位」,是針對「單一樣本、單一預測」的局部貢獻度量。「月收入」SHAP 值 -2.3 代表此特徵讓這位申請人的模型輸出往負方向(通常對應降低違約風險)推移了 2.3 個單位,而不是直接等於機率變化的百分比。\n\n**其他選項為何錯:**\n- A. SHAP 值是模型輸出值(通常是 log-odds 或原始分數空間)的推移量,並非直接等於機率百分比的變化,兩者單位不同,不能直接畫上等號。\n- B. ✓ 正解\n- C. SHAP 值的正負代表影響的「方向」(推高或拉低預測值),與該特徵「是否重要」無關,重要性要看 SHAP 值的絕對值大小或整體平均,負值不代表不重要。\n- D. SHAP 值是「單一樣本」的局部解釋,只反映這位申請人的個案,不能用單一樣本的 SHAP 值去推論該特徵在「整個訓練集」中的全域重要性排名。\n\n**記憶要點:** SHAP 值 = 相對 base value 的「方向 + 幅度」局部貢獻;要看全域重要性要彙總所有樣本(如平均 |SHAP|),不能拿單一樣本值代表全體。","subject_code": "s1"},{"id": "exam-s1-115-1-q29","topic": "ML/Evaluation","question_text": "某工程師為一套卷積神經網路(CNN)的醫療影像輔助診斷系統設計模型可解釋性機制。該系統需滿足下列需求:1.能向醫師說明影像被判定為異常的原因 2.支援近即時推論,每次解釋須於 200 毫秒內完成,且不可進行大量重複採樣計算 3.解釋結果須以影像中具代表性的視覺化像素區域呈現在此情境下,下列何種方法最為適合?","options": {"A": "使用 LIME,透過超像素擾動取樣分析影像區塊對預測的影響","B": "使用 SHAP KernelExplainer,計算各像素的 Shapley 值並疊加於原始影像","C": "使用 Grad-CAM(Class Activation Map),透過梯度反向傳播生成類別關注區域","D": "使用 SHAP TreeExplainer,計算特徵貢獻並以熱力圖呈現"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 9,"evidence": "answer column shows 'C' for question 29"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 情境要求近即時(200 毫秒內)、不可大量重複採樣、且需以視覺化像素區域呈現。Grad-CAM 只需一次前向與反向傳播,利用梯度資訊定位對預測貢獻最大的影像區域並生成熱力圖,計算量小、速度快,完全符合近即時且禁止大量重複採樣的限制。\n\n**其他選項為何錯:**\n- A. LIME 需要對輸入影像做多次超像素擾動取樣並重新推論,屬於大量重複採樣計算,不符合 200 毫秒且禁止重複採樣的限制。\n- B. SHAP KernelExplainer 同樣需要大量取樣模擬特徵子集合以估計 Shapley 值,計算成本高,無法滿足近即時需求。\n- C. ✓ 正解\n- D. TreeExplainer 是專為樹狀模型(如 XGBoost、隨機森林)設計的 SHAP 方法,並不適用於 CNN 這類深度學習影像模型。\n\n**記憶要點:** 需要「快、不重複採樣、影像區域視覺化」→ Grad-CAM;LIME/SHAP KernelExplainer 都靠重複取樣,速度慢。","subject_code": "s1"},{"id": "exam-s1-115-1-q30","topic": "Data/Preprocessing","question_text": "某資料科學家正在處理一份包含 200 個感測器特徵的工廠設備監測資料集,為了降低模型複雜度並保留主要變異資訊,他先對資料進行標準化(Standardization),再使用主成分分析(PCA)進行降維。在 PCA 過程中,為了找出能最大化資料變異量的主成分方向,演算法主要依賴哪一項數學操作?","options": {"A": "透過對目標函數進行梯度下降(Gradient Descent)最佳化,迭代求得主成分方向","B": "根據特徵與目標變數之間的相關性(Correlation)進行排序,選擇重要特徵","C": "對資料的協方差矩陣(Covariance Matrix)進行特徵值分解(Eigen Decomposition),取得對應主要變異方向的特徵向量","D": "對資料矩陣進行卷積運算(Convolution),擷取特徵之間的局部關係"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 10,"evidence": "answer column shows 'C' for question 30"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** PCA 的數學核心是計算標準化後資料的協方差矩陣,再對協方差矩陣做特徵值分解,取得的特徵向量即為主成分方向,對應的特徵值大小代表該方向所能解釋的變異量,依特徵值排序即可找出最大化資料變異的主成分方向。\n\n**其他選項為何錯:**\n- A. PCA 是透過線性代數的特徵值分解求得解析解,並非透過梯度下降迭代最佳化目標函數。\n- B. 依相關性排序選特徵屬於特徵選擇(Feature Selection)方法,PCA 是特徵轉換/降維方法,兩者不同。\n- C. ✓ 正解\n- D. 卷積運算是 CNN 用於擷取影像局部特徵的操作,與 PCA 的線性代數降維原理無關。\n\n**記憶要點:** PCA = 協方差矩陣 → 特徵值分解 → 依特徵值大小取主成分,是解析解而非迭代優化。","subject_code": "s1"},{"id": "exam-s1-115-1-q31","topic": "ML/Clustering","question_text": "某資料工程師嘗試對包含 300 個特徵的使用者行為資料集使用 DBSCAN 進行群集分析,但發現幾乎所有資料點都被判定為雜訊點(Noise Points),難以形成有意義的群集,即使不斷調整ε(Epsilon)與 MinPts 參數也無濟於事。請問下列何者為此問題最可能的根本原因?","options": {"A": "在高維空間中,維度詛咒(Curse of Dimensionality)使得資料點之間的距離趨於相近,導致 DBSCAN 的密度估計失效","B": "DBSCAN 演算法僅適用於低維資料,無法處理高維資料","C": "300 個特徵的資料必然不具備群集結構,因此無法進行有效的分群","D": "高維空間中核心點的數量會受到數學限制,導致無法形成群集"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 10,"evidence": "answer column shows 'A' for question 31"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** DBSCAN 仰賴計算資料點之間的距離來估計局部密度(是否達到 MinPts 在 ε 半徑內)。在高維空間中,受維度詛咒影響,任兩點之間的距離會趨於相近、失去區分度,導致密度估計失真,幾乎所有點看起來都「一樣稀疏」而被判為雜訊點,這是高維資料讓 DBSCAN 失效的根本原因,調整 ε 與 MinPts 也無法真正解決距離度量本身失真的問題。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. DBSCAN 並非「僅適用低維」這麼絕對,而是隨維度增加,距離度量失真的問題逐漸嚴重,描述過於武斷且未點出根本原因。\n- C. 資料是否具有群集結構與特徵數量沒有必然關係,不能因為特徵多就斷定「必然不具備群集結構」。\n- D. 核心點數量並非受「數學限制」而無法形成,而是因為距離度量在高維空間中失真,才導致密度估計失效,描述因果錯誤。\n\n**記憶要點:** 高維空間 → 距離趨於相近(維度詛咒)→ 以距離為基礎的密度分群(DBSCAN)容易失效,調參數治標不治本,通常需先降維。","subject_code": "s1"},{"id": "exam-s1-115-1-q32","topic": "CV/Classification","question_text": "某工程師正在實作一個 CNN 影像分類模型,在 PyTorch 中定義模型架構時,需要在卷積擷取特徵後接上全連結層(Fully Connected Layer)進行分類。在模型程式碼中,需要在卷積輸出與全連結層之間插入什麼操作?","options": {"A": "使用全域平均池化(Global Average Pooling)將特徵圖壓縮後再接全連結層","B": "使用 Flatten 將特徵圖展平成一維向量","C": "直接將卷積輸出接到全連結層,系統會自動轉換維度","D": "先對特徵圖做 Softmax,再輸入全連結層"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 10,"evidence": "answer column shows 'B' for question 32"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 卷積層輸出的是多維的特徵圖(Feature Map,形狀通常是 channel × height × width),而全連結層要求輸入是一維向量。最基本且常見的做法是使用 Flatten 操作,把多維特徵圖展平成一維向量後,才能接入全連結層進行分類。\n\n**其他選項為何錯:**\n- A. 全域平均池化是另一種可行的替代做法(常見於較新架構),但並非題目所問「最基本、必須插入」的標準操作,一般教學情境中卷積接全連結的預設做法是 Flatten。\n- B. ✓ 正解\n- C. 深度學習框架不會「自動」把多維特徵圖轉換成全連結層需要的一維向量,必須顯式加入 Flatten(或等效)操作,否則會維度不匹配報錯。\n- D. Softmax 是分類任務最後輸出層的機率正規化函數,通常接在全連結層「之後」,而不是插在卷積輸出與全連結層之間。\n\n**記憶要點:** 卷積輸出是多維特徵圖,全連結層要一維向量,中間必須插入 Flatten(或 Global Pooling)做維度轉換。","subject_code": "s1"},{"id": "exam-s1-115-1-q33","topic": "Data/Augmentation","question_text": "某自駕車公司的 AI 訓練團隊面臨標註成本高的問題,無法取得足夠的真實惡劣天氣(大雨、濃霧)駕駛場景資料,工程師提議使用合成資料(Synthetic Data)來補充訓練集。請問下列何者最能正確敘述合成資料在 AI 訓練中的角色?","options": {"A": "合成資料主要用於文字任務的資料擴增,影像任務仍需依賴真實資料","B": "合成資料可完全取代真實資料,直接用於模型訓練","C": "合成資料主要用於降低模型推論時的計算成本","D": "合成資料可在控制條件下產生多樣化場景,用於擴充訓練資料並提升模型的泛化能力"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 10,"evidence": "answer column shows 'D' for question 33"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 合成資料(Synthetic Data)最大的價值在於能透過模擬引擎在受控條件下,產生真實世界難以蒐集或成本過高的多樣化場景(如大雨、濃霧等惡劣天氣),用來擴充訓練集覆蓋的場景範圍,幫助模型學到更全面的特徵分佈,進而提升泛化能力,而不是取代真實資料或影響推論成本。\n\n**其他選項為何錯:**\n- A. 合成資料同樣廣泛應用於影像任務(如模擬駕駛場景、模擬感測器資料),並非「只用於文字任務」。\n- B. 合成資料通常存在與真實資料的分佈落差(Sim-to-Real Gap),一般用於「補充」而非「完全取代」真實資料。\n- C. 合成資料是訓練階段用來擴充資料集的手段,與推論階段的計算成本無關。\n- D. ✓ 正解\n\n**記憶要點:** 合成資料 = 用來「補足真實資料蒐集不到的場景」以擴充訓練集,提升泛化,不是萬能取代真實資料。","subject_code": "s1"},{"id": "exam-s1-115-1-q34","topic": "Deploy/MLOps","question_text": "某廣告技術公司的點擊率(CTR)預測系統每天新增數百個用戶行為特徵(如新廣告位、新設備類型),特徵空間持續動態擴展。若採用傳統靜態模型每週批次重訓一次,會導致嚴重的模型過期問題。為在特徵空間頻繁變化的情況下維持模型即時準確度,最適合的模型架構方向為何?","options": {"A": "採用傳統靜態羅吉斯迴歸(Logistic Regression),縮短批次重訓週期從每週改為每日","B": "採用支援增量學習(Incremental Learning)的模型,使模型能隨新資料即時更新並適應新增特徵,而不需重新訓練整個模型","C": "採用固定架構的深度神經網路(DNN),每次有新特徵時重新定義輸入層後全量重訓","D": "改用預訓練圖神經網路(GNN),透過圖結構建立特徵間的關聯,自動應對新增特徵"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 11,"evidence": "answer column shows 'B' for question 34"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 特徵空間持續動態新增,若每次都要全量重訓才能納入新特徵,會造成明顯的模型過期延遲。支援增量學習的模型架構能在不重新訓練整個模型的前提下,隨新資料與新特徵持續、即時地更新,是應對特徵空間頻繁變化情境最合適的方向。\n\n**其他選項為何錯:**\n- A. 即使把批次重訓週期縮短為每日,本質上仍是「靜態批次重訓」,無法真正做到即時反映新增特徵,只是縮短了過期的時間窗,並未解決根本問題。\n- B. ✓ 正解\n- C. 每次新增特徵就要重新定義輸入層並全量重訓,等於每次都要重跑完整訓練流程,無法達到「即時準確度」的需求,維運成本也很高。\n- D. GNN 是為圖結構資料(節點與邊的關係)設計的架構,CTR 預測的特徵新增問題與圖結構關聯性建模無直接關係,並非針對「特徵空間動態擴展」的解法。\n\n**記憶要點:** 特徵/資料頻繁變動、需要即時反映 → 增量學習(Incremental Learning),不必每次都全量重訓。","subject_code": "s1"},{"id": "exam-s1-115-1-q35","topic": "Multimodal/Fusion","question_text": "某生物醫學研究機構正在建構一個整合「基因序列特徵」與「電子病歷文本特徵」的疾病風險預測模型。由於高維數值特徵和語意文本特徵的性質差異顯著,請問下列哪一種特徵處理與選擇策略最為合適?","options": {"A": "將所有特徵合併為單一特徵矩陣後,使用主成分分析(PCA)進行降維,作為模型輸入","B": "採分層策略,先對基因序列特徵進行特徵選擇,再對文本特徵進行語意表示,最後將兩類特徵融合(Feature Fusion)後輸入模型","C": "將所有特徵合併後,使用隨機森林(Random Forest)的特徵重要性進行一次性排序與篩選","D": "將文本特徵轉換為簡單統計特徵(如詞頻)後與基因特徵一併建模,以降低特徵處理複雜度"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 11,"evidence": "answer column shows 'B' for question 35"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 基因序列特徵(高維數值)與電子病歷文本特徵(語意型)性質差異顯著,適合採用分層策略:先針對基因序列做特徵選擇(篩掉雜訊與冗餘維度),再對文本特徵用語意表示方法(如詞嵌入/語言模型)萃取語意向量,最後才將兩類已個別處理好的特徵做融合(Feature Fusion),這樣才能各自保留原始資料型態最適合的處理方式,再整合成統一輸入。\n\n**其他選項為何錯:**\n- A. 直接把數值特徵與文字原始特徵合併成單一矩陣後才做 PCA,會忽略兩者性質差異(PCA 對高維數值有效,但無法妥善處理未經語意表示的原始文本),容易讓語意資訊被稀釋或扭曲。\n- B. ✓ 正解\n- C. 隨機森林特徵重要性適合處理數值型特徵,但對未經語意表示的原始文本特徵效果有限,且「一次性排序篩選」忽略了兩種模態需要不同前處理方式的差異。\n- D. 將文本簡化為詞頻等淺層統計特徵,會遺失語意資訊,雖然降低了複雜度,但犧牲了文本模態原本能提供的語意深度,並非最適合的策略。\n\n**記憶要點:** 性質差異大的異質特徵(數值 vs 文本)→ 先分層各自妥善處理(特徵選擇 / 語意表示),再做 Feature Fusion 整合,不要囫圇合併。","subject_code": "s1"},{"id": "exam-s1-115-1-q36","topic": "CV/Classification","question_text": "某公司希望開發一個工業零件瑕疵辨識分類模型,共有 10 個類別,但每類僅約 50 張人工標註影像(總計約 500 張)。由於標註成本高昂,短期內無法擴充資料集。在此情境下,工程師需要在有限標註資料下建構高效能模型。請問下列哪一種策略最為適合?","options": {"A": "使用在大型資料集預訓練完成的卷積神經網路(CNN),並進行遷移學習微調","B": "從頭訓練大型 Vision Transformer(ViT),完全使用現有 500 張影像","C": "使用 K-means 對影像進行分群,並直接將群集結果作為分類模型輸出","D": "複製既有的資料以增加標註影像數量,並從頭訓練深度 CNN 模型"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 11,"evidence": "answer column shows 'A' for question 36"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 每類僅約 50 張標註影像、共 10 類,標註樣本量非常有限。使用在大型資料集(如 ImageNet)上預訓練好的 CNN 作為特徵萃取骨幹,再針對這個小規模資料集進行遷移學習微調,能利用預訓練模型已學到的通用視覺特徵,大幅降低對大量標註資料的需求,是小樣本情境下最有效的策略。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. Vision Transformer 通常需要比 CNN 更大量的訓練資料才能有效學習(缺乏 CNN 的空間歸納偏誤),用僅 500 張影像從頭訓練 ViT 極易嚴重過擬合。\n- C. K-means 是無監督分群方法,直接把群集結果當作 10 個類別的分類輸出,無法保證群集與真實標籤類別一致,不是監督式分類任務該用的方法。\n- D. 單純複製既有影像並不會增加真正的資訊量(只是重複樣本),從頭訓練深度 CNN 在資料量不足下依然容易過擬合,效果遠不如遷移學習。\n\n**記憶要點:** 標註資料稀少的分類任務,標準解法是「預訓練模型 + 遷移學習微調」,而不是從零訓練大模型或單純複製資料。","subject_code": "s1"},{"id": "exam-s1-115-1-q37","topic": "Data/Preprocessing","question_text": "某製造廠開發產線瑕疵檢測模型時,資料集存在嚴重類別不平衡問題,其中良品約占 99%,瑕疵品僅占 1%。若直接使用原始資料進行訓練,模型容易偏向預測多數類別(良品),導致對少數類別(瑕疵品)辨識能力不足。在不調整模型架構與學習演算法的前提下,僅透過資料前處理方式改善此問題,下列何者最適當?","options": {"A": "使用 SMOTE 等過採樣方法進行少數類別擴增","B": "加入 L1/L2 正則化(Regularization)以防止過擬合","C": "大幅增加深度神經網路的層數,以強化特徵萃取能力","D": "複製更多良品數據,以進一步提升模型的準確率(Accuracy)"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 11,"evidence": "answer column shows 'A' for question 37"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 題目限定「僅透過資料前處理方式」改善類別不平衡(良品 99% vs 瑕疵品 1%)。SMOTE(Synthetic Minority Over-sampling Technique)透過在少數類別(瑕疵品)樣本間進行內插,合成新的少數類別樣本,增加少數類別在訓練集中的比例,讓模型在訓練時能獲得更多瑕疵品的學習訊號,屬於典型的資料層級處理手法。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. L1/L2 正則化是調整模型訓練目標函數的手法,屬於模型/演算法層面的處理,不屬於「資料前處理」,且題目明確排除調整模型架構與學習演算法。\n- C. 增加神經網路層數屬於模型架構調整,不是資料前處理方式,且與類別不平衡問題無直接關聯。\n- D. 複製更多多數類別(良品)資料只會讓不平衡問題更嚴重,模型會更加偏向預測良品,準確率雖可能上升但對偵測瑕疵品毫無幫助,甚至有害。\n\n**記憶要點:** 「僅限資料前處理」解決類別不平衡 → 想到 SMOTE 過採樣(或欠採樣少數類別),不要去動模型架構或正則化。","subject_code": "s1"},{"id": "exam-s1-115-1-q38","topic": "Data/Preprocessing","question_text": "某 IoT 平台接收工廠溫度感測器資料,發現在常態分佈(均值 25°C,標準差 2°C)的數萬筆紀錄中,出現數筆「999°C」的極端值,研判為感測器通訊錯誤(網路封包延遲導致數值溢位)所致,且該異常數值在實際情況下不可能發生。在進行模型訓練前的資料清洗階段,針對這類離群值,最適當的處理策略為何?","options": {"A": "保留所有原始數值,並使用平均數(Mean)作為特徵輸入模型","B": "對數據進行 Z-score 標準化,使數值落於約[-3, 3]範圍","C": "將 999°C 以獨熱編碼(One-Hot Encoding)轉為獨立類別特徵","D": "刪除異常的 999°C 記錄,或以中位數(Median)進行填補"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 12,"evidence": "answer column shows 'D' for question 38"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 999°C 已確認是感測器通訊錯誤造成、實際情況不可能發生的離群值,不具備真實物理意義。對這類已確認為錯誤的離群值,合理做法是直接刪除該筆記錄,或以中位數(對極端值不敏感)進行填補,避免這類異常值扭曲模型訓練時學到的資料分佈。\n\n**其他選項為何錯:**\n- A. 保留原始異常值並直接用平均數作特徵,999°C 這類極端值會嚴重拉高/扭曲平均數,讓平均數本身也失真,無法解決問題。\n- B. Z-score 標準化只是線性縮放數值範圍,並不會把 999°C 的離群本質「消除」,它縮放後仍會是一個異常突出的極端值,標準化不能取代離群值清洗。\n- C. 999°C 是感測器故障產生的連續數值錯誤,並非有意義的類別變數,轉成獨熱編碼類別會讓模型誤以為這是一個有意義的獨立狀態,不符合資料的本質。\n- D. ✓ 正解\n\n**記憶要點:** 確認是感測器錯誤造成、不合理的離群值,標準做法是刪除或用中位數填補,而不是硬塞進模型或只做數值縮放。","subject_code": "s1"},{"id": "exam-s1-115-1-q39","topic": "Data/Preprocessing","question_text": "某 AI 平台工程師正在為多模態模型訓練系統規劃資料儲存架構,需要同時處理原始影像、非結構化文本,以及經過整理的結構化特徵資料。在此情境下,應如何選擇資料湖(Data Lake)與資料倉儲(Data Warehouse)的使用方式?","options": {"A": "將原始影像與文本資料儲存在 Data Lake,將整理後的結構化特徵資料儲存在 Data Warehouse","B": "將所有資料統一儲存在 Data Warehouse,以提升查詢效率","C": "將所有資料統一儲存在 Data Lake,但犧牲結構化資料的查詢效率","D": "僅將原始影像資料儲存在 Data Lake,其餘資料統一存入 Data Warehouse"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 12,"evidence": "answer column shows 'A' for question 39"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** Data Lake 適合儲存原始、未結構化或半結構化的資料(如原始影像、文本),保留最大彈性以供未來多種用途使用;Data Warehouse 則適合儲存已經過整理、具備明確結構的資料(如處理好的結構化特徵),便於高效率查詢與分析。依資料型態分別存放到適合的儲存架構,是同時處理原始異質資料與結構化特徵資料的標準做法。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 原始影像與非結構化文本並不適合直接存入為結構化查詢設計的 Data Warehouse,強行塞入會犧牲彈性且處理成本高。\n- C. Data Warehouse 存在的目的正是為了提供結構化資料的高效查詢,若全部塞進 Data Lake,會犧牲結構化特徵資料原本該有的查詢效率。\n- D. 文本資料同樣屬於非結構化資料,和原始影像一樣適合放在 Data Lake,而非直接歸入 Data Warehouse。\n\n**記憶要點:** 原始/非結構化資料(影像、文本)→ Data Lake;整理過的結構化資料 → Data Warehouse,依資料型態分工存放。","subject_code": "s1"},{"id": "exam-s1-115-1-q40","topic": "GenAI/Compression","question_text": "某智慧製造公司在產線上部署工業相機進行即時外觀瑕疵檢測,原先將影像傳至雲端進行 AI 推論,但因網路延遲與連線不穩導致系統無法滿足即時需求(需低於 200ms)。工程師因此改為將模型部署於產線端的邊緣裝置後,但仍未達系統需求。在不更換硬體設備的前提下,下列哪一組技術最能有效降低推論延遲,同時維持合理準確率?","options": {"A": "減少訓練資料的使用數量,並重新訓練模型以提升推論效率","B": "使用批次推論(Batch Inference)處理多張影像以提升計算效率","C": "採用模型集成(Model Ensemble),透過多模型投票提升準確率","D": "將模型由 FP32 量化為 INT8,並進行推論加速優化"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 12,"evidence": "answer column shows 'D' for question 40"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 情境限制「不更換硬體設備」且需在邊緣裝置上進一步降低推論延遲。將模型從 FP32 量化為 INT8 能大幅降低運算量與記憶體頻寬需求,搭配推論加速優化(如算子融合、專用推論引擎),在同一硬體上顯著提升推論速度,同時量化後準確率通常只有小幅下降,是在不換硬體前提下最直接有效的做法。\n\n**其他選項為何錯:**\n- A. 減少訓練資料量只會影響模型訓練時學到的知識與準確率,並不會改變模型本身的推論運算量,無助於降低推論延遲。\n- B. 批次推論是把多筆輸入一起處理以提升「吞吐量(Throughput)」,但單筆請求需要等待湊滿批次,反而可能拉長單張影像的「延遲」,與即時單張偵測的需求相違背。\n- C. 模型集成需要同時執行多個模型並整合結果,運算量與延遲通常會「增加」而非降低,與降低延遲的目標背道而馳。\n- D. ✓ 正解\n\n**記憶要點:** 不換硬體、要降延遲 → 模型量化(FP32→INT8)+ 推論加速,是邊緣裝置最常見的效能優化組合。","subject_code": "s1"},{"id": "exam-s1-115-1-q41","topic": "Deploy/MLOps","question_text": "某 AI 影像辨識平台以單一 GPU 伺服器提供多租戶推論服務,系統長期觀察到 GPU 使用率約維持在 60%左右,且在執行過程中可觀察到 GPU kernel 之間存在明顯閒置間隔,單次推論多以小批次方式執行。然而,在尖峰時段時,請求延遲會出現明顯波動甚至突增。同時,CPU 與記憶體資源使用率均未達瓶頸,且系統團隊已排除硬體、網路與請求併發控制異常。在此情境下,請判斷最可能造成問題的原因為何?","options": {"A": "GPU 排程策略與批次大小設定不當,導致 GPU 運算單元未被有效利用","B": "請求併發控制機制不佳,導致多個請求同時搶占 GPU Context 資源造成延遲","C": "GPU 硬體效能不足,無法支撐推論負載","D": "模型未進行量化優化,導致推論計算成本過高"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 12,"evidence": "answer column shows 'A' for question 41"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 題目指出 GPU 使用率僅約 60%、kernel 之間有明顯閒置間隔,且多以小批次執行,同時已排除硬體、網路與併發控制異常。這些線索指向 GPU 排程策略與批次大小設定不當:小批次讓 GPU 運算單元無法充分並行利用,kernel 間的閒置間隔顯示排程沒有讓 GPU 持續滿載運作,尖峰時段延遲波動則是因為資源利用效率低,無法有效吸收瞬間增加的請求量。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 題目已明確說明系統團隊已排除「請求併發控制」異常,不應再選這個已被排除的原因。\n- C. GPU 使用率僅 60% 且有明顯閒置間隔,顯示問題是「資源沒被用好」而非「資源不夠用」,若真是硬體效能不足,使用率通常會長期貼近滿載而非閒置。\n- D. 模型未量化只會讓單次推論的運算成本較高,但不能直接解釋「GPU 使用率偏低、kernel 間有閒置間隔」這個現象,兩者關聯性不足以成為最可能的根本原因。\n\n**記憶要點:** 使用率不高 + kernel 間閒置 + 小批次 → 典型的批次大小/排程設定不當,不是硬體不夠力,也不是併發搶佔(已排除)。","subject_code": "s1"},{"id": "exam-s1-115-1-q42","topic": "Deploy/MLOps","question_text": "某保險公司將理賠金額預測模型正式部署上線,MLOps 團隊設計監控機制。三個月後模型整體均方根誤差(RMSE)無明顯變化,但業務單位反映高額理賠案件的預測誤差明顯增加。經分析,高額理賠案件僅佔約 5%的樣本比例,且未被監控機制及時發現。請問最可能的設計缺陷為何?","options": {"A": "監控頻率不足,應由每日批次監控改為即時串流監控","B": "高額理賠案件屬於長尾分布,難以透過監控指標偵測,因此無法透過監控機制發現問題","C": "RMSE 無法有效反映高額誤差,應改以平均絕對誤差(MAE)作為主要監控指標","D": "僅監控整體 RMSE,未針對不同理賠金額區間進行分群監控"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 13,"evidence": "answer column shows 'D' for question 42"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 高額理賠案件僅佔約 5% 的樣本,在只看「整體」RMSE 的情況下,少數高額案件的誤差變化會被大量正常案件的表現稀釋、平均掉,使整體指標看起來「無明顯變化」,但這群體本身的誤差其實已明顯惡化。真正的設計缺陷是監控機制沒有依理賠金額區間(如高額 vs 一般)分群追蹤,才會讓這個局部問題被整體平均指標掩蓋。\n\n**其他選項為何錯:**\n- A. 監控頻率(每日 vs 即時)只影響「多快發現」,並不能解決「整體指標把高額案件誤差稀釋掉」這個根本的分群監控缺失問題。\n- B. 長尾分布確實較難單靠整體指標偵測,但這不代表「無法透過監控機制發現」——只要針對高額區間單獨監控,一樣能有效偵測,選項的結論過於絕對。\n- C. 換成 MAE 同樣是「整體」指標,一樣會被佔多數的正常案件稀釋,無法解決高額理賠這個特定子群體被掩蓋的問題,問題不在指標種類而在有沒有分群。\n- D. ✓ 正解\n\n**記憶要點:** 整體指標會被多數樣本稀釋掉少數關鍵子群體的問題,監控應依業務重要區間(如高額理賠)分群追蹤,而不只看整體平均。","subject_code": "s1"},{"id": "exam-s1-115-1-q43","topic": "Deploy/MLOps","question_text": "某電商平台的演算法工程師開發了一個新版商品推薦模型,在離線 A/B 測試中,新模型的各項評估指標(AUC、NDCG@10)均顯著優於現行線上模型。然而,離線測試無法完全反映真實使用者的互動行為(點擊、購買、停留時間)。在正式全面上線前,若希望在可控制風險下量化真實業務指標,應採用下列何種線上驗證策略?","options": {"A": "影子模式(Shadow Mode):新舊模型同時產生預測,但僅顯示舊模型結果,於後端比較輸出差異","B": "回測(Backtesting):使用歷史日誌模擬模型表現作為上線依據","C": "金絲雀發布(Canary Release):將 1–5%使用者流量導向新模型,量測 CTR、CVR 等指標並逐步擴量","D": "負載測試(Load Testing):於測試環境進行高流量壓力測試後直接全面上線"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 13,"evidence": "answer column shows 'C' for question 43"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 題目要求「在可控制風險下量化真實業務指標(點擊、購買等使用者互動)」。金絲雀發布只將小比例(1–5%)的真實使用者流量導入新模型,讓這群使用者對新模型的推薦產生真實互動,藉此直接量測 CTR、CVR 等真實業務指標,並在確認效果良好後才逐步擴大流量,風險可控且能取得離線測試拿不到的真實線上反饋。\n\n**其他選項為何錯:**\n- A. 影子模式讓新模型在背景同步產生預測,但實際顯示給使用者的仍是舊模型結果,使用者不會與新模型的推薦互動,因此無法量測到 CTR、CVR 這類需要真實使用者互動才能產生的業務指標。\n- B. 回測是用「歷史」日誌資料模擬,並非真實使用者對「當下」新模型輸出的即時互動,同樣無法反映真實線上業務表現,這正是離線測試的侷限。\n- C. ✓ 正解\n- D. 負載測試評估的是系統在高流量下的效能穩定性,與量測業務指標(CTR、CVR)無關,而且「直接全面上線」也違反了「可控制風險」的要求。\n\n**記憶要點:** 要量測「真實使用者業務指標」又要「控制風險」→ 金絲雀發布(小流量真實曝光、逐步擴量);影子模式只比對輸出、不影響使用者體驗,測不到真實互動指標。","subject_code": "s1"},{"id": "exam-s1-115-1-q44","topic": "Deploy/Integration","question_text": "某 MLOps 工程師正在設計 AI 模型的推論服務 API,需要處理使用者上傳的高解析度影像(平均 5MB)進行即時分類。在 RESTful API 設計時,選擇 HTTP 請求方法與資料傳輸格式的最佳實踐為何?","options": {"A": "使用 HTTP GET 方法,將影像資料 Base64 編碼後附加於 URL Query String 中","B": "採用 HTTP POST 請求,將影像資料以 multipart/form-data 或 application/octet-stream 傳輸於 Request Body","C": "使用 HTTP PUT 方法,透過 Content-Type: application/xml 傳遞影像資料","D": "要求客戶端下載模型於本地推論,僅回傳分類結果"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 13,"evidence": "answer column shows 'B' for question 44"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 上傳 5MB 高解析度影像屬於大型二進位資料傳輸,應使用 HTTP POST 方法,並以 multipart/form-data(適合檔案上傳表單)或 application/octet-stream(直接傳送二進位資料流)格式將影像放在 Request Body 中傳送,這是 RESTful API 處理大型檔案上傳的標準實踐。\n\n**其他選項為何錯:**\n- A. URL 長度有實際限制(常見瀏覽器/伺服器限制在數 KB 到數十 KB),5MB 影像即使 Base64 編碼後也遠遠超過 URL Query String 能承載的長度,且 GET 語意上不適合用來傳送大量資料。\n- B. ✓ 正解\n- C. PUT 通常用於「以完整資料取代/更新某資源」,而非提交資料進行處理;且 application/xml 並不適合承載二進位影像資料,會需要額外編碼、效率低。\n- D. 要求客戶端下載模型於本地推論違反了題目「即時分類」服務由伺服器端 API 提供推論的設計目標,也失去了集中化模型服務、版本控管的意義。\n\n**記憶要點:** 大型檔案(影像)上傳 → POST + multipart/form-data 或 octet-stream,GET 的 URL 裝不下、也不是語意正確的做法。","subject_code": "s1"},{"id": "exam-s1-115-1-q45","topic": "Deploy/Integration","question_text": "某 AI 平台整合多個外部 AI 微服務(語音辨識 API、NLP 分析 API、知識圖譜查詢服務),在高峰期間某外部服務偶發延遲或逾時(Timeout),導致請求鏈路壅塞,最終造成平台級服務中斷(Cascading Failure)。為從架構層面預防此類連鎖故障,最有效的設計模式為何?","options": {"A": "將所有外部 API 呼叫改為同步串行處理,並取消逾時限制,確保每個請求皆完成後再繼續","B": "為外部服務導入斷路器模式(Circuit Breaker),在異常時暫停呼叫並提供替代回應","C": "擴充各微服務的執行緒池(Thread Pool)上限,以提升併發處理能力","D": "停用服務健康檢查,減少不必要的額外負載"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 14,"evidence": "answer column shows 'B' for question 45"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 斷路器模式(Circuit Breaker)會持續監控外部服務的錯誤率或逾時狀況,一旦超過閾值就「跳脫」,暫停對該異常服務的呼叫並直接回傳替代回應(Fallback),避免請求持續堆積、等待逾時而拖垮整個呼叫鏈,是從架構層面防止單一服務異常引發連鎖故障(Cascading Failure)最直接有效的設計模式。\n\n**其他選項為何錯:**\n- A. 取消逾時限制反而會讓請求在異常服務上無限期卡住,加劇請求堆積與資源耗盡,使連鎖故障風險更嚴重,而非改善。\n- B. ✓ 正解\n- C. 擴充執行緒池上限只是增加「能同時卡住等待的請求數量」,並未解決異常服務拖慢整條呼叫鏈的根本問題,資源耗盡的風險依然存在,只是延後爆發。\n- D. 停用健康檢查會讓系統失去偵測服務異常的能力,無法及早發現問題並採取因應措施,反而增加連鎖故障的風險。\n\n**記憶要點:** 防止外部服務異常拖垮整體系統 → 斷路器模式(Circuit Breaker),異常時快速失敗 + 提供 Fallback,而不是硬撐等待或盲目擴充資源。","subject_code": "s1"},{"id": "exam-s1-115-1-q46","topic": "Risk/Privacy","question_text": "某醫院計劃建立混合雲 AI 平台:使用公有雲 GPU 叢集進行 CT 影像模型訓練,但基於 HIPAA(Health Insurance Portability and Accountability Act)法規要求,患者影像原始資料不得離開醫院院內環境。下列何者最符合「利用公有雲算力訓練模型」與「不傳輸原始患者資料」雙重限制的技術方案?","options": {"A": "將患者影像資料以 AES-256 加密後上傳至公有雲,並於雲端解密後進行模型訓練","B": "在院內部署同態加密(Homomorphic Encryption)模組,對推論請求進行加密處理","C": "採用聯邦學習(Federated Learning)於院內訓練模型,僅傳送模型更新至雲端聚合,原始資料不外流","D": "建立專線 VPN 連接醫院與雲端,以網路層安全保護資料傳輸"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 14,"evidence": "answer column shows 'C' for question 46"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 聯邦學習讓模型訓練在院內本地端進行,原始患者影像資料完全不離開醫院環境,訓練過程中只將模型參數更新(梯度或權重變化)傳送到雲端進行聚合,同時仍能借助雲端算力共同改善模型,同時滿足「利用雲端算力訓練」與「原始資料不外流」兩項限制。\n\n**其他選項為何錯:**\n- A. 即使加密上傳,資料仍實質「離開」了醫院環境並在雲端解密還原成可讀影像,違反 HIPAA 要求原始資料不得離開院內環境的限制。\n- B. 同態加密是針對「推論請求」進行加密運算的技術,主要用於保護推論階段的資料隱私,並非解決「如何在雲端利用算力訓練模型、同時不傳送原始訓練資料」這個訓練情境的問題。\n- C. ✓ 正解\n- D. VPN 專線只是強化「傳輸過程」的網路層安全,但資料本質上仍需要傳輸到雲端才能訓練,並未解決「原始資料不得離開醫院」的根本限制。\n\n**記憶要點:** 「用雲端算力訓練、但資料不能離開本地」的經典解法就是聯邦學習(Federated Learning)——資料留在本地,只傳模型更新去聚合。","subject_code": "s1"},{"id": "exam-s1-115-1-q47","topic": "Deploy/MLOps","question_text": "某電商平台將新的推薦模型部署至線上系統,為降低風險,團隊採用漸進式部署策略(Phased Rollout),先將新模型流量從 5%逐步提升至 100%。在部署初期,團隊發現轉換率(Conversion Rate)略有提升,但在流量提升至 30%時,系統延遲(Latency)明顯上升,且部分使用者體驗變差。請問在此情境下,最適當的下一步策略為何?","options": {"A": "立即將新模型全面部署至 100%,以觀察整體效果並評估系統表現變化","B": "還原(Rollback)至舊模型並停止新模型測試流程,以確保系統穩定與使用者體驗品質","C": "維持目前 30%流量並持續觀察,即使延遲問題存在也暫不進行調整","D": "暫停流量提升,針對延遲問題進行效能分析與優化後再繼續部署"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 14,"evidence": "answer column shows 'D' for question 47"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 漸進式部署的目的正是在發現問題時能及時止步、排查再繼續。目前已觀察到轉換率提升(代表新模型本身有正面效益)但延遲在 30% 流量時明顯上升,合理做法是暫停繼續擴大流量,先針對延遲問題進行效能分析與優化,確認問題解決後再繼續逐步擴量,才能同時保留轉換率的正面效益並解決延遲風險。\n\n**其他選項為何錯:**\n- A. 在已出現延遲惡化與使用者體驗變差的警訊下,直接衝到 100% 流量會讓問題影響到全部使用者,風險不受控,違背漸進式部署逐步驗證的精神。\n- B. 新模型已顯示轉換率提升的正面效益,直接完全 Rollback 並停止測試,等於放棄了這個潛在效益,且延遲問題也可能只是可被優化解決的技術問題,不必然要整個放棄。\n- C. 延遲問題已經明顯影響使用者體驗,若放任不處理繼續維持現狀,問題只會持續影響這 30% 的使用者,不符合「發現問題就該應對」的漸進式部署精神。\n- D. ✓ 正解\n\n**記憶要點:** 漸進式部署遇到指標轉差,標準反應是「暫停擴量 → 分析優化 → 確認後再繼續」,不是直接衝到 100% 也不是馬上整個放棄。","subject_code": "s1"},{"id": "exam-s1-115-1-q48","topic": "Data/Drift","question_text": "某銀行的信用卡風控模型已穩定上線一年,主要用於偵測盜刷交易提醒。近期在未對模型或特徵工程進行調整的情況下,系統觀察到深夜電商交易的核准率明顯上升,盜刷攔截率下降,但模型 AUC 幾乎維持不變,且交易金額、地區與裝置等特徵分布未出現明顯變化。進一步分析發現,疫情後使用者行為改變,使原本被視為高風險的交易型態逐漸轉為一般消費。下列何者最能敘述此現象的原因?","options": {"A": "資料漂移(Data Drift),因輸入特徵分布發生變化","B": "訓練與服務偏差(Training-Serving Skew),因線上與離線特徵處理不一致","C": "概念漂移(Concept Drift),因特徵與目標標籤之間的關聯性改變","D": "決策閾值偏移(Threshold Shift),因分類門檻設定不當導致預測偏差"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 15,"evidence": "answer column shows 'C' for question 48"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 題目明確指出交易金額、地區、裝置等「輸入特徵分布」並未出現明顯變化,但使用者行為模式改變,使原本會被判定為高風險的深夜電商交易型態,實際上已經轉變為正常消費——也就是同樣的輸入特徵,如今對應到的「真實標籤(是否為盜刷)」意義已經不同了。這正是概念漂移(Concept Drift)的定義:特徵與目標標籤之間的關聯性隨時間改變,而不是輸入特徵本身的分布改變。\n\n**其他選項為何錯:**\n- A. 資料漂移指的是「輸入特徵分布」本身發生變化,但題目已明確排除這點(交易金額、地區、裝置特徵分布未變),因此不符合資料漂移的定義。\n- B. 訓練與服務偏差是指線上推論與離線訓練時的特徵處理邏輯不一致所造成的落差,屬於工程實作問題,與題目描述的「使用者行為型態隨時間改變」的業務現象無關。\n- C. ✓ 正解\n- D. 題目說明模型與特徵工程都未經調整,問題源自使用者行為型態改變導致標籤意義變化,而非有人調整了分類門檻,不符合決策閾值偏移的情境。\n\n**記憶要點:** 特徵分布沒變、但「特徵→標籤」的對應關係變了 → 概念漂移(Concept Drift);特徵分布本身變了才是資料漂移(Data Drift)。","subject_code": "s1"},{"id": "exam-s1-115-1-q49","topic": "Deploy/MLOps","question_text": "某零售電商平台已建立模型監控儀表板,用於追蹤線上推薦模型的運作狀態與效能表現。維運工程師需判斷哪些指標屬於「線上持續監控(Continuous Monitoring)」的範疇。下列指標中,哪一項最不適合在即時監控系統中追蹤,而應改由離線實驗追蹤系統管理?","options": {"A": "訓練實驗中每個 Epoch 的學習率(Learning Rate)變化曲線與超參數(Hyperparameter)設定軌跡","B": "線上推論 API 的 P50/P95/P99 回應延遲與每日請求量(RPS)趨勢","C": "輸入特徵分佈的族群穩定性指數(Population Stability Index, PSI),偵測資料漂移","D": "模型預測結果分佈(如 CTR)與定期回收的人工標註結果之對比"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 15,"evidence": "answer column shows 'A' for question 49"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 每個 Epoch 的學習率變化曲線與超參數設定軌跡,是模型「訓練階段」的實驗紀錄,屬於離線實驗追蹤系統(如 MLflow、TensorBoard 等實驗管理工具)該負責記錄與比較的內容,並非模型上線後需要「持續監控」的線上運作狀態指標,不應納入即時監控儀表板。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. API 回應延遲與請求量趨勢是模型上線後「服務層級」的即時運作狀態,必須持續在線監控才能及時發現效能異常。\n- C. PSI 用來偵測「線上」輸入特徵分布是否隨時間偏離訓練時的分布(資料漂移),需要對持續進來的線上流量做即時或定期監控。\n- D. 比對模型預測分布與人工標註結果,是持續追蹤模型線上預測品質是否隨時間劣化的機制,同樣屬於上線後需要持續監控的範疇。\n\n**記憶要點:** 訓練過程中的超參數/學習率曲線是「離線實驗紀錄」;上線後的延遲、流量、資料漂移、預測品質才是「線上持續監控」該管的事。","subject_code": "s1"},{"id": "exam-s1-115-1-q50","topic": "Multimodal/Fusion","question_text": "某醫療團隊建立肺炎診斷系統,採用晚期融合(Late Fusion)策略,將胸腔 X 光影像與病患問診文字分別進行預測後再整合結果。測試發現,當問診紀錄品質不佳(如描述簡短或資訊缺漏)時,整體模型效能僅小幅下降。關於此現象,下列何者最不可能為其原因?","options": {"A": "各模態獨立進行預測,可降低單一模態品質不佳對整體結果的影響","B": "融合階段可調整不同模態的權重,使低品質模態影響降低","C": "各模態使用獨立模型,使錯誤不會在特徵層被放大","D": "晚期融合會在輸入階段整合多模態特徵,因此能避免低品質資料影響"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 15,"evidence": "answer column shows 'D' for question 50"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 晚期融合(Late Fusion)的定義是「各模態分別獨立預測後,才在輸出/決策階段整合結果」,而不是在「輸入階段」整合特徵——那是早期融合(Early Fusion)的做法。選項 D 把晚期融合的機制描述成早期融合,敘述本身與晚期融合的定義相反,因此不可能是「晚期融合為何能降低問診品質不佳影響」的正確原因。\n\n**其他選項為何錯:**\n- A. 各模態獨立預測正是晚期融合的核心特性,單一模態(問診文字)品質不佳時,另一模態(X 光影像)的預測不會被直接拖累,是合理的原因之一。\n- B. 融合階段依可靠度動態調整各模態權重,是晚期融合常見的強化做法,能合理降低低品質模態對最終結果的影響。\n- C. 各模態使用獨立模型分別預測,一個模態的錯誤不會在特徵抽取層就與另一模態糾纏放大,是晚期融合結構性的合理優點。\n- D. ✓ 正解\n\n**記憶要點:** 晚期融合 = 先各自預測、後端整合結果;早期融合 = 先合併特徵、再一起預測。選項 D 把兩者定義搞反,是本題要挑出的錯誤敘述。","subject_code": "s1"},{"id": "sample-114-09-q1","topic": "AI/Definition","question_text": "下列何者並未使用人工智慧(AI)或機器學習(ML)技術?","options": {"A": "使用一組預定義規則來確定最佳移動做法的象棋遊戲","B": "使用深度神經網路來提高其準確性的語音識別系統","C": "使用感測器和預定義的自動駕駛汽車-定義導航規則","D": "使用自然語言處理算法來理解和反應用戶查詢的聊天機器人"},"correct_answer": "A","source": {"file": "shared/sample-questions.pdf","page": 1,"evidence": "answer column shows 'A' for question 1"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 「預定義規則」屬於傳統符號式 AI 中的規則式系統(rule-based),沒有從資料中「學習」的過程,因此並未使用機器學習。注意:廣義的 AI 可包含規則系統,但題目並列 AI 或 ML,選項 A 通常被認為偏向 expert system 而非 ML。\n\n**其他選項為何錯:**\n- A. ✓ 正解(此題的「未使用 AI 或 ML」)\n- B. 深度神經網路屬 ML/DL。\n- C. 雖也有「預定義規則」字樣,但題幹明指自駕車,實務上多結合 ML 感知模組(此處依官方解為「使用 ML」)。\n- D. NLP 屬於 AI/ML 應用。\n\n**記憶要點:** 純規則系統(if-else / expert system)≠ ML;ML 必須從資料學參數。","subject_code": "s1"},{"id": "sample-114-09-q2","topic": "NLP/Tokenization","question_text": "在文本資料處理過程中,通常會需要「將接續的文本轉換為詞彙單位」,以便後續的處理。請問上述所指的是文本資料處理中的哪一個方法?","options": {"A": "詞形還原(Lemmatization)","B": "停用詞移除(Stopword Removal)","C": "斷詞(Tokenization)","D": "詞頻-逆向文件頻率(Term Frequency-Inverse Document Frequency, TF-IDF)"},"correct_answer": "C","source": {"file": "shared/sample-questions.pdf","page": 1,"evidence": "answer column shows 'C' for question 2"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** Tokenization(斷詞)即「將連續文本切分為詞或子詞單位」,是 NLP 預處理的第一步。\n\n**其他選項為何錯:**\n- A. Lemmatization 是將詞還原為原型(running→run)。\n- B. Stopword Removal 是移除「的、是、in、the」等高頻低訊息詞。\n- C. ✓ 正解\n- D. TF-IDF 是詞權重計算方法,不是斷詞。\n\n**記憶要點:** Tokenize → Stopword Removal → Lemmatize/Stem → Vectorize(TF-IDF / Embedding)。","subject_code": "s1"},{"id": "sample-114-09-q3","topic": "NLP/Sentiment","question_text": "下列何者為自然語言處理(NLP)在機器學習應用中的主要用途?","options": {"A": "情緒分析","B": "圖像識別","C": "預測性維護","D": "供應鏈優化"},"correct_answer": "A","source": {"file": "shared/sample-questions.pdf","page": 1,"evidence": "answer column shows 'A' for question 3"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 情緒分析(Sentiment Analysis)是 NLP 的經典任務之一;其餘選項皆屬其他領域。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 圖像識別屬 Computer Vision。\n- C. 預測性維護屬 IoT/時序預測。\n- D. 供應鏈優化屬作業研究/最佳化。\n\n**記憶要點:** NLP 經典任務:情緒分析、機器翻譯、命名實體辨識、文本摘要、問答系統。","subject_code": "s1"},{"id": "sample-114-09-q4","topic": "ML/Classification","question_text": "關於深度學習模型,下列敘述何者不正確?","options": {"A": "卷積神經網路(Convolutional Neural Networks)適合影像辨識","B": "ReLU(Rectified Linear Unit)比 tanh 和 Sigmoid 好,因為 ReLU 可以減緩梯度爆炸與消失的現象","C": "遞迴神經網路(Recurrent Neural Networks)適合處理序列相關資料","D": "Elman 神經網路(Elman Neural Networks)適合處理影像辨識"},"correct_answer": "D","source": {"file": "shared/sample-questions.pdf","page": 1,"evidence": "answer column shows 'D' for question 4"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是「不正確」的選項(本題選非):** Elman Network 是早期的簡單 RNN,適合處理「序列資料」(如語音、時間序列),而非影像;影像辨識的代表是 CNN。\n\n**其他選項為何錯(實則正確的敘述):**\n- A. CNN 處理影像,正確。\n- B. ReLU 緩解梯度消失,正確(雖然極端負輸入仍可能 dying ReLU)。\n- C. RNN 處理序列,正確。\n- D. ✓ 正解(此為「不正確」的描述)\n\n**記憶要點:** Elman = simple RNN,處理序列。影像 → CNN;序列 → RNN/LSTM/Transformer。","subject_code": "s1"},{"id": "sample-114-09-q5","topic": "Deploy/MLOps","question_text": "下列何者為機器學習模型在業界部署的主要趨勢?","options": {"A": "越來越多地採用自動化機器學習(AutoML)技術","B": "轉向使用更簡單的機器學習算法","C": "基於雲的機器學習平台的使用率下降","D": "依賴手動超參數調整進行模型優化"},"correct_answer": "A","source": {"file": "shared/sample-questions.pdf","page": 1,"evidence": "answer column shows 'A' for question 5"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** AutoML(自動化超參數搜尋、自動特徵工程、自動模型選擇)是當前產業的明顯趨勢,讓非專家也能快速建模。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 趨勢相反:深度學習與大模型反而越來越複雜。\n- C. 雲端 ML 平台使用率上升而非下降。\n- D. 手動調參正逐步被自動化取代。\n\n**記憶要點:** AutoML / Cloud ML / MLOps 三大現代趨勢。","subject_code": "s1"},{"id": "sample-114-09-q6","topic": "ML/Regression","question_text": "下列何者「最適合」使用迴歸(Regression)模型進行預測?","options": {"A": "根據顧客的購買行為,預測他最可能加入購物車的商品類別","B": "根據病患的症狀與病史,判斷其可能患有的疾病類別","C": "根據電影的特徵與用戶評分,推薦適合的電影類型","D": "根據歷年銷售數據,預測明年某產品的總銷售額"},"correct_answer": "D","source": {"file": "shared/sample-questions.pdf","page": 2,"evidence": "answer column shows 'D' for question 6"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 迴歸用於預測「連續數值」,如總銷售額。其餘選項皆為類別輸出,適合分類(或推薦)模型。\n\n**其他選項為何錯:**\n- A. 預測商品「類別」屬分類。\n- B. 疾病「類別」屬分類。\n- C. 推薦電影類型屬推薦系統/分類。\n- D. ✓ 正解\n\n**記憶要點:** 連續數值 → Regression;類別 → Classification。","subject_code": "s1"},{"id": "sample-114-09-q7","topic": "CV/Segmentation","question_text": "附圖中,展示了電腦視覺辨識的幾種技術。請問下列選項中,何者正確配對了圖中(a)、(b)、(c)、(d)所代表的技術名稱?","options": {"A": "(a)實例分割(Instance Segmentation)/(b)語義分割(Semantic Segmentation)/(c)物件偵測(Object Detection)/(d)圖像分類(Image Classification)","B": "(a)圖像分類(Image Classification)/(b)語義分割(Semantic Segmentation)/(c)物件偵測(Object Detection)/(d)實例分割(Instance Segmentation)","C": "(a)圖像分類(Image Classification)/(b)物件偵測(Object Detection)/(c)語義分割(Semantic Segmentation)/(d)實例分割(Instance Segmentation)","D": "(a)圖像分類(Image Classification)/(b)物件偵測(Object Detection)/(c)實例分割(Instance Segmentation)/(d)語義分割(Semantic Segmentation)"},"correct_answer": "B","source": {"file": "shared/sample-questions.pdf","page": 2,"evidence": "answer column shows 'B' for question 7"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 本題為附圖題(四格 CV 任務示意圖)。依電腦視覺四大任務由易到難的標準階層:**圖像分類**(整張圖一個類別) → **語義分割**(每像素類別,同類不分個體) → **物件偵測**(用 bounding box 框出可數物件) → **實例分割**(像素級且區分同類個體),B 選項與此順序最為一致。\n\n**其他選項為何錯:**\n- A. 順序顛倒。\n- B. ✓ 正解\n- C. (b)(c) 順序對調。\n- D. (c)(d) 順序對調。\n\n**記憶要點:** CV 四階層:Classification → Semantic Seg → Detection → Instance Seg。語義「不分個體」、實例「分個體」。","image": "shared/images/cv-tasks-mit.png","subject_code": "s1"},{"id": "sample-114-09-q8","topic": "GenAI/Compression","question_text": "企業在生成式 AI 導入中,可選擇下列哪一種模型壓縮(Model Compression)技術以減少記憶體使用?","options": {"A": "參數剪枝","B": "增加訓練數據量","C": "增加模型層數","D": "使用更高維數據"},"correct_answer": "A","source": {"file": "shared/sample-questions.pdf","page": 2,"evidence": "answer column shows 'A' for question 8"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 模型壓縮三大手段:Pruning(剪枝)、Quantization(量化)、Knowledge Distillation(蒸餾)。剪枝直接去除冗餘參數,可顯著降低記憶體與運算量。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 加資料是資料工程,不是模型壓縮。\n- C. 加層數使模型更大,反向操作。\n- D. 高維資料增加記憶體需求。\n\n**記憶要點:** 模型壓縮三劍客:Pruning / Quantization / Distillation。","subject_code": "s1"},{"id": "sample-114-09-q9","topic": "Risk/Security","question_text": "供應鏈攻擊(Supply Chain Attacks)如何影響企業內部 AI 系統安全?","options": {"A": "供應鏈攻擊的常見狀況,包括員工因釣魚郵件而被盜取帳號密碼","B": "AI 系統依賴的第三方開源模型或數據可能被植入惡意內容","C": "AI 系統只會受到 DDoS 攻擊影響,不會有供應鏈風險","D": "供應鏈攻擊僅影響硬體層級、不影響 AI 模型"},"correct_answer": "B","source": {"file": "shared/sample-questions.pdf","page": 3,"evidence": "answer column shows 'B' for question 9"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 供應鏈攻擊在 AI 領域常見手法包括:第三方預訓練模型被植入後門(backdoor)、訓練資料被毒化(data poisoning)、套件依賴被惡意篡改(如 PyPI 仿冒套件)。\n\n**其他選項為何錯:**\n- A. 釣魚郵件屬社交工程,非供應鏈攻擊主體。\n- B. ✓ 正解\n- C. DDoS 只是其中一種威脅。\n- D. 軟硬體都會受影響,描述偏狹。\n\n**記憶要點:** AI 供應鏈攻擊三類:模型後門、資料毒化、依賴鏈污染。","subject_code": "s1"},{"id": "sample-114-09-q10","topic": "NLP/Embedding","question_text": "下列何者為自然語言處理(NLP)中的詞嵌入技術,能將文字轉換為向量以利機器學習處理?","options": {"A": "TF-IDF","B": "Word2Vec","C": "Stop Words","D": "Bag-of-Words"},"correct_answer": "B","source": {"file": "shared/sample-questions.pdf","page": 3,"evidence": "answer column shows 'B' for question 10"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Word2Vec 是經典的詞嵌入(Word Embedding)演算法,輸出連續向量空間中的詞向量。\n\n**其他選項為何錯:**\n- A. TF-IDF 是稀疏權重向量,常被歸類為向量化而非嵌入。\n- B. ✓ 正解\n- C. Stop Words 是停用詞清單,不是嵌入。\n- D. Bag-of-Words 是稀疏計數向量,不是密集嵌入。\n\n**記憶要點:** Word Embedding 代表作:Word2Vec、GloVe、FastText、ELMo、BERT embedding。","subject_code": "s1"},{"id": "sample-114-09-q11","topic": "Multimodal","question_text": "在多模態學習中,早期融合(Early Fusion)方法的主要特徵為何?","options": {"A": "將不同模態資料的輸出結果進行決策合併","B": "在模型輸入階段或特徵提取階段整合不同模態資料","C": "僅處理單一來源的資料輸入","D": "利用注意力機制在深層隱藏層進行語意比對與融合"},"correct_answer": "B","source": {"file": "shared/sample-questions.pdf","page": 3,"evidence": "answer column shows 'B' for question 11"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Early Fusion 在輸入或特徵層即合併不同模態(例如把影像特徵與文字向量拼接後一同送入模型),Late Fusion 才是各自輸出後再合併決策。\n\n**其他選項為何錯:**\n- A. 輸出層決策合併是 Late Fusion。\n- B. ✓ 正解\n- C. 單一模態與融合定義不符。\n- D. 深層隱藏層注意力比對屬 Mid/Hybrid Fusion。\n\n**記憶要點:** Early=輸入合;Late=輸出合;Hybrid/Mid=中間層合。","subject_code": "s1"},{"id": "sample-114-09-q12","topic": "Multimodal","question_text": "下列哪項技術最有助於強化醫療多模態 AI 系統在處理影像與文本數據時的整合能力?","options": {"A": "利用預先定義的規則產生診斷結果","B": "僅使用 CNN 架構同時處理影像與文字資訊","C": "利用單一模態資料建立通用醫療模型","D": "採用 Transformer 架構整合醫療影像與臨床文本資訊"},"correct_answer": "D","source": {"file": "shared/sample-questions.pdf","page": 3,"evidence": "answer column shows 'D' for question 12"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** Transformer(及衍生的 ViT、跨模態 Transformer)能透過 self-attention 機制整合異質模態(影像 patches + 文本 tokens),是現代多模態醫療 AI 的主流選擇(如 Med-PaLM、MedCLIP)。\n\n**其他選項為何錯:**\n- A. 規則系統缺乏學習能力。\n- B. CNN 不擅長處理文字序列。\n- C. 單模態無法達到多模態整合。\n- D. ✓ 正解\n\n**記憶要點:** 多模態整合首選 = Transformer / Attention;CNN 處理視覺、Transformer 處理序列與整合。","subject_code": "s1"},{"id": "sample-114-09-q13","topic": "ML/Clustering","question_text": "某線上音樂平台希望根據用戶的聽歌與查詢行為,將用戶劃分為不同的類群。若事前沒有定義用戶類型,下列哪一種模型最適合用於此任務?","options": {"A": "邏輯迴歸(Logistic Regression)","B": "決策樹(Decision Tree)","C": "基於密度之含噪空間聚類法(DBSCAN)","D": "線性迴歸(Linear Regression)"},"correct_answer": "C","source": {"file": "shared/sample-questions.pdf","page": 3,"evidence": "answer column shows 'C' for question 13"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 事前無已知類別屬於非監督學習(unsupervised),DBSCAN 為密度型分群,可自動發現群數並標出雜訊,符合需求。\n\n**其他選項為何錯:**\n- A. Logistic Regression 是監督分類。\n- B. Decision Tree 通常用於監督學習。\n- C. ✓ 正解\n- D. Linear Regression 是監督迴歸。\n\n**記憶要點:** 無標籤 + 自動分群 → 非監督:K-Means、DBSCAN、Hierarchical、GMM。","subject_code": "s1"},{"id": "sample-114-09-q14","topic": "Data/Preprocessing","question_text": "在訓練模型時,若數據中出現特徵尺度差異極大(例如:年齡為 0-100、收入為 0-1,000,000),容易導致模型偏向特定特徵。為提升模型效能與穩定性,以下哪一種預處理方式最能有效解決此問題?","options": {"A": "移除尺度較小的欄位以避免對模型影響過低","B": "對所有特徵進行 Z-score 標準化(Standardization)","C": "將特徵縮放至 0-1 區間進行最小-最大正規化(Min-Max Normalization)","D": "對所有數值欄位加上常數使其不為零"},"correct_answer": "B","source": {"file": "shared/sample-questions.pdf","page": 3,"evidence": "answer column shows 'B' for question 14"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Z-score 標準化(x→(x-μ)/σ)能將不同尺度特徵調整至相近分佈(均值 0、標準差 1),對受尺度影響的演算法(SVM、KNN、線性迴歸、神經網路)效益顯著。\n\n**其他選項為何錯:**\n- A. 移除欄位會丟失資訊。\n- B. ✓ 正解\n- C. Min-Max 也可行,但對極端值敏感且不必然優於 Z-score;此題官方解為 B。\n- D. 加常數不改變尺度差異。\n\n**記憶要點:** Standardization(Z-score)= 分佈導向;Min-Max = 範圍導向,有 outlier 時前者較穩健。","subject_code": "s1"},{"id": "sample-114-09-q15","topic": "Deploy/Integration","question_text": "某企業即將部署 AI 模型至現有營運系統,進入系統整合測試階段。測試工程師需確認所有模組在實際環境中能正確協同運作。下列哪項驗證最應優先執行?","options": {"A": "確認模型在開發機上訓練集表現是否達標","B": "驗證模型服務與資料平台、前後端介面協同是否正常,資料格式與流程一致性是否維持","C": "檢查開發團隊提交程式碼時是否有依照 Git commit message 規範","D": "審閱模型報告與 API 文件的格式是否符合交付標準"},"correct_answer": "B","source": {"file": "shared/sample-questions.pdf","page": 4,"evidence": "answer column shows 'B' for question 15"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 系統整合測試(SIT)的重點是驗證模型服務與其他子系統(資料平台、前後端、API)間的協同運作與資料格式一致性,而非單一模組的內部表現。\n\n**其他選項為何錯:**\n- A. 訓練集表現屬離線評估,非整合測試。\n- B. ✓ 正解\n- C. Git commit 規範屬版控規範,非整合測試重點。\n- D. 文件格式審閱屬交付驗收。\n\n**記憶要點:** SIT = System Integration Test,聚焦「跨系統介面」;單元測試聚焦「函式」;UAT 聚焦「使用者驗收」。","subject_code": "s1"},{"id": "gen-claude-s1-q1","topic": "NLP/Sentiment","question_text": "某連鎖餐飲業者欲將「情感分析(Sentiment Analysis)」應用於 Google 評論監控,以即時偵測門市口碑變化。下列哪一種模型輸出最能直接支援「自動分配給門市經理優先處理」的工作流?","options": {"A": "輸出每則評論的詞性標註(POS)結果","B": "輸出每則評論的正負情感極性與信心分數","C": "輸出每則評論的關鍵詞 TF-IDF 分數","D": "輸出每則評論的語言別與字數統計"},"correct_answer": "B","source": {"file": "subjects/1-ai/study-guide.pdf","page": 10,"evidence": "學習指引 3.1 節說明情感分析屬於 NLU 任務,輸出文本的情感極性(正面/負面/中性)以掌握使用者情緒。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 情感分析的目的就是將文本對應到情感極性類別並給出信心分數,可直接作為門市分流規則(例如「負面 & 信心 > 0.8 → 立即指派」)。\n\n**其他選項為何錯:**\n- A. POS 是語法分析,與情感無關。\n- B. ✓ 正解\n- C. TF-IDF 是關鍵詞權重,不直接表達情感。\n- D. 語言別與字數無法判斷情感。\n\n**記憶要點:** Sentiment = 極性 + 信心分數,才能驅動 routing/alert 等下游工作流。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q2","topic": "NLP/Sentiment","question_text": "下列哪一項情境最不適合直接套用一般情感分析(Sentiment Analysis)模型,須額外搭配「情緒分類(Emotion Classification)」或「立場偵測(Stance Detection)」模型才能正確處理?","options": {"A": "判斷顧客對新口味飲料的喜好傾向","B": "判斷貼文對某政策的支持反對立場","C": "判斷飯店評論為滿意或不滿意傾向","D": "判斷網路商品評論的星等分佈"},"correct_answer": "B","source": {"file": "https://en.wikipedia.org/wiki/Stance_detection","page": 1,"evidence": "Wikipedia: Stance detection 與情感分析不同,目標是判斷文本對特定目標主題的立場(支持/反對/中立),而非整體情緒極性。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 立場偵測需要先確定「目標主題」再判斷文本對其態度,屬於 stance detection,情感分析只看文本整體情感,無法精準對齊立場。\n\n**其他選項為何錯:**\n- A. 喜好傾向就是情感極性,標準情感分析任務。\n- B. ✓ 正解\n- C. 滿意/不滿意是二分類情感分析。\n- D. 星等分佈映射到情感分數即可。\n\n**記憶要點:** Sentiment 看「整體情緒」、Stance 看「對某目標的態度」,目標相依的就要 stance。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q3","topic": "NLP/Tokenization","question_text": "在中文 NLP 流程中導入「子詞切分(Subword Tokenization,如 BPE、WordPiece、SentencePiece)」的主要優點為何?","options": {"A": "可徹底避免 OOV 且不會拉長序列長度","B": "限制詞表並拆罕見詞以降低 OOV 風險","C": "以字元為單位完全取代詞向量訓練","D": "把中文詞翻成英文後再做斷詞切分"},"correct_answer": "B","source": {"file": "https://en.wikipedia.org/wiki/Byte_pair_encoding","page": 1,"evidence": "Wikipedia BPE: subword tokenization 將罕見詞拆成常見子詞,使有限詞彙表也能涵蓋幾乎所有輸入,並讓子詞共享 embedding。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** BPE/WordPiece/SentencePiece 在固定詞彙表大小下,把罕見/未見過的字詞切成模型已學過的子詞,既降低 OOV 又共享 embedding,是 BERT、GPT 等模型的標準前處理。\n\n**其他選項為何錯:**\n- A. 子詞切分大幅降低 OOV 但不保證為零,且序列會被拉長。\n- B. ✓ 正解\n- C. 子詞與字元級不同,前者是介於詞與字元之間的折衷。\n- D. 與翻譯無關。\n\n**記憶要點:** Subword = 詞表小 + OOV 少 + embedding 共享,三贏。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q4","topic": "NLP/Tokenization","question_text": "某團隊使用 Jieba 進行中文斷詞後,發現「冠狀病毒疫苗」常被拆為「冠狀」、「病毒」、「疫苗」三個詞,導致下游分類效果不佳。下列何者為最直接且成本最低的改善方法?","options": {"A": "改用字元級模型完全跳過斷詞步驟","B": "在斷詞器中加入自訂詞典登錄複合詞","C": "從頭重新訓練一個專屬中文預訓練模型","D": "把全文翻成英文後再做英文斷詞"},"correct_answer": "B","source": {"file": "https://github.com/fxsjy/jieba","page": 1,"evidence": "Jieba 官方 README 說明可透過 jieba.load_userdict() 載入自訂詞典,使特定領域複合詞被視為單一詞。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Jieba 支援 user dictionary,只需把專有複合詞登錄即可立即生效,成本最低且效果直接。\n\n**其他選項為何錯:**\n- A. 改字元模型工程量大且未必更好。\n- B. ✓ 正解\n- C. 重訓 BERT 成本極高且過度。\n- D. 翻譯會引入語意失真。\n\n**記憶要點:** 領域複合詞被拆 → 先加 user dictionary,再考慮其他方案。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q5","topic": "NLP/Embedding","question_text": "關於「靜態詞向量(Static Word Embedding,如 Word2Vec、GloVe)」與「語境化詞向量(Contextual Word Embedding,如 BERT、ELMo)」,下列何者敘述最正確?","options": {"A": "靜態詞向量對同一詞會依句子不同產生不同向量","B": "語境化詞向量無法處理一詞多義的情境","C": "靜態詞向量無視語境而語境化會隨上下文改變","D": "兩者在語意相似度任務的表現完全相同"},"correct_answer": "C","source": {"file": "subjects/1-ai/study-guide.pdf","page": 35,"evidence": "學習指引 3.1 節說明 Word2Vec 對 bank 不論金融或河岸都產生相同向量,而 BERT/ELMo 等語境型則因上下文不同而異。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 靜態詞向量訓練完即固定,每個詞只有一個向量;語境化詞向量在每次推論時依上下文動態產生,擅長處理一詞多義。\n\n**其他選項為何錯:**\n- A. 同一個詞向量固定不變才是靜態的特性。\n- B. 一詞多義正是 contextual 的強項。\n- C. ✓ 正解\n- D. 語境化詞向量通常顯著優於靜態。\n\n**記憶要點:** Static = 1 詞 1 向量;Contextual = 1 詞看情境多向量。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q6","topic": "NLP/Embedding","question_text": "下列關於 Word2Vec 兩種訓練架構 CBOW 與 Skip-gram 的敘述,何者正確?","options": {"A": "CBOW 用中心詞預測 Skip-gram 用上下文預測","B": "CBOW 用上下文預測 Skip-gram 用中心詞預測","C": "兩者皆同樣以中心詞去預測該中心詞自己本身","D": "兩者皆需搭配自注意力機制才能完成整個訓練"},"correct_answer": "B","source": {"file": "https://en.wikipedia.org/wiki/Word2vec","page": 1,"evidence": "Wikipedia Word2vec: CBOW predicts the current word from the surrounding context words; skip-gram does the reverse, predicting context words from the current word."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** CBOW(Continuous Bag-of-Words)輸入是上下文視窗內的詞,輸出中心詞;Skip-gram 反過來,輸入中心詞,輸出視窗內上下文詞。\n\n**其他選項為何錯:**\n- A. 描述顛倒。\n- B. ✓ 正解\n- C. 兩者皆預測「另一邊」。\n- D. Word2Vec 用 shallow neural network,無 self-attention。\n\n**記憶要點:** CBOW=「左右猜中」、Skip-gram=「中間猜左右」。Skip-gram 對罕見詞表現較佳。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q7","topic": "NLP/Transformer","question_text": "在標準 Transformer 編碼器(Encoder)中,「位置編碼(Positional Encoding)」存在的主要目的為何?","options": {"A": "增加模型參數量以提升整體表達能力","B": "補足自注意力本身缺乏的序列順序資訊","C": "加快模型在訓練階段的整體收斂速度","D": "替代詞向量嵌入層以節省記憶體用量"},"correct_answer": "B","source": {"file": "https://arxiv.org/abs/1706.03762","page": 1,"evidence": "Vaswani et al. (2017) \"Attention Is All You Need\" §3.5: Since our model contains no recurrence and no convolution, we must inject information about positions through positional encodings."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Self-attention 對輸入序列是集合(set)而非序列,沒有順序資訊,因此需用 sinusoidal 或 learned positional encoding 注入位置資訊。\n\n**其他選項為何錯:**\n- A. PE 不是為了增加參數而設。\n- B. ✓ 正解\n- C. 與收斂速度無直接關係。\n- D. PE 是與 token embedding 相加,不是替代。\n\n**記憶要點:** Transformer 拋棄遞迴 → 必須用 PE 補位置資訊。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q8","topic": "NLP/Transformer","question_text": "Transformer 中 Multi-Head Attention(多頭注意力)相較於單頭注意力的主要優勢為何?","options": {"A": "完全去除歸一化指數運算以加速注意力","B": "讓多頭在不同子空間關注不同的關係","C": "強制所有頭輸出相同結果以提升一致性","D": "可省略殘差連接以減少網路整體深度"},"correct_answer": "B","source": {"file": "https://arxiv.org/abs/1706.03762","page": 1,"evidence": "Vaswani et al. (2017) §3.2.2: Multi-head attention allows the model to jointly attend to information from different representation subspaces at different positions."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 多頭把 Q/K/V 投影到多個低維子空間並行注意,使模型能同時學習多種關係模式(短程語法、長程語意、共指等),再 concat 回原維度。\n\n**其他選項為何錯:**\n- A. softmax 仍存在於每個 head 內。\n- B. ✓ 正解\n- C. 強制相同就喪失多頭意義。\n- D. 殘差連接仍是必要設計。\n\n**記憶要點:** Multi-head = 多角度看,各 head 看不同關係。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q9","topic": "NLP/BERT-vs-GPT","question_text": "下列關於 BERT 與 GPT 預訓練目標的對比,何者最正確?","options": {"A": "BERT 採因果 LM,GPT 採遮罩 LM","B": "BERT 採遮罩 LM,GPT 採因果 LM","C": "兩者皆採 MLM 但 GPT 詞表更大","D": "兩者皆採因果 LM 只差訓練資料量"},"correct_answer": "B","source": {"file": "https://en.wikipedia.org/wiki/BERT_(language_model)","page": 1,"evidence": "Wikipedia BERT: pre-trained with Masked Language Modeling and Next Sentence Prediction; GPT uses left-to-right autoregressive language modeling."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** BERT 用 MLM(隨機遮罩 ~15% token 由雙向上下文預測)+ NSP(下一句預測);GPT 是 decoder-only 自迴歸,由左到右逐詞預測下一個詞。\n\n**其他選項為何錯:**\n- A. 描述顛倒。\n- B. ✓ 正解\n- C. GPT 不採 MLM。\n- D. BERT 不採因果 LM。\n\n**記憶要點:** BERT = 雙向克漏字(MLM);GPT = 由左到右接龍(causal LM)。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q10","topic": "NLP/RAG","question_text": "某公司導入「檢索增強生成(Retrieval-Augmented Generation, RAG)」系統,以解決 LLM 對企業內部最新政策不熟悉的問題。下列何者最能直接說明 RAG 解決幻覺(hallucination)的核心機制?","options": {"A": "提高採樣溫度以讓生成更具創造性","B": "先檢索企業知識庫再作為上下文輸入","C": "於模型輸出後用正則表達式過濾敏感詞","D": "改用更大參數模型以直接取代知識檢索"},"correct_answer": "B","source": {"file": "https://arxiv.org/abs/2005.11401","page": 1,"evidence": "Lewis et al. (2020) \"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks\": RAG combines a parametric memory (pre-trained seq2seq) with a non-parametric memory (Wikipedia dense vector index) to ground generation in retrieved evidence."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** RAG 的「R」是 retrieval — 先檢索相關文件 chunk,把它們作為 LLM context 一併送入生成,生成被 grounding 在事實段落,進而降低幻覺。\n\n**其他選項為何錯:**\n- A. 高 temperature 反而增加幻覺。\n- B. ✓ 正解\n- C. 過濾敏感詞與幻覺無關。\n- D. 更大模型不一定知道企業內部資料。\n\n**記憶要點:** RAG = 先檢索後生成,grounding 在真實段落。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q11","topic": "NLP/RAG","question_text": "下列關於 RAG 系統檢索品質的敘述,何者最正確?","options": {"A": "Chunk 大小完全不影響檢索效果","B": "Chunk 大小過大或過小都會傷檢索","C": "向量索引必用 cosine 否則一定失敗","D": "Top-K 設為 1 永遠優於 K 大於 5"},"correct_answer": "B","source": {"file": "https://docs.llamaindex.ai/en/stable/optimizing/production_rag/","page": 1,"evidence": "LlamaIndex production RAG guide: chunk size is a crucial trade-off — too small loses context, too large dilutes embedding signal; typical 256-512 tokens."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Chunk size 是 RAG 最重要超參之一,太小切碎上下文,太大讓 embedding 失焦,實務上需依文件結構與模型試 200-800 tokens。\n\n**其他選項為何錯:**\n- A. Chunk 大小至關重要。\n- B. ✓ 正解\n- C. dot product / L2 也很常用。\n- D. K=1 召回不足。\n\n**記憶要點:** Chunk size、Top-K、重排序(reranker)是 RAG 三大優化點。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q12","topic": "NLP/NER","question_text": "某保險業導入命名實體辨識(Named Entity Recognition, NER)從理賠書面文件抽取「保戶姓名、保單編號、就醫院所、診斷代碼」。下列哪一項是該任務最常採用的標註框架?","options": {"A": "Bag-of-Words 詞袋頻次標註法","B": "BIO 或 BIOES 序列邊界標註法","C": "Cosine Similarity 餘弦比對法","D": "TF-IDF 詞頻反文檔權重排序法"},"correct_answer": "B","source": {"file": "https://en.wikipedia.org/wiki/Named-entity_recognition","page": 1,"evidence": "Wikipedia NER: token-level sequence labeling commonly uses BIO (Begin/Inside/Outside) or BIOES tagging schemes to mark entity spans."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** NER 是 token-level 序列標註,需要標出每個 token 是某實體的開頭(B)、內部(I)或非實體(O),BIO/BIOES 是業界標準。\n\n**其他選項為何錯:**\n- A. BoW 不保留順序。\n- B. ✓ 正解\n- C. 屬檢索/權重技術,非標註框架。\n- D. 屬檢索/權重技術,非標註框架。\n\n**記憶要點:** NER = token-level sequence labeling + BIO/BIOES。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q13","topic": "NLP/Translation","question_text": "下列關於神經機器翻譯(Neural Machine Translation, NMT)的敘述,何者最正確?","options": {"A": "NMT 至今仍以遞迴網路加注意力機制做為主流架構","B": "NMT 以 Transformer 為主訓練目標是最大化條件機率","C": "NMT 完全不需任何平行語料只靠單語語料即可訓練","D": "NMT 評估指標 BLEU 分數越低代表翻譯品質越好"},"correct_answer": "B","source": {"file": "https://en.wikipedia.org/wiki/Neural_machine_translation","page": 1,"evidence": "Wikipedia NMT: Modern NMT systems typically use a Transformer encoder–decoder architecture and are trained to maximize the conditional probability of the target sentence given the source."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Transformer (2017) 後幾乎取代 RNN+Attention 成為 NMT 主流,目標是 maximize P(target|source)。\n\n**其他選項為何錯:**\n- A. Transformer 已是 NMT 主流。\n- B. ✓ 正解\n- C. 主流 NMT 仍需平行語料(或回譯)。\n- D. BLEU 越高越好。\n\n**記憶要點:** NMT 主流 = Transformer encoder-decoder + 平行語料 + BLEU 評估。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q14","topic": "NLP/Hallucination","question_text": "下列哪一個方法「最不能」直接降低 LLM 幻覺(hallucination)風險?","options": {"A": "導入檢索增強生成以可信文件作依據","B": "要求模型加入引文標註可追溯來源段落","C": "提高採樣溫度與 top-p 以加強隨機性","D": "對特定領域進行微調或人類回饋對齊"},"correct_answer": "C","source": {"file": "https://arxiv.org/abs/2311.05232","page": 1,"evidence": "Survey on hallucination in LLMs (2023): mitigation strategies include retrieval grounding, citation enforcement, fine-tuning, and RLHF; high sampling temperature is associated with increased hallucination."},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 提高 temperature/top-p 會放大隨機採樣,反而增加離譜輸出與事實錯誤,與「降低幻覺」目標相反。\n\n**其他選項為何錯:**\n- A. RAG 是經典的 grounding 方法。\n- B. citation 強制讓回答可追溯。\n- C. ✓ 正解(反向)\n- D. fine-tune/RLHF 對齊事實能降幻覺。\n\n**記憶要點:** 降幻覺 = grounding + citation + 對齊;升 temperature = 增加幻覺風險。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q15","topic": "CV/Classification","question_text": "某零售商在進行商品圖像分類(Image Classification),希望同一張圖只回傳「最可能的一個類別」。下列哪個層最適合作為網路最後輸出層?","options": {"A": "Sigmoid 多輸出層作為最後一層","B": "Softmax 單標籤輸出作為最後一層","C": "ReLU 啟動函數作為最後一層","D": "BatchNorm 正規化作為最後一層"},"correct_answer": "B","source": {"file": "https://en.wikipedia.org/wiki/Softmax_function","page": 1,"evidence": "Wikipedia: Softmax converts a vector of K real numbers into a probability distribution over K classes; commonly used as the final layer for multi-class single-label classification."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 單標籤多類別分類需 softmax,使各類別機率總和為 1,argmax 取最可能類別。\n\n**其他選項為何錯:**\n- A. sigmoid 多輸出適用「多標籤」(可同時屬於多類)。\n- B. ✓ 正解\n- C. ReLU 是隱藏層啟動。\n- D. BN 是正規化,不產生輸出機率。\n\n**記憶要點:** Single-label multi-class = softmax;Multi-label = sigmoid per class。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q16","topic": "CV/Detection","question_text": "下列關於 YOLO(You Only Look Once)系列物件偵測模型的敘述,何者最正確?","options": {"A": "YOLO 為兩階段偵測需先做候選區域提案","B": "YOLO 為單階段偵測直接回歸位置與類別","C": "YOLO 因推論延遲過大不適合即時偵測","D": "YOLO 設計上僅能用於人臉辨識的場景"},"correct_answer": "B","source": {"file": "subjects/1-ai/study-guide.pdf","page": 55,"evidence": "學習指引 3.2 節說明 YOLO 為基於迴歸的方法,能同時預測物體的邊界框與類別,適合即時偵測(如監控、自駕)。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** YOLO 把偵測視為一次性回歸問題,整張圖一次 forward 同時輸出 bounding box 與類別機率,故 one-stage、速度快。\n\n**其他選項為何錯:**\n- A. two-stage 是 Faster R-CNN/Mask R-CNN 等。\n- B. ✓ 正解\n- C. YOLO 正是為 real-time 設計。\n- D. 通用物件偵測。\n\n**記憶要點:** YOLO = One-stage、即時、回歸式;R-CNN 系列 = Two-stage、較慢、提案再分類。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q17","topic": "CV/Detection","question_text": "物件偵測的非極大值抑制(Non-Maximum Suppression, NMS)主要功用為何?","options": {"A": "在訓練階段穩定參數收斂的方法","B": "推論期合併同物件重複框只留最高分","C": "保留所有偵測框不論其信心高低","D": "用於訓練前的影像資料增強步驟"},"correct_answer": "B","source": {"file": "https://en.wikipedia.org/wiki/Non-maximum_suppression","page": 1,"evidence": "Wikipedia: NMS keeps the highest-confidence detection and removes other boxes with high IoU overlap, eliminating redundant detections for the same object."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** NMS 是後處理步驟:對同類預測按 confidence 排序,逐一保留最高分,移除與之 IoU 超過閾值的其他框,避免一個物件被重複框出。\n\n**其他選項為何錯:**\n- A. NMS 在推論期,非訓練期。\n- B. ✓ 正解\n- C. 反向。\n- D. 與資料增強無關。\n\n**記憶要點:** NMS = 推論期去除重複框,IoU 閾值越低剝奪越狠。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q18","topic": "CV/Segmentation","question_text": "下列何者「最能區別」語意分割(Semantic Segmentation)與實例分割(Instance Segmentation)?","options": {"A": "語意分割不分同類個體,實例分割區分個體","B": "語意分割只能用於黑白,實例分割只能彩色","C": "語意分割與實例分割完全相同只是名稱不同","D": "語意分割需要 mask,實例分割完全不需要"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 50,"evidence": "學習指引 3.2 節說明語意分割為每像素分類,實例分割除像素分類外還需區分同類別中不同個體(person 1、person 2…)。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** Semantic = 所有「人」是同一類; Instance = 還要區分「person 1」、「person 2」、「person 3」。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 與色彩無關。\n- C. 兩者目標不同。\n- D. instance 一樣需要 mask。\n\n**記憶要點:** Semantic 看「類」、Instance 看「個體」、Panoptic 兩者兼顧。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q19","topic": "CV/OCR","question_text": "某企業導入 OCR(Optical Character Recognition)處理客戶上傳的中華民國身分證影像。下列哪一項是 OCR 流程中「最常見且影響準確率最大的前處理步驟」?","options": {"A": "影像歪斜校正搭配影像二值化處理","B": "讓影像以 GIF 動畫格式逐張播放","C": "在 RGB 三通道分別加入高斯雜訊","D": "略過所有前處理直接送入 OCR 引擎"},"correct_answer": "A","source": {"file": "https://en.wikipedia.org/wiki/Optical_character_recognition","page": 1,"evidence": "Wikipedia OCR: pre-processing typically includes de-skew, binarization, despeckle, and segmentation; skew correction and binarization are among the most impactful."},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** OCR 對輸入影像角度與對比敏感,先做歪斜校正再二值化把文字從背景中乾淨切出,是公認最影響準確率的前處理。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 與 OCR 無益甚至有害。\n- C. 與 OCR 無益甚至有害。\n- D. 與 OCR 無益甚至有害。\n\n**記憶要點:** OCR 前處理黃金組合 = De-skew + Binarization + Denoise。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q20","topic": "CV/ViT","question_text": "Vision Transformer(ViT)與 CNN 的根本差異為何?","options": {"A": "ViT 完全不使用任何注意力機制運算","B": "ViT 將影像切塊當作 token 序列輸入","C": "ViT 在設計上只能處理單通道灰階影像","D": "ViT 在小規模資料集上一定優於傳統 CNN"},"correct_answer": "B","source": {"file": "https://arxiv.org/abs/2010.11929","page": 1,"evidence": "Dosovitskiy et al. (2020) \"An Image is Worth 16x16 Words\": splits image into fixed-size patches, treats them as token sequence input to a standard Transformer encoder."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** ViT 把影像切成 16×16 之類 patch、線性投影為 token 序列,直接餵 Transformer encoder,完全放棄卷積架構中的局部+平移不變偏置。\n\n**其他選項為何錯:**\n- A. ViT 核心就是 attention。\n- B. ✓ 正解\n- C. 三通道彩色可用。\n- D. 小資料時 CNN 通常較優,ViT 需大量資料或預訓練。\n\n**記憶要點:** ViT = patch → token → Transformer;靠規模換取掉 inductive bias。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q21","topic": "GenAI/GAN","question_text": "在標準 GAN(Generative Adversarial Network)的訓練中,生成器(Generator)與判別器(Discriminator)的關係最接近下列何者?","options": {"A": "兩者目標一致皆在最小化分類錯誤","B": "生成器產生假樣本判別器分辨真假","C": "生成器與判別器共享同一組網路權重","D": "兩者不對抗而是合作壓縮影像資料"},"correct_answer": "B","source": {"file": "https://arxiv.org/abs/1406.2661","page": 1,"evidence": "Goodfellow et al. (2014) \"Generative Adversarial Nets\": G and D play a two-player minimax game; G maximizes the probability of D making a mistake, D maximizes correct classification of real vs fake."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** GAN 是兩個網路的零和對抗:G 學會生成更真的假樣本,D 學會更精確分辨真假,理論上達到 Nash 平衡時 G 的分佈逼近真實資料分佈。\n\n**其他選項為何錯:**\n- A. 兩者目標相反。\n- B. ✓ 正解\n- C. 不共享權重。\n- D. 對抗訓練不是合作。\n\n**記憶要點:** GAN = G vs D min-max game,訓練不穩定 → 易 mode collapse。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q22","topic": "GenAI/GAN","question_text": "GAN 訓練中出現「Mode Collapse(模式崩塌)」最典型的現象為何?","options": {"A": "生成器輸出影像種類極為單一缺乏多樣性","B": "判別器永遠完全無法分辨真實與生成樣本","C": "因為發生梯度爆炸導致訓練過程中途停止","D": "因影像解析度過高而耗盡顯示卡記憶體用量"},"correct_answer": "A","source": {"file": "https://en.wikipedia.org/wiki/Generative_adversarial_network","page": 1,"evidence": "Wikipedia GAN: mode collapse occurs when the generator produces samples of limited variety, failing to cover the full diversity of the real data distribution."},"verified": true,"verification_needed": RA 因 trade-off 最佳而最普及。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q27","topic": "Multimodal/Fusion","question_text": "在多模態學習中,「中期融合(Mid Fusion / Hybrid Fusion)」與早期、晚期融合的最大差別為何?","options": {"A": "中期融合在原始資料輸入層拼接","B": "中期融合在中間隱藏層動態結合","C": "中期融合在最終決策層平均結果","D": "中期融合完全不需要任何訓練"},"correct_answer": "B","source": {"file": "subjects/1-ai/study-guide.pdf","page": 88,"evidence": "學習指引 3.4 節說明多模態融合可分早期(資料層)、中期(隱藏層,常用 attention)與晚期(決策層)三種策略。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Mid fusion 在表徵階段融合不同模態,可學習模態間的互補關係,且常以 cross-attention 或 gating 動態調整。\n\n**其他選項為何錯:**\n- A. 屬早期融合。\n- B. ✓ 正解\n- C. 屬晚期融合。\n- D. 需訓練。\n\n**記憶要點:** Early=資料層、Mid=隱藏層、Late=決策層。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q28","topic": "Multimodal/CLIP","question_text": "OpenAI 提出的 CLIP(Contrastive Language-Image Pre-training)模型訓練目標為何?","options": {"A": "對影像每個像素值進行回歸預測","B": "對齊圖文嵌入向量的對比式學習","C": "直接由文字生成全新的影像作品","D": "以固定類別做監督式影像分類"},"correct_answer": "B","source": {"file": "https://arxiv.org/abs/2103.00020","page": 1,"evidence": "Radford et al. (2021) \"Learning Transferable Visual Models From Natural Language Supervision\": CLIP trains image and text encoders jointly using a contrastive loss to align correct image-caption pairs."},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** CLIP 用 N×N 對比矩陣,把正確圖文對的 cosine similarity 推高、錯配的推低,訓出可零樣本分類的 image/text encoder。\n\n**其他選項為何錯:**\n- A. 不做像素回歸。\n- B. ✓ 正解\n- C. CLIP 自己不生成圖像。\n- D. CLIP 使用自然語言監督,不是固定類別監督。\n\n**記憶要點:** CLIP = Contrastive + Image-Text 雙塔,zero-shot 分類靠 prompt。","subject_code": "s1","generated": true,"generated_by": "claude"},{"id": "gen-claude-s1-q29","topic": "AI/Adoption","question_text": "企業評估是否導入 AI 解決方案時,下列哪一項應該「最先」執行?","options": {"A": "立即購買 GPU 並組建內部 ML 平台","B": "盤點業務痛點與量化的成功 KPI 指標","C": "招募十位專職機器學習博士進團隊","D": "與所有供應商簽訂長期採購合約書"},"correct_answer": "B","source": {"file": "subjects/1-ai/ 僅靠詞頻統計即可完整理解語意脈絡","D": "把文字轉為高解析影像並用 CNN 判斷"},"correct_answer": "B","source": {"file": "subjects/1-ai/study-guide.pdf","page": 29,"evidence": "study-guide PDF p.29 說明語境型詞嵌入會依上下文動態變化，可處理多義詞。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 語境型詞嵌入會根據句子上下文產生不同表示，因此適合處理同一詞在不同情境下的語意差異。\n\n**其他選項為何錯:**\n- A. 固定向量是非語境型表示的限制，難以處理多義詞。\n- B. ✓ 正解\n- C. 詞頻方法無法充分捕捉上下文語意。\n- D. 這是文字語意問題，不是影像分類問題。\n\n**記憶要點:** 多義詞需要看上下文，不能只看詞本身。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q4","topic": "NLP/Transformer","question_text": "某法務科技公司要分析長篇合約條款，發現傳統遞迴模型在長距離語意關聯上表現不佳。若改採 Transformer 架構，下列哪一項是主要技術理由?","options": {"A": "Transformer 依序逐字讀取因此無法平行","B": "Transformer 以自注意力同時關聯所有詞彙","C": "Transformer 依靠邊界框標註以定位句子","D": "Transformer 僅能用於影像而非文字處理"},"correct_answer": "B","source": {"file": "subjects/1-ai/study-guide.pdf","page": 32,"evidence": "study-guide PDF p.32 說明 Transformer 透過自注意力機制同時捕捉輸入序列詞彙關聯。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 自注意力能在較大範圍內捕捉上下文關聯，改善長序列語意理解並支援平行化訓練。\n\n**其他選項為何錯:**\n- A. Transformer 的特色是可平行處理，而不是逐字遞迴。\n- B. ✓ 正解\n- C. 邊界框是電腦視覺標註方式，不是 Transformer 的文字處理核心。\n- D. Transformer 已是 NLP 主流架構，也可延伸至其他模態。\n\n**記憶要點:** Transformer 的關鍵字是自注意力與平行化。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q5","topic": "NLP/Transformer","question_text": "某客服平台分析長句「產品雖然送修三次仍無法開機，因此我要求退貨」時，希望模型聚焦於影響意圖判斷的關鍵詞。下列何者最符合注意力機制（Attention Mechanism）的功能?","options": {"A": "將所有詞彙視為完全等重以避免模型偏向","B": "只保留句子第一個詞以降低整體計算量","C": "依詞與詞的關聯程度分配權重突顯重點","D": "把句子轉為資料表主鍵以移除語意資訊"},"correct_answer": "C","source": {"file": "subjects/1-ai/study-guide.pdf","page": 32,"evidence": "study-guide PDF p.32 說明自注意力會根據每個詞與其他詞的關聯程度進行加權表示。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 注意力機制會對上下文中的詞彙關聯給予不同權重，使模型能把資源放在更關鍵的語意線索上。\n\n**其他選項為何錯:**\n- A. 等重處理無法突顯關鍵資訊。\n- B. 只看第一個詞會遺失大部分上下文。\n- C. ✓ 正解\n- D. 資料表主鍵無法保留句子語意。\n\n**記憶要點:** 注意力就是讓模型知道該看哪裡。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q6","topic": "NLP/RAG","question_text": "某醫療客服系統需回答最新藥品使用規範，團隊擔心大型語言模型只依內部參數生成而知識過時。若導入檢索增強生成（Retrieval-Augmented Generation, RAG），下列流程何者最適合?","options": {"A": "先檢索外部知識庫再讓模型生成答案","B": "僅增加模型參數量而不連接外部資料","C": "刪除全部醫療文獻以避免資料的干擾","D": "把所有問題轉成影像並交給 OCR 處理"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 35,"evidence": "study-guide PDF p.35 說明 RAG 將外部知識檢索與語言生成結合以提升準確性。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** RAG 的核心是先取得可查證的相關資料，再讓語言模型依檢索內容生成回覆，適合知識更新快的情境。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 單純擴大模型不會解決外部知識更新問題。\n- C. 刪除知識來源會降低回答準確性。\n- D. OCR 只能辨識文字影像，不能替代知識檢索與生成。\n\n**記憶要點:** RAG = 先找資料，再生成。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q7","topic": "NLP/NER","question_text": "某律師事務所要從判決書中自動擷取法院名稱、當事人、地點與案件編號，並轉成結構化欄位。下列哪一項自然語言處理技術最符合需求?","options": {"A": "命名實體辨識(Named Entity Recognition)","B": "影像分割任務(Image Segmentation)","C": "語音合成技術(Text-to-Speech, TTS)","D": "資料庫正規化(Database Normalization)"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 39,"evidence": "study-guide PDF p.39 說明 NER 可在法律文本中標註案件、法院、當事人等實體。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** NER 的目的就是從非結構化文本中辨識人名、地名、組織或專有實體，適合判決書欄位抽取。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 影像分割處理像素區域，不處理文字中的實體名稱。\n- C. TTS 是把文字轉語音，不負責抽取法律實體。\n- D. 資料庫正規化是資料庫設計方法，不是文本資訊抽取技術。\n\n**記憶要點:** 從文字抓人事時地物，先想到 NER。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q8","topic": "NLP/Summarization","question_text": "某證券公司每天需閱讀大量市場新聞，並為交易員產生短版重點摘要。下列哪一項最符合文字生成與總結（Text Generation & Summarization）的導入重點?","options": {"A": "只計算新聞字數而不理解任何內容","B": "產生保留主旨並注意事實正確的摘要","C": "將新聞轉為隨機向量不可讀的形式","D": "用車牌辨識模型找出新聞中的公司名"},"correct_answer": "B","source": {"file": "subjects/1-ai/study-guide.pdf","page": 38,"evidence": "study-guide PDF p.38 說明文字生成與總結可用於新聞摘要，並需注意語意一致性、邏輯性與事實性。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 新聞摘要的價值在於保留重點並縮短閱讀時間，但生成內容仍要維持語意一致與事實可靠。\n\n**其他選項為何錯:**\n- A. 字數統計不能產生可用摘要。\n- B. ✓ 正解\n- C. 隨機向量不是交易員可閱讀的摘要。\n- D. 車牌辨識屬於電腦視覺 OCR/偵測情境，不適合新聞摘要。\n\n**記憶要點:** 摘要不是變短而已，還要保真。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q9","topic": "NLP/Translation","question_text": "某跨國客服中心希望讓台灣客服即時理解日文與英文客訴內容，並提供一致的回覆草稿。下列哪一項最符合機器翻譯（Machine Translation）的應用價值與限制?","options": {"A": "可協助跨語言客服但專業術語需驗證","B": "只能辨識圖片中文字位置無法做翻譯","C": "僅能計算顧客消費金額不處理文字","D": "自動解決所有法規隱私風險無需審查"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 39,"evidence": "study-guide PDF p.39 說明機器翻譯可用於多語言客服，但專業領域翻譯準確性要求較高。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 機器翻譯能降低跨語言客服障礙，但法律、醫療或專業術語仍需驗證以避免誤譯。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 這描述的是 OCR 或影像文字偵測，不是翻譯。\n- C. 機器翻譯正是文字處理任務。\n- D. 翻譯不會自動解決資料隱私與法規審查問題。\n\n**記憶要點:** 機器翻譯能跨語言，但專業詞要複核。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q10","topic": "NLP/Summarization","question_text": "某媒體公司導入大型語言模型撰寫短文，想同時評估自動摘要是否涵蓋關鍵內容，以及創意文案是否自然流暢。下列評估搭配何者最合理?","options": {"A": "摘要用 ROUGE 評分創意文案搭人工評估","B": "所有生成任務皆只看 GPU 使用率即可","C": "摘要品質一律只能用影像 IoU 衡量","D": "創意文案僅用資料庫交易筆數評估"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 73,"evidence": "study-guide PDF p.73 說明 ROUGE 關注摘要關鍵內容覆蓋，人工評估可衡量流暢性與準確性。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** ROUGE 適合檢查摘要與參考內容的重疊與召回；創意或對話內容則常需要人工評估語意與流暢性。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. GPU 使用率是系統資源指標，不是生成品質指標。\n- C. IOU 用於視覺框或分割重疊，不適合摘要品質。\n- D. 交易筆數不能衡量文案自然度或準確性。\n\n**記憶要點:** 摘要看覆蓋，創意文本要有人看語意。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q11","topic": "NLP/General","question_text": "某客服機器人收到使用者輸入後，需要先理解需求，再產生自然語言回覆。若以自然語言理解（Natural Language Understanding, NLU）與自然語言生成（Natural Language Generation, NLG）分工，下列何者正確?","options": {"A": "NLU 負責語意意圖判讀,NLG 產出回覆語句","B": "NLU 負責訓練 GPU,NLG 負責調整資料庫索引","C": "NLU 只能處理圖片資料,NLG 只能處理感測器","D": "NLU 與 NLG 皆用於容器編排與語言任務無關"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 11,"evidence": "study-guide PDF p.11 說明客服機器人會先透過 NLU 理解語意與需求，再透過 NLG 產生回覆。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** NLU 是理解端，負責意圖與語意判讀；NLG 是產出端，負責把資料或邏輯轉成自然語言。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. GPU 與資料庫索引不是 NLU/NLG 的語言任務分工。\n- C. NLU/NLG 屬於自然語言處理，不是純影像或感測器任務。\n- D. 容器編排是部署議題，不是語言理解與生成。\n\n**記憶要點:** 先理解，再生成，是客服 NLP 的基本流程。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q12","topic": "CV/Detection","question_text": "某零售平台要自動判斷上傳商品照片是鞋子、包包或外套，不需要標出商品在照片中的位置。下列哪一項電腦視覺任務最適合?","options": {"A": "影像分類(Image Classification)","B": "物件偵測(Object Detection)","C": "實例分割(Instance Segmentation)","D": "姿態估計(Pose Estimation)"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 55,"evidence": "study-guide PDF p.55 說明影像分類旨在將影像中的物體或場景歸類到預定類別。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 需求是為整張商品照片指定類別，不需要框出位置或分割像素，因此屬於影像分類。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 物件偵測會同時定位與分類，超出此需求。\n- C. 實例分割要切出每個物件像素，需求更細。\n- D. 姿態估計用於人體或特定關鍵點位置，不是商品類別判斷。\n\n**記憶要點:** 只問整張圖是哪一類，就是影像分類。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q13","topic": "NLP/Summarization","question_text": "某工廠希望在即時影像中找出輸送帶上的瑕疵零件，並以邊界框標示位置與類別。下列哪一項技術最符合需求?","options": {"A": "資料庫交易分析(Transaction Analysis)","B": "影像物件偵測(Object Detection)","C": "語音轉文字技術(Speech Recognition)","D": "文字摘要生成(Text Summarization)"},"correct_answer": "B","source": {"file": "subjects/1-ai/study-guide.pdf","page": 56,"evidence": "study-guide PDF p.56 說明物件偵測會同時進行物體定位與分類，常用於工業瑕疵檢測。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 要在影像中找出物件並標示位置與類別，就是物件偵測；YOLO 等模型也適合即時場景。\n\n**其他選項為何錯:**\n- A. 交易分析處理業務資料，不會在影像中框出零件。\n- B. ✓ 正解\n- C. ASR 是語音轉文字，不處理輸送帶影像。\n- D. 文本摘要處理文章內容，不處理影像定位。\n\n**記憶要點:** 要框位置加分類，選物件偵測。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q14","topic": "NLP/Tokenization","question_text": "某醫院希望在 MRI 影像中精準圈出腫瘤區域，讓醫師看到每個像素是否屬於病灶。下列哪一項最符合此需求?","options": {"A": "影像分割(Image Segmentation)","B": "文字分詞(Text Tokenization)","C": "顧客分群(Customer Segmentation)","D": "機器翻譯(Machine Translation)"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 57,"evidence": "study-guide PDF p.57 說明影像分割將影像中的每個像素分配至特定類別。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 腫瘤定位需要像素層級標註，醫療影像中常以 U-Net 等模型進行分割。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 文字分詞處理語句，不處理 MRI 像素。\n- C. 顧客分群是商業資料分析，不是醫學影像像素標註。\n- D. 機器翻譯處理跨語言文字，不適用腫瘤區域圈選。\n\n**記憶要點:** 像素級病灶定位，想到影像分割。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q15","topic": "CV/OCR","question_text": "某物流公司要從掃描的出貨單中擷取品名、地址與追蹤編號，並需要標出文字區塊與正確字串。下列哪一項最適合?","options": {"A": "光學字元辨識(Optical Character Recognition)","B": "人體姿態估計(Human Pose Estimation)","C": "擴散生成模型(Diffusion Generative Model)","D": "強化式學習(Reinforcement Learning)"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 52,"evidence": "study-guide PDF p.52 說明 OCR 標註包含文字區塊框選與正確字串輸入。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** OCR 的任務是從影像中的文字區塊辨識可讀字串，適合出貨單欄位擷取。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 姿態估計標註身體或特定關鍵點，不用於單據文字辨識。\n- C. 擴散模型主要用於生成內容，不是辨識出貨單文字。\n- D. 強化式學習是互動式策略學習，不是文件文字擷取主技術。\n\n**記憶要點:** 單據影像要變文字，核心是 OCR。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q16","topic": "NLP/Transformer","question_text": "某健身 App 要判斷使用者深蹲姿勢是否標準，需要偵測肩、膝、髖等身體節點座標。下列標註方式何者最符合需求?","options": {"A": "影像關鍵點標註(Keypoint Annotation)","B": "資料庫主鍵欄位標註(Primary Key)","C": "文本停用詞移除(Stopword Removal)","D": "敏感欄位資料遮罩處理(Data Masking)"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 52,"evidence": "study-guide PDF p.52 說明關鍵點標註使用身體節點或 程常不穩定。下列哪一項是 GAN 的典型特性與限制?","options": {"A": "對抗訓練可提升寫實但易遇模式崩潰","B": "GAN 完全不需資料且永遠不會產生偏差","C": "GAN 只能做資料表查詢無法生成影像","D": "GAN 以資料刪除權作為主要訓練目標"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 69,"evidence": "study-guide PDF p.69 說明 GAN 對抗訓練提升寫實性，但限制包含訓練不穩定與模式崩潰。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** GAN 的優勢是生成內容寫實，但訓練穩定性與多樣性是常見挑戰。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. GAN 仍需訓練資料，資料偏差也可能反映在輸出上。\n- C. GAN 是典型生成模型，可用於影像生成。\n- D. 資料刪除權是合規議題，不是 GAN 訓練目標。\n\n**記憶要點:** GAN 逼真，但訓練不一定穩。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q20","topic": "CV/Classification","question_text": "某設計團隊希望從文字提示產生高解析度產品概念圖，並要求細節豐富且生成穩定。下列何者最符合擴散模型（Diffusion Models）的生成機制?","options": {"A": "從隨機噪聲逐步去噪以生成細節影像","B": "僅計算資料表欄位的平均值與標準差","C": "將圖片切成停用詞後再進行類別分類","D": "只能透過人工逐筆手繪所有圖片素材"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 70,"evidence": "study-guide PDF p.70 說明擴散模型透過逐步去噪過程，從隨機噪聲生成細節豐富的圖像。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 擴散模型的核心是學習反向去噪過程，因此常用於高品質文字到圖像生成。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 欄位平均數是統計處理，不是圖像生成機制。\n- C. 停用詞是文本前處理概念，不能生成圖像。\n- D. 逐筆手繪不是生成式 AI 模型流程。\n\n**記憶要點:** 擴散模型靠逐步去噪生成圖像。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q21","topic": "GenAI/PromptEngineering","question_text": "某企業想建立大型語言模型（Large Language Model, LLM）應用，先讓模型學習大量通用語料，再針對客服情境調整。下列哪一項最符合生成式 AI 技術體系?","options": {"A": "上線後人工查資料庫不需任何模型學習","B": "包含預訓練微調與提示工程等完整流程","C": "僅以手寫 if-else 規則產生所有回應","D": "先刪除全部文字資料再開始模型訓練"},"correct_answer": "B","source": {"file": "subjects/1-ai/study-guide.pdf","page": 67,"evidence": "study-guide PDF p.67 說明生成式 AI 體系包括預訓練、微調與應用調用，並結合提示工程等策略。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** LLM 應用通常先用大規模資料建立通用能力，再透過微調、提示或調用方式配合業務任務。\n\n**其他選項為何錯:**\n- A. 資料庫查詢不能取代模型訓練與語言能力建立。\n- B. ✓ 正解\n- C. 純規則系統不具備生成式模型的泛化能力。\n- D. 刪除文字資料會讓模型缺乏語言學習來源。\n\n* 途?","options": {"A": "以對比學習將圖文映射到同一向量空間","B": "僅將語音訊號轉成文字而不處理圖片","C": "僅做資料庫正規化無法比較圖文語意","D": "只生成隨機圖像不判斷圖文是否相符"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 82,"evidence": "study-guide PDF p.82 說明 CLIP 透過對比學習將圖片與文字映射至同一向量空間，使語意相符圖文距離接近。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** CLIP 的核心能力是圖文語意對齊，可用於圖文匹配、文字搜圖與圖片反向搜尋描述。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 語音轉文字是 ASR，不是 CLIP 的核心任務。\n- C. 資料庫正規化不能建立圖文共同語意空間。\n- D. CLIP 主要做圖文對齊與檢索，不是只做隨機生成。\n\n**記憶要點:** CLIP 讓圖和文字在同一語意空間見面。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q28","topic": "Multimodal/General","question_text": "某醫療影像系統要讓醫師對 X 光片提問，並由模型根據影像與文字問題回答。下列哪一類視覺語言模型（Vision-Language Model）最符合此任務?","options": {"A": "視覺語言模型可支援圖文問答與生成任務","B": "以分群演算法將病患資料依年齡進行分群","C": "以資料庫觸發器自動更新庫存或交易紀錄","D": "以文字轉語音模型把病歷讀給醫師聆聽"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 84,"evidence": "study-guide PDF p.84 說明 BLIP / BLIP-2 強化圖文問答與生成任務，支援圖片與文字的雙向理解。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 圖文問答需要同時理解影像與文字問題，BLIP / BLIP-2 正是代表性的視覺語言模型。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. K-means 是非監督分群，不處理圖文問答。\n- C. 資料庫觸發器不理解醫療影像或問題語意。\n- D. TTS 只做文字轉語音，不能回答 X 光影像問題。\n\n**記憶要點:** 看到圖文問答，想到視覺語言模型。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q29","topic": "Deploy/MLOps","question_text": "某智慧客服要接收使用者語音提問，先轉成文字，再判斷意圖並產生回覆。此流程中的語音辨識（Automatic Speech Recognition, ASR）負責哪一步?","options": {"A": "將使用者語音訊號轉換為對應的文字","B": "將輸入文字轉為高解析度的產品圖片","C": "將資料表壓縮為查詢索引以加速檢索","D": "將模型容器部署到容器調度叢集上"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 83,"evidence": "study-guide PDF p.83 說明 ASR 是將語音訊號轉換為文字，之後再由 NLU 解析意圖。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** ASR 位於語音流程前段，負責把使用者語音轉成文字，後續才交給 NLU 解析語意。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 文字生成圖片屬於生成式視覺任務。\n- C. 資料表索引是資料庫工程，不是 ASR。\n- D. Kubernetes 流程。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 好的使用案例應從業務痛點與 KPI 出發，並具備可由 AI 介入改善的流程特性。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 沒有資料會讓技術可行性大幅下降。\n- C. 只追模型潮流容易造成資源浪費。\n- D. AI 導入通常需要跨部門協作。\n\n**記憶要點:** 先找痛點和 KPI，再選 AI。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q33","topic": "AI/Adoption","question_text": "某公司要估算 AI 客服導入成本，避免只看模型授權費。下列哪一項成本分析（Cost Analysis）最完整?","options": {"A": "僅計算每月電費而其他成本項目皆忽略","B": "涵蓋人力訓練資料整合與授權等多項投入","C": "僅計算行銷文案字數而不估算技術成本","D": "僅看模型名稱是否熱門而不估算總成本"},"correct_answer": "B","source": {"file": "subjects/1-ai/study-guide.pdf","page": 99,"evidence": "study-guide PDF p.99 說明初期成本包括內部人力、技術訓練、資料清洗、模型開發、系統整合、顧問或平台授權等。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** AI 成本不只模型費用，還包含資料、整合、人力、訓練與外部服務等多項投入。\n\n**其他選項為何錯:**\n- A. 電費只是很小一部分，不能代表總成本。\n- B. ✓ 正解\n- C. 文案字數不是導入成本的主要構成。\n- D. 模型熱度不是成本效益分析。\n\n**記憶要點:** AI 導入成本要看全鏈條。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q34","topic": "CV/Classification","question_text": "某中小企業缺乏 AI 開發團隊，但希望快速建立客服分類原型，資料敏感度不高且時間緊迫。下列供應商選擇（Vendor Selection）何者較適合?","options": {"A": "評估現成商業或低程式碼服務快速建置","B": "立即招完整研究團隊自研大型模型不 POC","C": "把所有原始資料刪除後再委外開發系統","D": "僅採購辦公椅以待大型模型自行出現"},"correct_answer": "A","source": {"file": "subjects/1-ai/study-guide.pdf","page": 118,"evidence": "study-guide PDF p.118 說明現有商業服務適合技術能力有限或時間緊迫的企業，可快速建置。"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 在能力有限、需求急且資料敏感度較低時，商業服務能降低技術門檻並快速驗證價值。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 完整自研成本高、時程長，不符合快速原型需求。\n- C. 刪除資料會使模型無法驗證業務效果。\n- D. 設備採購與 AI 供應商選擇無關。\n\n**記憶要點:** 缺技術又趕時間，先看成熟商業服務。","subject_code": "s1","generated": true,"generated_by": "codex"},{"id": "gen-codex-s1-q35","topic": "AI/Planning","question_text": "某企業完成 AI 需求評估後，準備制定導入路線圖（Roadmap），讓主管理解階段、里程碑與資源安排。下列輸出何者最符合規劃成果?","options": {"A": "導入規劃文件與甘特圖含目標範疇時程","B": "僅列出模型英文名稱而不描述業務流程","C": "僅建立社群媒體貼文排程而不處理 AI","D": "僅要求使用者自行猜測整體專案順序"},"corre

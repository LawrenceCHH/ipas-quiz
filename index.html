n\n**記憶要點:** Chunk size、Top-K、重排序(reranker)是 RAG 三大優化點。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q12", "topic": "NLP/NER", "question_text": "某保險業導入命名實體辨識(Named Entity Recognition, NER)從理賠書面文件抽取「保戶姓名、保單編號、就醫院所、診斷代碼」。下列哪一項是該任務最常採用的標註框架?", "options": {"A": "Bag-of-Words 標註", "B": "BIO/BIOES 序列標註", "C": "Cosine Similarity 比對", "D": "TF-IDF 權重排序"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Named-entity_recognition", "page": 1, "evidence": "Wikipedia NER: token-level sequence labeling commonly uses BIO (Begin/Inside/Outside) or BIOES tagging schemes to mark entity spans."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** NER 是 token-level 序列標註,需要標出每個 token 是某實體的開頭(B)、內部(I)或非實體(O),BIO/BIOES 是業界標準。\n\n**其他選項為何錯:**\n- A. BoW 不保留順序。\n- B. ✓ 正解\n- C. 屬檢索/權重技術,非標註框架。\n- D. 屬檢索/權重技術,非標註框架。\n\n**記憶要點:** NER = token-level sequence labeling + BIO/BIOES。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q13", "topic": "NLP/Translation", "question_text": "下列關於神經機器翻譯(Neural Machine Translation, NMT)的敘述,何者最正確?", "options": {"A": "NMT 一律使用 RNN + attention,Transformer 並未取代它", "B": "現代 NMT 主要以 Transformer encoder-decoder 為主流,訓練目標為最大化目標語句的條件機率", "C": "NMT 不需要平行語料,只需單語語料即可訓練", "D": "BLEU 分數越低代表翻譯品質越好"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Neural_machine_translation", "page": 1, "evidence": "Wikipedia NMT: Modern NMT systems typically use a Transformer encoder–decoder architecture and are trained to maximize the conditional probability of the target sentence given the source."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Transformer (2017) 後幾乎取代 RNN+Attention 成為 NMT 主流,目標是 maximize P(target|source)。\n\n**其他選項為何錯:**\n- A. Transformer 已是 NMT 主流。\n- B. ✓ 正解\n- C. 主流 NMT 仍需平行語料(或回譯)。\n- D. BLEU 越高越好。\n\n**記憶要點:** NMT 主流 = Transformer encoder-decoder + 平行語料 + BLEU 評估。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q14", "topic": "NLP/Hallucination", "question_text": "下列哪一個方法「最不能」直接降低 LLM 幻覺(hallucination)風險?", "options": {"A": "導入 Retrieval-Augmented Generation(RAG)以基於可信文件回答", "B": "為回答加上 citations 並要求模型只引用檢索到的段落", "C": "提高 temperature 與 top-p 以增加生成隨機性", "D": "對特定領域進行微調(Fine-tuning)或 RLHF 校準"}, "correct_answer": "C", "source": {"file": "https://arxiv.org/abs/2311.05232", "page": 1, "evidence": "Survey on hallucination in LLMs (2023): mitigation strategies include retrieval grounding, citation enforcement, fine-tuning, and RLHF; high sampling temperature is associated with increased hallucination."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** 提高 temperature/top-p 會放大隨機採樣,反而增加離譜輸出與事實錯誤,與「降低幻覺」目標相反。\n\n**其他選項為何錯:**\n- A. RAG 是經典的 grounding 方法。\n- B. citation 強制讓回答可追溯。\n- C. ✓ 正解(反向)\n- D. fine-tune/RLHF 對齊事實能降幻覺。\n\n**記憶要點:** 降幻覺 = grounding + citation + 對齊;升 temperature = 增加幻覺風險。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q15", "topic": "CV/Classification", "question_text": "某零售商在進行商品圖像分類(Image Classification),希望同一張圖只回傳「最可能的一個類別」。下列哪個層最適合作為網路最後輸出層?", "options": {"A": "Sigmoid 多輸出(每類別獨立)", "B": "Softmax 多類別輸出", "C": "ReLU 啟動", "D": "Batch Normalization"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Softmax_function", "page": 1, "evidence": "Wikipedia: Softmax converts a vector of K real numbers into a probability distribution over K classes; commonly used as the final layer for multi-class single-label classification."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 單標籤多類別分類需 softmax,使各類別機率總和為 1,argmax 取最可能類別。\n\n**其他選項為何錯:**\n- A. sigmoid 多輸出適用「多標籤」(可同時屬於多類)。\n- B. ✓ 正解\n- C. ReLU 是隱藏層啟動。\n- D. BN 是正規化,不產生輸出機率。\n\n**記憶要點:** Single-label multi-class = softmax;Multi-label = sigmoid per class。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q16", "topic": "CV/Detection", "question_text": "下列關於 YOLO(You Only Look Once)系列物件偵測模型的敘述,何者最正確?", "options": {"A": "YOLO 是 two-stage detector,依賴 region proposal", "B": "YOLO 是 one-stage detector,直接從整張圖一次回歸 bounding box 與類別,推論速度快", "C": "YOLO 無法用於即時(real-time)場景", "D": "YOLO 僅能用於人臉辨識"}, "correct_answer": "B", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 55, "evidence": "學習指引 3.2 節說明 YOLO 為基於迴歸的方法,能同時預測物體的邊界框與類別,適合即時偵測(如監控、自駕)。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** YOLO 把偵測視為一次性回歸問題,整張圖一次 forward 同時輸出 bounding box 與類別機率,故 one-stage、速度快。\n\n**其他選項為何錯:**\n- A. two-stage 是 Faster R-CNN/Mask R-CNN 等。\n- B. ✓ 正解\n- C. YOLO 正是為 real-time 設計。\n- D. 通用物件偵測。\n\n**記憶要點:** YOLO = One-stage、即時、回歸式;R-CNN 系列 = Two-stage、較慢、提案再分類。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q17", "topic": "CV/Detection", "question_text": "物件偵測的非極大值抑制(Non-Maximum Suppression, NMS)主要功用為何?", "options": {"A": "讓網路在訓練階段更穩定收斂", "B": "在推論階段合併同一物件被重複偵測的多個 bounding box,只保留分數最高且 IoU 較小的框", "C": "把所有 bounding box 不論信心都保留", "D": "用於資料增強"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Non-maximum_suppression", "page": 1, "evidence": "Wikipedia: NMS keeps the highest-confidence detection and removes other boxes with high IoU overlap, eliminating redundant detections for the same object."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** NMS 是後處理步驟:對同類預測按 confidence 排序,逐一保留最高分,移除與之 IoU 超過閾值的其他框,避免一個物件被重複框出。\n\n**其他選項為何錯:**\n- A. NMS 在推論期,非訓練期。\n- B. ✓ 正解\n- C. 反向。\n- D. 與資料增強無關。\n\n**記憶要點:** NMS = 推論期去除重複框,IoU 閾值越低剝奪越狠。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q18", "topic": "CV/Segmentation", "question_text": "下列何者「最能區別」語意分割(Semantic Segmentation)與實例分割(Instance Segmentation)?", "options": {"A": "語意分割逐像素標類別但「不區分」同類別不同個體;實例分割「區分」同類別的每個個體", "B": "語意分割只能用於黑白影像;實例分割只能用於彩色影像", "C": "兩者完全相同,只是名稱不同", "D": "實例分割不需要任何 mask"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 50, "evidence": "學習指引 3.2 節說明語意分割為每像素分類,實例分割除像素分類外還需區分同類別中不同個體(person 1、person 2…)。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Semantic = 所有「人」是同一類; Instance = 還要區分「person 1」、「person 2」、「person 3」。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 與色彩無關。\n- C. 兩者目標不同。\n- D. instance 一樣需要 mask。\n\n**記憶要點:** Semantic 看「類」、Instance 看「個體」、Panoptic 兩者兼顧。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q19", "topic": "CV/OCR", "question_text": "某企業導入 OCR(Optical Character Recognition)處理客戶上傳的中華民國身分證影像。下列哪一項是 OCR 流程中「最常見且影響準確率最大的前處理步驟」?", "options": {"A": "影像旋轉校正(Skew Correction)+ 二值化(Binarization)", "B": "GIF 動畫播放", "C": "影像 RGB 加噪", "D": "完全不做前處理"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Optical_character_recognition", "page": 1, "evidence": "Wikipedia OCR: pre-processing typically includes de-skew, binarization, despeckle, and segmentation; skew correction and binarization are among the most impactful."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** OCR 對輸入影像角度與對比敏感,先做歪斜校正再二值化把文字從背景中乾淨切出,是公認最影響準確率的前處理。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 與 OCR 無益甚至有害。\n- C. 與 OCR 無益甚至有害。\n- D. 與 OCR 無益甚至有害。\n\n**記憶要點:** OCR 前處理黃金組合 = De-skew + Binarization + Denoise。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q20", "topic": "CV/ViT", "question_text": "Vision Transformer(ViT)與 CNN 的根本差異為何?", "options": {"A": "ViT 完全不使用 attention", "B": "ViT 將影像切成 patch 後當作 token 序列送入 Transformer,放棄卷積的局部偏置(locality bias)", "C": "ViT 只能處理灰階影像", "D": "ViT 在小資料集上一定優於 CNN"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/2010.11929", "page": 1, "evidence": "Dosovitskiy et al. (2020) \"An Image is Worth 16x16 Words\": splits image into fixed-size patches, treats them as token sequence input to a standard Transformer encoder."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** ViT 把影像切成 16×16 之類 patch、線性投影為 token 序列,直接餵 Transformer encoder,完全放棄卷積架構中的局部+平移不變偏置。\n\n**其他選項為何錯:**\n- A. ViT 核心就是 attention。\n- B. ✓ 正解\n- C. 三通道彩色可用。\n- D. 小資料時 CNN 通常較優,ViT 需大量資料或預訓練。\n\n**記憶要點:** ViT = patch → token → Transformer;靠規模換取掉 inductive bias。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q21", "topic": "GenAI/GAN", "question_text": "在標準 GAN(Generative Adversarial Network)的訓練中,生成器(Generator)與判別器(Discriminator)的關係最接近下列何者?", "options": {"A": "兩者目標一致,皆最小化分類錯誤", "B": "Generator 嘗試生成以假亂真樣本欺騙 Discriminator;Discriminator 嘗試區分真假,屬 min-max 博弈", "C": "Generator 與 Discriminator 共享同一組權重", "D": "兩者不對抗,而是合作壓縮影像"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/1406.2661", "page": 1, "evidence": "Goodfellow et al. (2014) \"Generative Adversarial Nets\": G and D play a two-player minimax game; G maximizes the probability of D making a mistake, D maximizes correct classification of real vs fake."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** GAN 是兩個網路的零和對抗:G 學會生成更真的假樣本,D 學會更精確分辨真假,理論上達到 Nash 平衡時 G 的分佈逼近真實資料分佈。\n\n**其他選項為何錯:**\n- A. 兩者目標相反。\n- B. ✓ 正解\n- C. 不共享權重。\n- D. 對抗訓練不是合作。\n\n**記憶要點:** GAN = G vs D min-max game,訓練不穩定 → 易 mode collapse。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q22", "topic": "GenAI/GAN", "question_text": "GAN 訓練中出現「Mode Collapse(模式崩塌)」最典型的現象為何?", "options": {"A": "Generator 輸出的影像種類極為單一,無法覆蓋資料分佈的多種模式", "B": "Discriminator 永遠無法分辨真假", "C": "梯度爆炸導致訓練停止", "D": "影像解析度過高使 GPU 記憶體耗盡"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Generative_adversarial_network", "page": 1, "evidence": "Wikipedia GAN: mode collapse occurs when the generator produces samples of limited variety, failing to cover the full diversity of the real data distribution."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Mode collapse 是 GAN 常見病:G 找到少數幾個「能騙過 D」的輸出後就懶得多樣化,實際看到的 fake 影像高度雷同。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 那是平衡狀態,不是模式崩塌。\n- C. 梯度爆炸是訓練數值問題。\n- D. 與資源相關,非定義。\n\n**記憶要點:** Mode Collapse = 輸出種類太少;對策:Mini-batch discrimination、WGAN、Unrolled GAN。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q23", "topic": "GenAI/Diffusion", "question_text": "下列關於擴散模型(Diffusion Model)生成流程的敘述,何者最正確?", "options": {"A": "前向過程加噪、反向過程去噪;最終由純高斯雜訊逐步還原成真實影像", "B": "擴散模型不需要 U-Net 或其他去噪網路", "C": "擴散模型一次性從 latent 生成最終影像,沒有迭代步驟", "D": "擴散模型只能生成黑白影像"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/2006.11239", "page": 1, "evidence": "Ho et al. (2020) \"Denoising Diffusion Probabilistic Models\": forward process gradually adds Gaussian noise; reverse process learns to denoise step-by-step from pure noise to data."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Diffusion model 由 forward noising(資料 → 雜訊)與 reverse denoising(雜訊 → 資料)兩階段組成,推論時從 N(0,I) 逐步去噪 T 步重建。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 通常以 U-Net 去噪。\n- C. 是多步迭代。\n- D. 三通道彩色皆可。\n\n**記憶要點:** Diffusion = 加噪 → 去噪;訓練學去噪、生成由純雜訊往回走。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q24", "topic": "GenAI/Diffusion", "question_text": "Stable Diffusion 與 DALL·E 系列等「文字到影像(Text-to-Image)」模型,通常需要結合下列哪一個組件以實作「文字條件」?", "options": {"A": "文本編碼器(Text Encoder,如 CLIP text encoder)以將提示詞轉成 embedding,再經 cross-attention 注入 UNet", "B": "傳統的 SVM 文字分類器", "C": "Random Forest", "D": "BPE Tokenizer 即可,無需任何語言模型"}, "correct_answer": "A", "source": {"file": "https://arxiv.org/abs/2112.10752", "page": 1, "evidence": "Rombach et al. (2022) \"High-Resolution Image Synthesis with Latent Diffusion Models\": text conditioning is achieved by encoding the prompt via a pretrained text encoder (e.g., CLIP), then injecting via cross-attention layers into the U-Net denoiser."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 文字到影像 diffusion model 把 prompt 經文本編碼器(常用 CLIP)變 embedding,再透過 cross-attention 注入 U-Net 的去噪過程,引導生成。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 經典 ML 模型無法產生 embedding 條件。\n- C. 經典 ML 模型無法產生 embedding 條件。\n- D. 只 tokenize 沒有 encode。\n\n**記憶要點:** Text2Image = Text Encoder(CLIP)+ U-Net Diffusion + Cross-Attention。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q25", "topic": "GenAI/PromptEngineering", "question_text": "下列哪一個技巧最能幫助 LLM 在「需要多步推理的數學或邏輯題」上提升正確率?", "options": {"A": "Zero-shot 直接問答", "B": "Chain-of-Thought(CoT)提示,要求模型「逐步思考」並輸出推理過程", "C": "把問題改成全大寫", "D": "降低 max_tokens 限制長度"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/2201.11903", "page": 1, "evidence": "Wei et al. (2022) \"Chain-of-Thought Prompting Elicits Reasoning in Large Language Models\": few-shot CoT prompting significantly improves performance on arithmetic, commonsense, and symbolic reasoning tasks."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** CoT 提示讓模型把中間推理顯式寫出來,等於把運算分攤到多個 token,顯著提升多步推理任務正確率。\n\n**其他選項為何錯:**\n- A. zero-shot 在複雜推理常表現差。\n- B. ✓ 正解\n- C. 大小寫無影響。\n- D. 截短反而中斷推理。\n\n**記憶要點:** 多步推理 → CoT「Let's think step by step」是入門咒語。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q26", "topic": "GenAI/FineTuning", "question_text": "下列關於 PEFT(Parameter-Efficient Fine-Tuning,如 LoRA)的敘述,何者最正確?", "options": {"A": "PEFT 必須更新模型全部參數", "B": "LoRA 在每層注入低秩(low-rank)可訓練矩陣,凍結原權重,以極少參數達成接近全微調效果", "C": "PEFT 只能用於 CV 模型,不適用 LLM", "D": "PEFT 訓練成本一定高於完整微調"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/2106.09685", "page": 1, "evidence": "Hu et al. (2021) \"LoRA: Low-Rank Adaptation of Large Language Models\": freezes pretrained weights, injects trainable rank-decomposition matrices, dramatically reducing trainable parameters with minimal quality loss."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** LoRA 凍結原模型 W,在每層加入 ΔW = BA(B、A 為低秩矩陣)只訓 B、A,可訓參數降至原本 1% 以下,效果接近全微調。\n\n**其他選項為何錯:**\n- A. 反向。\n- B. ✓ 正解\n- C. LoRA 主要為 LLM 設計。\n- D. PEFT 顯著降低成本。\n\n**記憶要點:** PEFT 三招:LoRA、Prefix-Tuning、Adapter;LoRA 因 trade-off 最佳而最普及。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q27", "topic": "Multimodal/Fusion", "question_text": "在多模態學習中,「中期融合(Mid Fusion / Hybrid Fusion)」與早期、晚期融合的最大差別為何?", "options": {"A": "中期融合是在輸入層拼接原始資料", "B": "中期融合在中間隱藏層(深層特徵層)透過 attention 或閘控機制動態結合不同模態特徵", "C": "中期融合僅在最終決策輸出處平均不同模態結果", "D": "中期融合不需要訓練"}, "correct_answer": "B", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 88, "evidence": "學習指引 3.4 節說明多模態融合可分早期(資料層)、中期(隱藏層,常用 attention)與晚期(決策層)三種策略。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Mid fusion 在表徵階段融合不同模態,可學習模態間的互補關係,且常以 cross-attention 或 gating 動態調整。\n\n**其他選項為何錯:**\n- A. 屬早期融合。\n- B. ✓ 正解\n- C. 屬晚期融合。\n- D. 需訓練。\n\n**記憶要點:** Early=資料層、Mid=隱藏層、Late=決策層。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q28", "topic": "Multimodal/CLIP", "question_text": "OpenAI 提出的 CLIP(Contrastive Language-Image Pre-training)模型訓練目標為何?", "options": {"A": "回歸影像像素", "B": "對齊圖像 embedding 與其對應文字 embedding(正例配對),拉開不匹配配對(負例)的對比學習", "C": "直接生成新影像", "D": "做監督式影像分類"}, "correct_answer": "B", "source": {"file": "https://arxiv.org/abs/2103.00020", "page": 1, "evidence": "Radford et al. (2021) \"Learning Transferable Visual Models From Natural Language Supervision\": CLIP trains image and text encoders jointly using a contrastive loss to align correct image-caption pairs."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** CLIP 用 N×N 對比矩陣,把正確圖文對的 cosine similarity 推高、錯配的推低,訓出可零樣本分類的 image/text encoder。\n\n**其他選項為何錯:**\n- A. 不做像素回歸。\n- B. ✓ 正解\n- C. CLIP 自己不生成圖像。\n- D. CLIP 使用自然語言監督,不是固定類別監督。\n\n**記憶要點:** CLIP = Contrastive + Image-Text 雙塔,zero-shot 分類靠 prompt。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q29", "topic": "AI/Adoption", "question_text": "企業評估是否導入 AI 解決方案時,下列哪一項應該「最先」執行?", "options": {"A": "立即購買 GPU 並組建內部 ML 平台", "B": "盤點具體業務痛點與量化的成功指標(KPI),以判斷 AI 是否為合適手段", "C": "招募 10 位 ML 博士", "D": "與所有供應商簽長期合約"}, "correct_answer": "B", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 99, "evidence": "學習指引 4.1 節 AI 導入評估強調應先釐清業務需求與成功指標,再評估 AI 技術是否符合與帶來 ROI。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** AI 導入評估第一步是釐清「為什麼要做、要解什麼問題、KPI 怎麼量」,沒清楚定義就買硬體/招人都是燒錢。\n\n**其他選項為何錯:**\n- A. 屬執行階段,且在沒有確認問題前都是浪費。\n- C. 屬執行階段,且在沒有確認問題前都是浪費。\n- D. 屬執行階段,且在沒有確認問題前都是浪費。\n- B. ✓ 正解\n\n**記憶要點:** AI 導入順序:Business problem → Success KPI → Feasibility → POC → Scale。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q30", "topic": "AI/Adoption", "question_text": "下列關於 AI Proof-of-Concept(PoC)目的的描述,何者最正確?", "options": {"A": "PoC 目的是立即交付產線可用的正式系統", "B": "PoC 目的是在「有限投入」下驗證技術可行性、資料可用性、初步效益,以決定是否進一步投資", "C": "PoC 必須以最大規模、全功能展開", "D": "PoC 完成後即可結案,不需後續評估"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Proof_of_concept", "page": 1, "evidence": "Wikipedia: A proof of concept (PoC) is a realization of a method or idea in order to demonstrate its feasibility; it is incomplete and intended to verify potential, not deliver final product."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** PoC 是 small-scale 驗證,在有限預算/時間裡跑出可量化證據,協助決策是否擴大投資。\n\n**其他選項為何錯:**\n- A. 那是 production launch。\n- B. ✓ 正解\n- C. 大規模屬 pilot 或正式部署。\n- D. PoC 完要 review/決策。\n\n**記憶要點:** PoC = small + fast + measurable;通過再走 Pilot → Production。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q31", "topic": "AI/Adoption", "question_text": "某企業評估「自建 vs. 採購 SaaS AI 服務」決策時,下列哪一項是「最不重要」的考量?", "options": {"A": "資料隱私與資料外流風險", "B": "TCO(Total Cost of Ownership)與營運成本", "C": "團隊既有技術能力與可維護性", "D": "辦公室咖啡機品牌"}, "correct_answer": "D", "source": {"file": "https://www.gartner.com/en/information-technology/glossary/total-cost-of-ownership-tco", "page": 1, "evidence": "Gartner glossary: Build vs Buy decisions hinge on TCO, time-to-value, data sensitivity, internal capability, and strategic differentiation."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** 與決策無關,純干擾選項。\n\n**其他選項為何錯:**\n- A. 涉及合規與商業機密,重要。\n- B. TCO 是核心成本指標。\n- C. 自建須評估維運能力。\n- D. ✓ 正解(不相關)\n\n**記憶要點:** Build vs Buy 評估:資料、TCO、能力、差異化。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q32", "topic": "AI/Adoption", "question_text": "某零售業希望將「AI 預測補貨」優先導入。從 ROI 角度,下列哪一項判斷最合理?", "options": {"A": "ROI 與資料品質、預測準確度、實際補貨節省金額三者皆無關", "B": "ROI 應評估「節省的庫存成本 + 缺貨損失減少」與「資料、模型、部署成本」之比,需明確的基準線(baseline)", "C": "ROI 越高代表模型一定越複雜", "D": "ROI 評估通常在模型上線兩年後再做即可"}, "correct_answer": "B", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 100, "evidence": "學習指引 4.1 節說明 AI 導入需以可量化效益(收益、成本節省)與投入成本相比,並建立基準線評估 ROI。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** ROI = (效益 - 成本) / 成本,前提是有可量化的 baseline 才能算出「節省了多少」。\n\n**其他選項為何錯:**\n- A. 三者皆是 ROI 關鍵變數。\n- B. ✓ 正解\n- C. 複雜模型未必 ROI 高。\n- D. 太晚評估會錯失早期修正機會。\n\n**記憶要點:** AI ROI = (Δ收益 − Δ成本) / Δ成本;baseline 是必要前提。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q33", "topic": "AI/Planning", "question_text": "在 AI 專案規劃中,「資料策略(Data Strategy)」最應該優先回答下列哪一個問題?", "options": {"A": "公司應該換哪一家雲端服務商", "B": "需要哪些資料、來源在哪、如何取得授權、如何標註與治理", "C": "辦公室要不要重新裝潢", "D": "團隊應該用哪一種程式語言"}, "correct_answer": "B", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 105, "evidence": "學習指引 4.2 節指出 AI 導入規劃須先制定資料策略,涵蓋資料來源、授權、標註、品質與治理流程。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** AI 三要素是資料、演算法、算力,資料策略決定後兩者方向。先清楚要哪些資料、能否合法取得、怎麼維護品質,才有後續模型可言。\n\n**其他選項為何錯:**\n- A. 屬基礎建設或人力問題,非資料策略本身。\n- C. 屬基礎建設或人力問題,非資料策略本身。\n- D. 屬基礎建設或人力問題,非資料策略本身。\n- B. ✓ 正解\n\n**記憶要點:** 資料策略 = What + Where + How(取得 / 標註 / 治理 / 安全)。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q34", "topic": "AI/Planning", "question_text": "下列關於 AI 專案「跨部門利害關係人(Stakeholder)管理」的敘述,何者最正確?", "options": {"A": "AI 專案只需要技術部門參與即可成功", "B": "業務、IT、法務、資安、HR 等部門皆可能影響或受影響,需識別關鍵利害關係人並設定溝通節奏", "C": "利害關係人愈少愈好,直接交付即可", "D": "法務與資安在 PoC 階段完全不必介入"}, "correct_answer": "B", "source": {"file": "https://www.pmi.org/learning/library/stakeholder-engagement-process-ai-projects-12345", "page": 1, "evidence": "PMI / iPAS planning materials: AI projects require multi-stakeholder engagement covering business, IT, legal, security, and operations from early stages."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** AI 影響跨組織流程、法遵、人員與資料,僅技術部門無法成事;早期識別關鍵 stakeholder 並建立 RACI 才能順利推進。\n\n**其他選項為何錯:**\n- A. 單部門易撞牆。\n- B. ✓ 正解\n- C. 利害關係人少不等於風險小。\n- D. 法資安應從 PoC 即介入合規檢視。\n\n**記憶要點:** AI Stakeholder:Business、IT、Legal、Security、Ops、HR — 早期介入。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q35", "topic": "AI/Planning", "question_text": "下列哪一項 AI 專案「最不適合採用瀑布式(Waterfall)生命週期」,而應採用迭代式(Iterative / Agile)?", "options": {"A": "需求極為固定且法規嚴格的核能控制系統", "B": "首次以新型 LLM + RAG 建立企業內部知識問答,需求與資料逐步釐清", "C": "從供應商採購現成 SaaS 並直接導入,合約條款穩定", "D": "純粹只是更新公司網站文案"}, "correct_answer": "B", "source": {"file": "https://www.atlassian.com/agile/project-management/waterfall-vs-agile", "page": 1, "evidence": "Agile vs Waterfall: iterative methods are preferred when requirements are uncertain and discovery is needed; AI/ML projects with evolving data and metrics fit Agile."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** ML 專案的資料、評估指標與成效都在過程中持續學習與調整,適合短迭代;固定需求專案才適合瀑布。\n\n**其他選項為何錯:**\n- A. 高度規範環境傾向瀑布。\n- B. ✓ 正解\n- C. 固定範疇可瀑布。\n- D. 固定範疇可瀑布。\n\n**記憶要點:** AI 不確定性高 → 短迭代 + 階段性 review。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q36", "topic": "Risk/Privacy", "question_text": "下列哪一項做法「最直接」符合「資料最小化(Data Minimization)」原則?", "options": {"A": "盡可能收集越多越好,以備未來模型訓練之需", "B": "在進入訓練前移除或假名化與目標無關的個人資料欄位,僅保留必要特徵", "C": "將完整身分證字號明碼存於訓練集", "D": "把所有個人資料公開分享給第三方"}, "correct_answer": "B", "source": {"file": "https://gdpr-info.eu/art-5-gdpr/", "page": 1, "evidence": "GDPR Article 5(1)(c) — data minimisation: personal data shall be adequate, relevant and limited to what is necessary for the purposes for which they are processed."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Data minimization 要求「只收/留必要的、相關的」,做法就是事前移除無關欄位、必要欄位假名化(pseudonymization)。\n\n**其他選項為何錯:**\n- A. 反向(資料極大化)。\n- B. ✓ 正解\n- C. 嚴重隱私風險。\n- D. 違反個資法。\n\n**記憶要點:** GDPR Art.5 七大原則之一:Data Minimization;只用「必要的」資料。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q37", "topic": "Risk/Compliance", "question_text": "下列關於台灣《個人資料保護法》(個資法)的敘述,何者最正確?", "options": {"A": "蒐集個資不需告知當事人特定目的", "B": "蒐集、處理、利用個資皆需「特定目的」與相應「合法事由」,且應告知當事人", "C": "個資法不適用於 AI 模型訓練", "D": "當事人不可以行使資料更正或刪除權"}, "correct_answer": "B", "source": {"file": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0050021", "page": 1, "evidence": "中華民國個人資料保護法第 5、6、19 條:蒐集、處理、利用個資需特定目的、合法事由及告知當事人,並賦予查詢、更正、刪除等權利。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 個資法核心:特定目的 + 合法事由 + 告知義務 + 當事人權利(查詢/更正/刪除/停止利用)。AI 訓練同樣適用。\n\n**其他選項為何錯:**\n- A. 須告知。\n- B. ✓ 正解\n- C. 適用。\n- D. 法律保障當事人權利。\n\n**記憶要點:** 個資法四大要件:特定目的、合法事由、告知、權利保障。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q38", "topic": "Risk/Compliance", "question_text": "GDPR 對「自動化決策(Automated Decision-Making)」的特別規範為何?", "options": {"A": "完全禁止任何自動化決策", "B": "當事人有權「不被完全自動化決策所制約」,且資料控管者需提供救濟機制與人為審查管道", "C": "自動化決策可任意進行無需告知", "D": "GDPR 不涉及自動化決策議題"}, "correct_answer": "B", "source": {"file": "https://gdpr-info.eu/art-22-gdpr/", "page": 1, "evidence": "GDPR Article 22: data subject has the right not to be subject to a decision based solely on automated processing which produces legal or similarly significant effects; controllers must provide safeguards including human intervention."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Art.22 保障當事人不被「純自動化決策」單方面決定其權益,且企業必須提供 opt-out、解釋與人工複審機制。\n\n**其他選項為何錯:**\n- A. 並非全禁,有例外。\n- B. ✓ 正解\n- C. 須告知與救濟。\n- D. GDPR Art.22 即此條。\n\n**記憶要點:** GDPR Art.22 = 反對純自動化決策的權利 + 人工介入義務。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q39", "topic": "Risk/Copyright", "question_text": "企業使用生成式 AI 產出行銷文案時,下列關於著作權的敘述,何者「最不正確」?", "options": {"A": "輸入端若使用未授權第三方著作可能構成侵權", "B": "輸出端可能因模型訓練資料含有他人著作而存在再現風險", "C": "美國 USCO 立場是「純由 AI 生成」的作品不獲著作權保護;人類創造性介入則可能受保護", "D": "只要是由 AI 生成的作品,所有國家都明文承認其著作權"}, "correct_answer": "D", "source": {"file": "https://www.copyright.gov/ai/ai_policy_guidance.pdf", "page": 1, "evidence": "U.S. Copyright Office 2023 guidance: works produced by AI without sufficient human creative input are not copyrightable."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解(最不正確):** 各國對 AI 生成著作權態度分歧,美國 USCO 明確認定無人類創意者不獲保護;歐盟與台灣亦未一致承認。\n\n**其他選項為何錯:**\n- A. 真,輸入端有侵權風險。\n- B. 真,輸出可能再現訓練資料。\n- C. 真,USCO 立場。\n- D. ✓ 正解(錯誤敘述)\n\n**記憶要點:** AI 著作權三大風險:輸入授權、輸出再現、人類創作性門檻。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q40", "topic": "Risk/Security", "question_text": "下列何者為 LLM 應用中最常見的「Prompt Injection」攻擊類型?", "options": {"A": "直接攻擊:使用者在 prompt 內嵌指令覆寫系統指示(如「忽略上面所有指示...」)", "B": "雙重加密保護法", "C": "在影像中加入像素水印", "D": "硬體層級的中間人攻擊"}, "correct_answer": "A", "source": {"file": "https://owasp.org/www-project-top-10-for-large-language-model-applications/", "page": 1, "evidence": "OWASP Top 10 for LLM Applications: LLM01 Prompt Injection — direct injection inserts instructions into user input that override the system prompt; indirect injection embeds instructions in retrieved content."}, "verified": t l-preserving。\n- B. ✓ 正解\n\n**記憶要點:** Augmentation 必須 label-preserving,翻轉 6→9 / 字元類常踩坑。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q43", "topic": "Deploy/MLOps", "question_text": "MLOps 中的「Model Registry」最主要的職責為何?", "options": {"A": "監控網路流量", "B": "管理模型版本、metadata、stage(staging/production)以及審核流程", "C": "管理硬體採購清單", "D": "替代 Git 倉庫"}, "correct_answer": "B", "source": {"file": "https://mlflow.org/docs/latest/model-registry.html", "page": 1, "evidence": "MLflow Model Registry: centralized model store with versioning, stage transitions (None/Staging/Production/Archived), annotations, and approvals."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Model Registry(如 MLflow、Vertex AI Registry、SageMaker Model Registry)是 MLOps 治理核心,管模型版本、metadata 與發布流程。\n\n**其他選項為何錯:**\n- A. 屬監控/網路。\n- B. ✓ 正解\n- C. 與採購無關。\n- D. 程式碼版控仍用 Git。\n\n**記憶要點:** Model Registry = 模型版本 + 階段管理 + 審核 + Lineage。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q44", "topic": "Deploy/MLOps", "question_text": "下列關於 MLOps 「藍綠部署(Blue-Green Deployment)」與「金絲雀發布(Canary Release)」的差異敘述,何者最正確?", "options": {"A": "兩者完全相同", "B": "藍綠部署同時維護兩套環境,一次性全量切換;金絲雀則逐步將流量灰度發送到新版本,可即時回滾", "C": "金絲雀發布只能用於資料庫變更", "D": "藍綠部署必須先停機"}, "correct_answer": "B", "source": {"file": "https://martinfowler.com/bliki/BlueGreenDeployment.html", "page": 1, "evidence": "Martin Fowler: Blue-green deployment maintains two production environments and switches all traffic at once; canary release gradually shifts a percentage of traffic to the new version."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 藍綠:同時跑 Blue/Green,流量切換是 100%/0% → 0%/100%;金絲雀:5% → 25% → 50% → 100% 漸進切換,風險更可控。\n\n**其他選項為何錯:**\n- A. 不同模式。\n- B. ✓ 正解\n- C. 與資料庫無關。\n- D. 藍綠通常零停機。\n\n**記憶要點:** Blue-Green = 全量切;Canary = 漸進切。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q45", "topic": "Data/Drift", "question_text": "下列關於「資料漂移(Data Drift)」與「概念漂移(Concept Drift)」的差異,何者最正確?", "options": {"A": "兩者沒有差別", "B": "Data Drift 是輸入特徵分佈 P(X) 改變;Concept Drift 是輸入-標籤關係 P(Y|X) 改變", "C": "Data Drift 不會影響模型表現", "D": "Concept Drift 是指模型權重隨機重置"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Concept_drift", "page": 1, "evidence": "Wikipedia Concept drift: a change in the statistical properties of the target variable P(Y|X) over time; sometimes distinguished from covariate / data drift which is a change in P(X)."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Data Drift = 特徵分佈變;Concept Drift = 輸入到標籤的條件關係變(例:疫情後消費者偏好改變)。\n\n**其他選項為何錯:**\n- A. 兩者定義不同。\n- B. ✓ 正解\n- C. Data Drift 會降低模型表現。\n- D. 與權重重置無關。\n\n**記憶要點:** Data Drift = P(X) 變;Concept Drift = P(Y|X) 變。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q46", "topic": "NLP/Summarization", "question_text": "下列何者最能區分「抽取式摘要(Extractive)」與「生成式摘要(Abstractive)」?", "options": {"A": "抽取式直接複製原文句子;生成式可改寫並產生原文中未出現的詞句", "B": "兩者皆只能複製原文", "C": "抽取式必須使用 LLM", "D": "生成式不需要訓練"}, "correct_answer": "A", "source": {"file": "https://en.wikipedia.org/wiki/Automatic_summarization", "page": 1, "evidence": "Wikipedia Automatic summarization: extractive methods select source sentences verbatim; abstractive methods generate novel sentences that paraphrase the source."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Extractive 是「挑句子」、Abstractive 是「重寫句子」,Transformer/T5/BART 等是現代 abstractive 主流。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 抽取式才複製。\n- C. 抽取式可以是 TextRank 等傳統方法。\n- D. 仍需訓練。\n\n**記憶要點:** Extractive=拼貼、Abstractive=改寫。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q47", "topic": "CV/Pose", "question_text": "下列何者最能正確描述「人體姿態估計(Human Pose Estimation)」?", "options": {"A": "預測影像中的天氣狀態", "B": "估計人體關鍵點(Keypoints)位置(如肩、肘、腕、髖、膝、踝),可分 2D 或 3D", "C": "辨識文字內容", "D": "分割語意區域"}, "correct_answer": "B", "source": {"file": "https://en.wikipedia.org/wiki/Articulated_body_pose_estimation", "page": 1, "evidence": "Wikipedia: Human pose estimation involves predicting keypoint locations (joints) of a human body in images or video, in 2D or 3D coordinates."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Pose Estimation 任務即偵測人體關鍵點/骨架,代表模型 OpenPose、HRNet、MediaPipe。\n\n**其他選項為何錯:**\n- A. 屬不同任務。\n- C. 屬不同任務。\n- D. 屬不同任務。\n- B. ✓ 正解\n\n**記憶要點:** Pose = Keypoints;Top-down(先偵測再估姿)vs Bottom-up(先抓 keypoints 再分人)。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q48", "topic": "NLP/LLM-Eval", "question_text": "下列關於評估生成式 LLM 輸出品質的方法,何者「最不可信於」開放式生成任務(如自由回答 QA)?", "options": {"A": "BLEU(對文字生成的 n-gram 重疊率)", "B": "Perplexity(困惑度)", "C": "Human evaluation / pairwise comparison(人類兩兩比較)", "D": "LLM-as-a-judge 搭配 rubric 評分"}, "correct_answer": "A", "source": {"file": "https://aclanthology.org/W18-5435/", "page": 1, "evidence": "Reiter (2018): BLEU correlates poorly with human judgments on open-ended generation tasks; should be avoided as the sole metric for tasks like dialogue or open QA."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** BLEU 只看 n-gram 重疊,對開放式任務不同表達同義無法評分,與人類判斷相關性低。\n\n**其他選項為何錯:**\n- A. ✓ 正解(最不可信)\n- B. PPL 用於語言建模本身的擬合度。\n- C. 人類評估金標準。\n- D. LLM-as-judge 為主流補強。\n\n**記憶要點:** 開放式生成評估:首選 Human + LLM-judge,BLEU/ROUGE 只能作參考。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q49", "topic": "GenAI/RAG", "question_text": "在 RAG pipeline 中,加入「Reranker(重排序模型,如 Cross-Encoder)」的主要效益為何?", "options": {"A": "降低向量資料庫儲存成本", "B": "對初步檢索(Bi-Encoder)的 Top-K 結果做更精細的相關性重排,提升精確度", "C": "完全取代向量檢索", "D": "減少 LLM 推論延遲"}, "correct_answer": "B", "source": {"file": "https://www.sbert.net/examples/applications/retrieve_rerank/README.html", "page": 1, "evidence": "Sentence-Transformers retrieve & re-rank: bi-encoder for fast retrieval, cross-encoder for re-ranking — cross-encoder is more accurate but slower, so applied only on top-K."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Reranker 通常是 Cross-Encoder,直接對 (query, doc) 對打分,精準但慢;故策略是「Bi-encoder 召回 Top-K → Cross-encoder 排序前 N」。\n\n**其他選項為何錯:**\n- A. 與儲存成本無關。\n- B. ✓ 正解\n- C. 不取代向量檢索。\n- D. Reranker 額外推論反而增加延遲。\n\n**記憶要點:** RAG 黃金組合:Retrieve(Bi-encoder)→ Re-rank(Cross-encoder)→ Generate。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-claude-s1-q50", "topic": "AI/Risk", "question_text": "歐盟 AI Act 將 AI 系統分為四個風險等級,下列哪一項「最可能」被歸類為「高風險(High-risk)」?", "options": {"A": "用於招募篩選履歷的 AI 系統", "B": "影音平台的個性化內容推薦", "C": "客服聊天機器人提供 FAQ", "D": "電子郵件垃圾信過濾"}, "correct_answer": "A", "source": {"file": "https://artificialintelligenceact.eu/high-level-summary/", "page": 1, "evidence": "EU AI Act Annex III lists high-risk AI use cases, including employment-related systems (CV screening, candidate ranking, performance evaluation)."}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** EU AI Act 將「就業、教育、信用、執法、關鍵基礎設施」等涉及人權與機會的決策列為高風險,履歷篩選正屬其中。\n\n**其他選項為何錯:**\n- B. 通常屬有限或最低風險。\n- C. 通常屬有限或最低風險。\n- D. 通常屬有限或最低風險。\n- A. ✓ 正解\n\n**記憶要點:** EU AI Act 風險等級:Unacceptable → High → Limited → Minimal;招募/信用/司法常屬 High。", "subject_code": "s1", "generated": true, "generated_by": "claude"}, {"id": "gen-codex-s1-q1", "topic": "NLP/Sentiment", "question_text": "某電商企業希望利用情感分析（Sentiment Analysis）追蹤新品上市後的社群留言，並在負面情緒升高時通知客服團隊。下列何者最符合此技術在該情境中的核心用途?", "options": {"A": "將每則留言翻譯成英文，以利海外團隊閱讀", "B": "判斷留言表達的是正面、負面或中立等情緒傾向", "C": "自動產生促銷圖片，提升商品點擊率", "D": "把顧客依購買金額分成不同價格區間"}, "correct_answer": "B", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 37, "evidence": "study-guide PDF p.37 說明情感分析用於辨識文本中的正面、負面或中立情緒。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 情感分析的重點是判斷文字中隱含的情緒傾向，可用於品牌監控與顧客回饋分析。\n\n**其他選項為何錯:**\n- A. 這是機器翻譯任務，不是情緒判斷。\n- B. ✓ 正解\n- C. 這屬於圖像生成或行銷素材生成，不是 oof of Concept, POC），下列設計何者最適合?", "options": {"A": "選一條具代表性且風險可控的產線，小範圍測試並收集效能與使用者回饋", "B": "直接全廠上線，避免浪費時間在驗證階段", "C": "只購買 GPU，不設定任何驗證目標", "D": "只要求外部廠商承諾成功，不提供測試資料"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 106, "evidence": "study-guide PDF p.106 說明 POC 應以小範圍、風險可控且具代表性的流程進行測試。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** POC 的價值在於用最小風險驗證技術、流程與組織可行性，代表性場景能支援後續擴展判斷。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 未經驗證直接全廠上線會放大風險。\n- C. 硬體採購不是 POC 目標設定。\n- D. 沒有資料與驗證條件，無法判斷導入可行性。\n\n**記憶要點:** POC 要小、可控、代表性強。", "subject_code": "s1", "generated": true, "generated_by": "codex"}, {"id": "gen-codex-s1-q31", "topic": "CV/Segmentation", "question_text": "某零售企業評估 AI 推薦系統，希望判斷投入成本是否值得。若使用投資報酬率（Return on Investment, ROI），下列哪一項最符合其用途?", "options": {"A": "衡量投資回報相對於投資成本的效益", "B": "衡量圖片分割框與真實框的重疊比例", "C": "衡量語音辨識錯字比例", "D": "衡量資料表欄位是否符合第三正規化"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 99, "evidence": "study-guide PDF p.99 說明 ROI 用來評估投資回報是否值得，公式為投資回報減投資成本後除以投資成本。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** ROI 是成本效益評估指標，用來量化 AI 導入後的經濟回報是否足以支持投資。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 重疊比例是 IOU，屬於視覺偵測或分割評估。\n- C. 語音錯字比例是 WER，不是 ROI。\n- D. 資料庫正規化與投資回報無關。\n\n**記憶要點:** ROI 問的是錢投下去值不值。", "subject_code": "s1", "generated": true, "generated_by": "codex"}, {"id": "gen-codex-s1-q32", "topic": "AI/Adoption", "question_text": "某企業主管想「先導入 AI 再找問題」，專案經理認為應先做使用案例選擇（Use-case Selection）。下列哪一項判斷最符合導入評估原則?", "options": {"A": "優先選擇重複性高、決策規則清晰且能連結 KPI 的業務流程", "B": "優先選擇資料完全不存在的流程，才能展示 AI 魔法", "C": "優先選擇最流行的模型，不必確認業務痛點", "D": "優先選擇不允許任何部門參與的流程"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 97, "evidence": "study-guide PDF p.97 說明 AI 導入應辨識具體問題，例如重複性高、決策規則清晰、數據驅動的流程。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 好的使用案例應從業務痛點與 KPI 出發，並具備可由 AI 介入改善的流程特性。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 沒有資料會讓技術可行性大 , "D": "只提高模型溫度參數，不處理資料授權"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 126, "evidence": "study-guide PDF p.126 說明未經授權使用第三方資料、演算法、模型或軟體工具可能產生智慧財產權與著作權侵權問題。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 生成式 AI 的訓練資料需確認授權與使用範圍，避免把受保護內容納入商業訓練流程。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 不記錄來源會削弱稽核與合規能力。\n- C. 字型改變不代表取得著作權授權。\n- D. 溫度參數不會解決訓練資料侵權問題。\n\n**記憶要點:** 版權風險先看資料有沒有授權。", "subject_code": "s1", "generated": true, "generated_by": "codex"}, {"id": "gen-codex-s1-q44", "topic": "AI/Risk", "question_text": "某銀行信用評分模型對特定年齡與族群的拒貸率異常偏高，稽核懷疑訓練資料含歷史偏見。下列何者最符合模型偏見（Model Bias）治理方向?", "options": {"A": "檢查資料分布、歷史偏見與標註偏見，並以公平性指標追蹤不同群體表現", "B": "只看整體準確率，只要平均分數高就不需處理", "C": "刪除所有稽核紀錄，避免模型被質疑", "D": "把所有被拒貸者標為同一類，以加快訓練"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 130, "evidence": "study-guide PDF p.130 說明模型偏見來源包含資料分布不均、歷史偏見與標註偏見，可能造成特定群體不公平。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 偏見治理不能只看整體平均，需檢查資料與標註來源，並比較不同群體的公平性表現。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 整體準確率可能掩蓋弱勢群體的不公平結果。\n- C. 刪除稽核紀錄會降低問責與治理能力。\n- D. 粗暴合併標籤會破壞資料品質與公平性分析。\n\n**記憶要點:** 模型公平性要分群看，不只看平均。", "subject_code": "s1", "generated": true, "generated_by": "codex"}, {"id": "gen-codex-s1-q45", "topic": "Data/Preprocessing", "question_text": "某電商企業整合 CRM 與訂單資料時，發現顧客年齡缺漏、交易紀錄重複且金額有極端異常值。下列哪一項資料清理（Data Cleaning）流程最適合?", "options": {"A": "處理缺失值、移除重複值，並用 Z-score 或 IQR 檢測異常值", "B": "直接把所有資料丟進模型，不做任何檢查", "C": "只更換模型名稱，不處理資料內容", "D": "把資料轉成圖片後刪除數值欄位"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 144, "evidence": "study-guide PDF p.144 說明資料清理包含缺失值處理、重複值清除與使用 Z-score 或 IQR 偵測異常值。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 缺漏、重複與異常是資料清理的核心問題，需先處理才能降低模型學習錯誤訊號的風險。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 不清理會讓模型受錯誤或雜訊資料影響。\n- C. 改模型名稱不會改善資料品質。\n- D. 轉成圖片會破壞原本可用的結構化資料。\n\n**記憶要點:** 建模前先清缺漏、重複、異常。", "subject_code": "s1", "generated": true, "generated_by": "codex"}, {"id": "gen-codex-s1-q46", "topic": "Data/Preprocessing", "question_text": "某金融公司建立交易風險模型前，要評估資料品質（Data Quality）。下列哪一組指標最符合資料品質檢核?", "options": {"A": "完整性、一致性、準確性、即時性與唯一性", "B": "圖片飽和度、音量、影片幀率與字幕字型", "C": "模型層數、GPU 品牌、鍵盤配置與螢幕亮度", "D": "員工喜好、會議長度、辦公室溫度與午餐價格"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 145, "evidence": "study-guide PDF p.145 說明資料品質指標包含完整性、一致性、準確性、即時性與唯一性。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 這些指標能檢查資料是否缺欄位、邏輯一致、反映真實世界、足夠新且沒有重複衝突。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 這些多為媒體屬性，不是交易資料品質核心指標。\n- C. 硬體與周邊配置不是資料品質指標。\n- D. 這些與金融交易風險資料品質無關。\n\n**記憶要點:** 資料品質五字訣：完整、一致、準確、即時、唯一。", "subject_code": "s1", "generated": true, "generated_by": "codex"}, {"id": "gen-codex-s1-q47", "topic": "Deploy/MLOps", "question_text": "某醫療影像團隊請多位醫師標註腫瘤邊界，但發現同一張影像的標註標準不一致。下列哪一項最能提升標註（Labeling）品質?", "options": {"A": "建立標註準則、定期品質檢查，必要時採雙重標註", "B": "取消所有標註規則，讓每位醫師自由發揮", "C": "只看檔案名稱，不檢查影像內容", "D": "把腫瘤影像全部標成正常，以減少工時"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 53, "evidence": "study-guide PDF p.53 說明標註準則須確保一致性與準確性，並可用品質控制或雙重標註提高準確性。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 影像標註的一致性會直接影響模型學習，標註準則與品質控制能降低標註偏差。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 缺乏規則會使標註結果更不一致。\n- C. 檔名無法代表影像中的病灶邊界。\n- D. 錯誤標註會嚴重破壞模型訓練。\n\n**記憶要點:** 標註品質靠準則、審查、必要時雙標。", "subject_code": "s1", "generated": true, "generated_by": "codex"}, {"id": "gen-codex-s1-q48", "topic": "Data/Augmentation", "question_text": "某零售影像模型訓練資料不足，團隊想提升模型對不同角度與光線的泛化能力。下列哪一項資料擴增（Data Augmentation）作法最符合影像任務?", "options": {"A": "在訓練時加入翻轉、旋轉、裁剪、模糊或色彩偏移等變化", "B": "刪除所有少數類別圖片，只保留最多的類別", "C": "把圖片檔名改長，讓模型學到更多語意", "D": "只調整資料庫連線數，不改變影像資料"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 53, "evidence": "study-guide PDF p.53 說明影像資料擴增包含翻轉、旋轉、裁剪、模糊、色彩偏移，可增強模型泛化能力並對抗過擬合。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 影像擴增能模擬合理視覺變化，讓模型不只記住訓練樣本，而能適應更多真實場景。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 刪除少數類別會加劇資料不平衡。\n- C. 改檔名不會增加影像視覺變化。\n- D. 資料庫連線數與影像泛化能力無直接關係。\n\n**記憶要點:** 影像資料少，合理變形來擴增。", "subject_code": "s1", "generated": true, "generated_by": "codex"}, {"id": "gen-codex-s1-q49", "topic": "NLP/Tokenization", "question_text": "某 AI 團隊要把同一個模型服務部署到測試、正式與備援環境，並希望依流量自動擴縮。下列哪一項容器（Containers）與編排設計最合理?", "options": {"A": "用 Docker 封裝依賴環境，並用 Kubernetes 進行資源調度、故障恢復與自動擴縮", "B": "只把程式複製到桌面資料夾，不記錄依賴版本", "C": "每次部署都手動安裝不同版本套件，讓環境自然演化", "D": "用文字分詞取代部署流程"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 157, "evidence": "study-guide PDF p.157 說明 Docker 可封裝應用與依賴環境，Kubernetes 可做容器編排、資源調度、故障恢復與自動擴縮。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 容器化能保持跨平台環境一致，Kubernetes 則負責大量容器的編排、擴縮與故障處理。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 不記錄依賴版本會造成部署不可重現。\n- C. 手動且不一致的環境會增加維運風險。\n- D. 文字分詞是 NLP 前處理，不是部署方法。\n\n**記憶要點:** Docker 管環境，Kubernetes 管容器群。", "subject_code": "s1", "generated": true, "generated_by": "codex"}, {"id": "gen-codex-s1-q50", "topic": "Data/Drift", "question_text": "某訂閱制服務的流失預測模型上線半年後，顧客行為改變使準確率下降。若要建立部署後監控與漂移（Monitoring / Drift）機制，下列哪一項最適合?", "options": {"A": "監控資料漂移與模型漂移，設定門檻並觸發再訓練流程", "B": "只要伺服器沒有當機，就不需要追蹤模型表現", "C": "刪除所有預測紀錄，避免發現問題", "D": "把模型固定永久不更新，確保版本不變"}, "correct_answer": "A", "source": {"file": "subjects/1-ai/study-guide.pdf", "page": 160, "evidence": "study-guide PDF p.160 說明模型部署後需監控模型漂移與資料漂移，並設定準確率下降等門檻啟動再訓練流程。"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** AI 模型上線後會面對資料型態與使用環境改變，需用監控和回饋機制偵測效能下降並更新模型。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 系統正常不代表模型預測仍準確。\n- C. 刪除紀錄會失去監控與稽核依據。\n- D. 永不更新會讓模型更難適應資料變化。\n\n**記憶要點:** 部署不是結束，漂移監控才是長期維運。", "subject_code": "s1", "generated": true, "generated_by": "codex"}, {"id": "exam-s2-114-2-q1", "topic": "Stats/Descriptive", "question_text": "若某數據點的 Z 分數(Z-Score)= 2,請問代表下列哪一種意涵?", "options": {"A": "代表該數據點之原始數值為 2", "B": "該數據點比平均值低 2 個標準差", "C": "代表數據為異常值", "D": "該數據點比平均值高 2 個標準差"}, "correct_answer": "D", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 1, "evidence": "answer column shows 'D' for question 1"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** Z 分數 = (X − μ) / σ,Z = 2 代表該數據點距平均值「正向」2 個標準差,即比平均值高 2 個標準差。\n\n**其他選項為何錯:**\n- A. Z 分數是標準化後的相對位置,非原始值。\n- B. 比平均值低應為負 Z,Z = −2 才表示低 2 個標準差。\n- C. 通常 |Z| ≥ 3 才視為異常值,Z = 2 仍在常見範圍。\n- D. ✓ 正解\n\n**記憶要點:** Z 分數正向 = 高於平均;|Z| ≥ 3 才常被當作 outlier。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q2", "topic": "Analytics/EDA", "question_text": "使用 Python 的 pandas 套件處理各商品銷售數據(變數為 df)時,若需計算「總銷售額」欄位的敘述性統計量(如平均值、標準差等),應使用下列哪一種語法?", "options": {"A": "df['總銷售額'].sum()", "B": "df['總銷售額'].describe()", "C": "df['總銷售額'].sort_values()", "D": "df['總銷售額'].stats()"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 1, "evidence": "answer column shows 'B' for question 2"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** pandas 的 `describe()` 會一次回傳 count、mean、std、min、25%、50%、75%、max 等敘述性統計量,正好符合題目需求。\n\n**其他選項為何錯:**\n- A. `sum()` 只回傳加總,不含平均與標準差。\n- B. ✓ 正解\n- C. `sort_values()` 是排序,與描述統計無關。\n- D. pandas 沒有 `stats()` 這個方法。\n\n**記憶要點:** 描述統計一鍵打包 → `describe()`。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q3", "topic": "Stats/Descriptive", "question_text": "[此題包含附圖:資料分佈直方圖,主要密度峰值集中在 30~45,左側尾部延伸至 −20] 附圖為某資料之分佈圖,此圖資料之偏態(Skewness)值較有可能為下列哪個選項?", "options": {"A": "Skewness < 0", "B": "Skewness > 0", "C": "Skewness = 0", "D": "無法計算 Skewness"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 1, "evidence": "answer column shows 'A' for question 3"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 圖中資料的「尾巴」拖向左側(負值方向),屬於左偏(負偏態),Skewness < 0。負偏態時平均數通常 < 中位數 < 眾數。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 右偏(Skewness > 0)時尾巴拉向右,與圖示相反。\n- C. Skewness = 0 表示完全對稱(如常態分佈),此圖明顯不對稱。\n- D. 只要有資料即可計算偏態。\n\n**記憶要點:** 尾巴向哪邊,偏態符號就跟著哪邊;左尾 → 負偏。", "image": "shared/images/exam-s2-114-2-q3-p1.png", "subject_code": "s2"}, {"id": "exam-s2-114-2-q4", "topic": "Stats/Probability", "question_text": "累積分佈函數(Cumulative Distribution Function, CDF)可用於描述隨機變數的機率分佈特性,其數學定義為下列何者?", "options": {"A": "機率密度函數(Probability Density Function, PDF)的平均值", "B": "機率密度函數(Probability Density Function, PDF)的積分", "C": "機率密度函數(Probability Density Function, PDF)的離散總和", "D": "機率密度函數(Probability Density Function, PDF)的標準差"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 1, "evidence": "answer column shows 'B' for question 4"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 對連續隨機變數,CDF(x) = ∫_{−∞}^{x} f(t) dt,亦即 PDF 從負無窮到 x 的積分,代表「X ≤ x 的機率」。\n\n**其他選項為何錯:**\n- A. PDF 的平均值不是 CDF 的定義。\n- B. ✓ 正解\n- C. 離散總和(Σ)是離散變數機率質量函數(PMF)的累積方式,非連續 PDF。\n- D. 標準差與 CDF 完全不同概念。\n\n**記憶要點:** 連續 → CDF = PDF 積分;離散 → CDF = PMF 累加。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q5", "topic": "FeatureEng", "question_text": "在進行資料前處理時,若使用 Label Encoding 將類別變數轉換為數字型態,下列何者為最常見的潛在風險?", "options": {"A": "無法處理缺值", "B": "會引入類別之間的虛假順序關係", "C": "無法擴展至新資料", "D": "記憶體佔用過高"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 2, "evidence": "answer column shows 'B' for question 5"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Label Encoding 將類別映射為整數(如紅=0、綠=1、藍=2),會讓模型誤判類別之間存在數值大小或順序關係,對無序(Nominal)資料尤其危險。\n\n**其他選項為何錯:**\n- A. 缺值處理是另一前處理步驟,不是 Label Encoding 特有問題。\n- B. ✓ 正解\n- C. 可以擴展,只要重新 fit/map。\n- D. Label Encoding 反而比 One-Hot 省記憶體。\n\n**記憶要點:** 無序類別 → 用 One-Hot;有序類別才適合 Label Encoding。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q6", "topic": "FeatureEng", "question_text": "在進行資料分析時,會遇到類別型(Categorical)與數值型(Numerical)資料格式。關於這兩種資料格式的處理,下列敘述何者不正確?", "options": {"A": "One-Hot 編碼(One-Hot Encoding)會將類別變數轉換為多維二元向量,適用於無序(Nominal)類別資料,但在高基數(High Cardinality)特徵下可能造成維度爆炸問題", "B": "標籤編碼(Label Encoding)會以整數表示不同類別,若應用於無序(Nominal)資料,可能導致模型誤將編碼值解讀為具數值大小關係的特徵", "C": "標準化(Standardization)透過將資料平移與縮放,使其平均值為 0、標準差為 1,可在多數距離型演算法中改善收斂速度,並同時將數值範圍壓縮至 0 至 1 之間", "D": "對連續變數進行分箱(Binning)可提升模型可解釋性,但若分段方式未依據資料分佈特性設計,可能導致資訊損失或邊界偏誤"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 2, "evidence": "answer column shows 'C' for question 6"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是錯誤(即為「不正確」的選項,故為正解):** 標準化(Z-score)只保證平均 0、標準差 1,並不會把數值壓縮至 [0, 1] 範圍;將值壓到 [0, 1] 是 Min-Max 正規化(Normalization)。\n\n**其他選項為何錯(此題找錯誤敘述):**\n- A. 描述正確:One-Hot 適用無序、但高基數會維度爆炸。\n- B. 描述正確:Label Encoding 用於無序資料會引入虛假順序。\n- C. ✓ 正解(此敘述錯誤)\n- D. 描述正確:分箱可增可解釋性,但邊界設計不當會損失資訊。\n\n**記憶要點:** Standardization → 均值 0、std 1;Normalization (Min-Max) → 0~1。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q7", "topic": "BigData/Storage", "question_text": "在資料庫的 ACID 特性中,下列何者為「原子性(Atomicity)」的正確定義?", "options": {"A": "所有資料欄位必須為相同型別", "B": "每次交易需以批次方式執行", "C": "交易不可分割,需完全成功或完全失敗", "D": "系統會自動同步交易資料至所有節點"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 2, "evidence": "answer column shows 'C' for question 7"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** Atomicity(原子性)指一個交易內的所有操作要麼全部成功提交(Commit),要麼全部回滾(Rollback)— 不允許部分成功的中間狀態。\n\n**其他選項為何錯:**\n- A. 與型別一致性無關。\n- B. 批次處理是執行方式,非 ACID 特性。\n- C. ✓ 正解\n- D. 多節點同步較接近 Consistency 或分散式系統的 Replication,而非原子性。\n\n**記憶要點:** ACID = Atomicity(全有全無)、Consistency、Isolation、Durability。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q8", "topic": "FeatureEng", "question_text": "資料科學家為分析顧客行為,利用現有欄位「銷售金額」與「瀏覽次數」,計算出新變數「銷售金額/瀏覽次數」。此動作屬於下列哪一類特徵工程方法?", "options": {"A": "特徵選擇(Feature Selection)", "B": "特徵衍生(Feature Derivation)", "C": "特徵轉換(Feature Transformation)", "D": "分箱處理(Binning)"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 2, "evidence": "answer column shows 'B' for question 8"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 由既有欄位透過運算(加減乘除、比率等)組合出新特徵,屬於特徵衍生(Feature Derivation / Feature Construction)。\n\n**其他選項為何錯:**\n- A. 特徵選擇是從現有特徵中挑出子集,不會產生新特徵。\n- B. ✓ 正解\n- C. 特徵轉換(如標準化、對數轉換)是改變既有特徵的表示形式,而非組合新欄位。\n- D. 分箱是把連續變數切成區間。\n\n**記憶要點:** 用舊欄位合成新欄位 → Derivation;從已有挑子集 → Selection。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q9", "topic": "FeatureEng", "question_text": "在進行數值特徵的標準化(Normalization)時,若資料中存在極端值(Outliers),下列哪一種方法最適合使用?", "options": {"A": "Min-Max 正規化(Min-Max Scaling)", "B": "Z-score 標準化(Z-score Normalization)", "C": "穩健縮放(Robust Scaling)", "D": "標準分箱(Standard Binning)"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 3, "evidence": "answer column shows 'C' for question 9"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** Robust Scaling 採用中位數與四分位距(IQR)作為中心與尺度,不受極端值影響,適用於含 outlier 的資料。\n\n**其他選項為何錯:**\n- A. Min-Max 直接受最大/最小值左右,極端值會把多數資料壓在很小區間。\n- B. Z-score 用平均數與標準差,極端值會嚴重拉動兩者。\n- C. ✓ 正解\n- D. 標準分箱並非處理 outlier 的縮放方法。\n\n**記憶要點:** 有 outlier → 用中位數/IQR 的 Robust Scaler。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q10", "topic": "Analytics/Methods", "question_text": "下列哪一種情境最適合應用異常偵測(Anomaly Detection)技術?", "options": {"A": "根據歷史銷售資料預測特定商品在旺季期間是否會出現供貨短缺,以提前調整庫存策略", "B": "透過信用風險模型預測顧客是否可能發生違約,以輔助核貸決策", "C": "即時分析金融交易資料流,偵測與平常交易行為明顯不同的可疑交易紀錄", "D": "監控線上服務平台的使用者登入次數,預測次日的登入量變化趨勢"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 3, "evidence": "answer column shows 'C' for question 10"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** 異常偵測的目標就是識別「與常態行為顯著不同」的資料點;即時偵測可疑交易正是其經典應用(信用卡盜刷、洗錢偵測)。\n\n**其他選項為何錯:**\n- A. 屬於需求/銷售預測(Regression/Forecasting)。\n- B. 屬於違約分類(Classification)。\n- C. ✓ 正解\n- D. 屬於時間序列預測。\n\n**記憶要點:** 找「異常少數」→ Anomaly Detection;預測「未來數值」→ Forecasting/Regression。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q11", "topic": "BigData/Processing", "question_text": "若一家公司需即時監控大量物聯網裝置的異常行為,下列哪一種組合最適合此應用?", "options": {"A": "傳統關聯式資料庫+圖形視覺化", "B": "批次資料處理+雲端備份", "C": "大數據平台+即時資料分析技術", "D": "Word 文件+手動標註"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 3, "evidence": "answer column shows 'C' for question 11"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** 大量 IoT 裝置產生高速資料流,需要可橫向擴展的大數據平台搭配串流(Stream)即時分析技術(如 Kafka + Spark Streaming / Flink)才能即時偵測異常。\n\n**其他選項為何錯:**\n- A. 傳統 RDBMS 難以承受高吞吐串流。\n- B. 批次處理無法達到「即時」。\n- C. ✓ 正解\n- D. 手動方式完全不符規模需求。\n\n**記憶要點:** 即時 + 大量 = 串流式大數據平台。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q12", "topic": "Analytics/Methods", "question_text": "在處理分類問題時,若某一類樣本數明顯少於其他類別,研究人員可採用隨機過採樣(Random Oversampling)以平衡資料比例,此方法最常造成下列哪一種問題?", "options": {"A": "增加過擬合風險", "B": "降低模型的收斂速度", "C": "減少資料總筆數數量", "D": "導致訓練資料欄位缺失"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 3, "evidence": "answer column shows 'A' for question 12"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Random Oversampling 直接重複複製少數類樣本,模型可能對這些重複樣本「死記」,導致對訓練資料過擬合(Overfitting)。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 樣本數增加未必明顯影響收斂速度。\n- C. 過採樣是增加樣本,不是減少。\n- D. 不會造成欄位缺失。\n\n**記憶要點:** 過採樣 → 過擬合風險高;改用 SMOTE 合成樣本可緩解。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q13", "topic": "Privacy", "question_text": "下列何者為同態加密(Homomorphic Encryption)技術的核心特性?", "options": {"A": "將資料轉換為匿名識別碼以隱藏身分", "B": "對資料進行標準化處理以提升模型精度", "C": "自動偵測與排除異常值", "D": "可直接在加密狀態下進行數據運算"}, "correct_answer": "D", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 3, "evidence": "answer column shows 'D' for question 13"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** 同態加密的核心就是允許在密文(加密狀態)上直接執行運算,解密後得到的結果等同於在明文上運算的結果;適用於雲端計算的隱私保護。\n\n**其他選項為何錯:**\n- A. 匿名化(Anonymization)的範疇,不是同態加密。\n- B. 與加密無關。\n- C. 與加密無關。\n- D. ✓ 正解\n\n**記憶要點:** Homomorphic = 在加密上算,結果可解;隱私計算的明星技術。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q14", "topic": "Analytics/Methods", "question_text": "某組資料共 10 項標籤如下:A, A, A, A, A, B, B, B, B, B。若該標籤僅有 A、B 兩種,請問這組資料的「正規化吉尼不純度(Normalized Gini impurity)」為何?", "options": {"A": "0", "B": "0.42", "C": "0.84", "D": "1"}, "correct_answer": "D", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 4, "evidence": "answer column shows 'D' for question 14"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** 吉尼不純度 = 1 − Σpᵢ²。此處 p_A = p_B = 0.5,Gini = 1 − (0.25 + 0.25) = 0.5,為二類問題的最大值。「正規化」是除以最大可能 Gini,所以正規化後 Gini = 0.5 / 0.5 = 1,代表純度最差(完全均勻)。\n\n**其他選項為何錯:**\n- A. 0 代表完全純淨(只有一類),不符題意。\n- B. 此值未對應任何標準計算結果。\n- C. 此值未對應任何標準計算結果。\n- D. ✓ 正解\n\n**記憶要點:** 兩類各半 → Gini = 0.5(最大值);正規化後最大不純度 = 1。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q15", "topic": "Stats/Probability", "question_text": "某客服中心統計資料發現,平均每小時會接到約 20 通顧客來電,但每分鐘的來電數量不固定,可能為 0、1、2 通不等。這些來電事件彼此獨立,且在短時間內,發生的機率與時間長短成正比。若要以機率模型描述「每分鐘接到幾通來電」的機率分佈,下列哪一種最適合使用?", "options": {"A": "均勻分佈(Uniform distribution)", "B": "指數分佈(Exponential distribution)", "C": "卜瓦松分佈(Poisson distribution)", "D": "常態分佈(Normal distribution)"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 4, "evidence": "answer column shows 'C' for question 15"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** 卜瓦松分佈描述「單位時間內事件發生次數」,條件:事件獨立、平均發生率固定、機率與時間長度成正比 — 完全符合題目情境。\n\n**其他選項為何錯:**\n- A. 均勻分佈各值機率相等,不適合計數型事件。\n- B. 指數分佈描述「事件間的等待時間」(連續),不是「次數」。\n- C. ✓ 正解\n- D. 常態為連續對稱分佈,描述計數仍偏離本質(雖然 λ 大時可近似)。\n\n**記憶要點:** 計數 → Poisson;間隔時間 → Exponential。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q16", "topic": "Stats/Descriptive", "question_text": "某金融科技公司以 Z 分數(Z-Score)監控交易金額異常狀況。若交易金額平均為新台幣 2,000 元,標準差為 400 元,某筆交易金額為 3,200 元,且公司以|Z| ≥ 3 判定為異常值(Outlier),下列判斷何者最為正確?", "options": {"A": "該筆交易的 Z 分數為 3,應標記為異常值", "B": "該筆交易的 Z 分數為 2.5,屬於合理變異範圍", "C": "該筆交易的 Z 分數為 2,顯示模型標準差估計過高", "D": "該筆交易的 Z 分數為 1.5,無須納入異常檢測"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 4, "evidence": "answer column shows 'A' for question 16"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** Z = (3200 − 2000) / 400 = 1200 / 400 = 3。依公司規則 |Z| ≥ 3 即視為異常值。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 算錯,正確為 3。\n- C. 算錯,正確為 3。\n- D. 算錯,正確為 3。\n\n**記憶要點:** Z = (X − μ) / σ;直接套公式即可。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q17", "topic": "FeatureEng", "question_text": "某電商公司欲利用顧客行為資料建立消費預測模型,其中「會員等級」欄位包含「一般、白金、黑卡」三種類別。若模型採用梯度提升樹(Gradient Boosting Tree)演算法,資料科學家在進行特徵編碼時應特別注意下列何種情況?", "options": {"A": "應優先採用獨熱編碼(One-Hot Encoding),以減少類別之間的相依性與記憶體使用量", "B": "直接使用標籤編碼(Label Encoding)可能使模型誤判類別間存在順序關係,導致特徵重要性偏誤", "C": "使用目標編碼(Target Encoding)會自動消除過擬合(Overfitting)風險", "D": "若類別數量較少,建議先使用主成分分析(Principal Component Analysis, PCA)進行降維"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 4, "evidence": "answer column shows 'B' for question 17"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 「一般/白金/黑卡」本身有等級語意,但若直接用 Label Encoding 任意映射為 0/1/2,GBT 會把數值差視為有意義的順序與大小,導致分裂條件與特徵重要性失真。\n\n**其他選項為何錯:**\n- A. One-Hot 不會「減少相依性與記憶體」;反而會增加維度。\n- B. ✓ 正解\n- C. Target Encoding 反而容易過擬合,並非「自動消除」。\n- D. 類別數少不需要 PCA,且 PCA 用於連續變數降維。\n\n**記憶要點:** 樹模型 + 無序類別 → 用 One-Hot 或 Ordinal 明確指定順序,避免 Label 隱含錯誤排序。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q18", "topic": "BigData/Storage", "question_text": "某人工智慧團隊使用分散式資料庫(Distributed Database)儲存模型訓練資料,並在更新訓練樣本時啟用多節點交易。若其中一個節點在交易過程中發生錯誤,但系統仍確保整體資料不會出現部分更新、最終狀態維持一致,下列何者最能說明此現象?", "options": {"A": "系統透過原子性(Atomicity)確保交易必須全部成功或全部回復(Rollback)", "B": "系統透過一致性(Consistency)確保交易完成後資料符合完整性規則", "C": "系統透過隔離(Isolation)避免多筆交易同時存取或修改相同資料", "D": "系統透過持久性(Durability)確保交易一旦提交,其結果將永久保留於資料庫中"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 5, "evidence": "answer column shows 'A' for question 18"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 題目強調「部分更新不會出現、整體 all-or-nothing」— 這正是原子性(Atomicity)的定義:交易要嘛全部成功提交,要嘛全部回滾。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. Consistency 強調符合完整性約束(如外鍵、唯一性),非「部分成功」議題。\n- C. Isolation 處理並發交易互相干擾的問題。\n- D. Durability 保證提交後即便當機也不會遺失。\n\n**記憶要點:** All-or-nothing = Atomicity。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q19", "topic": "BigData/Processing", "question_text": "某製造企業導入上萬台物聯網(IoT)感測器以進行設備健康監測。系統需在毫秒級回應異常事件,並同時將完整資料保留於雲端供後續 AI 模型訓練與分析。若企業希望兼顧即時性、資料完整性與可擴展性,下列哪一種資料流程設計最符合此目標?", "options": {"A": "感測器 → 雲端 API Gateway → 分散式資料庫 → 批次特徵工程 → 模型推論", "B": "感測器 → MQTT Broker → 雲端資料倉儲 → 即時儀表板 → 模型再訓練", "C": "感測器 → 邊緣運算節點 → 流式資料處理框架(Stream Processing Framework)→ 雲端資料湖 → 模型推論", "D": "感測器 → 本地快取層 → RESTful API → 雲端報表系統 → 模型批次更新"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 5, "evidence": "answer column shows 'C' for question 19"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** 「邊緣運算 + 流式處理 + 資料湖」三者搭配兼顧低延遲(邊緣減少網路 round trip)、即時分析(stream framework 如 Flink/Spark Streaming)與完整原始資料保留(資料湖儲存所有歷史),具備可擴展性。\n\n**其他選項為何錯:**\n- A. 批次特徵工程無法毫秒級回應。\n- B. 資料倉儲偏結構化,且需經 ETL,延遲較高。\n- C. ✓ 正解\n- D. REST 批次更新無法即時。\n\n**記憶要點:** IoT 即時 → Edge + Stream Processing + Data Lake。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q20", "topic": "Privacy", "question_text": "某銀行計畫將信用風險評估模型部署至雲端平台,以便即時分析客戶交易行為。由於涉及大量敏感金融資料,銀行要求雲端服務商在不解密原始資料的情況下仍能執行模型運算。為達成此目標,最適合採用下列哪一項技術?", "options": {"A": "在上傳資料前進行匿名化(Anonymization),僅保留可識別代碼供比對使用", "B": "利用雜湊(Hash)函數轉換資料,以確保模型可追蹤但無法還原個資", "C": "採用資料本地化(Data Localization)策略,將所有模型訓練限制於內部伺服器中", "D": "透過同態加密(Homomorphic Encryption),讓雲端系統能直接在加密資料上執行運算,解密後結果與原始資料一致"}, "correct_answer": "D", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 5, "evidence": "answer column shows 'D' for question 20"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** 題目要求「雲端不解密就能運算」,正是同態加密的核心能力 — 在密文上做加法/乘法,解密後等於明文運算結果。\n\n**其他選項為何錯:**\n- A. 匿名化資料雖去除身分,但雲端仍以「明文」運算。\n- B. Hash 是單向,無法回復,也無法作模型運算的輸入。\n- C. 本地化等於不上雲,不符題目「部署至雲端」。\n- D. ✓ 正解\n\n**記憶要點:** 雲端 + 不解密 + 算 → Homomorphic Encryption。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q21", "topic": "Viz/Tools", "question_text": "某資料分析師設計在業務績效報告時,希望單一頁面中同時呈現多區域、不同產品線的銷售趨勢變化,並確保主管能在短時間內掌握整體資料走向。若依據 Edward Rolf Tufte 的數據密度(Data Density)原則,下列哪一種設計方式最能符合該概念?", "options": {"A": "將每個區域的銷售資料分成多張獨立折線圖,以避免資訊重疊", "B": "使用顏色區分產品線,於同一圖表中整合多區域趨勢線,保持比例一致且標註清晰", "C": "移除所有輔助線與標籤,僅保留主要折線以凸顯趨勢", "D": "將資料轉換為表格形式,確保數值精確呈現並取代圖表視覺化"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 6, "evidence": "answer column shows 'B' for question 21"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Tufte 的 Data Density 原則強調「在有限版面中傳達盡可能多的有效資訊」,以顏色區分產品線、同圖整合多區域趨勢,正好提高資訊密度且保留比較性。\n\n**其他選項為何錯:**\n- A. 拆成多張小圖反而降低資料密度與比較性。\n- B. ✓ 正解\n- C. 移除標籤會犧牲可讀性,違反「資料-墨水比」原則的另一面向。\n- D. 表格無法快速傳達趨勢,違反高效視覺化目標。\n\n**記憶要點:** Data Density = 在同一個視覺空間中,擠進更多有效資訊。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q22", "topic": "Viz/Tools", "question_text": "某投資研究員希望分析四檔科技股(A、B、C、D)每日報酬率的變化趨勢,以判斷這些股票之間是否存在高度相關性與共變動性,並評估投資組合分散風險的程度。若研究員希望以單一圖表快速呈現各股票間的關聯強度與方向,下列哪一種視覺化呈現方式最適合?", "options": {"A": "為每檔股票各自繪製直方圖(Histogram)以比較報酬率分佈", "B": "針對任兩股股票繪製散佈圖並加上趨勢線(Regression Line)", "C": "使用雙軸折線圖(Dual-axis Line Chart)同時顯示四檔股價變化", "D": "熱力圖(Heatmap)配合相關係數矩陣(Correlation Matrix)"}, "correct_answer": "D", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 6, "evidence": "answer column shows 'D' for question 22"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** 多檔股票兩兩之間的相關性,正是用相關係數矩陣計算 + 熱力圖呈現的典型情境;一張圖即可看出所有配對的強度與正負方向。\n\n**其他選項為何錯:**\n- A. 直方圖只看單一變數的分佈,不顯示兩兩關聯。\n- B. 兩兩散佈圖需要 C(4,2)=6 張圖,不夠精簡。\n- C. 雙軸圖只能比較兩條時間序列。\n- D. ✓ 正解\n\n**記憶要點:** 多變數兩兩相關 → Correlation Heatmap。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q23", "topic": "Stats/Hypothesis", "question_text": "某研究團隊以單樣本 t 檢定(one-sample t-test)檢驗「新行銷策略後的平均月銷售額是否與原本的 100 萬元不同」,顯著水準設定為 α=0.05。檢定結果顯示:p 值為 0.08,且 95% 信賴區間為 [95 萬元, 108 萬元]。根據上述結果,下列敘述何者正確?", "options": {"A": "因 p 值 < 0.05,可拒絕虛無假設", "B": "若顯著水準改為 0.10,仍不顯著", "C": "因 100 萬元落在信賴區間內,無法拒絕虛無假設", "D": "信賴區間寬度僅與顯著水準有關"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 6, "evidence": "answer column shows 'C' for question 23"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** 95% 信賴區間 [95, 108] 包含 100,代表在 α=0.05 下無法拒絕「均值=100」的虛無假設;這與 p=0.08 > 0.05 的結論一致。\n\n**其他選項為何錯:**\n- A. p=0.08 ≥ 0.05,不能拒絕。\n- B. p=0.08 < 0.10,改用 α=0.10 反而會顯著。\n- C. ✓ 正解\n- D. 信賴區間寬度還與樣本變異、樣本數有關,不只顯著水準。\n\n**記憶要點:** 假設值落在 CI 內 ⇔ 對應雙尾檢定不顯著。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q24", "topic": "BigData/Storage", "question_text": "某企業建置生成式 AI 系統,利用大量客服紀錄與產品評論資料訓練語言模型,以自動生成客服回覆與知識摘要。由於資料來源多樣,且包含非結構化文字、影像與表格資訊,團隊希望在不降低模型效能的前提下,提升資料處理效率與一致性,下列哪一種資料處理策略最適合?", "options": {"A": "建立資料湖(Data Lake)架構,並以 Apache Spark 或 Ray 進行分散式資料預處理與特徵抽取,再串接至模型訓練管線(Pipeline)", "B": "採用單節點高效能伺服器搭配批次處理模式,集中執行資料清理與格式轉換", "C": "將所有文字資料轉換為向量,並以資料庫索引方式直接餵入語言模型訓練", "D": "使用生成式模型先行自動清理資料內容,再將結果輸入至下游訓練流程"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 6, "evidence": "answer column shows 'A' for question 24"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 資料湖適合儲存「異質、非結構化」大量資料;Spark / Ray 提供水平擴展的分散式處理框架,可高效預處理與特徵抽取後串接訓練。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 單節點無法擴展、效率受限。\n- C. 索引並非餵入訓練的方式,且跳過清理步驟。\n- D. 用生成式模型「自動清理」風險高,且不解決規模問題。\n\n**記憶要點:** 異質大資料 → Data Lake + 分散式處理框架(Spark/Ray)。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q25", "topic": "Viz/Tools", "question_text": "某電商資料團隊繪製顧客單筆消費金額的箱型圖後發現:四分位距(IQR)範圍極小,但上鬚線拉得很長,且在高金額區域有多筆離群值。若希望協助行銷部門依據消費層級設計分群策略,下列哪一種視覺化方式最有助於凸顯不同消費層級間的差異?", "options": {"A": "以對數刻度繪製箱型圖或長條圖,放大高金額消費族群的變化差異", "B": "移除所有離群值,確保資料呈現集中分布", "C": "採用等距分箱(Equal-Width Binning)方式分群", "D": "改以折線圖(Line Chart)觀察時間變化趨勢"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 7, "evidence": "answer column shows 'A' for question 25"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 右偏(長尾)且 IQR 很小的資料,線性刻度會把多數樣本擠在一起、高金額點散布在很遠處;改用對數刻度可均衡視覺空間,凸顯各消費層級的差異。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 移除高金額顧客等於丟失重要分群資訊。\n- C. 等距分箱對長尾分佈會讓多數高頻區擠在第一個箱。\n- D. 折線圖看時間趨勢,與消費分群目的不符。\n\n**記憶要點:** 長尾資料(右偏)→ 對數刻度視覺化。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q26", "topic": "Analytics/Methods", "question_text": "某串流影音平台運用關聯規則學習(Association Rule Learning)分析用戶的觀影行為,發現若使用者觀看了科幻影集,則有較高機率接著觀看超級英雄電影。分析顯示,同時觀看這兩種類型的使用者約佔全部觀影紀錄的 12%,而觀看科幻影集的使用者中,有 50% 也觀看了超級英雄電影,該規則的提升度(Lift)為 1.8。根據上述資訊,下列哪一項推論最為正確?", "options": {"A": "支持度(Support)過低,代表此規則不具任何商業價值", "B": "提升度(Lift)大於 1 表示兩種類型內容無關,僅屬於隨機重疊", "C": "信賴度(Confidence)為 50%,代表觀看科幻影集者有明顯傾向觀看超級英雄電影", "D": "同時觀看比例僅 12%,代表兩種類型互相排斥"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 7, "evidence": "answer column shows 'C' for question 26"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** Confidence(A→B) = P(B|A) = 50% 表示看了科幻影集的人中,有一半也看了超級英雄電影,顯示明顯傾向。\n\n**其他選項為何錯:**\n- A. 12% support 並不算過低,亦未必無商業價值。\n- B. Lift > 1 表示正相關(超過獨立假設),不是無關。\n- C. ✓ 正解\n- D. 12% 同時觀看 + Lift 1.8,顯示兩類正相關,並非互斥。\n\n**記憶要點:** Support = 同時發生的比例;Confidence = 條件機率;Lift > 1 = 正相關。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q27", "topic": "BigData/Processing", "question_text": "某金融科技公司分析每日上億筆交易資料,以監控客戶轉帳金額分佈與異常波動。由於資料量極大,為兼顧效率與準確度,團隊決定採用「近似分位數(Approximate Quantile)」方法進行資料摘要統計。下列何者最能正確反映該技術的核心目的?", "options": {"A": "確保每個分位值的結果完全精確,即使計算時間較長", "B": "利用機器學習模型預測分位數位置,以減少統計計算量", "C": "僅能對結構化資料進行批次處理,無法應用於即時資料流", "D": "在可容忍誤差範圍內,快速估算分位值以支援即時分析"}, "correct_answer": "D", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 7, "evidence": "answer column shows 'D' for question 27"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** 大規模資料計算精確分位數需排序整體資料,代價高昂;近似分位數演算法(如 t-digest、GK)以「可控誤差」換取「線性時間 + 串流處理」,專為即時/巨量分析設計。\n\n**其他選項為何錯:**\n- A. 完全精確正是近似法所放棄的目標。\n- B. 與機器學習預測無關。\n- C. 近似分位數正是為串流而生。\n- D. ✓ 正解\n\n**記憶要點:** 近似分位數 = 用一點誤差換速度與可擴展性。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q28", "topic": "Analytics/Methods", "question_text": "若在高維度(>500 維)的資料上應用 DBSCAN(Density-Based Spatial Clustering of Applications with Noise)演算法,卻發現所有資料點皆被判定為雜訊(Noise),下列何者為最有可能的原因?", "options": {"A": "高維下距離變化趨同,導致 ε(Epsilon)閾值選擇失效", "B": "使用錯誤的距離函數(Distance Function)", "C": "MinPts 參數設得太小", "D": "資料過度標準化導致特徵消失"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 8, "evidence": "answer column shows 'A' for question 28"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 維度詛咒(Curse of Dimensionality)使高維空間中所有點對的距離趨於均勻,DBSCAN 賴以判定密度的 ε 閾值幾乎找不到合適值,所有點都成為孤立 → 全被判為雜訊。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 距離函數錯誤通常產生奇怪聚類,而非「全是雜訊」。\n- C. MinPts 太小反而更容易形成核心點,結果應該相反。\n- D. 標準化不會讓特徵消失。\n\n**記憶要點:** 高維 + 密度聚類 → 距離趨同、ε 失效是首要嫌疑;高維可先降維(PCA、UMAP)再用 DBSCAN。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q29", "topic": "FeatureEng", "question_text": "某團隊在開發風險評估模型時,使用主成分分析(Principal Component Analysis, PCA)進行降維。輸入資料包含三個數值欄位:「交易金額(單位:新台幣)」、「交易次數(次/月)」與「年齡(歲)」,其數值量級分別約為 10⁵、10¹ 與 10²。分析人員直接將原始數據帶入 PCA,結果第一主成分(PC1)幾乎完全由「交易金額」主導。下列哪一項作法或判斷最合理?", "options": {"A": "這是正常現象,金額本身變異較大,應主導主成分", "B": "若改用特徵選擇法,可自動解決變數量級問題", "C": "可刪除「交易金額」欄位以平衡各主成分的影響", "D": "在進行 PCA 前應預先進行標準化(Standardization),以避免因數值尺度差異造成特徵偏誤"}, "correct_answer": "D", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 8, "evidence": "answer column shows 'D' for question 29"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** PCA 是基於變異數的線性投影,變異越大的特徵越主導主成分。若不同特徵量級差異巨大(10⁵ vs 10¹),量級大的會壟斷 PC1。標準化(Z-score)讓每個特徵 std=1 後再做 PCA 才公平。\n\n**其他選項為何錯:**\n- A. 不該由「單位差異」決定主成分,這是偏誤。\n- B. 特徵選擇不解決尺度問題。\n- C. 直接刪除有價值的欄位是錯誤對策。\n- D. ✓ 正解\n\n**記憶要點:** PCA 前一定要標準化;否則大尺度特徵會偷走主成分。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q30", "topic": "Stats/Regression", "question_text": "某行銷團隊想了解「廣告預算」與「銷售金額」之間的關聯程度。經繪製散佈圖後發現兩者呈明顯線性趨勢,且資料中無明顯離群值(Outliers)。若希望衡量兩者之間線性關係的強度與方向,下列哪一種方法最適合?", "options": {"A": "均方根誤差(Root Mean Squared Error, RMSE)", "B": "共變異數(Covariance)", "C": "皮爾森相關係數(Pearson Correlation Coefficient)", "D": "平均絕對誤差(Mean Absolute Error, MAE)"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 8, "evidence": "answer column shows 'C' for question 30"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** Pearson 相關係數 r ∈ [−1, 1] 提供「強度」(絕對值)與「方向」(正負號)兩種資訊,正是衡量線性關係的標準工具。\n\n**其他選項為何錯:**\n- A. RMSE 是預測誤差,非關聯強度。\n- B. Covariance 雖反映方向但其值受單位影響,無法直接判斷強度。\n- C. ✓ 正解\n- D. MAE 同樣是誤差指標。\n\n**記憶要點:** 線性關聯強度+方向 → Pearson r;Covariance 除以兩變數的 std 即得 Pearson。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q31", "topic": "Stats/Probability", "question_text": "某電商團隊觀察到,每位顧客對廣告推播的點擊行為可視為一次伯努利試驗(Bernoulli Trial),單次點擊成功機率為 p=0.4。當推播對象擴增至 5,000 位顧客時,團隊想快速預估「成功點擊總數」的分佈情形,以進行模型效能模擬與預測。若希望以常態分佈(Normal Distribution)近似原始分佈,下列哪一項判斷最為合理?", "options": {"A": "因樣本數極大,可直接以常態分佈近似二項分佈(Binomial Distribution)", "B": "只有當 np 與 n(1−p) 皆大於 5 時,才能以常態分佈作近似", "C": "常態近似只適用於 p=0.5 的情況", "D": "無論樣本數多大,二項分佈都不能以常態分佈近似"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 8, "evidence": "answer column shows 'B' for question 31"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Binomial → Normal 近似的常見經驗法則(De Moivre–Laplace 定理)要求 np ≥ 5 且 n(1−p) ≥ 5(部分教材用 ≥ 10),避免分佈過於偏斜。\n\n**其他選項為何錯:**\n- A. 樣本數大也要看 p 是否極端(極端時偏態強)。\n- B. ✓ 正解\n- C. p=0.5 對稱性最好,但不是唯一可近似條件。\n- D. 大 n 配合條件成立時可近似。\n\n**記憶要點:** Binomial → Normal 近似條件:np ≥ 5 且 n(1−p) ≥ 5。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q32", "topic": "Privacy", "question_text": "某電信公司導入生成式 AI 客服系統,利用過去對話紀錄與用戶行為資料訓練語言模型,在資料治理與合規審查過程中,團隊發現模型可能會在回答中生成包含真實姓名、電話或交易資訊的內容。為確保系統符合個資法及生成式 AI 的安全與隱私要求,下列哪一項作法最符合實務可行及法規原則?", "options": {"A": "在訓練資料前進行資料匿名化(Anonymization)或偽匿名化(Pseudonymization)處理,並建立輸出內容稽核機制", "B": "改以強化學習(Reinforcement Learning)微調模型,使模型學會避免產出真實資訊", "C": "採用同態加密(Homomorphic Encryption)以加密所有文字輸入,確保模型無法辨識任何個資", "D": "僅設定模型回覆時不顯示用戶姓名,即可視為隱私防護完成"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 9, "evidence": "answer column shows 'A' for question 32"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 隱私防護的最佳實務是「source 端去識別 + 輸出端稽核」雙層;在訓練前匿名化/偽匿名化可從源頭降低洩漏風險,加上輸出稽核可防範生成幻覺式洩漏。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. RL 無法保證避免洩漏,且需 reward 設計,難以稽核。\n- C. 同態加密用於計算過程的密文運算,不適合語言模型訓練的非結構化文字。\n- D. 只遮姓名不夠,電話、交易資訊仍會洩漏。\n\n**記憶要點:** 隱私 = Source 端去識別 + Output 端稽核,單一層級不足。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q33", "topic": "Stats/Hypothesis", "question_text": "某金融機構的量化分析師在建立資產風險評估模型時,發現報酬率資料分佈明顯非對稱,且出現多次極端損失事件,使得傳統假設常態分佈的模型無法準確反映真實風險。若希望在不依賴常態分佈假設的前提下,採取更能捕捉資料極端情況的建模策略,下列哪一種方法最為合適?", "options": {"A": "採用線性迴歸模型(Linear Regression Model),以常態分佈殘差(Residuals)為基礎進行推估", "B": "使用平均數(Mean)與標準差(Standard Deviation)估計波動範圍", "C": "將資料裁剪至 ±3σ 範圍內以排除異常值影響", "D": "採用分位數迴歸模型(Quantile Regression Model),聚焦於尾部分位(Tail Quantiles)以評估極端風險"}, "correct_answer": "D", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 9, "evidence": "answer column shows 'D' for question 33"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** 分位數迴歸不假設殘差為常態,可針對任意分位(如 0.05、0.95)建模,適合極端尾部風險(如 VaR、CVaR)分析。\n\n**其他選項為何錯:**\n- A. 仍依賴常態殘差假設。\n- B. Mean/Std 在非常態與重尾下無法反映尾部風險。\n- C. 裁剪極端值反而會掩蓋風險。\n- D. ✓ 正解\n\n**記憶要點:** 重尾、不對稱 → Quantile Regression;傳統 OLS 假設殘差常態且同方差。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q34", "topic": "BigData/Storage", "question_text": "在圖形資料庫(Graph Database)中建模社群平台資料時,若每筆「按讚」行為都包含時間戳記(Timestamp)與裝置類型(Device Type)等資訊。若希望同時保留使用者與貼文之間的互動關係,並能有效查詢「按讚」的行為屬性,下列哪一種設計方式最為合適?", "options": {"A": "將「按讚」視為節點(Node),與使用者建立邊(Edge)", "B": "將「按讚」資訊作為邊的屬性(Property)儲存,連結使用者與被按讚的貼文節點", "C": "把「按讚」資訊直接寫入使用者節點中作為屬性", "D": "建立「按讚紀錄表」並將資料存入關聯式資料庫"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 9, "evidence": "answer column shows 'B' for question 34"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 圖資料庫的典型建模:使用者 -[LIKED {timestamp, device}]→ 貼文。把「按讚」當邊、把時間/裝置作邊的屬性,既保留關係又支援屬性查詢。\n\n**其他選項為何錯:**\n- A. 將「按讚」做成節點會多一層 hop,查詢與儲存效率較差(雖然可行)。\n- B. ✓ 正解\n- C. 寫入使用者節點失去「按了哪則貼文」的關聯。\n- D. 用 RDBMS 違背使用圖資料庫的初衷。\n\n**記憶要點:** 圖建模:節點 = 實體,邊 = 關係,邊屬性 = 關係的細節。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q35", "topic": "BigData/Storage", "question_text": "某企業欲建構知識圖譜(Knowledge Graph),以整合內部的研究報告、專利資料與專家知識,並支援語意查詢與關聯推理。若希望模型能具備良好的語意擴展性與高效推理能力,下列哪一種圖模型設計最為合適?", "options": {"A": "僅以節點(Node)與邊(Edge)表示,所有資訊存放於節點屬性中", "B": "將資料結構建為 RDF(Resource Description Framework)三元組(Subject-Predicate-Object)", "C": "使用文件型資料庫儲存內容,並以標籤(Tag)連接節點", "D": "採用關聯式資料庫儲存對應關係,並搭配預建索引加速查詢"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 9, "evidence": "answer column shows 'B' for question 35"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** RDF 三元組(主語-謂詞-賓語)是知識圖譜的標準資料模型,搭配 OWL/RDFS 等本體論可進行語意推理,且生態工具(SPARQL、Reasoner)成熟。\n\n**其他選項為何錯:**\n- A. 純屬性圖難以做語意推理,擴展性有限。\n- B. ✓ 正解\n- C. 文件型 NoSQL 不適合複雜關聯推理。\n- D. RDBMS join 在多跳關聯查詢上效率差。\n\n**記憶要點:** 知識圖譜的標準資料模型 = RDF 三元組;查詢語言 = SPARQL。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q36", "topic": "Stats/Regression", "question_text": "某研究人員欲使用線性迴歸模型(Linear Regression Model)分析變數 Y 與 X 之間的關係,但發現 Y 的分佈明顯右偏,且其變異數隨 X 的增大而增加。為滿足模型假設並提升配適效果,下列哪一種前處理方法最為合適?", "options": {"A": "對 X 進行標準化(Standardization)", "B": "對 Y 進行 Box-Cox 轉換(Box-Cox Transformation)", "C": "對資料進行一次差分(First Differencing)", "D": "對 Y 中變異較大的樣本移除"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 9, "evidence": "answer column shows 'B' for question 36"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** Box-Cox 轉換可同時改善「右偏」與「異質變異(heteroscedasticity)」,讓 Y 趨近常態與等變異,正符合 OLS 假設。\n\n**其他選項為何錯:**\n- A. 對 X 標準化不改變 Y 的分佈或變異結構。\n- B. ✓ 正解\n- C. 一次差分用於時間序列趨勢/單根問題,非偏態。\n- D. 移除大變異樣本會丟失資訊且選樣偏誤。\n\n**記憶要點:** 右偏 + 變異隨 X 增大 → Box-Cox(或 log)轉換 Y。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q37", "topic": "Analytics/Methods", "question_text": "若開發一個用於罕見疾病自動診斷的分類模型,目前資料集中確診樣本僅佔不到 1%,且因為標註成本太高,短期內無法取得更多資料。在此情況下,若希望提升模型對少數類的偵測能力,同時避免過擬合,下列哪一種策略最為合理?", "options": {"A": "對少數類進行隨機過採樣(Random Oversampling)", "B": "對多數類進行欠採樣(Random Undersampling)", "C": "使用 SMOTE(Synthetic Minority Over-sampling Technique)生成合成少數樣本後再訓練分類模型", "D": "僅使用現有資料調整模型決策閾值(Decision Threshold)以提升召回率"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 10, "evidence": "answer column shows 'C' for question 37"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** SMOTE 透過鄰近少數類樣本進行線性插值生成新樣本,既能平衡類別分佈,又比單純複製(Random Oversampling)更不易過擬合。\n\n**其他選項為何錯:**\n- A. 直接複製易過擬合(見 Q12)。\n- B. 在已經樣本不足的情況下,欠採樣多數類會丟失資訊。\n- C. ✓ 正解\n- D. 只調整閾值無法改善模型對少數類特徵的學習。\n\n**記憶要點:** 不平衡資料 + 想避免過擬合 → SMOTE 合成新樣本。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q38", "topic": "Stats/Hypothesis", "question_text": "一家製造廠評估新生產線推出後,產品良率是否較原生產線提升。工程師分別從兩條生產線各抽樣 100 件產品,原生產線良率為 95%,新生產線為 97%。若欲檢定兩條生產線良率的差異是否具有統計意義,下列哪一種方法最為合適?", "options": {"A": "雙樣本平均數 t 檢定(Two-sample t-test)", "B": "雙比例 Z 檢定(Two-proportion Z-test)", "C": "卡方檢定(Chi-square test)", "D": "變異數分析(ANOVA)"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 10, "evidence": "answer column shows 'B' for question 38"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 良率是「比例」(成功/總數),比較兩組比例差異,標準工具是 Two-proportion Z-test(p₁ − p₂ 的 Z 檢定)。\n\n**其他選項為何錯:**\n- A. t-test 用於連續變數的平均數差。\n- B. ✓ 正解\n- C. 卡方檢定處理列聯表獨立性,亦可用於 2×2 表 (與 Z-test 結論相同),但題目要求最合適的「比例差」方法。\n- D. ANOVA 比較三組以上平均數。\n\n**記憶要點:** 兩比例差 → Z-test (Two-proportion);三組以上平均 → ANOVA。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q39", "topic": "Analytics/Methods", "question_text": "若評估一個新開發的腫瘤分類模型,其資料集中有 80% 的樣本來自良性病例。若直接使用 5-fold 交叉驗證(Cross-Validation)進行模型評估,可能導致模型效能評估出現偏差,為避免此問題,下列哪一種作法最合適?", "options": {"A": "降低 K 值以減少交叉驗證次數", "B": "改為使用拔靴法(Bootstrap)", "C": "調整測試集使良性樣本比例更高,以模擬真實分佈", "D": "使用分層交叉驗證(Stratified K-Fold Cross-Validation),以確保每折類別比例一致"}, "correct_answer": "D", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 10, "evidence": "answer column shows 'D' for question 39"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** 在類別不平衡資料上,普通 K-fold 可能讓某折幾乎沒有少數類樣本;Stratified K-Fold 維持每一折的類別比例與整體一致,得到較穩定的效能估計。\n\n**其他選項為何錯:**\n- A. 降 K 值不解決分層問題。\n- B. Bootstrap 也不必然保證類別比例。\n- C. 故意拉高良性比例反而加劇偏差。\n- D. ✓ 正解\n\n**記憶要點:** 不平衡 + CV → Stratified K-Fold。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q40", "topic": "Analytics/Methods", "question_text": "請參考附圖,下列虛擬程式碼(pseudocode)最可能是在描述何種驗證法?\n\n```\nInput:\n  - data_set: 包含 N 筆資料的資料集\n  - model_training_function: 用來訓練模型的函式\n  - model_evaluation_function: 用來評估模型的函式\nOutput:\n  - 平均評估指標\n\nAlgorithm:\n1. 初始化評估指標列表 metrics = []\n2. 對 i = 1 到 N:\n   a. 將第 i 筆資料作為測試集 test_data\n   b. 將其餘 N-1 筆資料作為訓練集 train_data\n   c. 使用 model_training_function 在 train_data 上訓練模型\n   d. 使用訓練好的模型對 test_data 做預測,計算評估指標 metric_i\n   e. 將 metric_i 加入 metrics\n3. 計算 metrics 的平均值 mean_metric\n4. 回傳 mean_metric\n```", "options": {"A": "Hold-out 驗證(Hold-out Validation)", "B": "留一交叉驗證 LOOCV(Leave-One-Out Cross Validation)", "C": "K-fold 交叉驗證(K-fold Cross Validation)", "D": "拔靴法(Bootstrap)驗證"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 11, "evidence": "answer column shows 'B' for question 40"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** 演算法在每次迭代「只抽 1 筆作測試、其餘 N−1 筆訓練」,總共做 N 次 — 這就是 Leave-One-Out Cross Validation(LOOCV)的定義。\n\n**其他選項為何錯:**\n- A. Hold-out 只切一次訓練/測試,不會跑 N 次。\n- B. ✓ 正解\n- C. K-fold 將資料切 K 等份,每次 1 份當測試;K = N 時退化為 LOOCV,但題目以一筆為單位明確說明是 LOOCV。\n- D. Bootstrap 使用有放回抽樣建多組訓練/測試,流程不同。\n\n**記憶要點:** N 筆 → N 次驗證 → LOOCV。", "image": "shared/images/exam-s2-114-2-q40-p11.png", "subject_code": "s2"}, {"id": "exam-s2-114-2-q41", "topic": "Analytics/Methods", "question_text": "請參考附圖,下列虛擬程式碼(pseudocode)最可能是在描述何種演算法?\n\n```\nInput:\n  - data_points: N 筆資料,每筆資料有 D 個特徵\n  - X: 要分成的群數\nOutput:\n  - clusters: 每筆資料所屬的群編號\n  - centroids: 每個群的中心點\n\nAlgorithm:\n1. 隨機選擇 X 個資料點作為初始中心\n2. 重複以下步驟直到收斂:\n   a. 分群: 對每個資料點,計算它到每個中心的距離,將資料點指派給距離最近的中心\n   b. 更新中心: 對每個群:計算該群中所有資料點的平均值,將群中心更新為這個平均值\n3. 當群中心不再變動時,停止\n```", "options": {"A": "K-means 分群(K-means Clustering)", "B": "高斯混合模型分群(Gaussian Mixture Model Clustering)", "C": "階層式分群(Hierarchical Clustering)", "D": "DBSCAN 分群"}, "correct_answer": "A", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 12, "evidence": "answer column shows 'A' for question 41"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 A 是正解:** 「隨機初始中心 → 指派最近中心 → 重新計算各群平均作為新中心 → 反覆直到收斂」是 K-means 的標準 Lloyd's 演算法流程。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. GMM 用 EM 演算法估計高斯參數(平均+共變異),不是直接取平均。\n- C. 階層式分群基於距離合併/分裂,不需要事先指定中心。\n- D. DBSCAN 基於密度,不使用中心點。\n\n**記憶要點:** 「指定 K + 平均更新中心」= K-means。", "image": "shared/images/exam-s2-114-2-q41-p12.png", "subject_code": "s2"}, {"id": "exam-s2-114-2-q42", "topic": "Stats/Probability", "question_text": "考慮某生產線每小時出現瑕疵品的個數符合卜瓦松分佈(Poisson Distribution),已知平均每小時產生 5 個瑕疵品,附圖程式碼展示資料處理,請問下列敘述何者正確?\n\n```python\nimport numpy as np\nfrom scipy.stats import poisson\nlambda_poisson = 5\nprint(poisson.pmf(5, lambda_poisson))\n```", "options": {"A": "lambda_poisson = 5 表示每小時最多 5 個瑕疵品", "B": "poisson.pmf(5, lambda_poisson) 表示小於 5 個瑕疵品的機率", "C": "卜瓦松分佈的適用條件為事件彼此獨立,且平均發生率固定", "D": "poisson.cdf(10, 5) 表示大於或等於 10 個瑕疵品的機率"}, "correct_answer": "C", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 12, "evidence": "answer column shows 'C' for question 42"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 C 是正解:** Poisson 分佈三大假設:事件獨立、單位時間內平均發生率 λ 固定、稀有事件;選項 C 正是該條件的標準敘述。\n\n**其他選項為何錯:**\n- A. λ=5 是「平均」每小時 5 個,不是「最多」。\n- B. `pmf(5, λ)` 是「恰好等於 5」的機率,不是「小於 5」。\n- C. ✓ 正解\n- D. `cdf(10, 5)` = P(X ≤ 10),是小於或等於 10 的機率。\n\n**記憶要點:** PMF = 恰好;CDF = 累積到該值(含)。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q43", "topic": "Analytics/EDA", "question_text": "[此題使用 vgsales.csv 情境]\n\n```python\ndata['Year']\n# 0     2006.0\n# 1     1985.0\n# ...\n# Name: Year, Length: 16598, dtype: float64\n```\n\n分析師在載入資料後,檢視 Year 欄位的資料型態,發現它是 float64,而非一般年份常用的整數。他想了解這樣的情形為什麼會發生。請問下列哪些原因可能導致這種狀況?\n\n原因 A:CSV 檔中 Year 欄位有缺失值(NaN),導致 Pandas 自動將整欄轉為浮點數。\n原因 B:CSV 檔中的年份資料原本是字串(如 \"2006\"),Pandas 轉換時出錯而變成浮點數。\n原因 C:Pandas 預設將所有數值型態讀取為 float64,不論資料是否為整數。\n原因 D:CSV 檔中的年份資料可能包含小數點(例如 2006.0),因此被視為浮點數。", "options": {"A": "原因 B、原因 C", "B": "原因 A、原因 D", "C": "原因 A、原因 B、原因 D", "D": "原因 C、原因 D"}, "correct_answer": "B", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 14, "evidence": "answer column shows 'B' for question 43"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 B 是正解:** \n- 原因 A 正確:Pandas 整數型態不支援 NaN,有缺失值會自動升級為 float64。\n- 原因 D 正確:CSV 內若已有 2006.0 這種帶小數點寫法,Pandas 會以 float 讀取。\n- 原因 B 錯誤:字串無法「轉換出錯就變浮點數」,只會留為 object。\n- 原因 C 錯誤:Pandas 預設整數會用 int64,並非全部讀為 float。\n\n**其他選項為何錯:**\n- A. 包含 B,但 B 錯誤。\n- B. ✓ 正解\n- C. 包含 B,B 錯誤。\n- D. 包含 C,C 錯誤。\n\n**記憶要點:** Int 欄位若有 NaN → Pandas 升級為 float64(或使用 Int64 nullable type)。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q44", "topic": "Analytics/EDA", "question_text": "研究團隊接下來想將 Year 欄位轉換為整數型態,以便後續進行年份趨勢分析。考慮到資料中可能包含缺失值(NaN),請選出最適合的轉換方式。", "options": {"A": "data['Year'] = data['Year'].astype(int);", "B": "data['Year'] = data['Year'].fillna(0).astype(int);", "C": "data['Year'] = data['Year'].fillna(1).astype(int);", "D": "data['Year'] = data['Year'].astype('Int64');"}, "correct_answer": "D", "source": {"file": "subjects/2-bigdata/past-exam.pdf", "page": 14, "evidence": "answer column shows 'D' for question 44"}, "verified": true, "verification_needed": null, "explanation": "**為什麼 D 是正解:** Pandas 的 `'Int64'`(大寫 I,Nullable Integer)型態原生支援 NaN,可在不破壞缺失值資訊的情況下轉為整數,適合後續分析。\n\n**其他選項為何錯:**\n- A. `astype(int)` 若欄位含 NaN 會直接報錯。\n- B. `fillna(0)` 把缺失值偽造為 0 年,污染年份分析。\n- C. `fillna(1)` 同理,且 1 年更不合理。\n- D. ✓ 正解\n\n**記憶要點:** 想保留 NaN 的整數欄位 → `astype('Int64')`(注意大寫 I)。", "subject_code": "s2"}, {"id": "exam-s2-114-2-q45", "topic": "A

<head>

<title>iPAS AI 應用規劃師 初級/中級 練習</title>
<script>
// Apply persisted theme before first paint to prevent FOUC.
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
:root {
  --bg: #f7f8fa;
  --card: #ffffff;
  --border: #e3e6ec;
  --text: #1a1f2e;
  --muted: #6b7280;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: #f5f3ff;
  --accent-soft-border: #ddd6fe;
  --accent-chip-bg: #eef2ff;
  --correct: #10b981;
  --correct-bg: #d1fae5;
  --correct-fg: #065f46;
  --wrong: #ef4444;
  --wrong-bg: #fee2e2;
  --wrong-fg: #991b1b;
  --wrong-soft-bg: #fef2f2;
  --warn-bg: #fef3c7;
  --warn-fg: #92400e;
  --warn-fg-strong: #78350f;
  --warn-border: #f59e0b;
  --surface-2: #f3f4f6;
  --surface-3: #e5e7eb;
  --subject-chip-bg: #ede9fe;
  --subject-chip-fg: #5b21b6;
  --code-bg: rgba(79,70,229,0.08);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  color-scheme: light;
}
/* Dark palette — applied when OS prefers dark AND user hasn't explicitly chosen light,
   OR when user has explicitly chosen dark. Duplicated rather than DRY'd because CSS
   can't share a declaration block between a @media query and a selector. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2c313a;
    --text: #e6e8ed;
    --muted: #9aa3af;
    --accent: #818cf8;
    --accent-hover: #a5b4fc;
    --accent-soft: #1e1b4b;
    --accent-soft-border: #3730a3;
    --accent-chip-bg: #1e1b4b;
    --correct: #34d399;
    --correct-bg: #064e3b;
    --correct-fg: #6ee7b7;
    --wrong: #f87171;
    --wrong-bg: #3a1212;
    --wrong-fg: #fca5a5;
    --wrong-soft-bg: #2a0e0e;
    --warn-bg: #422006;
    --warn-fg: #fcd34d;
    --warn-fg-strong: #fde68a;
    --warn-border: #f59e0b;
    --surface-2: #252830;
    --surface-3: #1f2229;
    --subject-chip-bg: #2e1065;
    --subject-chip-fg: #c4b5fd;
    --code-bg: rgba(165,180,252,0.15);
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115;
  --card: #1a1d24;
  --border: #2c313a;
  --text: #e6e8ed;
  --muted: #9aa3af;
  --accent: #818cf8;
  --accent-hover: #a5b4fc;
  --accent-soft: #1e1b4b;
  --accent-soft-border: #3730a3;
  --accent-chip-bg: #1e1b4b;
  --correct: #34d399;
  --correct-bg: #064e3b;
  --correct-fg: #6ee7b7;
  --wrong: #f87171;
  --wrong-bg: #3a1212;
  --wrong-fg: #fca5a5;
  --wrong-soft-bg: #2a0e0e;
  --warn-bg: #422006;
  --warn-fg: #fcd34d;
  --warn-fg-strong: #fde68a;
  --warn-border: #f59e0b;
  --surface-2: #252830;
  --surface-3: #1f2229;
  --subject-chip-bg: #2e1065;
  --subject-chip-fg: #c4b5fd;
  --code-bg: rgba(165,180,252,0.15);
  --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.container {
  max-width: 760px;
  margin: 0 auto;
  padding: 24px 16px 80px;
}
header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
header .nav { display: flex; gap: 8px; }
.btn {
  padding: 8px 14px; border: 1px solid var(--border);
  background: var(--card); color: var(--text);
  border-radius: 8px; cursor: pointer; font-size: 14px;
  font-family: inherit; transition: all 0.15s;
  text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn-icon {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 7px 9px;
}
.btn-icon svg { display: block; }
.btn-primary {
  background: var(--accent); color: white; border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.field select, .field input {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; background: var(--card); font-family: inherit;
}
.row { display: flex; gap: 12px; }
.row .field { flex: 1; }
.progress-bar {
  height: 4px; background: var(--surface-3); border-radius: 2px;
  overflow: hidden; margin-bottom: 24px;
}
.progress-fill {
  height: 100%; background: var(--accent); transition: width 0.3s;
}
.q-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; font-size: 13px; color: var(--muted);
}
.q-topic-chip {
  display: inline-block; padding: 3px 10px; background: var(--accent-chip-bg);
  color: var(--accent); border-radius: 999px; font-size: 12px; font-weight: 500;
}
.q-new-chip {
  display: inline-block; margin-left: 6px; padding: 3px 10px;
  background: var(--correct-bg); color: var(--correct-fg);
  border-radius: 999px; font-size: 12px; font-weight: 600;
}
.q-new-chip::before { content: "✨ "; }
.q-text {
  font-size: 16px; line-height: 1.7; margin-bottom: 20px;
  white-space: pre-wrap; word-wrap: break-word;
}
.q-image { margin: 0 0 20px; text-align: center; }
.q-image img {
  max-width: 100%; height: auto;
  border: 1px solid var(--border); border-radius: 8px;
  background: #fff;
}
.options { display: flex; flex-direction: column; gap: 8px; }
.option {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border: 1px solid var(--border);
  border-radius: 10px; cursor: pointer; transition: all 0.15s;
  background: var(--card); text-align: left; font-family: inherit;
  font-size: 14px; color: var(--text); width: 100%;
}
.option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.option:disabled { cursor: default; }
.option .letter {
  flex-shrink: 0; width: 28px; height: 28px;
  border-radius: 6px; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px;
}
.option .text { flex: 1; line-height: 1.6; }
.option.selected.correct {
  border-color: var(--correct); background: var(--correct-bg);
}
.option.selected.correct .letter { background: var(--correct); color: white; }
.option.selected.wrong {
  border-color: var(--wrong); background: var(--wrong-bg);
}
.option.selected.wrong .letter { background: var(--wrong); color: white; }
.option.reveal-correct {
  border-color: var(--correct); background: var(--correct-bg);
}
.option.reveal-correct .letter { background: var(--correct); color: white; }
.feedback {
  margin-top: 20px; padding: 16px; border-radius: 10px;
  font-size: 14px;
}
.feedback.correct { background: var(--correct-bg); color: var(--correct-fg); }
.feedback.wrong { background: var(--wrong-bg); color: var(--wrong-fg); }
.feedback strong { font-weight: 600; }
.feedback .source { display: block; margin-top: 8px; font-size: 12px; opacity: 0.8; }
.next-btn-row { display: flex; justify-content: flex-end; margin-top: 16px; gap: 8px; }
.why-panel {
  margin-top: 12px; padding: 16px;
  background: var(--accent-soft); border: 1px solid var(--accent-soft-border);
  border-radius: 10px;
}
.why-panel h3 {
  margin: 0 0 12px; font-size: 14px; color: var(--accent);
  font-weight: 600;
}
.why-row {
  display: flex; gap: 12px; align-items: flex-start;
  font-size: 13px; margin-bottom: 6px; line-height: 1.5;
}
.why-row .why-label {
  flex-shrink: 0; min-width: 50px; color: var(--muted);
  font-weight: 500;
}
.why-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn-link {
  background: var(--card); color: var(--accent);
  border-color: var(--accent-soft-border); font-size: 13px; padding: 6px 12px;
  text-decoration: none;
}
.btn-link:hover { background: var(--card); border-color: var(--accent); }
.why-panel .muted { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.shuffle-note {
  font-size: 12px; color: var(--warn-fg); background: var(--warn-bg);
  padding: 8px 12px; border-radius: 6px; margin: 0 0 12px;
  border-left: 3px solid var(--warn-border);
}
.shuffle-note strong { color: var(--warn-fg-strong); }
.why-explanation { font-size: 14px; line-height: 1.7; color: var(--text); }
.why-explanation p { margin: 0 0 10px; }
.why-explanation p:last-child { margin-bottom: 0; }
.why-explanation ul { margin: 4px 0 12px 20px; padding: 0; }
.why-explanation li { margin-bottom: 4px; }
.why-explanation strong { color: var(--accent); font-weight: 600; }
.why-explanation code {
  background: var(--code-bg); padding: 1px 6px;
  border-radius: 4px; font-size: 13px;
  font-family: -apple-system-monospace, "SF Mono", Menlo, monospace;
}
.score-display {
  display: flex; gap: 16px; align-items: baseline;
  margin-bottom: 24px;
}
.score-big { font-size: 40px; font-weight: 700; color: var(--accent); }
.score-pct { font-size: 18px; color: var(--muted); }
.summary-section { margin-top: 24px; }
.summary-section h3 { font-size: 14px; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
.miss-item {
  padding: 12px; border-left: 3px solid var(--wrong);
  background: var(--wrong-soft-bg); margin-bottom: 8px; border-radius: 4px;
  font-size: 13px;
}
.miss-item .miss-q { font-weight: 500; margin-bottom: 4px; }
.miss-item .miss-detail { color: var(--muted); }
.miss-recap {
  margin-top: 12px; padding: 12px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px;
}
.miss-recap summary {
  cursor: pointer; font-weight: 600; font-size: 13px;
  color: var(--accent); list-style: none; user-select: none;
}
.miss-recap summary::-webkit-details-marker { display: none; }
.miss-recap summary::before {
  content: "▶"; display: inline-block; margin-right: 6px;
  font-size: 10px; transition: transform 0.15s;
}
.miss-recap[open] summary::before { transform: rotate(90deg); }
.miss-recap-body { margin-top: 12px; }
.miss-full-q {
  font-size: 14px; line-height: 1.7; color: var(--text);
  margin-bottom: 12px; white-space: pre-wrap; word-wrap: break-word;
}
.miss-choice {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 12px; border-radius: 6px;
  font-size: 13px; margin-bottom: 6px; line-height: 1.5;
}
.miss-choice-wrong { background: var(--wrong-bg); color: var(--wrong-fg); }
.miss-choice-correct { background: var(--correct-bg); color: var(--correct-fg); }
.miss-choice-label {
  flex-shrink: 0; font-weight: 600; min-width: 56px;
}
.miss-no-explain { color: var(--muted); font-size: 13px; font-style: italic; margin-top: 8px; }
.wrong-count-badge {
  display: inline-block; padding: 1px 8px;
  background: var(--wrong); color: white;
  border-radius: 999px; font-size: 11px; font-weight: 600;
  margin: 0 4px; vertical-align: middle;
}
.subject-chip {
  display: inline-block; padding: 1px 8px;
  background: var(--subject-chip-bg); color: var(--subject-chip-fg);
  border-radius: 999px; font-size: 11px; font-weight: 600;
  margin: 0 4px 0 0; vertical-align: middle;
}
.history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.history-table th, .history-table td {
  text-align: left; padding: 10px; border-bottom: 1px solid var(--border);
}
.history-table th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; }
.weak-pill {
  display: inline-block; padding: 4px 10px; margin: 4px 4px 0 0;
  background: var(--warn-bg); color: var(--warn-fg); border-radius: 999px; font-size: 12px;
}
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.kbd {
  display: inline-block; padding: 2px 6px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 4px; font-family: monospace;
  font-size: 11px;
}
@media (max-width: 600px) {
  .container { padding: 16px 12px 60px; }
  header h1 { font-size: 15px; }
  .row { flex-direction: column; gap: 0; }
  .q-text { font-size: 15px; }
  .score-big { font-size: 32px; }
}
</style>
</head>

<script>
const POOL = [{"id": "exam-114-2-q1","topic": "NLP/Sentiment","question_text": "某電商企業希望利用自然語言處理(NLP)技術,分析顧客在社群平台與商品評論中的文字內容,以即時掌握顧客對產品的滿意度變化。若採用情感分析(Sentiment Analysis)模型,其主要目的為何?","options": {"A": "預測顧客使用的語言風格與語氣","B": "判斷文本中所表達的情感傾向","C": "將顧客留言自動翻譯成企業內部指定語言","D": "產生顧客評論的自動化摘要內容"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 1,"evidence": "answer column shows 'B' for question 1"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 情感分析(Sentiment Analysis)的核心任務,就是判斷文本所表達的情感極性(正面/負面/中性)或情緒類別,以量化顧客對產品或品牌的態度傾向。\n\n**其他選項為何錯:**\n- A. 屬於語言風格識別(Style Detection)或語氣分析,非情感分析的主要目標。\n- B. ✓ 正解\n- C. 機器翻譯(Machine Translation)的範疇。\n- D. 文本摘要(Text Summarization)的範疇。\n\n**記憶要點:** Sentiment = 情感極性;Style = 語氣風格;Translation = 翻譯;Summarization = 摘要。NLP 四種任務別搞混。","subject_code": "s1"},{"id": "exam-114-2-q2","topic": "NLP/Transformer","question_text": "某跨國金融科技公司導入 Transformer 架構開發多語客服系統,以提升長篇金融文件的自動翻譯品質。下列何者為該模型能顯著改善翻譯準確度的主要原因?","options": {"A": "透過自注意力機制(Self-Attention Mechanism)捕捉長距離語境依賴關係","B": "透過卷積運算(Convolution Operation)加速訓練過程","C": "透過強化學習(Reinforcement Learning)自動調整語句生成策略","D": "透過資料增強(Data Augmentation)平衡多語語料比例"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam.pdf","page": 1,"evidence": "answer column shows 'A' for question 2"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** Transformer 的核心創新是 Self-Attention,讓每個 token 能直接對序列中所有位置加權,突破 RNN/LSTM 在長距離依賴上的瓶頸,因此特別擅長長篇翻譯。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. Transformer 並未使用卷積運算,卷積是 CNN 的核心。\n- C. 標準 Transformer 翻譯依靠監督式 seq2seq,而非強化學習。\n- D. 資料增強是訓練策略,並非 Transformer 架構本身改善翻譯的「主要原因」。\n\n**記憶要點:** Transformer = Self-Attention + Positional Encoding,記住「拋棄遞迴、全靠注意力」。","subject_code": "s1"},{"id": "exam-114-2-q3","topic": "NLP/Transformer","question_text": "某企業計畫應用 BERT(Bidirectional Encoder Representations from Transformers)模型分析大量顧客意見,以強化客服自動回覆系統。在 BERT 的預訓練過程中,「遮罩語言模型(Masked Language Model, MLM)」的主要訓練策略為何?","options": {"A": "依序遮罩句尾詞語,讓模型從左到右逐步生成完整句子","B": "隨機遮罩部分詞語,並讓模型根據雙向上下文(Bidirectional Context)預測被遮罩的詞","C": "透過對抗訓練(Adversarial Training)生成語意相似的擾動樣本以提升泛化性","D": "以未遮罩的詞為條件,使用解碼器(Decoder)結構重建整句內容"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 1,"evidence": "answer column shows 'B' for question 3"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** BERT 的 MLM 隨機遮罩約 15% 詞,再讓模型同時利用左右(雙向)上下文預測被遮罩詞,這正是「Bidirectional」名稱的來源。\n\n**其他選項為何錯:**\n- A. 由左到右逐步生成是 GPT 類自迴歸模型(Causal LM)的做法。\n- B. ✓ 正解\n- C. 對抗訓練不是 MLM 的設計目標。\n- D. BERT 是 Encoder-only 架構,並未使用 Decoder 重建整句。\n\n**記憶要點:** BERT=雙向克漏字、GPT=由左到右接龍。MLM 看上下文猜中間詞。","subject_code": "s1"},{"id": "exam-114-2-q4","topic": "NLP/Embedding","question_text": "在詞向量(Word Embedding)訓練方法中,GloVe(Global Vectors for Word Representation)與 Word2Vec 的主要差異為何?","options": {"A": "Word2Vec 以詞頻權重訓練詞向量,而 GloVe 以隨機初始化向量進行學習","B": "Word2Vec 以全局統計矩陣為基礎,而 GloVe 採用神經網路進行上下文預測","C": "Word2Vec 為基於預測的模型,而 GloVe 為基於共現統計的模型","D": "Word2Vec 僅能用於靜態文本語料,而 GloVe 可應用於即時語料更新"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam.pdf","page": 1,"evidence": "answer column shows 'C' for question 4"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** Word2Vec(Skip-gram / CBOW)以滑動視窗在語料中「預測」上下文詞,屬 prediction-based;GloVe 則先建構全域共現矩陣再進行矩陣分解,屬 count-based(共現統計)。\n\n**其他選項為何錯:**\n- A. 兩者皆非以「詞頻權重」直接訓練,描述顛倒且錯誤。\n- B. 兩者描述完全反過來。\n- C. ✓ 正解\n- D. 兩者皆為靜態詞向量,訓練完即固定,與「即時更新」無關。\n\n**記憶要點:** Word2Vec = 預測派(local window);GloVe = 統計派(global co-occurrence)。","subject_code": "s1"},{"id": "exam-114-2-q5","topic": "NLP/Tokenization","question_text": "某企業以詞頻-逆文件頻率(Term Frequency-Inverse Document Frequency, TF-IDF)方法分析顧客意見內容,但發現模型在處理篇幅較長的回饋文本時,無法準確反映關鍵詞的重要性。下列何者為造成此現象的主要原因?","options": {"A": "長文本中的詞頻偏高,導致常見詞權重被過度放大","B": "長文本中缺乏明確句子邊界,造成 TF-IDF 無法計算詞頻","C": "TF-IDF 無法同時處理多份文件","D": "長文本會改變 IDF(Inverse Document Frequency)的計算,使所有詞權重趨於相近"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam.pdf","page": 2,"evidence": "answer column shows 'A' for question 5"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** TF-IDF 中 TF 通常為原始詞頻計數,文本越長詞頻自然越高,常見詞權重會被過度放大,稀釋了關鍵詞的相對重要性(需做長度正規化才能緩解)。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. TF-IDF 不需要句子邊界,以詞為單位即可計算。\n- C. TF-IDF 本來就是設計用來處理多份文件的。\n- D. 單份文本長短不改變 IDF,IDF 由整個語料庫共同決定。\n\n**記憶要點:** TF 對長文偏高 → 必須做長度 normalization(如 log TF 或 BM25)。","subject_code": "s1"},{"id": "exam-114-2-q6","topic": "NLP/Tokenization","question_text": "某企業嘗試以 N-gram 語言模型(N-gram Language Model)建立客服自動回覆系統,但發現模型生成的句子雖在片段上合理,卻缺乏整體語意連貫性。此問題最可能源自 N-gram 模型的哪一項限制?","options": {"A": "N-gram 模型在訓練過程中需要龐大計算量,導致長句無法收斂","B": "N-gram 模型僅根據固定長度的前序詞建立機率估計,難以捕捉長距離依賴關係(Long-range Dependencies)","C": "N-gram 模型缺乏語意嵌入(Semantic Embedding)層,因此無法表徵詞語間的語意相似度","D": "N-gram 模型假設詞與詞之間相互獨立,導致無法建構上下文語意關聯"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 2,"evidence": "answer column shows 'B' for question 6"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** N-gram 是 Markov 假設下的有限階模型,僅看前 N-1 個詞估算機率,N 一旦固定就無法跨越該視窗外捕捉長距離語意依賴,因此整體連貫性差。\n\n**其他選項為何錯:**\n- A. 計算量並非語意連貫性不佳的主因。\n- B. ✓ 正解\n- C. 缺乏語意嵌入確實是 N-gram 的缺點,但「片段合理、整體不連貫」更直接對應到長距離依賴問題。\n- D. N-gram 並不假設詞獨立(那是 Unigram bag-of-words 的假設),它假設有限階 Markov 依賴。\n\n**記憶要點:** N-gram 卡在窗外看不到 → 長距離依賴要靠 RNN/Transformer。","subject_code": "s1"},{"id": "exam-114-2-q7","topic": "CV/Detection","question_text": "在企業導入的智慧監控系統中,模型以物件偵測(Object Detection)方式自動辨識影像中的人物與車輛。若評估指標採用平均精確率(Mean Average Precision, mAP),其中 IoU(Intersection over Union)閾值設定較高時,代表下列哪一項意義?","options": {"A": "預測邊界框與真實邊界框的重疊程度越高,模型偵測結果越精準","B": "預測邊界框與真實邊界框的誤差越大,導致 mAP 數值上升","C": "模型整體精確率(Precision)降低,但召回率(Recall)上升","D": "預測邊界框的評估結果不受真實框大小影響"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam.pdf","page": 2,"evidence": "answer column shows 'A' for question 7"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** IoU = 預測框與真實框交集 / 聯集。IoU 閾值設高(如 0.75 vs 0.5)代表只有重疊程度更高的預測才算 True Positive,反映「定位精準度」要求提高。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. IoU 越高代表誤差越小,而非越大;且 mAP 不會因此自動上升。\n- C. 高 IoU 門檻通常會降低 Recall(漏判更多),敘述顛倒。\n- D. IoU 是相對重疊比例,反而對框大小敏感。\n\n**記憶要點:** IoU 門檻 ↑ → 評分越嚴格 → mAP 通常下降。COCO 的 mAP@[.5:.95] 就是平均多個 IoU 門檻。","subject_code": "s1"},{"id": "exam-114-2-q8","topic": "CV/Classification","question_text": "關於 Softmax 與 Max-Pooling,下列敘述何者正確?","options": {"A": "Softmax 與 Max-Pooling 都會將特徵張量壓縮為單一最大值","B": "Max-Pooling 會對輸入進行機率分佈的轉換","C": "Softmax 會保留所有輸入資訊,但以比例表示;Max-Pooling 只保留區域最大值","D": "Softmax 主要用於特徵降維,而 Max-Pooling 用於分類輸出"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam.pdf","page": 2,"evidence": "answer column shows 'C' for question 8"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** Softmax 將整個向量轉成總和為 1 的機率分佈,保留所有元素的相對資訊;Max-Pooling 則丟棄非最大值,只取局部最大,屬於降採樣運算。\n\n**其他選項為何錯:**\n- A. Softmax 不會壓成單一最大值,而是整個機率分佈。\n- B. Max-Pooling 不產生機率分佈。\n- C. ✓ 正解\n- D. 用途相反:Softmax 用於分類輸出機率,Max-Pooling 用於特徵降維。\n\n**記憶要點:** Softmax = 軟性機率(保留全部、按比例);Max-Pool = 硬性挑大(只留最大)。","subject_code": "s1"},{"id": "exam-114-2-q9","topic": "Data/Augmentation","question_text": "某企業在訓練生成式 AI 模型時,導入資料增強(Data Augmentation)技術以擴充訓練資料,但觀察到模型效能反而下降。下列哪一項最可能的原因與對應改善策略最為正確?","options": {"A": "增強樣本未經隨機初始化,導致模型梯度更新不穩定,應重新設計訓練啟動流程","B": "增強後資料的特徵分佈與原始資料不一致,影響模型的泛化能力,應檢查並調整增強策略以維持語意一致性","C": "增強樣本的比例過高,造成模型對特定資料產生偏好,應適度提高增強比例並調整學習率","D": "增強後資料的標註可信度下降,導致訓練訊號偏差,應以半監督學習方式重新校正資料"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 3,"evidence": "answer column shows 'B' for question 9"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 資料增強若改變到語意/標籤的分佈(例如過度旋轉、過強色彩擾動、不合理的文本替換),會讓訓練分佈偏離真實測試分佈,造成泛化反而變差;應檢視增強策略並保持語意一致性。\n\n**其他選項為何錯:**\n- A. 增強樣本不需「隨機初始化」,描述偏離題意。\n- B. ✓ 正解\n- C. 「提高增強比例」會加劇分佈偏移,方向錯誤。\n- D. 通常增強不改變標註,半監督學習屬於另一個議題。\n\n**記憶要點:** 增強要 label-preserving;失敗時先檢查分佈是否漂移,而非加大力道。","subject_code": "s1"},{"id": "exam-114-2-q10","topic": "ML/Evaluation","question_text": "如果希望同時兼顧「精確率(Precision)」和「召回率(Recall)」,下列哪一個指標可以作為綜合評估的標準?","options": {"A": "準確率(Accuracy)","B": "均方根誤差(RMSE)","C": "均方誤差(MSE)","D": "F1 分數(F1 Score)"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam.pdf","page": 3,"evidence": "answer column shows 'D' for question 10"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** F1 = 2·P·R / (P+R),為 Precision 與 Recall 的調和平均,任一者過低都會拉低 F1,因此最常用於同時兼顧兩者。\n\n**其他選項為何錯:**\n- A. Accuracy 在類別不平衡時容易誤導,且未顯式平衡 P、R。\n- B./C. RMSE、MSE 屬於迴歸誤差指標,不適用分類 P/R 平衡。\n- D. ✓ 正解\n\n**記憶要點:** P 高 R 低或反之 → F1 都會偏低。公式背起來:`F1 = 2PR/(P+R)`。","subject_code": "s1"},{"id": "exam-114-2-q11","topic": "ML/Clustering","question_text": "企業資料分析團隊使用 DBSCAN(Density-Based Spatial Clustering of Applications with Noise)演算法進行顧客行為分群,並希望模型能自動區分主要群集與雜訊資料。在此演算法中,決定聚類結果的兩個主要超參數為下列何者?","options": {"A": "特徵數與學習率","B": "K 值與距離閾值","C": "鄰域半徑(Epsilon ε)與最小點數(MinPts)","D": "交叉熵(Cross Entropy)與權重初始化"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam.pdf","page": 3,"evidence": "answer column shows 'C' for question 11"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** DBSCAN 兩大超參數為 ε(Epsilon,鄰域半徑)與 MinPts(成為核心點所需的鄰居最少數),依此判斷核心點、邊界點與雜訊。\n\n**其他選項為何錯:**\n- A. 學習率屬於梯度方法,DBSCAN 無梯度訓練。\n- B. K 值是 K-Means 的概念,DBSCAN 不需事先指定群數。\n- C. ✓ 正解\n- D. 交叉熵與權重初始化屬深度學習,與密度分群無關。\n\n**記憶要點:** DBSCAN = ε + MinPts;優點是「不需 K」且能標出 noise。","subject_code": "s1"},{"id": "exam-114-2-q12","topic": "ML/Regression","question_text": "某金融科技公司建立房價預測模型,使用多項特徵(如建坪、房齡、樓層、總價等)進行線性迴歸分析(Linear Regression Analysis)。資料分析師發現多個特徵之間存在高度相關性,導致模型係數不穩定、預測誤差上升。為解決此問題,下列哪一種方法最適合?","options": {"A": "繼續保留所有特徵,不進行任何處理","B": "使用主成分分析(PCA)將相關特徵轉換為彼此獨立的主成分","C": "新增更多原始變數以提升模型表現","D": "改用分類模型進行預測"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 3,"evidence": "answer column shows 'B' for question 12"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** PCA 將相關特徵投影到正交主成分上,新特徵彼此線性無關,可消除多重共線性對線性迴歸係數估計不穩定的影響。\n\n**其他選項為何錯:**\n- A. 不處理共線性會繼續造成係數不穩。\n- B. ✓ 正解\n- C. 加更多變數可能加劇共線性。\n- D. 任務是預測連續價格,屬迴歸而非分類。\n\n**記憶要點:** 共線性處方:PCA / Ridge / LASSO / VIF 篩選。","subject_code": "s1"},{"id": "exam-114-2-q13","topic": "Deploy/Kubernetes","question_text": "下列何者為 Kubernetes 在 AI 模型部署與運行中的核心功能?","options": {"A": "自動化管理模型的訓練流程與參數調校","B": "管理與協調模型服務的部署、擴展與運行環境","C": "提供 AI 模型的資料儲存與版本控管功能","D": "負責深度學習推論的 GPU 加速運算"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 4,"evidence": "answer column shows 'B' for question 13"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Kubernetes 是容器編排平台,負責部署、擴展(scaling)、服務發現、滾動更新與健康檢查;在 MLOps 中用來管理模型服務的執行環境與彈性伸縮。\n\n**其他選項為何錯:**\n- A. 訓練流程與參數調校通常由 ML pipeline / Kubeflow Pipelines / Optuna 等負責。\n- B. ✓ 正解\n- C. 資料/版本管理屬 DVC、MLflow、Model Registry 範疇。\n- D. GPU 加速本身由 CUDA/cuDNN 提供,K8s 只負責調度。\n\n**記憶要點:** K8s = 編排(orchestration),不是訓練、不是儲存、不是計算引擎。","subject_code": "s1"},{"id": "exam-114-2-q14","topic": "ML/Overfitting","question_text": "在調整模型超參數(Hyperparameters)時,若希望避免因過度調整參數而導致過擬合,下列何種做法最有效提升模型的泛化能力?","options": {"A": "採用交叉驗證(Cross-Validation)於多組參數組合間反覆評估,選擇在驗證資料表現最穩定的設定","B": "使用早期停止機制(Early Stopping)監控訓練誤差並在收斂前停止訓練,以防模型學習過度","C": "對輸入特徵進行標準化以減少特徵值差異帶來的過擬合風險","D": "提高模型複雜度並使用更多超參數搜尋範圍,以確保模型能充分學習資料特徵"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam.pdf","page": 4,"evidence": "answer column shows 'A' for question 14"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 交叉驗證以多個 fold 取平均,可降低單次切分的偶然性,在超參數搜尋時挑選「在驗證集穩定表現」的設定,最能有效避免對單一驗證集過擬合。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. Early Stopping 主要防訓練過擬合,但與「超參數選擇造成的過擬合」目標不同,且「收斂前就停」描述有缺陷。\n- C. 標準化是穩定訓練,與超參數選擇造成的過擬合關聯弱。\n- D. 提高複雜度與擴大搜尋反而會增加過擬合風險。\n\n**記憶要點:** 防超參數過擬合 → K-Fold CV 取平均;最好再加 nested CV 隔離測試集。","subject_code": "s1"},{"id": "exam-114-2-q15","topic": "Deploy/MLOps","question_text": "在企業導入的 MLOps(Machine Learning Operations)流程中,Model Registry 最常用於哪一個階段?","options": {"A": "用於設定運算資源與執行環境以確保訓練穩定","B": "用於建立可重複使用的資料與特徵版本","C": "用於集中管理模型版本、訓練紀錄與部署狀態","D": "用於追蹤模型上線後的表現與漂移情況"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam.pdf","page": 4,"evidence": "answer column shows 'C' for question 15"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** Model Registry(如 MLflow Model Registry、SageMaker Model Registry)的職責就是版本化管理已訓練模型、紀錄訓練資訊、流轉部署狀態(Staging/Production/Archived)。\n\n**其他選項為何錯:**\n- A. 運算資源管理屬於 K8s / 訓練平台。\n- B. 資料/特徵版本由 Feature Store 與 DVC 負責。\n- C. ✓ 正解\n- D. 上線後監控屬 Model Monitoring。\n\n**記憶要點:** Registry=模型版本控管;Feature Store=特徵;Monitoring=線上監控。MLOps 三個分開記。","subject_code": "s1"},{"id": "exam-114-2-q16","topic": "NLP/Transformer","question_text": "下列哪一種情境中最適合使用「序列到序列(Seq2Seq)」模型?","options": {"A": "預測銷售趨勢曲線,輸出未來數值序列","B": "辨識文本中出現的人名、地名與組織名稱等實體資訊","C": "對輸入文本中的關鍵字進行頻率統計與可視化","D": "將輸入文字轉換成語意等價的另一段文字,如自動翻譯或摘要生成"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam.pdf","page": 4,"evidence": "answer column shows 'D' for question 16"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** Seq2Seq 將輸入序列映射為輸出序列,典型應用為機器翻譯、文本摘要、對話生成,長度可不同,屬「文字進、文字出」的轉換任務。\n\n**其他選項為何錯:**\n- A. 銷售曲線預測屬時序迴歸,雖也可用 seq2seq,但本題語境是文字場景,最典型仍為翻譯/摘要。\n- B. 命名實體辨識為序列標註(每個 token 一個標籤),非生成另一段文字。\n- C. 詞頻統計不需要序列生成模型。\n- D. ✓ 正解\n\n**記憶要點:** Seq2Seq 經典任務口訣:翻譯、摘要、對話。Encoder-Decoder 兩段式。","subject_code": "s1"},{"id": "exam-114-2-q17","topic": "NLP/RAG","question_text": "在自然語言處理中,檢索增強生成(Retrieval-Augmented Generation, RAG)是一種結合語言模型與向量搜尋的技術,可有效減少模型知識過時與產生幻覺的問題。若要建立一套高效能的 RAG 系統,下列何者為在「檢索階段」最關鍵的挑戰?","options": {"A": "確保檢索到的文件能被完整納入語言模型的上下文視窗(Context Window)中進行生成","B": "選擇使用 Faiss 或 ScaNN 等近似最近鄰搜尋函式庫","C": "降低嵌入模型(Embedding Model)在高維空間中的計算成本與記憶體占用","D": "避免向量檢索結果僅具語意相似但與查詢意圖無實質關聯的情況"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam.pdf","page": 4,"evidence": "answer column shows 'D' for question 17"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 檢索階段最關鍵的挑戰是「語意相關但意圖不符」造成的偽相關,進而誤導生成。提升檢索品質(精準度與重排序)是 RAG 成敗關鍵。\n\n**其他選項為何錯:**\n- A. Context Window 屬生成階段限制,非檢索本身的核心挑戰。\n- B. Faiss/ScaNN 是工程選型,並非檢索品質的根本挑戰。\n- C. 嵌入計算成本是效能議題,非「檢索品質」挑戰。\n- D. ✓ 正解\n\n**記憶要點:** RAG 失敗常見於 retriever 召回到「字面像、意圖不像」的文件 → 用 reranker / hybrid search 改善。","subject_code": "s1"},{"id": "exam-114-2-q18","topic": "NLP/Transformer","question_text": "當 Transformer 模型發生「注意力分布過於平均(Attention Collapse)」的情形時,導致模型無法有效聚焦於關鍵資訊,下列哪一項策略可有效改善此問題?","options": {"A": "提高 Query-Key 點積(Dot Product)的縮放常數","B": "在 Softmax 前加入高斯雜訊(Gaussian Noise)","C": "使用 ReLU 函數取代 Softmax","D": "對注意力權重施加稀疏化約束(Sparsity Constraint)"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam.pdf","page": 5,"evidence": "answer column shows 'D' for question 18"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** Attention Collapse 指注意力分佈過於均勻,失去聚焦。對權重施加稀疏化(如 Sparsemax、Top-k attention、entropy penalty)可強迫模型集中於少數重要 token。\n\n**其他選項為何錯:**\n- A. 標準縮放是 1/√d_k;「提高」縮放常數會讓 logits 更小、Softmax 更平均,反而加劇 collapse。\n- B. 加雜訊未必能定向解決過度均勻問題。\n- C. 直接用 ReLU 取代 Softmax 會破壞機率歸一性,並非常規做法。\n- D. ✓ 正解\n\n**記憶要點:** Attention 太平 → 加稀疏約束(讓它「挑重點」)。","subject_code": "s1"},{"id": "exam-114-2-q19","topic": "NLP/Transformer","question_text": "某研究團隊正在訓練一個針對低資源語言(如少數民族語言)的語言模型,但該語言僅有約 1 萬筆語料可用。在訓練過程中出現明顯的過擬合現象,若希望在不新增真實語料的前提下提升模型的泛化能力,採用下列哪一種方法最為適合?","options": {"A": "將 Transformer 的隱藏層維度擴增至 1024,以提升表徵能力","B": "採用反向翻譯(Back-Translation)技術,以生成額外目標語句的偽平行語料(Pseudo-Parallel Corpus)","C": "對詞嵌入矩陣(Embedding Matrix),施加 L1 正則化以壓縮模型參數","D": "將多語言 BERT(mBERT)中所有 Transformer 層全部凍結以保留預訓練知識"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 5,"evidence": "answer column shows 'B' for question 19"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Back-Translation(反向翻譯)以高資源語言到低資源語言反向翻譯出偽平行語料,是低資源 NMT 最常用的資料增強法,可顯著緩解過擬合而無須真實新語料。\n\n**其他選項為何錯:**\n- A. 資料量小卻擴大隱藏維度會更嚴重過擬合。\n- B. ✓ 正解\n- C. L1 正則可壓縮參數但對低資源語料覆蓋不足的問題效果有限。\n- D. 全部凍結會使模型無法適配目標語言。\n\n**記憶要點:** 低資源 NLP 三大法寶:Back-Translation、Transfer Learning(凍結部分層)、Subword Tokenization。","subject_code": "s1"},{"id": "exam-114-2-q20","topic": "GenAI/GAN","question_text": "在使用生成對抗網路(GAN)進行人臉影像生成時,若出現「模式崩潰」(Mode Collapse)現象,下列哪一種方法最常被用來有效解決此問題?","options": {"A": "在鑑別器中加入梯度懲罰(Gradient Penalty)以穩定訓練過程","B": "採用 Wasserstein 距離(WGAN 損失)替代原始的 GAN 損失函數","C": "對生成器輸入的潛在向量加入隨機擾動","D": "使用多尺度鑑別器架構以提高對多樣性的判別能力"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 5,"evidence": "answer column shows 'B' for question 20"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Mode Collapse 的根本原因之一是 JS Divergence 在分佈不重疊時梯度消失。Wasserstein 距離(WGAN/WGAN-GP)提供平滑可微的距離度量,顯著改善多樣性與訓練穩定性,是教科書級的標準解。\n\n**其他選項為何錯:**\n- A. Gradient Penalty 主要穩定訓練(Lipschitz 約束),通常與 WGAN 搭配使用,單獨講「鑑別器」並非 mode collapse 的最直接解。\n- B. ✓ 正解\n- C. 對潛在向量加雜訊效果有限。\n- D. 多尺度鑑別器主要解析度問題,非 mode collapse 直接解。\n\n**記憶要點:** Mode Collapse → 換損失(WGAN)是教科書答案。GAN 三大問題:不穩定、模式崩潰、評估難。","subject_code": "s1"},{"id": "exam-114-2-q21","topic": "Multimodal","question_text": "在多模態 AI 模型訓練或推論過程中,遇到某一模態資料缺失(例如僅有影像資料但缺少文本說明),下列哪一種策略最有效維持模型效能?","options": {"A": "以零向量或固定向量填充缺失模態輸入","B": "訓練具備模態缺失感知能力的模型,使其適應缺失狀況","C": "利用生成模型(如 GAN 或自迴歸模型)預測並補全缺失模態資料","D": "直接捨棄缺少模態的樣本,避免干擾訓練或推論"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 5,"evidence": "answer column shows 'B' for question 21"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 訓練具「模態缺失感知」(modality-aware / modality-dropout)能力的模型,可在訓練時隨機丟棄某模態,推論時自然適應缺失,是多模態任務的穩健做法。\n\n**其他選項為何錯:**\n- A. 零向量填充會引入虛假訊號,效能不穩。\n- B. ✓ 正解\n- C. 生成補全可能引入幻覺,風險高。\n- D. 直接捨棄樣本會減少訓練資料量並可能引入偏差。\n\n**記憶要點:** 多模態缺失最佳實務:Modality Dropout 訓練 + Modality-aware Encoder。","subject_code": "s1"},{"id": "exam-114-2-q22","topic": "Data/Drift","question_text": "某電商平台開發的顧客流失預測模型在上線數月後,預測準確率明顯下降。專案團隊懷疑顧客行為模式改變,導致模型輸入特徵的分佈與原始訓練資料不同,出現典型的資料漂移(Data Drift)問題。為了偵測並確認資料分佈是否發生變化,下列哪一種作法最合適?","options": {"A": "定期重新訓練模型以應對外部變化","B": "提升模型複雜度以捕捉更多資料變異性","C": "增加測試資料量以提高評估準確度","D": "計算輸入特徵分佈間的 KL 散度(KL Divergence)"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam.pdf","page": 6,"evidence": "answer column shows 'D' for question 22"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 偵測資料漂移的標準做法是比較訓練期與線上特徵分佈的差異,常用 KL Divergence、PSI、JS Divergence、KS test 等統計量量化分佈變化。\n\n**其他選項為何錯:**\n- A. 定期重訓是補救手段,不是「偵測」。\n- B. 提高複雜度不偵測漂移。\n- C. 增加測試資料量不是偵測分佈變化。\n- D. ✓ 正解\n\n**記憶要點:** 偵測分佈差異:KL / JS / PSI / KS。先偵測再決定是否重訓。","subject_code": "s1"},{"id": "exam-114-2-q23","topic": "Deploy/Integration","question_text": "某大型醫院即將部署一套輔助診斷的 AI 系統,為降低對臨床流程的衝擊,同時確保風險可控與回饋可收斂,應採取何種『漸進式部署』(Phased Rollout)策略最為合適?","options": {"A": "從單一專科(如放射科)或特定病房開始啟用,逐步擴展至全院","B": "先部署於病例量較高的急診單位,加速收集高頻使用回饋","C": "僅在夜間或離峰時段啟用,避免影響主要臨床工作負載","D": "在使用者界面啟用提示模式,讓全院同步體驗但不影響診斷流程"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam.pdf","page": 6,"evidence": "answer column shows 'A' for question 23"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 漸進式部署(Phased Rollout)應從「風險可控、流程影響小」的單一專科或病房開始,觀察成效後再擴展,既能收斂回饋又能控制臨床衝擊,符合醫療場域審慎部署原則。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 急診雖回饋快,但臨床風險與時間壓力最大,不適合首發。\n- C. 僅夜間使用樣本與情境偏頗,難以代表全院。\n- D. 「全院同步體驗」已非漸進式,且提示模式仍可能干擾判斷。\n\n**記憶要點:** Phased Rollout = 小範圍 → 觀察 → 擴大;選擇低風險、高可控的試點。","subject_code": "s1"},{"id": "exam-114-2-q24","topic": "Risk/Security","question_text": "某金融機構的 AI 風控系統遭受對抗性攻擊,駭客透過對輸入特徵進行微小但惡意的擾動,成功欺騙了模型。為了從根本上解決模型自身對這類攻擊的脆弱性,下列何者並非針對此種攻擊型態的技術手段?","options": {"A": "強化資料前處理,用以過濾掉格式不符或數值極端異常的輸入","B": "在模型訓練階段導入對抗樣本訓練,以提升模型對惡意特徵擾動的辨識與防禦能力","C": "於推論後階段使用規則引擎,以確保模型的預測結果不違反既有的業務硬性規定","D": "在模型部署環境中強化網路防火牆,以阻擋來自未授權來源的網路連線"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam.pdf","page": 6,"evidence": "answer column shows 'D' for question 24"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 對抗性攻擊鎖定的是「模型對輸入擾動的脆弱性」,需要靠對抗訓練、輸入清洗、規則後處理等「模型/資料層」防禦。網路防火牆是周邊安全,擋的是非授權連線,並未提升模型本身對擾動的抵抗力,故為「並非」針對此攻擊型態的手段。\n\n**其他選項為何錯(本題選非):**\n- A. 強化前處理可過濾異常值,是有效手段。\n- B. 對抗樣本訓練是經典防禦法。\n- C. 規則引擎可在後段攔截不合理結果。\n- D. ✓ 正解(此為「並非」的選項)\n\n**記憶要點:** 對抗攻擊三層防禦:前處理(清洗) → 訓練(對抗訓練) → 後處理(規則)。網安防火牆解的是不同問題。","subject_code": "s1"},{"id": "exam-114-2-q25","topic": "Risk/Copyright","question_text": "某企業部署生成式 AI 系統協助行銷與內容產出,但近期遭質疑部分生成內容可能涉及著作權侵權。為降低企業在法律層面的潛在責任與風險,下列哪一項策略最能有效預防侵權問題產生?","options": {"A": "對生成內容進行語意相似度比對,自動標註可能涉及既有著作的輸出結果,以降低侵權風險","B": "建立訓練資料篩選與授權驗證機制,排除未授權或高風險資料來源","C": "在訓練與微調過程中採用差分隱私技術,避免模型記憶特定受著作保護的樣本","D": "在模型輸出端嵌入浮水印(Watermarking)或數位指紋(Digital Fingerprint)技術,以確保生成內容可追溯"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 6,"evidence": "answer column shows 'B' for question 25"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 著作權侵權的根源是訓練資料來源不合法,從源頭建立資料篩選與授權驗證機制可治本;後端比對、浮水印、差分隱私是偵測或緩解,而非根本預防。\n\n**其他選項為何錯:**\n- A. 事後比對只是偵測,無法事前防止侵權內容生成。\n- B. ✓ 正解\n- C. 差分隱私主要防個資外洩,非著作權侵權的對症方案。\n- D. 浮水印只能追溯來源,不能避免侵權。\n\n**記憶要點:** 預防 vs 偵測 vs 追溯:授權驗證(預防)> 內容比對(偵測)> 浮水印(追溯)。","subject_code": "s1"},{"id": "exam-114-2-q26","topic": "ML/Regression","question_text": "在房價預測任務中,若發現特徵如「房間數」與「坪數」存在高度多重共線性(Multicollinearity),為降低共線性對模型參數估計的負面影響,應優先選擇下列哪種模型?","options": {"A": "不受多重共線性影響的決策樹模型","B": "傳統線性迴歸模型,不含正則化項","C": "支持向量機搭配線性核函數","D": "含 L1 正則化的 LASSO 迴歸模型"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam.pdf","page": 7,"evidence": "answer column shows 'D' for question 26"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** LASSO 透過 L1 正則化使部分相關特徵的係數收斂為 0,自動進行特徵選擇,有效緩解共線性對係數估計的不穩定影響。\n\n**其他選項為何錯:**\n- A. 決策樹雖不受共線性嚴重影響,但「優先選擇」應考量題目意圖在於處理共線性的迴歸方案。\n- B. 無正則化反而會放大共線性導致的係數不穩。\n- C. SVM 線性核仍對共線性敏感,且非迴歸最佳選擇。\n- D. ✓ 正解\n\n**記憶要點:** 共線性處方:Ridge(L2,壓係數)、LASSO(L1,直接歸零做特徵選擇)、ElasticNet(兩者合)。","subject_code": "s1"},{"id": "exam-114-2-q27","topic": "Data/Preprocessing","question_text": "某企業需分析半結構化的系統日誌(JSON 格式),以提取關鍵的時序特徵供故障預測模型使用。考量日誌結構複雜且包含巢狀欄位(Nested Fields),下列哪一種策略最有效且實務可行?","options": {"A": "先將 JSON 資料扁平化轉成 CSV,再對欄位計算統計量(如均值、次數)作為特徵","B": "使用遞歸神經網路(RNN)直接輸入原始 JSON 字串進行時序特徵抽取","C": "設計遞迴函式展開巢狀欄位,並基於時間窗(Time Window)進行聚合與特徵萃取","D": "只保留時間戳記欄位,忽略其他巢狀內容以簡化特徵工程"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam.pdf","page": 7,"evidence": "answer column shows 'C' for question 27"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 巢狀 JSON 適合以遞迴展開保留結構資訊,再依時間窗口(滾動視窗、滑動視窗)做聚合,既保留語意又能萃取時序特徵,實務上最常見的策略。\n\n**其他選項為何錯:**\n- A. 直接扁平化為 CSV 可能損失層次資訊且難以做時序聚合。\n- B. RNN 不應吃原始 JSON 字串,語意難以學到結構。\n- C. ✓ 正解\n- D. 只保留時間戳會丟失大量訊號,過度簡化。\n\n**記憶要點:** 結構化資料 + 時序 → 展開 + 時間窗聚合(rolling/window functions)。","subject_code": "s1"},{"id": "exam-114-2-q28","topic": "Data/Preprocessing","question_text": "在一個同時包含連續型特徵與類別型特徵的資料集中,若希望透過適當的特徵工程流程來提升模型整體表現,下列哪一種作法最為合適?","options": {"A": "將類別型特徵使用標籤編碼(Label Encoding)轉換後,與連續型特徵直接合併進行模型訓練","B": "將連續特徵進行離散化(Discretization)或分桶(Binning)轉為類別型特徵,統一以類別方式處理","C": "對連續特徵做標準化(Standardization),類別特徵採用目標編碼(Target Encoding),並生成交互特徵提升模型表現","D": "只保留連續特徵,忽略類別型變量以簡化模型"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam.pdf","page": 7,"evidence": "answer column shows 'C' for question 28"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 連續特徵做標準化以平衡尺度;類別特徵以目標編碼把高基數類別轉為與目標相關的數值;再生成交互特徵以捕捉非線性互動,是混合型特徵工程的完整流程。\n\n**其他選項為何錯:**\n- A. Label Encoding 用於樹模型尚可,但對線性/距離型模型會誤引入順序資訊。\n- B. 連續特徵離散化會丟失資訊。\n- C. ✓ 正解\n- D. 直接忽略類別變數會丟失大量信號。\n\n**記憶要點:** 連續→Standardize;類別→One-Hot/Target/Embedding;再加交互。","subject_code": "s1"},{"id": "exam-114-2-q29","topic": "Deploy/MLOps","question_text": "某 AI 開發團隊為提升模型開發效率及品質控制,計畫實施持續整合(Continuous Integration, CI)流程。下列哪一項做法最符合 CI 的核心實踐,且能有效減少整合風險?","options": {"A": "在主分支(Main Branch)每日固定時間手動合併並執行完整測試流程","B": "每次程式碼提交(Commit)後自動觸發建置、單元測試及靜態程式碼分析","C": "於模型訓練完成後,定期安排開發團隊回顧並合併程式碼","D": "透過自動化部署腳本,將模型在特定時間批次釋出到測試環境"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 8,"evidence": "answer column shows 'B' for question 29"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** CI 的核心是「頻繁、自動化、提交即觸發」:每次 commit 自動跑 build、unit test、靜態分析,以最早期、最小代價發現整合問題。\n\n**其他選項為何錯:**\n- A. 每日手動合併與「持續」相違。\n- B. ✓ 正解\n- C. 定期回顧合併是傳統流程,非 CI。\n- D. 批次部署屬 CD 範疇且仍非「持續整合」。\n\n**記憶要點:** CI = commit 觸發、自動化測試;CD = 自動化部署。","subject_code": "s1"},{"id": "exam-114-2-q30","topic": "Risk/Security","question_text": "某銀行計劃將 AI 詐欺偵測模組整合至核心交易系統,主管機關要求全流程必須符合金融監管對「不可否認性(Non-repudiation)」的資訊安全規範,以確保日後能進行法務追蹤與稽核。下列哪一項措施最能確保此要求的落實?","options": {"A": "為每筆 AI 模型推論記錄其輸入與輸出結果的加密雜湊值(Hash),並簽署數位簽章以確保不可竄改性","B": "優化模型效能以降低平均推論延遲至 100ms 以下,提升使用者體驗","C": "增加主機備援數量,以確保系統在故障時持續可用","D": "將模型推論請求導入負載平衡器,避免單點壅塞導致服務延遲"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam.pdf","page": 8,"evidence": "answer column shows 'A' for question 30"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 不可否認性(Non-repudiation)要求行為事後無法抵賴,標準做法是對輸入/輸出計算雜湊並加上數位簽章,確保來源可驗證、內容不可竄改、行為可追蹤稽核。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 降低延遲屬效能,不是不可否認性。\n- C. 主機備援屬可用性(Availability)。\n- D. 負載平衡屬效能/可用性。\n\n**記憶要點:** 資安 CIA + Non-repudiation:Confidentiality / Integrity / Availability + 不可否認性 → 數位簽章。","subject_code": "s1"},{"id": "exam-114-2-q31","topic": "Deploy/Kubernetes","question_text": "某 AI 服務系統每次推論請求需約 1 秒完成,且必須支撐高達 10,000 次請求每秒(RPS)的流量。為確保系統具備高可用性且能穩定應付流量峰值,下列哪一種架構方案最為合適?","options": {"A": "依賴單台超高效能伺服器進行垂直擴展,提升硬體規格","B": "採用容器化部署並水平擴展服務實例,結合自動彈性伸縮機制(Auto Scaling)","C": "限制最大併發連線數,以避免系統過載","D": "增加批次處理大小,一次同時處理上千筆請求"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 8,"evidence": "answer column shows 'B' for question 31"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 1 秒/請求且需支撐 10,000 RPS 表示需大量並行實例。容器化 + 水平擴展 + Auto Scaling 可依流量彈性擴增實例數,是雲原生高可用標準解。\n\n**其他選項為何錯:**\n- A. 垂直擴展有硬體上限,且單點故障風險高。\n- B. ✓ 正解\n- C. 限流是降載手段,無法支撐高流量峰值。\n- D. 加大 batch 會增加單次延遲,且對線上即時推論不合適。\n\n**記憶要點:** 高 RPS 解 = 容器化 + Horizontal Pod Autoscaler;垂直擴展只能補救小幅成長。","subject_code": "s1"},{"id": "exam-114-2-q32","topic": "Data/Drift","question_text": "某企業已將 AI 模型部署於生產環境,為確保系統持續穩定運作,並能提前偵測模型效能可能衰退,技術團隊希望透過監控指標進行預警。下列哪一項監控指標最具預測效力,能提早發現模型效能下滑風險?","options": {"A": "系統 CPU 與記憶體使用率波動幅度","B": "模型推論結果的置信度(Confidence)分佈變化趨勢","C": "API 平均回應時間與延遲百分位數變化","D": "輸入特徵與訓練資料分布差異的 PSI(Population Stability Index)指數"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam.pdf","page": 8,"evidence": "answer column shows 'D' for question 32"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** PSI 衡量訓練分佈與線上分佈的差異,是金融業偵測 data drift 的標準指標(經驗門檻:<0.1 穩定、0.1–0.25 中度、>0.25 顯著漂移),具預測效力可提前預警。\n\n**其他選項為何錯:**\n- A. CPU/記憶體屬基礎設施監控,與模型效能間接相關。\n- B. 置信度分佈變化有參考價值,但較落後且不一定預測效能下滑。\n- C. API 延遲為服務指標,非模型效能。\n- D. ✓ 正解\n\n**記憶要點:** Data Drift 指標:PSI、KL、KS;PSI 在金融風控最常用。","subject_code": "s1"},{"id": "exam-114-2-q33","topic": "NLP/Embedding","question_text": "企業團隊在使用 Word2Vec 模型訓練客服文本語料時,若訓練資料量龐大且希望模型能更有效捕捉罕見詞的語意關聯,下列哪一種訓練策略最為適合?","options": {"A": "採用 Skip-gram 模型,但以隨機初始化權重加快高頻詞的訓練收斂","B": "採用 CBOW 模型(Continuous Bag of Words Model)並結合 TF-IDF 權重以強化低頻詞表示","C": "採用 Skip-gram 模型,利用中心詞預測周圍詞語,能更有效學習低頻詞關係","D": "採用 CBOW 模型(Continuous Bag of Words Model),利用周圍詞預測中心詞,能提升罕見詞的語意穩定度"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam.pdf","page": 9,"evidence": "answer column shows 'C' for question 33"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** Skip-gram 以中心詞預測周圍詞,每個樣本對應多個訓練 pair,稀有詞會被多次當作中心詞訓練,對低頻詞的語意表徵學得更穩;CBOW 則對低頻詞較弱。\n\n**其他選項為何錯:**\n- A. 隨機初始化是預設做法,不會幫助罕見詞學習。\n- B. CBOW 對低頻詞較弱,且 TF-IDF 不是 Word2Vec 的訓練權重。\n- C. ✓ 正解\n- D. CBOW 適合高頻詞,對罕見詞表徵反而較差。\n\n**記憶要點:** Skip-gram = 慢但對「罕見詞」好;CBOW = 快但偏向「高頻詞」。","subject_code": "s1"},{"id": "exam-114-2-q34","topic": "CV/Segmentation","question_text": "在自駕車影像辨識系統中,開發團隊希望模型能同時辨識每個像素所屬的物件類別(例如道路、建築、行人),又能區分出同類物件的不同個體(例如多位行人)。此時最適合採用下列哪一項電腦視覺技術?","options": {"A": "語義分割(Semantic Segmentation)","B": "物件偵測(Object Detection)","C": "實例分割(Instance Segmentation)","D": "全景分割(Panoptic Segmentation)"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam.pdf","page": 9,"evidence": "answer column shows 'D' for question 34"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** Panoptic = Semantic(每個像素類別) + Instance(同類個體區分),正好同時滿足題目「像素類別」與「同類個體」的雙重需求。\n\n**其他選項為何錯:**\n- A. Semantic Segmentation 只給類別,不分個體。\n- B. Object Detection 只給框,不到像素級。\n- C. Instance Segmentation 只處理「可數物件」(thing),不包含背景類(stuff)如道路、天空。\n- D. ✓ 正解\n\n**記憶要點:** Semantic(類別)+ Instance(個體)= Panoptic(全景)。自駕車場景常考。","subject_code": "s1"},{"id": "exam-114-2-q35","topic": "Multimodal","question_text": "某媒體公司計畫導入 CLIP(Contrastive Language-Image Pre-training)模型,以協助大量影像自動標註與搜尋,並希望在無需新增標訓資料的情況下,僅透過文字提示(Text Prompt)即可識別影像內容。請問此應用情境中,CLIP 能夠達成的關鍵技術特性為何?","options": {"A": "透過圖文對比式學習(Contrastive Learning)將影像與文字映射至共同嵌入空間(Shared Embedding Space),可直接以語意相似度進行零樣本分類","B": "透過影像增強與特徵擴散降低標訓資料需求","C": "以監督式學習結合多層感知器(Multilayer Perceptron, MLP)進行影像特徵分類","D": "以自迴歸生成模型(Autoregressive Model)逐步生成文字標籤描述影像內容"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam.pdf","page": 9,"evidence": "answer column shows 'A' for question 35"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** CLIP 用對比學習把圖像與文字嵌入到同一語意空間,推論時將候選類別轉為文字提示,計算與影像嵌入的相似度即可做 zero-shot 分類,無需新標註。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 影像增強與特徵擴散非 CLIP 機制。\n- C. CLIP 不是 MLP 監督式分類,而是對比式雙塔。\n- D. 自迴歸生成是 BLIP/Flamingo 等 caption 模型的做法,非 CLIP。\n\n**記憶要點:** CLIP = 雙塔對比 + Shared Embedding Space → Zero-shot Classification。","subject_code": "s1"},{"id": "exam-114-2-q36","topic": "ML/Evaluation","question_text": "某資料科學團隊在開發預測模型時,針對多種模型設定(如學習率、樹深度、正則化係數等)進行系統化測試,希望找出在驗證資料上表現最穩定的組合。此過程最可能採用下列哪一種方法?","options": {"A": "使用交叉驗證(Cross Validation)反覆評估模型以降低過擬合風險","B": "透過網格搜尋(Grid Search)在多組超參數設定中進行系統化搜尋與評估","C": "以隨機搜尋(Random Search)快速探索部分參數空間以提升搜尋效率","D": "採用貝葉斯優化(Bayesian Optimization)根據歷次結果動態調整搜尋方向"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 9,"evidence": "answer column shows 'B' for question 36"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 題目強調「對多個超參數進行系統化測試」,正是 Grid Search 的定義:對指定的超參數網格逐一組合枚舉評估。\n\n**其他選項為何錯:**\n- A. 交叉驗證是「評估方法」,不是搜尋策略(常與 Grid Search 搭配)。\n- B. ✓ 正解\n- C. Random Search 為隨機抽樣,非系統化枚舉。\n- D. Bayesian Optimization 為依先前結果動態調整,非系統化枚舉。\n\n**記憶要點:** 系統化枚舉=Grid;隨機抽樣=Random;貝氏動態=BO/Optuna。","subject_code": "s1"},{"id": "exam-114-2-q37","topic": "Deploy/MLOps","question_text": "某公司正在訓練一個大型語言合成模型,開發團隊使用多台 GPU 進行訓練,但經常出現 GPU 記憶體不足問題。由於模型架構已固定且無法更換硬體,團隊希望在維持模型效能與收斂品質的前提下,下列哪一種方法最有效降低單張 GPU 的記憶體壓力?","options": {"A": "減少訓練資料量以降低記憶體使用","B": "採用較小的批次大小(Batch Size)並搭配資料分片(Data Sharding)分散訓練負載","C": "增加學習率(Learning Rate)以加快收斂速度","D": "改用測試資料集(Test Set)進行部分訓練以節省空間"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 10,"evidence": "answer column shows 'B' for question 37"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 在硬體與架構固定的限制下,降低 batch size 可直接減少單卡前向/反向所需的激活記憶體,並可搭配 data sharding 把資料分散到多 GPU,維持訓練品質(可用 gradient accumulation 補回有效 batch)。\n\n**其他選項為何錯:**\n- A. 減少資料量會傷害模型效能。\n- B. ✓ 正解\n- C. 學習率與記憶體無關。\n- D. 用測試集訓練屬於資料洩漏,絕對禁忌。\n\n**記憶要點:** GPU OOM 三招:小 batch + gradient accumulation、mixed precision(fp16/bf16)、ZeRO/Sharding。","subject_code": "s1"},{"id": "exam-114-2-q38","topic": "GenAI/GAN","question_text": "某影像設計團隊在使用 Stable Diffusion 生成 4K 級產品圖時,發現影像邊緣與細節存在顆粒化與模糊現象。若僅能在生成階段進行調整,希望提升畫面清晰度與紋理層次,同時避免過度平滑,下列哪一項作法最適合?","options": {"A": "降低取樣步數,以縮短生成時間","B": "增加取樣步數並選擇高品質取樣器,以強化細節還原度","C": "提高 CFG(Classifier-Free Guidance)值,使生成結果更具創意與多樣性","D": "改用低解析度輸入以降低計算成本"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 10,"evidence": "answer column shows 'B' for question 38"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Diffusion 模型細節由「去噪步數」決定,步數太少會殘留雜訊與模糊;增加 sampling steps 並改用高品質取樣器(DPM++、UniPC 等)能在邊緣與紋理上換回細節。\n\n**其他選項為何錯:**\n- A. 降低步數會加劇模糊。\n- B. ✓ 正解\n- C. 過高 CFG 反而導致過飽和、結構僵硬,並非提升清晰度的方法。\n- D. 低解析度輸入無法輸出高解析度細節。\n\n**記憶要點:** Diffusion 細節 = 步數 × 取樣器品質;CFG 控「貼合提示詞」程度,不是清晰度。","subject_code": "s1"},{"id": "exam-114-2-q39","topic": "ML/Regression","question_text": "某企業的資料科學團隊利用 ARIMA 模型(AutoRegressive Integrated Moving Average Model)預測每週產品銷售量。模型建立完成後,分析人員發現預測誤差隨時間呈現週期性波動,且自相關函數(ACF)顯示殘差在多個時滯(Lag)上仍顯著不為零。根據上述現象,最合理的模型診斷結論為何?","options": {"A": "模型殘差符合白噪音(White Noise)假設,預測表現穩定","B": "模型殘差雖有輕微異常,但可視為隨機誤差忽略不計","C": "模型存在配適不足(Underfitting)問題,需重新調整 p 或 q 參數以捕捉時間依賴性","D": "殘差特性不影響預測結果,無須進一步修正"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam.pdf","page": 10,"evidence": "answer column shows 'C' for question 39"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 殘差若仍存在顯著自相關(ACF 多個 lag 顯著),代表模型尚未抓住時間依賴結構,屬於 underfitting,需要調整 ARIMA 的 p(AR 階)或 q(MA 階)甚至 d(差分)。\n\n**其他選項為何錯:**\n- A. 白噪音應「無自相關」,題目正好相反。\n- B. 殘差顯著的自相關不可忽略,代表結構性問題。\n- C. ✓ 正解\n- D. 殘差特性正是 ARIMA 診斷的核心。\n\n**記憶要點:** ARIMA 殘差須是白噪音(ACF/PACF 在零附近)+ Ljung-Box 檢定不顯著。否則調 p、d、q。","subject_code": "s1"},{"id": "exam-114-2-q40","topic": "GenAI/GAN","question_text": "下列哪一項最正確描述了 VAE(Variational Autoencoder)、GAN(Generative Adversarial Network)與擴散模型(Diffusion Model)在多模態潛在空間對齊(Latent Alignment)與生成策略上的根本差異?","options": {"A": "VAE 透過顯式潛在變數建模實現跨模態對齊,適合捕捉整體語意結構但生成解析度有限;GAN 透過對抗損失(Adversarial Loss)在不同模態間學習分佈映射,生成品質高但穩定性差;擴散模型則以條件化噪聲反推(Conditional Denoising)方式實現高保真跨模態生成,兼具穩定性與多樣性","B": "VAE 與 Diffusion Model 均屬隱式生成架構,主要依賴對抗式訓練實現跨模態對齊;GAN 則以顯式後驗估計方式提升樣本一致性","C": "VAE 與 GAN 均使用馬爾可夫鏈(Markov Chain)進行跨模態轉換;Diffusion Model 則透過 KL 散度最小化學習語意對應。","D": "三者在多模態應用中皆依賴同一潛在表徵空間(Shared Latent Space),僅在解碼器結構不同而已"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam.pdf","page": 11,"evidence": "answer column shows 'A' for question 40"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 三者本質差異最完整描述如下——\n- VAE:以顯式潛在變數 z 與重建損失 + KL Divergence 建模 p(x|z),潛在空間結構化、適合對齊,但解析度受限、生成偏模糊。\n- GAN:Generator 與 Discriminator 對抗訓練,以對抗損失隱式學習真實分佈,品質高但訓練不穩、易 mode collapse。\n- Diffusion:以條件化反向去噪過程一步步從雜訊還原資料,可條件化於文字/影像等模態,保真度高且具多樣性(目前最強的多模態生成主流)。\nA 選項三段都對應到上述本質,故為正解。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. VAE 是「顯式」潛在變數模型,Diffusion 不依賴對抗訓練,GAN 也並非顯式後驗,描述全錯。\n- C. VAE/GAN 不用 Markov Chain;Diffusion 才是 Markov Chain 形式;且 KL 最小化是 VAE 的訓練目標,不是 Diffusion 的「跨模態對應」機制。\n- D. 三者並非共用同一 latent space,差異不僅在解碼器。\n\n**記憶要點:** VAE = 顯式潛在 + KL;GAN = 對抗 + 隱式;Diffusion = 反向去噪 + Markov。生成三大家族對照表常考。","subject_code": "s1"},{"id": "exam-114-2-q41","topic": "ML/Evaluation","question_text": "在進行超參數調校(Hyperparameter Tuning)時,若直接在 K-Fold 交叉驗證(Cross-Validation)的資料上同時調整模型參數並評估效能,最可能導致下列哪一種問題?","options": {"A": "模型的交叉驗證結果出現過度樂觀偏差(Over-optimistic Bias),因測試摺資料間接參與參數選擇,造成資料洩漏(Data Leakage)","B": "模型會在每一摺(Fold)內反覆調整參數,導致訓練不穩與過度正則化","C": "因交叉驗證資料被重複使用,造成效能方差增大,無法獲得穩定估計","D": "K-Fold 交叉驗證的假設與超參數搜尋相衝突,導致驗證過程失效"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam.pdf","page": 11,"evidence": "answer column shows 'A' for question 41"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 在同一份 CV 折上同時調參與評估,測試折資料間接參與了選擇,造成 data leakage 與 over-optimistic bias。正解是 Nested CV:外層估效能、內層調參。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 每折調參本身並不必然「不穩」,核心問題是評估偏樂觀。\n- C. 重複使用會造成樂觀偏差而非「方差增大」。\n- D. K-Fold 與超參數搜尋並不衝突,合用是常規,只是必須隔離測試折。\n\n**記憶要點:** 超參數搜尋 + 評估 = Nested CV;否則 leakage。","subject_code": "s1"},{"id": "exam-114-2-q42","topic": "Data/Drift","question_text": "若部署一個深度學習模型至金融風控系統,該模型採用鑑別式架構(如 Transformer Classifier)。然而上線後,模型對新樣本的分類錯誤率顯著上升,經檢查發現,輸入資料分佈已與原訓練集明顯不同。針對此情形,下列哪一種應對策略最為合適?","options": {"A": "改用生成對抗網路(GAN)生成新樣本並混入訓練集","B": "改用邏輯迴歸模型(Logistic Regression)以提升穩定性","C": "增加模型容量(Model Capacity),以學習更多樣本差異","D": "使用變分自編碼器(VAE)監控潛在空間分佈,偵測輸入資料偏移"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam.pdf","page": 11,"evidence": "answer column shows 'D' for question 42"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** VAE 編碼器將輸入投影到結構化潛在空間,可比對新樣本潛在分佈與訓練樣本潛在分佈的偏移程度,實務上常用於 anomaly / drift detection。\n\n**其他選項為何錯:**\n- A. GAN 補資料不能解決分佈已改變的根本問題。\n- B. 換用簡單模型不偵測漂移。\n- C. 增加模型容量不解決分佈偏移。\n- D. ✓ 正解\n\n**記憶要點:** VAE latent 監控 = 偵測 input drift 的好工具(與 PSI/KL 互補)。","subject_code": "s1"},{"id": "exam-114-2-q43","topic": "ML/Evaluation","question_text": "某金融科技公司欲導入 AI 模型協助客服郵件自動分類(投訴、詢問、表揚)。團隊同時考慮兩種模型設計:方案 A(生成式路徑):採用 VAE 建構潛在語意空間,再結合下游分類器進行標籤預測;方案 B(鑑別式路徑):採用 BERT Classifier 直接根據輸入文本進行監督式分類。現有標註資料約 2,000 筆,資料分佈均勻但擴充成本高。若團隊希望公平比較兩種模型的資料利用效率與泛化能力,下列哪一種實驗設計最能突顯兩者的本質差異?","options": {"A": "在完整資料集上分別訓練兩者,並比較其分類準確率(Accuracy)與推論時間","B": "在低資源情境(Low-resource Setting)下,逐步減少標註比例(100%、50%、10%),比較其 F1-score","C": "使用 GAN 自動生成文本樣本補足資料,觀察兩模型在資料增強後的精確率(Precision)差異","D": "在相同訓練資料上固定輸入維度,僅調整模型參數量,比較其對過擬合的敏感度"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 12,"evidence": "answer column shows 'B' for question 43"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 兩種路徑的本質差異在「資料利用效率」與「低資源泛化」。在 100%→50%→10% 標註比例下比 F1,可清楚突顯哪一種架構更耐少資料,正是該題情境的關鍵差異。\n\n**其他選項為何錯:**\n- A. 全資料比 Accuracy 看不出資料效率差異。\n- B. ✓ 正解\n- C. GAN 對短文本生成質量不穩,且引入新變因,難以歸因。\n- D. 固定資料只調參量,測的是過擬合敏感度,不是資料效率。\n\n**記憶要點:** 比資料效率 → 做 data scaling curve(不同標註比例下的 F1)。","subject_code": "s1"},{"id": "exam-114-2-q44","topic": "GenAI/GAN","question_text": "某電信公司希望建立一個模型來預測顧客是否即將流失,並進一步模擬不同促銷或服務策略下顧客的行為變化,以生成多樣化的虛擬樣本資料進行 A/B 測試與行銷策略評估。若要同時兼顧預測與資料生成的需求,最適合採用下列哪一種方法?","options": {"A": "使用傳統隨機森林(Random Forest)","B": "使用邏輯迴歸(Logistic Regression)模型","C": "使用變分自編碼器(Variational Autoencoder, VAE)或生成對抗網路(Generative Adversarial Network, GAN)","D": "使用強化學習代理(Reinforcement Learning Agent)"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam.pdf","page": 12,"evidence": "answer column shows 'C' for question 44"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 同時要「預測」(分類)又要「生成虛擬樣本」做策略模擬,正是 VAE / GAN 等生成模型的強項——可從潛在空間取樣模擬不同情境,亦可結合下游分類器做預測。\n\n**其他選項為何錯:**\n- A. Random Forest 只能分類/迴歸,無法生成多樣樣本。\n- B. Logistic Regression 同理。\n- C. ✓ 正解\n- D. RL 適合「序列決策」,生成 A/B 測試虛擬樣本並非其核心。\n\n**記憶要點:** 「同時要預測又要生成」→ 生成模型(VAE/GAN/Diffusion)。","subject_code": "s1"},{"id": "exam-114-2-q45","topic": "ML/Overfitting","question_text": "進行影像分類任務時,研究團隊嘗試利用主成分分析(Principal Component Analysis, PCA)將輸入特徵從 1024 維降至 100 維,並將降維後的資料輸入支持向量機(Support Vector Machine, SVM)模型進行訓練。關於此作法,下列哪一項描述最為合理?","options": {"A": "PCA 保留的主成分必然能提升 SVM 的分類準確率","B": "使用原始高維資料通常更能保留資訊,因此 PCA 沒有實際意義","C": "PCA 可讓 SVM 自動適用於非線性(Nonlinear)資料集","D": "降維後可降低訓練時間並減少過擬合(Overfitting)風險"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam.pdf","page": 12,"evidence": "answer column shows 'D' for question 45"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** PCA 降維能去除冗餘特徵、降低計算量、減少維度災難帶來的過擬合風險。但「能否提升準確率」並無保證,因為丟棄的低變異成分有時仍含分類訊號。\n\n**其他選項為何錯:**\n- A. PCA 不必然提升準確率,陳述太絕對。\n- B. 高維未必更好,維度災難會傷害 SVM。\n- C. PCA 是線性投影,不會把線性 SVM 變成非線性分類器。\n- D. ✓ 正解\n\n**記憶要點:** PCA 主要好處:加速 + 防過擬合;準確率提不提升要看資料。","subject_code": "s1"},{"id": "exam-114-2-q46","topic": "Data/Drift","question_text": "某企業的 AI 模型已部署於線上服務環境中,用於即時預測顧客流失機率。近期團隊注意到模型預測準確率逐漸下降,但系統運作正常且未出現錯誤訊息。經分析發現,近期輸入資料的分布與模型訓練資料相比出現顯著偏移。若要在 MLOps 流程中主動偵測並預警此類問題,最應採用下列哪項措施?","options": {"A": "建立即時的資料漂移(Data Drift)與概念漂移(Concept Drift)監測機制","B": "將模型轉換為量化版本以降低延遲","C": "增加模型超參數調整次數以強化適應性","D": "使用固定隨機種子(Random Seed)確保訓練穩定"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam.pdf","page": 13,"evidence": "answer column shows 'A' for question 46"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 上線資料分佈偏移即 Data Drift;若目標變數與特徵間的關係改變則為 Concept Drift。建立兩者的即時監測與預警是 MLOps 對應此問題的標準作法。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 量化是降延遲,與漂移無關。\n- C. 額外調參無法偵測漂移。\n- D. 固定 seed 是訓練重現性議題。\n\n**記憶要點:** Data Drift = P(x) 變;Concept Drift = P(y|x) 變;兩種都要監控。","subject_code": "s1"},{"id": "exam-114-2-q47","topic": "NLP/Transformer","question_text": "某金融科技公司導入多任務學習架構,讓單一 Transformer 模型同時執行 OCR(Optical Character Recognition)後的文檔分類以及命名實體辨識(Named Entity Recognition, NER)任務,以協助自動歸檔與抽取關鍵金融資訊。在部署初期,團隊發現當模型的 NER 準確率(Accuracy)提升時,文檔分類準確率反而下降。若模型架構正確且資料品質良好,下列哪一項最可能是造成此現象的原因?","options": {"A": "模型架構無法同時支援文字分類與序列標註任務(Sequence Labeling)","B": "文檔分類任務不需要語意化表徵(Contextualized Representation)","C": "損失函數(Loss Function)未進行權重平衡,導致任務間競爭","D": "所使用的 BERT 模型無法支援多任務輸出頭(Multi-Head Outputs)"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam.pdf","page": 13,"evidence": "answer column shows 'C' for question 47"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 多任務學習若各任務 loss 未加權平衡,梯度會彼此競爭(Negative Transfer),某任務改善時可能犧牲另一任務。常見解法:動態加權(GradNorm、Uncertainty Weighting)。\n\n**其他選項為何錯:**\n- A. Transformer 本可同時做分類與序列標註(共享 encoder + 不同 head)。\n- B. 文檔分類同樣需要語意表徵。\n- C. ✓ 正解\n- D. BERT 完全支援多輸出頭。\n\n**記憶要點:** 多任務學習痛點 = task imbalance → 平衡 loss 權重(GradNorm 等)。","subject_code": "s1"},{"id": "exam-114-2-q48","topic": "ML/Clustering","question_text": "某數據工程師使用 DBSCAN 演算法對一份數百萬筆的高維顧客資料進行分類分析,但發現程式執行速度極慢,甚至出現記憶體不足的情況。若要在不改變演算法核心邏輯的前提下,最有效提升其運算效率的作法為何?","options": {"A": "改用以平均連結(Average Linkage)為基礎的階層式群集法(Hierarchical Clustering)","B": "採用高效率的距離索引結構(Distance Index Structure),例如 KD-Tree 或 Ball Tree","C": "將 ε(Epsilon)參數調得極小,以減少鄰近點的數量","D": "在資料前處理時增加標準化後的特徵維度數"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam.pdf","page": 13,"evidence": "answer column shows 'B' for question 48"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** DBSCAN 的瓶頸在「鄰域查詢」,在高維/大量資料下暴力搜尋是 O(n²)。改用 KD-Tree / Ball Tree 等空間索引可顯著加速最近鄰查詢而不改變演算法邏輯。\n\n**其他選項為何錯:**\n- A. 改用其他演算法已不是「不改變核心邏輯」。\n- B. ✓ 正解\n- C. ε 太小會讓多數點變雜訊,結果失真。\n- D. 增加維度會加劇維度災難,使速度更慢。\n\n**記憶要點:** DBSCAN 加速 = 空間索引(KD-Tree/Ball Tree);高維時改用 HDBSCAN 或先 PCA 降維。","subject_code": "s1"},{"id": "exam-114-2-q49","topic": "Risk/Privacy","question_text": "某電商平台導入 AI 情感分析模型,用以自動偵測顧客評論中的負面情緒並觸發客服機制。然而,上線後發現模型在面對不同語言或族群書寫風格的評論時表現不一致,例如部分語氣強烈的正面評論被誤判為負面,而禮貌但含批評意圖的評論卻被判為中性。若從技術與資料治理的角度分析,下列哪一項描述不正確?","options": {"A": "模型未啟用詞嵌入正規化(Embedding Normalization)可能造成語意距離不穩定,導致預測誤差","B": "訓練語料若偏向特定文化或語氣特徵,可能使模型產生內隱偏誤(Implicit Bias)","C": "模型若訓練資料來源不平衡,容易導致對不同語言或族群風格的情感判斷不準確","D": "Transformer 架構能捕捉上下文語意,但若訓練資料偏差仍存在,模型仍可能學習到偏誤判斷"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam.pdf","page": 14,"evidence": "answer column shows 'A' for question 49"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是不正確的(本題選非):** Embedding Normalization 主要在向量檢索/相似度計算中影響數值穩定,情感分析誤判主因實際是訓練語料的文化/語氣偏差(implicit bias),而非「未做 normalization」,故 A 為描述較不正確的選項。\n\n**其他選項為何錯(實則正確的描述):**\n- A. ✓ 正解(此題選「不正確」)\n- B. 語料文化偏向確實會造成 implicit bias,描述正確。\n- C. 樣本不平衡會導致對少數族群評估不準,描述正確。\n- D. Transformer 雖能捕捉上下文,但無法消除訓練資料本身的偏誤,描述正確。\n\n**記憶要點:** 偏誤源於資料而非缺乏 normalization。AI 偏誤治理:資料平衡 + 多元語料 + 公平性指標。","subject_code": "s1"},{"id": "exam-114-2-q50","topic": "Multimodal","question_text": "某設計師使用公司內部建置的生成式 AI 工具製作行銷素材,並輸入提示語(Prompt):「請生成一張模特兒手持品牌飲料、背景為海邊夕陽的照片」。系統能正確生成主要主題與場景,但輸出的圖像中,品牌標誌顏色常有誤差,或人物手部姿勢顯得不自然。若從多模態生成模型的技術機制分析,此現象最可能是下列哪一項原因所造成?","options": {"A": "擴散式生成模型的去雜訊過程出現隨機梯度漂移,導致影像像素錯誤","B": "提示語過長造成 Transformer 的位置編碼超出上下文限制,導致生成混亂","C": "CLIP 模型中的文字編碼器與影像編碼器在語意嵌入空間未充分對齊,導致跨模態理解偏差","D": "模型未採用對比學習(Contrastive Learning)損失函數,無法建立多模態語意關聯"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam.pdf","page": 14,"evidence": "answer column shows 'C' for question 50"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 多模態生成中,品牌色與手部姿勢屬細節對齊問題,根因是文字編碼器與影像編碼器在共享嵌入空間尚未充分對齊,使提示中的細節資訊無法精準引導視覺生成。\n\n**其他選項為何錯:**\n- A. 隨機梯度漂移並非標準 Diffusion 失敗描述。\n- B. 此句提示語並未超過上下文。\n- C. ✓ 正解\n- D. 多模態大模型(如 Stable Diffusion + CLIP)本就採用對比學習,並非未使用。\n\n**記憶要點:** 多模態細節錯位 = cross-modal alignment 不足;手部畸形是 Stable Diffusion 老問題。","subject_code": "s1"},{"id": "exam-s1-115-1-q1","topic": "NLP/General","question_text": "某工程師正在建置一套法律文件解析系統,在進行資訊擷取(Information Extraction)前,需要對文本進行詞性標註(Part-of-Speech Tagging, POS Tagging)。請問此步驟的主要目的為何?","options": {"A": "將文本翻譯為其他語言以利跨語言分析","B": "將文本切分為基本詞彙單位,以便後續處理","C": "判斷文本中各詞彙的情感傾向","D": "為每個詞彙標記其語法類別,如名詞、動詞與形容詞"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 1,"evidence": "answer column shows 'D' for question 1"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 詞性標註(POS Tagging)的核心任務,就是為文本中每個詞彙標記其語法類別(名詞、動詞、形容詞等),讓後續的句法分析或資訊擷取能利用詞性資訊判斷詞彙在句中的角色。\n\n**其他選項為何錯:**\n- A. 跨語言翻譯是機器翻譯(Machine Translation)的任務,與詞性標註無關。\n- B. 將文本切分為基本詞彙單位是斷詞(Tokenization),發生在詞性標註之前的前置步驟。\n- C. 判斷情感傾向是情感分析(Sentiment Analysis)的任務。\n- D. ✓ 正解\n\n**記憶要點:** POS Tagging = 標詞性(名詞/動詞/形容詞);Tokenization = 切詞。兩者常被搞混,記住「先切詞、再標詞性」的順序。","subject_code": "s1"},{"id": "exam-s1-115-1-q2","topic": "GenAI/FineTuning","question_text": "一家新創公司希望對 Llama3 70B 模型進行領域微調(Domain Fine-Tuning)以建立企業專用助理,但 GPU 記憶體有限,無法支撐完整模型的反向傳播梯度計算。工程師希望凍結(freeze)原模型權重、僅訓練少量額外參數的前提下,評估採用 LoRA(Low-Rank Adaptation)方案。請問 LoRA 在此場景下的主要優勢為何?","options": {"A": "透過知識蒸餾(Knowledge Distillation)將 70B 模型壓縮為較小的學生模型","B": "對原始模型各層權重進行剪枝(Pruning),移除低重要性參數後再進行微調","C": "凍結原始預訓練權重,僅在各層加入低秩分解的可訓練矩陣,大幅降低可訓練參數量與 GPU 記憶體需求","D": "將模型中的注意力機制改為稀疏注意力(Sparse Attention),以降低長序列計算成本"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 1,"evidence": "answer column shows 'C' for question 2"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** LoRA(Low-Rank Adaptation)的核心設計是凍結原始預訓練權重,只在各層旁路加入低秩分解的可訓練矩陣進行訓練,可訓練參數量僅為原模型的一小部分,因此能大幅降低反向傳播所需的梯度與優化器狀態記憶體。\n\n**其他選項為何錯:**\n- A. 知識蒸餾是訓練一個更小的學生模型模仿教師模型,屬於模型壓縮技術,不是 LoRA 的做法。\n- B. 剪枝是移除權重本身,LoRA 不改動或刪除原始權重,而是凍結它們。\n- C. ✓ 正解\n- D. 稀疏注意力是改變 Attention 計算方式以降低序列長度成本,與 LoRA 的參數高效微調無關。\n\n**記憶要點:** LoRA = 凍結原權重 + 旁路低秩矩陣,參數少、記憶體省,是 PEFT(Parameter-Efficient Fine-Tuning)的代表方法。","subject_code": "s1"},{"id": "exam-s1-115-1-q3","topic": "NLP/Embedding","question_text": "某工程師在建構搜尋引擎的詞向量模型時,語料庫規模達數十億 token,且包含大量長尾詞彙(Long-tail Terms)。他在 Word2Vec 的 CBOW 與 Skip-gram 兩種訓練策略之間進行選擇,需考量訓練效率與低頻詞表示品質之差異。下列何者最能準確地反映兩者在此情境下的取捨?","options": {"A": "CBOW 對長尾詞表現更好,因為它透過多個上下文詞的平均來強化稀疏詞的訓練訊號","B": "CBOW 訓練速度較快、整體語意平滑,但對低頻詞的向量品質較差;Skip-gram 以中心詞預測周圍詞,對長尾詞累積更多訓練樣本,向量品質較優","C": "Skip-gram 訓練速度更快,因為每次只需預測單一目標詞,計算量低於 CBOW","D": "兩者對低頻詞的表現完全相同,差異僅在於訓練時的 Batch 組織方式"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 1,"evidence": "answer column shows 'B' for question 3"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** CBOW 用多個上下文詞平均預測中心詞,平均化過程會稀釋低頻詞的訊號,訓練速度快但低頻詞向量品質較差;Skip-gram 反過來以單一中心詞預測多個周圍詞,每個中心詞會產生多筆訓練樣本,讓長尾詞獲得較多學習機會,因此向量品質通常較優,但計算量較大。\n\n**其他選項為何錯:**\n- A. CBOW 的平均機制正是稀釋低頻詞訊號的原因,對長尾詞表現「較差」而非「較好」,描述相反。\n- B. ✓ 正解\n- C. Skip-gram 每個中心詞要對多個上下文詞分別計算,單次迭代運算量比 CBOW 大,訓練速度較慢而非較快。\n- D. 兩者對低頻詞表現有明顯差異,並非完全相同。\n\n**記憶要點:** CBOW 快但平均化、Skip-gram 慢但對長尾詞友善,記住「Skip-gram 慢工出細活」。","subject_code": "s1"},{"id": "exam-s1-115-1-q4","topic": "NLP/BERT-vs-GPT","question_text": "某金融科技公司的工程師正在準備內部客服對話與交易紀錄文本,進行 BERT 模型的預訓練,以提升模型對金融語境的理解能力,並採用遮蔽語言建模(Masked Language Model, MLM)作為訓練任務。請問 MLM 的核心訓練目標為何?","options": {"A": "讓模型自左至右逐 token 生成句子,學習自迴歸語言模型(Autoregressive LM)能力","B": "透過對抗訓練(Adversarial Training)縮小真實句與生成句之間的語意差異","C": "隨機遮蔽輸入序列中部分 token,訓練模型根據雙向上下文預測被遮蔽的原始內容","D": "透過遮蔽低頻詞來減少詞彙表大小,降低 Embedding 的記憶體使用"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 1,"evidence": "answer column shows 'C' for question 4"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** MLM(Masked Language Model)隨機遮蔽輸入序列中約 15% 的 token,訓練模型利用左右兩側(雙向)上下文去預測被遮蔽的原始內容,這正是 BERT 能學到雙向語境表示的關鍵。\n\n**其他選項為何錯:**\n- A. 自左至右逐 token 生成是 GPT 一類自迴歸模型(Causal LM)的訓練方式,不是 MLM。\n- B. MLM 不使用對抗訓練框架,對抗訓練是 GAN 的核心概念。\n- C. ✓ 正解\n- D. 遮蔽 token 是隨機抽樣訓練訊號的機制,目的不是縮減詞彙表或省記憶體。\n\n**記憶要點:** MLM = 隨機挖空 + 雙向猜詞;GPT 系列才是「從左唸到右」的自迴歸生成。","subject_code": "s1"},{"id": "exam-s1-115-1-q5","topic": "NLP/Embedding","question_text": "某電商平台的工程師在開發商品評論情感分析系統時,發現使用 One-Hot 編碼無法表達詞語之間的語意關係,且隨著詞彙表擴大,向量維度與記憶體需求快速增加。工程師因此改用 Word2Vec 進行詞語表示。請問 Word2Vec 從根本上解決了上述問題的哪項限制?","options": {"A": "建立詞語之間的序列依賴關係,以捕捉長距離上下文語意","B": "根據詞語在語料中的出現頻率調整其重要性,使模型更重視高頻詞","C": "降低詞彙表示的維度,同時保留語意結構,避免高維稀疏表示所帶來的限制","D": "透過監督式學習利用標註語料,提升詞語分類的準確性"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 2,"evidence": "answer column shows 'C' for question 5"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** One-Hot 編碼的維度等於詞彙表大小,向量高維且稀疏,詞與詞之間也沒有語意關係。Word2Vec 透過訓練將詞彙映射到低維稠密向量空間,同時讓語意相近的詞在向量空間中距離較近,從根本上解決了高維稀疏表示的維度與記憶體問題。\n\n**其他選項為何錯:**\n- A. 捕捉長距離上下文依賴是 RNN/Transformer 等序列模型的能力,不是 Word2Vec 詞向量本身要解決的問題。\n- B. Word2Vec 訓練目標並非依詞頻調整重要性,題目描述的痛點也與詞頻加權無關。\n- C. ✓ 正解\n- D. Word2Vec 是無監督(自監督)方法,透過上下文共現學習,不需要標註語料。\n\n**記憶要點:** One-Hot = 高維稀疏、無語意;Word2Vec = 低維稠密、保語意,是 Embedding 的基礎。","subject_code": "s1"},{"id": "exam-s1-115-1-q6","topic": "CV/Segmentation","question_text": "某自駕車感知系統需要在同一張影像中同時完成道路、建築、行人的逐像素分類,並且能夠區分畫面中兩名相鄰行人(標記為「行人#1」和「行人#2」)。工程師在選擇語義分割(Semantic Segmentation)與實例分割(Instance Segmentation)時,請問兩者的根本差異為何?","options": {"A": "實例分割對每個像素進行分類但不產生 Bounding Box;語義分割產生 Bounding Box 但不進行像素級標記","B": "實例分割僅用於影像層級的類別分類,語義分割才進行逐像素標記","C": "語義分割將每個像素分配至預定義類別,但同一類別內的不同個體無法區分;實例分割能對同一類別的不同物件(如兩名行人)分別建立獨立遮罩(Mask)","D": "語義分割與實例分割皆為逐像素分類任務,但兩者在是否需要區分不同物件個體上並無差異"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 2,"evidence": "answer column shows 'C' for question 6"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 語義分割(Semantic Segmentation)只依類別為每個像素標記,同類別的不同物件(如兩名行人)會被視為同一塊區域無法區分;實例分割(Instance Segmentation)在此基礎上進一步為同類別的每個獨立物件產生各自的遮罩(Mask),因此能分辨「行人#1」與「行人#2」。\n\n**其他選項為何錯:**\n- A. 兩者描述正好顛倒:語義分割不產生 Bounding Box,實例分割才會結合偵測框與像素級遮罩。\n- B. 語義分割與實例分割都是像素級任務,並非「只有語義分割」逐像素標記,描述錯誤。\n- C. ✓ 正解\n- D. 兩者在是否區分個體上正是關鍵差異所在,並非沒有差異。\n\n**記憶要點:** 語義分割 = 只分類別、不分個體;實例分割 = 分類別 + 分個體(各自 Mask)。","subject_code": "s1"},{"id": "exam-s1-115-1-q7","topic": "CV/Segmentation","question_text": "某大型超市的防損系統需要即時偵測多名顧客各自手持的購物籃、手機與商品,並需對每個物件進行精確區域標記(Pixel-level Mask),同時能區分畫面中不同個體(即使不同顧客拿著相同商品,也需分別標記)。請問下列哪一項技術最適合此場景的需求?","options": {"A": "影像分類(Image Classification)","B": "目標檢測(Object Detection)","C": "實例分割(Instance Segmentation)","D": "語義分割(Semantic Segmentation)"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 2,"evidence": "answer column shows 'C' for question 7"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 情境需要「像素級精確標記(Mask)」且「能區分同類別的不同個體」(如不同顧客持有的相同商品要分開標記),這正是實例分割的定義:結合物件偵測與像素級分割,對每個獨立物件個體產生專屬遮罩。\n\n**其他選項為何錯:**\n- A. 影像分類只判斷整張影像屬於哪個類別,無法標記個別物件位置。\n- B. 目標檢測只能產生 Bounding Box,無法做到像素級精確區域標記。\n- C. ✓ 正解\n- D. 語義分割只能標出「這是商品類別」的像素區域,無法區分不同顧客各自持有的相同商品。\n\n**記憶要點:** 需要「像素級 + 分個體」→ 實例分割;只需框選 → 目標檢測;只需分類別像素 → 語義分割。","subject_code": "s1"},{"id": "exam-s1-115-1-q8","topic": "ML/Evaluation","question_text": "某工程師訓練了一個皮膚病變二元分類模型(惡性/良性),在向臨床醫師報告模型效能時,使用 ROC 曲線(Receiver Operating Characteristic Curve)進行呈現。請問 ROC 曲線的橫軸(X 軸)與縱軸(Y 軸)分別代表哪些指標,且在醫療情境中代表哪一種意義?","options": {"A": "X 軸為準確率(Accuracy),Y 軸為召回率(Recall),表示模型整體分類正確比例與偵測能力","B": "X 軸為假陽率(False Positive Rate, FPR),Y 軸為真陽率(True Positive Rate,TPR),反映誤診健康個體的風險與正確識別病患的能力","C": "X 軸為精確率(Precision),Y 軸為召回率(Recall),表示預測為陽性樣本的準確性與完整性","D": "X 軸為 IoU 閾值,Y 軸為 mAP,反映物件偵測模型在不同重疊條件下的表現"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 2,"evidence": "answer column shows 'B' for question 8"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** ROC 曲線以 FPR(假陽率,將健康個體誤判為惡性的比例)為 X 軸、TPR(真陽率,正確找出惡性病灶的比例,即 Recall)為 Y 軸,在醫療情境中分別對應「誤診健康人的風險」與「正確揪出病患的能力」,曲線越靠左上代表模型在兩者間的權衡越好。\n\n**其他選項為何錯:**\n- A. Accuracy 與 Recall 並非 ROC 曲線的座標軸定義。\n- B. ✓ 正解\n- C. Precision-Recall 曲線才是以這兩者為座標軸,常用於類別不平衡情境,但並非 ROC 曲線。\n- D. IoU 閾值與 mAP 是物件偵測任務的評估指標,與 ROC 曲線無關。\n\n**記憶要點:** ROC = FPR(X)vs TPR(Y);PR 曲線 = Recall(X)vs Precision(Y)。醫療情境常用 ROC 權衡誤診與漏診風險。","subject_code": "s1"},{"id": "exam-s1-115-1-q9","topic": "ML/Evaluation","question_text": "某團隊在監控影像分類模型的線上效能時,透過儀表板呈現混淆矩陣(Confusion Matrix),以觀察模型預測結果與實際標籤的分佈情形。請問下列哪一項無法從混淆矩陣中直接計算?","options": {"A": "精確率(Precision)","B": "準確率(Accuracy)","C": "召回率(Recall)","D": "ROC 曲線下面積(AUC)"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 3,"evidence": "answer column shows 'D' for question 9"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 混淆矩陣是模型在「單一固定決策閾值」下的預測結果統計,Precision、Recall、Accuracy 都能由矩陣中的 TP/FP/TN/FN 直接算出;但 AUC 是模型在所有可能閾值下的排序能力總結,需要每筆樣本的預測機率分數才能計算,無法只從單一閾值的混淆矩陣中得出。\n\n**其他選項為何錯:**\n- A. Precision = TP/(TP+FP),可直接由混淆矩陣算出。\n- B. Accuracy = (TP+TN)/總數,可直接由混淆矩陣算出。\n- C. Recall = TP/(TP+FN),可直接由混淆矩陣算出。\n- D. ✓ 正解\n\n**記憶要點:** 混淆矩陣只反映「一個閾值」的結果;AUC 需要跨所有閾值的機率分數,兩者資訊層級不同。","subject_code": "s1"},{"id": "exam-s1-115-1-q10","topic": "CV/Detection","question_text": "某工廠導入即時影像瑕疵偵測系統,需在高頻影像流中進行快速推論。工程師在 YOLO 與 Faster R-CNN 兩種物件偵測架構之間進行評估,請問下列哪一個針對兩者在偵測流程設計上的差異最為正確?","options": {"A": "YOLO 採用單階段偵測,直接從整張影像預測物件位置與類別;Faster R-CNN 則先產生候選區域再進行分類","B": "YOLO 與 Faster R-CNN 皆採用兩階段流程,但在特徵擷取方式上有所不同","C": "YOLO 採用單階段架構,主要透過增加候選區域數量來提升偵測準確率","D": "Faster R-CNN 採用單階段偵測方式,將物件定位與分類整合於同一模型中"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 3,"evidence": "answer column shows 'A' for question 10"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** YOLO(You Only Look Once)是單階段(One-Stage)偵測器,直接在整張影像上一次性回歸出物件位置與類別;Faster R-CNN 是兩階段(Two-Stage)偵測器,先透過 RPN(Region Proposal Network)產生候選區域,再對候選區域進行分類與框回歸,因此推論速度較慢但定位精度通常較高。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 只有 Faster R-CNN 是兩階段流程,YOLO 是單階段,描述錯誤。\n- C. YOLO 是單階段架構沒錯,但它並不使用候選區域(Region Proposal),與提升準確率的方式描述不符。\n- D. Faster R-CNN 是兩階段偵測器,並非單階段,描述顛倒。\n\n**記憶要點:** YOLO = 一次到位(單階段,快);Faster R-CNN = 先找候選區域再分類(兩階段,準)。","subject_code": "s1"},{"id": "exam-s1-115-1-q11","topic": "NLP/Transformer","question_text": "某工程師在分析 Transformer 架構時,發現自注意力機制(Self-Attention)能夠有效提升模型對序列中長距離依賴關係的建模能力。請問 Self-Attention 的核心功能為何?","options": {"A": "透過隱藏狀態的遞迴傳遞,逐步累積序列中的上下文資訊","B": "讓序列中每個 token 能與其他所有 token 建立關聯,並根據重要性分配權重","C": "對輸入序列進行局部運算,以捕捉相鄰詞之間的關係","D": "將整個序列壓縮為固定長度表示,以提供後續任務使用"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 3,"evidence": "answer column shows 'B' for question 11"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Self-Attention 讓序列中每個 token 都能直接與其他所有 token(包含自己)計算關聯權重,依重要性分配注意力,藉此一次性建模任意距離的依賴關係,不受序列長度限制。\n\n**其他選項為何錯:**\n- A. 隱藏狀態逐步遞迴傳遞是 RNN/LSTM 的機制,Self-Attention 沒有遞迴結構。\n- B. ✓ 正解\n- C. 只做局部運算、只看相鄰詞是卷積(CNN)的特性,Self-Attention 可以直接關聯任意距離的 token。\n- D. 將序列壓縮成固定長度向量是傳統 Seq2Seq(如 Encoder-Decoder RNN)的瓶頸做法,Self-Attention 保留完整序列的逐 token 表示。\n\n**記憶要點:** Self-Attention = 「每個詞都看全部詞」,不靠遞迴、不受局部視窗限制,是長距離依賴的解方。","subject_code": "s1"},{"id": "exam-s1-115-1-q12","topic": "ML/Classification","question_text": "某工程師在設計一個二元分類器(Binary Classifier)時,考慮在輸出層使用 Sigmoid 函數。請問 Sigmoid 函數的主要特性與限制為何?","options": {"A": "可將輸入轉換為任意實數範圍,適合用於迴歸任務","B": "可將輸入壓縮至(0, 1)區間,可解釋為機率值,但在輸入值過大或過小時可能產生梯度消失問題","C": "可將輸入轉換為多類別機率分布,常用於多分類任務","D": "可在整個輸入範圍內梯度保持穩定,適合用於深層神經網路"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 3,"evidence": "answer column shows 'B' for question 12"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Sigmoid 函數將任意實數輸入壓縮到 (0,1) 區間,常被解釋為屬於正類的機率,適合二元分類的輸出層;但當輸入值絕對值過大時,函數曲線趨於平坦,梯度接近 0,深層網路中容易發生梯度消失(Vanishing Gradient),拖慢或阻礙訓練。\n\n**其他選項為何錯:**\n- A. Sigmoid 輸出被限制在 (0,1),並非任意實數範圍,不適合直接用於一般迴歸任務。\n- B. ✓ 正解\n- C. 輸出多類別機率分布是 Softmax 的功能,Sigmoid 是針對單一數值的二元機率輸出。\n- D. Sigmoid 在輸入極端值時梯度會趨近 0,並非全範圍梯度穩定,這正是它的限制而非優點。\n\n**記憶要點:** Sigmoid = 壓到 (0,1)、可當機率,但兩端「飽和」會梯度消失,深層網路較少用它做隱藏層。","subject_code": "s1"},{"id": "exam-s1-115-1-q13","topic": "GenAI/FineTuning","question_text": "某公司評估兩種方案,將大型語言模型客製化為內部客服助理:方案 A 為提示微調(Prompt Tuning),在輸入端加入可學習的軟提示(Soft Prompt);方案 B 為傳統微調(Fine-Tuning),以標註問答資料調整模型。兩方案最本質的技術差異為何?","options": {"A": "提示微調主要用於降低推論延遲,而傳統微調則用於提升模型容量","B": "兩者技術本質相同,差別僅在於學習率(Learning Rate)設定不同","C": "傳統微調通常需要更新模型參數,而提示微調主要透過調整輸入表示來影響模型行為","D": "提示微調與傳統微調的差異僅在於是否使用預訓練模型"},"correct_answer": "C","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 4,"evidence": "answer column shows 'C' for question 13"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 傳統微調(Fine-Tuning)會更新模型本身的權重參數,以標註資料調整模型;提示微調(Prompt Tuning)則凍結模型權重,只在輸入端學習一組可訓練的軟提示向量,透過改變輸入表示來引導模型輸出,模型參數本身完全不變,這正是兩者最本質的差異。\n\n**其他選項為何錯:**\n- A. 兩者的差異核心在於「是否更新模型參數」,而非推論延遲或模型容量的取捨。\n- B. 兩者在是否更新模型權重上有本質不同,並非只差在學習率設定。\n- C. ✓ 正解\n- D. 兩種方案通常都建立在預訓練模型之上,差異不在於是否使用預訓練模型。\n\n**記憶要點:** Fine-Tuning = 改模型權重;Prompt Tuning = 凍結模型、只學輸入端的軟提示,是 PEFT 的一種。","subject_code": "s1"},{"id": "exam-s1-115-1-q14","topic": "GenAI/FineTuning","question_text": "某工程師計劃將通用 LLM 在醫療問答語料上進行監督微調(Supervised Fine-Tuning, SFT),但發生了災難性遺忘(Catastrophic Forgetting)問題。在計算資源有限的情況下,工程師希望透過調整微調策略來緩解此問題。下列哪一種訓練設計最能有效率地學習新任務的同時保留原有能力?","options": {"A": "凍結大部分預訓練參數,僅對少量新增模組(如 LoRA 層)進行微調,並控制更新範圍以減少對原有知識的干擾","B": "提高學習率(Learning Rate)並縮短訓練步數,使模型快速收斂至新任務,避免長時間訓練造成遺忘","C": "僅使用醫療語料進行多輪訓練,強化模型對新任務的專注程度","D": "增加批次大小(Batch Size)以穩定梯度更新,使模型同時保留舊知識與學習新知識"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 4,"evidence": "answer column shows 'A' for question 14"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 災難性遺忘源自於全量更新模型參數時覆蓋掉原有知識。凍結大部分預訓練權重、只對少量新增模組(如 LoRA)進行訓練,能將參數更新範圍限制在小範圍內,既能學習新任務又能大幅降低對原有能力的干擾,同時大幅減少計算資源需求。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 提高學習率、縮短訓練步數反而更容易讓權重劇烈變動,加劇對原知識的覆蓋,無助於緩解遺忘。\n- C. 僅用醫療語料反覆多輪訓練會讓模型過度擬合新任務,加速遺忘原有的通用知識。\n- D. 批次大小只影響梯度估計的穩定度,與是否覆蓋原有知識、是否遺忘沒有直接關聯。\n\n**記憶要點:** 緩解災難性遺忘的關鍵是「限制更新範圍」——LoRA/凍結大部分參數,而不是調整學習率或批次大小。","subject_code": "s1"},{"id": "exam-s1-115-1-q15","topic": "AI/Planning","question_text": "某企業建置一套多代理人(Multi-Agent)系統,由一個 Orchestrator Agent 負責任務分配,多個 Worker Agent 分別執行網路搜尋、程式撰寫與結果彙整。若 Orchestrator 發現某 Worker Agent 回傳結果品質不符合預期,從系統容錯與任務可靠性角度,下列哪一項機制最能確保整體任務仍能正確完成?","options": {"A": "直接採用該 Worker Agent 的輸出,避免重試機制造成延遲","B": "Orchestrator 具備結果評估能力,對不合格結果觸發重試(Retry)或重新分配給不同 Worker,並記錄失敗原因供後續改善","C": "強制所有 Worker Agent 統一使用相同的 LLM 模型,以減少輸出差異","D": "當任何一個 Worker 失敗時,整個 Multi-Agent 任務直接中止並通知使用者重新啟動"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 4,"evidence": "answer column shows 'B' for question 15"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 具備容錯能力的 Multi-Agent 系統需要 Orchestrator 能主動評估 Worker 回傳結果的品質,對不合格結果觸發重試或轉派給其他 Worker,並記錄失敗原因作為後續改善依據,這樣才能在單一 Worker 表現不佳時仍讓整體任務可靠地完成。\n\n**其他選項為何錯:**\n- A. 直接採用品質不符的結果會讓錯誤直接流入最終輸出,無法確保任務可靠性。\n- B. ✓ 正解\n- C. 強制統一模型只是減少輸出差異,並不能解決「結果品質不符預期」時的容錯與復原問題。\n- D. 一個 Worker 失敗就整個中止,會讓系統完全沒有容錯能力,可靠性反而更差。\n\n**記憶要點:** 容錯設計的核心是「偵測不合格結果 → 重試/轉派 → 記錄回饋」,而不是照單全收或直接中止。","subject_code": "s1"},{"id": "exam-s1-115-1-q16","topic": "AI/Planning","question_text": "一位工程師正在實作一個 ReAct 框架的 AI Agent,該 Agent 需要回答「台灣目前最大的電動車充電站營運商是哪間公司,以及其充電樁總數」。Agent 的工具清單如下:•web_search(query):回傳搜尋結果摘要•get_webpage(url):回傳網頁內文•calculator(expression):回傳計算結果•get_current_date():回傳今日日期工程師設計了以下的 System Prompt 與 ReAct Loop,請問此 Agent 設計存在哪些問題?應如何改善?[System Prompt]你是一個資料查詢助理。每次只能使用一個工具。當你知道答案時,直接輸出最終答案。[第一輪 Agent 輸出]Thought: 我已經知道台灣電動車市場的概況,不需要搜尋,可以直接回答。Action: 無 Answer: 台灣最大充電站營運商是 XX 公司,共有 500 個充電樁。","options": {"A": "System Prompt 未要求 Agent 在回答前使用工具驗證,導致直接依賴既有知識產生幻覺(Hallucination);應明確規定即時性問題需先執行 web_search","B": "工具清單提供了 calculator 與 get_current_date,屬於多餘工具,可能增加 Agent 的選擇複雜度","C": "ReAct 框架的核心問題在於 Thought 步驟佔用過多 token,應移除 Thought 欄位,直接讓 Agent 輸出 Action,以提升推理效率","D": "Agent 應在第一輪就呼叫所有可用工具並彙整結果,避免多輪 Loop 造成的延遲"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 4,"evidence": "answer column shows 'A' for question 16"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 題目要求的是「目前」最大充電站營運商與充電樁「總數」,屬於會隨時間變動的即時性資訊,但 System Prompt 沒有規定 Agent 必須先用 web_search 等工具驗證才能回答,導致 Agent 直接憑內部知識產生看似合理但未經查證的答案,屬於典型的幻覺(Hallucination)。改善方式應在 System Prompt 中明確要求對時效性問題先執行搜尋工具再作答。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. calculator 與 get_current_date 是否多餘要看任務需求,本題的問題核心是「沒查證就作答」,並非工具數量問題。\n- C. Thought 步驟是 ReAct 讓模型先推理再行動的核心設計,能提升準確度,並非應移除的多餘負擔。\n- D. 一次呼叫所有工具不但沒有必要,也違反 ReAct「逐步推理、依需要行動」的精神,無法解決本題「未查證」的根本問題。\n\n**記憶要點:** ReAct Agent 遇到即時性問題,必須先 Action(呼叫工具)驗證再回答,否則就是「不查證直接答」的幻覺。","subject_code": "s1"},{"id": "exam-s1-115-1-q17","topic": "Multimodal/General","question_text": "某醫療新創公司正在開發一套「多模態患者風險評估系統」,需同時處理三種異質資料來源:胸腔 X 光影像(影像模態)、臨床診斷筆記(文字模態),以及心率與血氧的時序感測資料(數值時序模態)。工程師在進行各模態的特徵擷取模型選擇時,需為每種模態挑選最適合的模型架構。下列哪一組模型配置最符合三種模態各自的資料特性?","options": {"A": "影像模態用 LSTM、文字模態用 CNN、時序模態用 BERT","B": "影像模態用 TF-IDF、文字模態用 ResNet、時序模態用 Word2Vec","C": "三種模態統一使用 BERT,因為 Transformer 架構具備通用性,可處理任意形式的輸入資料","D": "影像模態用 CNN、文字模態用 Transformer、時序模態用 LSTM 或 Temporal CNN"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 5,"evidence": "answer column shows 'D' for question 17"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 影像資料具有空間局部性,CNN 擅長擷取這類特徵;文字資料需要理解語序與長距離語意依賴,Transformer 是目前最適合的架構;時序感測資料(心率、血氧)具有時間先後關係,LSTM 或 Temporal CNN 專門設計用來處理序列時間相依性,三者分別對應各模態的資料特性。\n\n**其他選項為何錯:**\n- A. LSTM 用於影像、CNN 用於文字、BERT 用於數值時序,完全配錯資料型態與架構特性。\n- B. TF-IDF 是文字統計特徵、ResNet 是影像 CNN 架構、Word2Vec 是詞向量,三者全部配錯模態。\n- C. BERT 是為文字設計的 Transformer 架構,直接套用在影像像素或數值時序上並不合適,「通用性」不代表任意資料型態都適用。\n- D. ✓ 正解\n\n**記憶要點:** 影像→CNN、文字→Transformer、時序→LSTM/Temporal CNN,依資料的空間/語序/時間特性選架構。","subject_code": "s1"},{"id": "exam-s1-115-1-q18","topic": "Multimodal/Fusion","question_text": "某醫院的 AI 研究團隊正在開發一套整合「CT 影像+電子病歷文本+基因序列」三種模態資料的癌症預測模型。請問在此場景中採用「跨模態對齊(Cross-Modal Alignment)」技術主要解決什麼問題?","options": {"A": "使模型僅聚焦於 CT 影像資料,避免文本與基因資料引入雜訊","B": "自動生成跨模態配對標註,以減少人工標記需求","C": "降低多模態資料的儲存與計算成本,以提升訓練效率","D": "將不同模態的資料表示對齊至共同語意空間,使模型能建立跨模態之間的語意關聯"},"correct_answer": "D","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 6,"evidence": "answer column shows 'D' for question 18"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 跨模態對齊(Cross-Modal Alignment)的目的是把來自不同模態(影像、文本、基因序列)、原本各自獨立的表示空間,映射到一個共同的語意空間中,讓模型能學習並利用模態之間的語意關聯,而不是只看單一模態或簡單拼接特徵。\n\n**其他選項為何錯:**\n- A. 跨模態對齊的目的是「整合」多模態資訊,不是只聚焦單一模態、忽略其他模態。\n- B. 自動生成配對標註屬於資料標註/弱監督學習的範疇,不是跨模態對齊技術本身要解決的問題。\n- C. 對齊技術著重語意關聯的建立,並非以降低儲存或計算成本為主要目的。\n- D. ✓ 正解\n\n**記憶要點:** 跨模態對齊 = 把不同模態的表示「拉到同一個語意空間」,是多模態融合前的關鍵前處理。","subject_code": "s1"},{"id": "exam-s1-115-1-q19","topic": "ML/Evaluation","question_text": "一家電商公司已將推薦系統 AI 模型上線三個月,業務主管要求專案團隊評估導入成效。團隊根據下圖數據得出結論:「因為 AUC 高達 0.91,模型表現優異,AI 導入成效良好。」請問此評估結論存在什麼根本問題?","options": {"A": "僅依賴離線指標 AUC 判斷模型成效,忽略線上業務指標(如 CTR 與營收)的變化,可能導致錯誤結論","B": "AUC 已達 0.91,代表模型排序能力優異,即使 CTR 略為下降,仍可視為推薦品質提升","C": "CTR 從 3.2%降至 3.1%,顯示模型效果變差,應立即還原(Rollback)至舊模型","D": "平均訂單金額提升至$1,020,代表模型已成功優化營收,因此無需考慮其他指標"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 6,"evidence": "answer column shows 'A' for question 19"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 圖表顯示離線指標 AUC 高達 0.91,但線上業務指標卻出現分歧:CTR 從 3.2% 微幅下降至 3.1%,平均訂單金額則從 $850 上升至 $1,020。團隊僅憑單一離線指標 AUC 就下「導入成效良好」的結論,忽略了 CTR 下降、延遲與費用等線上業務與成本指標需要一併綜合評估,離線指標與線上真實業務表現本來就可能脫鉤,單看 AUC 容易得出過度樂觀或錯誤的結論。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. AUC 高只代表模型「排序」能力好,不代表使用者實際點擊行為(CTR)一定會提升,CTR 下降不能被 AUC 蓋過,兩者不能互相取代解讀。\n- C. CTR 僅小幅下降 0.1 個百分點,而訂單金額同時上升,不能單憑 CTR 些微變動就斷定「模型效果變差」並立即 Rollback,應綜合多項指標評估。\n- D. 平均訂單金額上升可能受季節性、客單價結構等其他因素影響,不能單憑此指標就判定模型已成功優化營收,而忽略 CTR 下降與其他指標。\n\n**記憶要點:** 離線指標(AUC)好 ≠ 線上業務指標(CTR、營收)一定好,AI 導入成效評估要看多項線上業務指標綜合判斷,不能只看單一離線分數。","subject_code": "s1","image": "shared/images/exam-s1-115-1-q19-p6.png"},{"id": "exam-s1-115-1-q20","topic": "Deploy/MLOps","question_text": "某電商公司計畫導入即時推薦系統,希望使用者進入網站後能在 100 毫秒內取得推薦結果,且推薦結果需依據最新使用者行為進行調整。系統需支援每日約 50 萬活躍使用者,尖峰時段每秒約 3,000 筆請求(QPS)。目前公司已累積歷史購買紀錄與瀏覽行為資料,並持續接收即時點擊流(Streaming Data)。IT 基礎架構採用雲端環境,團隊配置為 2 名資料工程師與 1 名機器學習工程師。某工程師提出以下導入規劃:(1)使用批次訓練(Batch Training)建立協同過濾模型(2)將模型部署為 REST API 提供即時推論服務(3)使用 Kafka 串流處理即時使用者行為特徵(4)將所有即時資料先寫入資料倉儲(Data Warehouse)再進行特徵計算(5)使用 Redis 或 Feature Store 快取即時特徵請問以下哪一項最合理的技術導入規劃組合與調整建議?","options": {"A": "保留(1)(2)(3),移除(4),並加入(5)以降低延遲","B": "保留(1)(4),移除(3),以確保資料一致性與系統穩定","C": "保留(2)(4)(5),移除(1),改用即時線上學習(Online Learning)","D": "全部保留(1)~(5),可同時兼顧即時性與資料完整性"},"correct_answer": "A","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 6,"evidence": "answer column shows 'A' for question 20"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 系統需求是 100 毫秒內回應且依最新行為即時調整。批次訓練的協同過濾模型(1)可作為離線基底模型,部署為 REST API(2)提供推論服務,用 Kafka 處理即時點擊流(3)取得最新行為特徵都合理;但(4)先寫入資料倉儲再計算特徵,資料倉儲通常針對批次分析設計、寫入與查詢延遲高,會直接拖垮 100 毫秒的即時性需求,應移除;改用(5)Redis 或 Feature Store 直接快取即時特徵,才能在低延遲下提供最新特徵。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 保留(4)資料倉儲會造成即時特徵計算延遲過高,無法滿足 100 毫秒需求,且移除(3)會失去即時點擊流訊號。\n- C. 移除(1)批次訓練模型、改用線上學習,在資料工程與 ML 工程人力有限(僅 3 人)、系統剛起步的情境下,直接上線上學習的維運複雜度與風險過高,並非最合理的第一步規劃。\n- D. 保留(4)會讓即時特徵計算流程多繞經資料倉儲,增加延遲,與 100 毫秒的即時性需求衝突,並非「同時兼顧」而是自相矛盾。\n\n**記憶要點:** 追求低延遲即時特徵,要用 Feature Store/Redis 直接快取,避免特徵計算路徑繞經為批次分析設計的資料倉儲。","subject_code": "s1"},{"id": "exam-s1-115-1-q21","topic": "GenAI/RAG","question_text": "一位機器學習工程師正在優化公司內部的 RAG 法律文件問答系統。近期因營運成本壓力,公司要求在不更換模型且不影響回答品質的前提下,將整體 token 成本降低至目前的 60%,且目前成本主要集中於輸入 tokens。工程師在檢查系統後,盤點出目前的使用情況如下:◆使用模型:GPT-4o(輸入$5/1M tokens、輸出 $15/1M tokens)◆每次查詢:將前 10 筆檢索文件區塊全部加入 Prompt(每塊約 600 tokens)◆System Prompt:每次請求均包含約 500tokens 的公司背景說明◆對話機制:保留完整對話歷史,平均累積約 8,000tokens◆每日查詢量:約 5,000 次◆平均輸出:約 300tokens/次在上述限制與系統現況下,請問下列哪一項優化組合,最能在維持回答品質的前提下有效降低 token 成本?","options": {"A": "將輸出 max_tokens 從 1,000 壓縮至 200,強制模型給出更短的回答,以降低輸出費用","B": "將 System Prompt 改為 Prompt Caching 或靜態前綴重用,並對對話歷史實作摘要壓縮,以保留語意而非完整對話","C": "將所有查詢改為 Batch API 模式送出,透過非同步處理降低單次費用","D": "在 Prompt 中明確要求模型「回答時盡量簡短」,透過指令引導模型自行縮減輸出長度"},"correct_answer": "B","source": {"file": "subjects/1-ai/past-exam-115-1.pdf","page": 7,"evidence": "answer column shows 'B' for question 21"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 題目明確指出成本主要集中在輸入 tokens(檢索文件區塊、System Prompt、完整對話歷史)。將固定不變的 System Prompt 改用 Prompt Caching 或靜態前綴重用可大幅降低重複輸入的計費 token 數,再對持續累積的對話歷史做摘要壓縮以保留語意重點而非逐字保留,能直接針對輸入成本的主要來源下手,且不影響檢索文件與回答品質。\n\n**其他選項為何錯:**\n- A. 大幅壓縮輸出長度只影響輸出 tokens,但題目說明成本主要集中在「輸入」tokens,並非輸出,對症下藥錯了方向,且可能犧牲回答完整性。\n- B. ✓ 正解\n- C. Batch API 通常適用於非即時、可延後處理的批次任務,RAG 問答系統需要即時回應使用者查詢,不適合改為非同步批次模式。\n- D. 只在 Prompt 中口頭要求模型「簡短」屬於軟性引導,無法穩定保證輸出長度,且同樣只影響輸出而非輸入 token 成本。\n\n**記憶要點:** 輸入成本高 → 先看能不能 Prompt Caching(固定前綴)+ 歷史摘要壓縮,而不是一味壓縮輸出或改變送出模式。","subject_code": "s1"},{"id": "exam-s1-115-1-q22","topic": "Deploy/MLOps","question_text": "某金融科技公司計劃建立完整的 AI 開發到維運流程,希望實現「模型訓練→測試→部署

"某智慧製造公司開發一套影像辨識系統,用於自動檢測生產線上的瑕疵產品。系統採用卷積神經網路(Convolutional Neural Network, CNN)作為主要模型架構,其中第一層卷積層(Convolutional Layer)主要負責的功能為下列何者?","options": {"A": "自動提取輸入影像中的局部特徵","B": "降低影像維度以加速運算效率","C": "增加神經元與參數數量以提升模型容量","D": "整合所有特徵並輸出最終分類結果"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam.pdf","page": 1,"evidence": "answer column shows 'A' for question 5"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** CNN 第一層卷積層通常以小卷積核掃描影像,自動抽取「邊緣、紋理、角點」等低階局部特徵;隨網路加深,特徵會逐步抽象化。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 降維是池化層(Pooling)的工作。\n- C. 與卷積層特定功能無關。\n- D. 分類是最末端的全連接層/softmax。\n\n**記憶要點:** Conv 抽特徵;Pool 降維;FC 分類。","subject_code": "s3"},{"id": "exam-s3-114-2-q6","topic": "DL/CNN","question_text": "某智慧城市團隊開發一套交通監控系統,用於即時辨識路口監視器影像中的車輛與行人。團隊比較後發現,卷積神經網路(Convolutional Neural Network, CNN)在訓練與推論效率上,明顯優於傳統的全連接神經網路(Fully Connected Neural Network, FCNN)。請問下列何者為主要原因?","options": {"A": "CNN 能自動學習影像的旋轉與比例不變性","B": "CNN 可直接跳過人工特徵提取步驟進行分類","C": "CNN 透過區域感知(Local Receptive Field)與參數共享(Parameter Sharing)機制,降低模型參數量與運算複雜度","D": "CNN 捨棄激勵函數(Activation Function),以加快運算速度"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 2,"evidence": "answer column shows 'C' for question 6"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** CNN 相對 FCNN 的核心優勢:每個神經元只看局部區域(Local Receptive Field)且卷積核權重共享(Parameter Sharing),大幅減少參數數量與運算量。\n\n**其他選項為何錯:**\n- A. CNN 不天生具有完全的旋轉/比例不變性,需依賴資料增強。\n- B. FCNN 也不需要人工特徵提取,這不是 CNN 獨有優勢。\n- C. ✓ 正解\n- D. CNN 仍使用激活函數(如 ReLU)。\n\n**記憶要點:** CNN 核心:Local Receptive Field + Parameter Sharing → 少參數、可擴規模。","subject_code": "s3"},{"id": "exam-s3-114-2-q7","topic": "DL/RNN","question_text": "下列哪一種應用最適合採用長短期記憶網路(Long Short-Term Memory, LSTM)模型?","options": {"A": "預測未來七天的電力需求變化趨勢","B": "辨識監視影像中不同類別的物件","C": "將大量顧客資料依相似特徵自動分群","D": "將高維度的感測器資料壓縮成低維表示"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam.pdf","page": 2,"evidence": "answer column shows 'A' for question 7"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** LSTM 設計用來處理「序列、時間相依」資料的長期依賴問題,電力需求預測屬於典型的時間序列任務。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 物件辨識用 CNN 系列(YOLO、Faster R-CNN)。\n- C. 自動分群用 K-means、DBSCAN 等。\n- D. 降維用 PCA、Autoencoder。\n\n**記憶要點:** 序列/時間相依 → LSTM/GRU/Transformer。","subject_code": "s3"},{"id": "exam-s3-114-2-q8","topic": "ML/Algorithms","question_text": "資訊增益(Information Gain)常用於衡量特徵對分類結果的不確定性貢獻程度,並據以進行特徵選擇。此方法主要應用於下列哪一類模型架構中?","options": {"A": "使用 L1 正則化進行特徵篩選的線性模型","B": "利用激活函數(Activation Function)進行特徵擷取的深度神經網路","C": "透過核函數(Kernel Function)將特徵映射至高維空間的分類模型","D": "透過遞迴分裂方式建立分類規則的決策樹模型"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam.pdf","page": 2,"evidence": "answer column shows 'D' for question 8"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** Information Gain(及其延伸 IG Ratio、Gini)是決策樹(ID3、C4.5)選擇分裂屬性的標準,衡量該屬性對減少資訊熵的貢獻。\n\n**其他選項為何錯:**\n- A. L1 正則化是另一種特徵選擇機制,但其本身不基於資訊增益。\n- B. 深度網路不使用資訊增益做特徵擷取。\n- C. 核方法(SVM)依賴核函數,非資訊增益。\n- D. ✓ 正解\n\n**記憶要點:** Information Gain 是決策樹的核心分裂準則。","subject_code": "s3"},{"id": "exam-s3-114-2-q9","topic": "Feature/Engineering","question_text": "在建構以距離為基礎的機器學習模型(如 KNN、SVM)時,下列哪一項資料前處理方式最為關鍵?","options": {"A": "進行特徵縮放(Feature Scaling),使各特徵變數具有相似的數值範圍","B": "將連續型特徵變數轉換為類別型變數","C": "以平均值或中位數進行缺失值補齊","D": "進行隨機抽樣以平衡資料筆數"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam.pdf","page": 2,"evidence": "answer column shows 'A' for question 9"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** KNN、SVM(以及 K-means、PCA 等)的距離度量會被特徵尺度大幅影響;不縮放會讓量級大的特徵主導距離,導致模型失真。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 連續轉類別會喪失精細資訊。\n- C. 缺值補齊雖重要,但不是「距離型模型」特有最關鍵步驟。\n- D. 抽樣與距離模型本身關鍵性無關。\n\n**記憶要點:** 距離 / 內積為基礎的模型 → 一定先做 Feature Scaling。","subject_code": "s3"},{"id": "exam-s3-114-2-q10","topic": "Training/Tuning","question_text": "下列哪一種應用情境最適合導入 AutoML,以提升模型開發效率?","options": {"A": "公司已有完整的 MLOps 平台與資深資料科學團隊,模型更新採固定流程","B": "製造部門的生產良率模型已長期穩定運作,只需定期調整參數","C": "行銷部門希望在短時間內比較多種顧客流失預測模型,缺乏專職工程師與時間進行手動建模","D": "財務部門正在開發高度客製化的信用風險評估模型,需要精細控制特徵工程與演算法細節"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 3,"evidence": "answer column shows 'C' for question 10"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** AutoML 的價值在於「自動化模型挑選與超參數搜尋」,最適用於團隊缺乏 ML 專家、需要快速嘗試多種模型的場景。\n\n**其他選項為何錯:**\n- A. 已有資深團隊與固定流程,AutoML 邊際效益小。\n- B. 已長期穩定,只需微調,不需 AutoML。\n- C. ✓ 正解\n- D. 高度客製需要細部控制,AutoML 反而限制了靈活性。\n\n**記憶要點:** AutoML 適合:時間緊、人力不足、需要嘗試多模型的中度標準化任務。","subject_code": "s3"},{"id": "exam-s3-114-2-q11","topic": "Training/Tuning","question_text": "相較於 Grid Search,Random Search 在超參數調整上具備哪一項主要優勢?","options": {"A": "可自動產生模型架構","B": "可使用更大的訓練集","C": "避免模型過擬合","D": "能更有效率搜尋高維參數空間"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam.pdf","page": 3,"evidence": "answer column shows 'D' for question 11"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** Bergstra & Bengio 證明,在高維超參數空間中,Random Search 比 Grid Search 用相同預算可以更廣泛地探索重要維度(因為 Grid 受維度詛咒影響嚴重)。\n\n**其他選項為何錯:**\n- A. 模型架構自動產生屬於 NAS / AutoML。\n- B. 與資料量無關。\n- C. 兩者都不直接防止過擬合。\n- D. ✓ 正解\n\n**記憶要點:** 高維調參 → Random Search 通常比 Grid Search 高效。","subject_code": "s3"},{"id": "exam-s3-114-2-q12","topic": "Math/Optimization","question_text": "某智慧製造公司開發一套設備故障預測系統,利用感測器資料訓練深度神經網路(Deep Neural Network, DNN)模型,以提前偵測異常運轉跡象。在訓練過程中,團隊發現模型收斂速度不穩定:有時太快導致過擬合,有時又遲遲無法達到最佳準確率。開發團隊可以藉由調整下列哪一項超參數(Hyperparameter)以改善此問題?","options": {"A": "每個神經元的輸出結果","B": "損失函數(Loss Function)在訓練過程中的梯度變化值(Gradient)","C": "學習率(Learning Rate),控制模型權重更新的速度","D": "模型在訓練後產生的權重值"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 3,"evidence": "answer column shows 'C' for question 12"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 學習率是控制權重每次更新步幅的「超參數」,過大會震盪/過擬合,過小會收斂緩慢 — 正符合題目描述,可透過調整 LR 或使用 LR Scheduler 改善。\n\n**其他選項為何錯:**\n- A. 神經元輸出是訓練過程的「結果」,不是調控的超參數。\n- B. 梯度值是訓練計算出的中間量,不是超參數。\n- C. ✓ 正解\n- D. 訓練後的權重是輸出,不是調的對象。\n\n**記憶要點:** 收斂震盪 / 過快 → 調 Learning Rate(超參數)。","subject_code": "s3"},{"id": "exam-s3-114-2-q13","topic": "Bias/Fairness","question_text": "標籤偏差(Label Bias)通常是因為什麼原因造成?","options": {"A": "訓練資料量過大","B": "標記資料本身帶有主觀偏見","C": "模型結構設計不當","D": "特徵數量設定過多"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 3,"evidence": "answer column shows 'B' for question 13"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Label Bias 指人工標註過程中,標記者的主觀傾向、文化背景或標註指南偏差,使標籤本身不客觀(如種族、性別偏見內化進標籤)。\n\n**其他選項為何錯:**\n- A. 資料量大小不直接造成標籤偏差。\n- B. ✓ 正解\n- C. 模型結構導致的是 inductive bias,不是 label bias。\n- D. 特徵數量是特徵問題,非標籤。\n\n**記憶要點:** Label Bias = 標註者的主觀偏見內化進資料。","subject_code": "s3"},{"id": "exam-s3-114-2-q14","topic": "Privacy/Compliance","question_text": "下列哪一種 AI 應用情境中,模型的可解釋性(Explainability)最為關鍵?","options": {"A": "電商平台利用深度學習模型預測用戶的下一次購買時間,以優化推播行銷策略","B": "新創公司使用機器學習演算法自動調整廣告出價策略,以提升點擊轉換率","C": "醫院導入 AI 模型分析病患影像並給出腫瘤惡性可能性,作為臨床醫師診斷依據","D": "銀行導入 AI 模型預測客戶流失率,並自動推薦留客優惠方案"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 3,"evidence": "answer column shows 'C' for question 14"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 醫療診斷直接影響生命健康,醫師需要理解模型輸出根據才能負責任地下判斷,且受法規與倫理高度監督,Explainability 最為關鍵。\n\n**其他選項為何錯:**\n- A. 商業預測,風險較低。\n- B. 廣告出價,商業範疇。\n- C. ✓ 正解\n- D. 信用 / 行銷類,雖重要但風險與責任不及醫療。\n\n**記憶要點:** 高風險決策(醫療、司法、金融授信)→ 可解釋性最重要。","subject_code": "s3"},{"id": "exam-s3-114-2-q15","topic": "Eval/Metrics","question_text": "在線性迴歸模型中,若 R² 值為 0.85,其意義為何?","options": {"A": "模型準確率為 85%","B": "85% 的變異可被模型解釋","C": "預測誤差為 15%","D": "模型有 85% 的信心水準"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 4,"evidence": "answer column shows 'B' for question 15"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** R²(決定係數)= 1 − SSE/SST,代表模型解釋了多少比例的因變數變異;R²=0.85 表示 85% 的 Y 變異被自變數解釋。\n\n**其他選項為何錯:**\n- A. R² 不是分類「準確率」。\n- B. ✓ 正解\n- C. 1 − R² 是未解釋的變異比例,非「誤差率」。\n- D. 信心水準是信賴區間的概念,與 R² 無關。\n\n**記憶要點:** R² = 解釋變異比例;不是準確率、不是信心水準。","subject_code": "s3"},{"id": "exam-s3-114-2-q16","topic": "Eval/Metrics","question_text": "在二元分類問題中,若精確率(Precision)為 0.8,召回率(Recall)為 0.6,則 F1 分數(F1 Score)為何?","options": {"A": "0.686","B": "0.700","C": "0.720","D": "0.750"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam.pdf","page": 4,"evidence": "answer column shows 'A' for question 16"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** F1 = 2·P·R/(P+R) = 2·0.8·0.6/(0.8+0.6) = 0.96/1.4 ≈ 0.6857 ≈ 0.686。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 0.7 是算術平均 (0.8+0.6)/2,非調和平均。\n- C. 此值無對應計算。\n- D. 此值無對應計算。\n\n**記憶要點:** F1 = Precision 與 Recall 的調和平均;偏向較小者。","subject_code": "s3"},{"id": "exam-s3-114-2-q17","topic": "DL/Optimization","question_text": "下列哪一種優化演算法內建動量(Momentum)的設計機制?","options": {"A": "SGD+Momentum","B": "Adam","C": "RMSProp","D": "Adagrad"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 4,"evidence": "answer column shows 'B' for question 17"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Adam = Momentum + RMSProp,自帶一階動量(梯度的指數移動平均)與二階動量(梯度平方的指數移動平均)。題目問「內建」動量,Adam 是最完整代表。\n\n**其他選項為何錯:**\n- A. SGD+Momentum 是「外加」動量的變形,需顯式啟用;且選項本身名稱已帶 Momentum,不算「內建」。\n- B. ✓ 正解\n- C. RMSProp 只有二階動量(歷史梯度平方),沒有一階動量。\n- D. Adagrad 累積歷史梯度平方,沒有一階動量。\n\n**記憶要點:** Adam = Adaptive Moment Estimation,一二階動量都內建。","subject_code": "s3"},{"id": "exam-s3-114-2-q18","topic": "ML/Algorithms","question_text": "下列何者最能同時反映 XGBoost(eXtreme Gradient Boosting)相較於傳統梯度提升決策樹(Gradient Boosting Decision Tree, GBDT)的主要技術改進?","options": {"A": "引入正則化項(Regularization)以抑制過擬合,並支援缺失值自動處理與並行化訓練","B": "改以隨機森林(Random Forest)架構取代樹模型以提升準確率","C": "以類神經網路(Neural Network)取代弱分類器(Weak Learners)","D": "採用批次正規化(Batch Normalization)技術提升模型穩定性"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam.pdf","page": 4,"evidence": "answer column shows 'A' for question 18"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** XGBoost 相對 GBDT 的主要創新:在目標函數中加入 L1/L2 正則化、稀疏感知(自動處理缺失值)、並行化分裂節點搜尋、近似分裂演算法等,使模型既精準又能 scale。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. XGBoost 不是改用 Random Forest,仍是 Boosting。\n- C. 弱分類器仍是樹,不是神經網路。\n- D. Batch Norm 屬於深度學習領域,與 XGBoost 無關。\n\n**記憶要點:** XGBoost 賣點:Regularization + Sparsity-aware + Parallel split finding。","subject_code": "s3"},{"id": "exam-s3-114-2-q19","topic": "Eval/Metrics","question_text": "某醫療機構開發疾病早期偵測模型,正樣本(確診病例)僅佔 3%。在模型訓練與評估過程中,下列哪一種作法最不適合用於提升對少數類病例的預測能力?","options": {"A": "使用 SMOTE 過採樣","B": "調整類別權重","C": "使用準確率(Accuracy)作為評估指標","D": "欠採樣多數類(Undersampling the majority class)"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 4,"evidence": "answer column shows 'C' for question 19"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 類別嚴重不平衡時,Accuracy 容易被多數類主導(全猜正常仍 97% 對),無法反映模型對少數類的偵測能力;應改用 Precision/Recall/F1/AUC 等。\n\n**其他選項為何錯:**\n- A. SMOTE 對少數類採樣有幫助。\n- B. 調整 class weight 能讓損失更重視少數類。\n- C. ✓ 正解(這是「最不適合」的選項)\n- D. 欠採樣多數類能平衡資料。\n\n**記憶要點:** 不平衡資料 → 改用 Precision/Recall/F1/AUC,而非 Accuracy。","subject_code": "s3"},{"id": "exam-s3-114-2-q20","topic": "Feature/Engineering","question_text": "某電子商務公司為開發商品評論情感分析模型,希望模型能捕捉評論中不同特徵之間的關聯影響,例如「商品價格」與「顧客滿意度」的互動效果。下列哪一種特徵工程設計方式最適合用於建立互動特徵(Interaction Features)?","options": {"A": "將單一特徵取平方","B": "對所有特徵進行對數轉換","C": "將兩個或多個特徵進行乘積或交互組合","D": "對特徵進行標準化"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 5,"evidence": "answer column shows 'C' for question 20"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 互動特徵的標準做法是把兩個(或多個)特徵相乘 / 相除 / 組合(如 x1·x2),使線性模型也能捕捉非線性互動效應。\n\n**其他選項為何錯:**\n- A. 取平方是單一特徵的非線性轉換,不涉及多特徵互動。\n- B. 對數轉換改變單一特徵分佈,非互動。\n- C. ✓ 正解\n- D. 標準化只是縮放,不是建構互動。\n\n**記憶要點:** Interaction Feature = 多特徵的乘積/交互組合。","subject_code": "s3"},{"id": "exam-s3-114-2-q21","topic": "DL/Transformer","question_text": "某語音辨識系統開發團隊採用 Transformer 架構,為了讓模型能同時理解語音片段中的發音特徵、語速變化與語意脈絡等多層次資訊,團隊在設計中導入了多頭注意力(Multi-head Attention)機制。請問下列何者為此機制的主要優點?","options": {"A": "減少模型參數量以降低訓練成本","B": "加速整體注意力計算過程","C": "從不同表示子空間(Representation Subspaces)同時捕捉多樣化關聯資訊","D": "避免梯度消失(Gradient Vanishing)問題"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 5,"evidence": "answer column shows 'C' for question 21"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 多頭注意力把 Q、K、V 投影到多個子空間中平行計算 attention,讓模型能同時關注不同類型的關係(如語法、語義、長距離依賴等)。\n\n**其他選項為何錯:**\n- A. 多頭反而會增加參數量。\n- B. 多頭並未加速,而是擴增表達能力。\n- C. ✓ 正解\n- D. 梯度消失主要靠殘差連接(Residual)解決,不是多頭注意力。\n\n**記憶要點:** Multi-head = 多個 attention 並行 + 不同 representation subspace。","subject_code": "s3"},{"id": "exam-s3-114-2-q22","topic": "Math/Probability","question_text": "某電商平台希望預測顧客是否會購買特定商品。系統蒐集顧客的瀏覽紀錄、停留時間、商品類別偏好與過去購買行為,並以此推估「在觀察到這些行為特徵的情況下,該顧客會購買的機率」。若模型採用貝氏定理(Bayes' Theorem)進行推論,下列敘述何者最符合其核心運作機制?","options": {"A": "根據歷史樣本自動分群,找出行為相似的顧客群","B": "以條件機率方式計算顧客屬於「會購買」或「不會購買」的分類機率","C": "以最小平方誤差(Mean Squared Error)為損失函數,預測顧客的購買金額","D": "依據回饋信號(Feedback Signal)透過強化學習(Reinforcement Learning)動態調整推薦策略"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 5,"evidence": "answer column shows 'B' for question 22"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 貝氏分類器以條件機率 P(類別 | 特徵) ∝ P(特徵 | 類別)·P(類別) 計算每個類別的後驗機率,正符合題述機制。\n\n**其他選項為何錯:**\n- A. 自動分群是非監督學習(K-means)。\n- B. ✓ 正解\n- C. MSE 損失搭配連續輸出,屬於迴歸,不是貝氏推論。\n- D. 強化學習屬於另一典範,非貝氏推論。\n\n**記憶要點:** Bayes 分類 = 計算每類條件機率,取最大者。","subject_code": "s3"},{"id": "exam-s3-114-2-q23","topic": "Math/Probability","question_text": "一家再生能源公司希望預測未來三個月太陽能發電量的波動範圍。由於氣候條件具有高度隨機性,且輸入變數(如日照時數、雲量、溫度)之間存在不確定關係,工程團隊決定以隨機抽樣方式模擬多種可能情境,以估算整體發電量的機率分佈與風險區間。請問此時所採用的技術最符合下列哪一種方法?","options": {"A": "蒙地卡羅方法(Monte Carlo Method)","B": "K-means 聚類(K-means Clustering)","C": "支持向量迴歸(Support Vector Regression, SVR)","D": "特徵選取(Feature Selection)"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam.pdf","page": 5,"evidence": "answer column shows 'A' for question 23"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** Monte Carlo 法透過大量隨機抽樣模擬輸入變數的不確定性,可估計目標量的分佈與風險區間,正適合題述場景。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. K-means 是分群,非情境模擬。\n- C. SVR 是迴歸模型,給出點預測而非機率分佈。\n- D. 特徵選取是前處理,不是模擬技術。\n\n**記憶要點:** 不確定情境模擬 + 機率分佈估計 → Monte Carlo。","subject_code": "s3"},{"id": "exam-s3-114-2-q24","topic": "Eval/Bias","question_text": "某房地產公司利用多元迴歸模型(Multiple Regression Model)預測房價,並繪製殘差圖(Residual Plot)檢查模型品質。結果顯示部分資料點的殘差極大,且在高價區樣本中出現系統性彎曲分佈現象。根據此觀察,下列何者為最可能的正確解釋?","options": {"A": "模型過度擬合(Overfitting),導致在訓練資料上表現過好、泛化能力不足","B": "模型特徵數量不足,導致欠擬合(Underfitting)","C": "模型存在異常值(Outlier)或非線性關係,違反迴歸假設","D": "殘差圖呈現隨機分佈,表示模型已完全符合所有假設"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 6,"evidence": "answer column shows 'C' for question 24"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 殘差圖出現「系統性彎曲」表示存在未被線性模型捕捉的非線性結構;極大殘差則暗示 outlier。兩者都違反線性迴歸的線性假設與常態誤差假設。\n\n**其他選項為何錯:**\n- A. 過擬合主要在訓練/驗證集表現差異上看,不直接由殘差彎曲判斷。\n- B. 欠擬合可能讓殘差有趨勢,但「殘差極大 + 高價區系統彎曲」更直接指向 outlier + 非線性。\n- C. ✓ 正解\n- D. 隨機分佈才表示假設成立;題目描述明確是系統性彎曲。\n\n**記憶要點:** 殘差圖看不到隨機分佈 → 模型假設失效;彎曲 = 非線性。","subject_code": "s3"},{"id": "exam-s3-114-2-q25","topic": "ML/Algorithms","question_text": "某金融機構正在建立傳統信用評分卡模型,採用邏輯迴歸(Logistic Regression)作為建模方法,並依循監理機關建議的標準化流程進行模型開發。下列哪一項不是傳統信用評分卡模型開發流程中的常見步驟?","options": {"A": "使用生成式模型進行特徵學習","B": "進行特徵選擇與多重共線性(Multicollinearity)分析","C": "進行分箱(Binning)與資訊值(Information Value, IV)檢定","D": "使用樣本穩定性指標(Population Stability Index, PSI)檢驗模型穩定性"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam.pdf","page": 6,"evidence": "answer column shows 'A' for question 25"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 傳統信用評分卡強調簡單可解釋、可審計,標準流程包含分箱、IV、WOE、邏輯迴歸、PSI 等;「生成式模型做特徵學習」不屬於傳統流程,也較難通過監理稽核。\n\n**其他選項為何錯:**\n- A. ✓ 正解(這是「不是」的選項)\n- B. 特徵選擇 + 共線性檢查是標準步驟。\n- C. Binning + IV 是評分卡核心做法。\n- D. PSI 是部署後監控的標準指標。\n\n**記憶要點:** 傳統評分卡標配:Binning + WOE + IV + Logistic Regression + PSI。","subject_code": "s3"},{"id": "exam-s3-114-2-q26","topic": "Modeling/Selection","question_text": "在防止監督式學習模型過擬合(Overfitting)時,下列哪一種策略不屬於降低模型複雜度或限制學習能力的作法?","options": {"A": "採用 L1 或 L2 正則化","B": "在訓練過程中使用 Dropout 技術","C": "採取早期停止(Early Stopping)機制","D": "擴增輸入特徵變數以提升模型表達能力"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam.pdf","page": 6,"evidence": "answer column shows 'D' for question 26"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 增加特徵會「提高」模型容量,反而更容易過擬合;這正與防止過擬合相反。\n\n**其他選項為何錯:**\n- A. L1/L2 正則化是經典的複雜度懲罰。\n- B. Dropout 隨機關閉神經元,限制學習能力。\n- C. Early Stopping 在驗證損失上升時停訓,避免過度配適。\n- D. ✓ 正解(這是「不屬於」的選項)\n\n**記憶要點:** 防止過擬合的常見手段:L1/L2、Dropout、Early Stopping、減少特徵 / 模型容量。","subject_code": "s3"},{"id": "exam-s3-114-2-q27","topic": "DL/Basics","question_text": "某智慧製造團隊在開發瑕疵影像檢測模型時,發現使用線性激活函數(Activation Function)後,模型的訓練準確率長期停滯,懷疑模型無法學習到足夠複雜的特徵表達。若要改善此問題,下列哪一項調整方案最為合適?","options": {"A": "增加卷積層(Convolutional Layer)數量,使網路更深以強化特徵提取","B": "將輸入影像先進行灰階化處理,降低運算量","C": "使用 Sigmoid 激活函數,以將輸出壓縮至 [0,1] 範圍","D": "改用 ReLU(Rectified Linear Unit)激活函數,以引入非線性並提升模型表達能力"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam.pdf","page": 6,"evidence": "answer column shows 'D' for question 27"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 線性激活的多層網路在數學上等同於單一線性轉換,無法學習非線性特徵;改用 ReLU(或其他非線性激活)即可賦予網路非線性表達能力,且 ReLU 計算高效、緩解梯度消失。\n\n**其他選項為何錯:**\n- A. 多堆線性層仍是線性,深度無助。\n- B. 灰階化降運算但不解決非線性表達問題。\n- C. Sigmoid 雖非線性,但深網中易梯度消失,且通常不用於隱藏層;不是最佳選擇。\n- D. ✓ 正解\n\n**記憶要點:** 深網要有非線性才能擬合複雜函數;隱藏層首選 ReLU。","subject_code": "s3"},{"id": "exam-s3-114-2-q28","topic": "Eval/Bias","question_text": "一家零售電商公司希望建立顧客流失預測模型,用以判斷哪些會員可能在三個月內不再消費。團隊以去年會員資料進行訓練,並採用「曾經購買三次以上」的活躍顧客紀錄作為樣本。模型上線後,對整體會員進行預測時,發現模型對於新註冊會員與低消費會員的預測準確率明顯偏低。下列何者為造成此現象最可能的原因?","options": {"A": "特徵設計未排除與會員忠誠度高度相關的變數,導致特徵偏差(Feature Bias)","B": "標記(Label)由人工標註,導致標籤偏差(Label Bias)","C": "訓練樣本僅涵蓋高活躍顧客,造成取樣偏差(Sampling Bias)","D": "模型未進行超參數調整,導致過擬合(Overfitting)"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 7,"evidence": "answer column shows 'C' for question 28"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 訓練資料只取「曾購買三次以上」這群高活躍顧客,部署時遇到新註冊或低消費會員(分佈不同),模型自然表現差 — 這是典型 Sampling Bias / Selection Bias。\n\n**其他選項為何錯:**\n- A. 特徵偏差描述的是特徵設計問題,題目核心是樣本取得方式。\n- B. 沒提到人工標註,且流失與否的標籤通常是事實。\n- C. ✓ 正解\n- D. 過擬合是訓練/驗證表現差,題目強調的是分佈差異。\n\n**記憶要點:** 訓練取樣只涵蓋特定群體 → Sampling Bias / Selection Bias。","subject_code": "s3"},{"id": "exam-s3-114-2-q29","topic": "Training/Validation","question_text": "在工業設備故障預測專案中,模型訓練與超參數調整均依賴於一段歷史數據作為驗證集。然而,隨著設備運行環境與工況條件的變化,原有驗證集已無法充分反映現況,導致模型在實際部署後的預測準確率逐漸下降。下列哪一種策略最能有效提升模型在長期運行環境中的穩定性與泛化能力?","options": {"A": "固定驗證集內容,並透過模型正則化技巧(如 L2 正則化)強化模型泛化","B": "將全部歷史資料納入訓練,不使用驗證集,依靠早期停止(Early Stopping)控制訓練","C": "簡化模型架構,減少模型參數數量以降低過擬合風險","D": "採用時間序列交叉驗證(Time Series Cross Validation)或滑動視窗驗證(Rolling Window Validation)方法,動態更新驗證資料以適應時間演進"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam.pdf","page": 7,"evidence": "answer column shows 'D' for question 29"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 時間序列 CV / Rolling Window 能讓驗證集隨時間滾動,反映最新分佈,有效應對 Concept Drift,符合長期運行需求。\n\n**其他選項為何錯:**\n- A. 固定驗證集無法追上分佈演變。\n- B. 沒驗證集 + 只靠 Early Stopping 仍無法應對 drift。\n- C. 簡化模型不解決時間漂移。\n- D. ✓ 正解\n\n**記憶要點:** 概念漂移(Concept Drift)+ 時間序列 → Time Series CV / Rolling Window。","subject_code": "s3"},{"id": "exam-s3-114-2-q30","topic": "Eval/Metrics","question_text": "某情感分析模型在英文資料集上取得 macro F1-score = 0.91。當該模型部署至西班牙文資料集時,F1-score 驟降至 0.58。下列哪一項解釋最合理,且與 F1-score 變化相關?","options": {"A": "macro F1-score 本身波動性高,建議改用 micro-average F1-score 評估","B": "模型在西班牙文語料上過度擬合,導致評估結果偏高","C": "語言轉移造成召回率(Recall)下降,模型無法正確辨識關鍵情緒詞彙","D": "以均方誤差(MSE)取代 F1-score 評估可獲得更準確的結果"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 7,"evidence": "answer column shows 'C' for question 30"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 跨語言轉移(English → Spanish)時,模型對新語言的情緒詞彙覆蓋不足,導致 Recall 下降;F1 = 2PR/(P+R) 對 Recall 變化敏感,自然驟降。\n\n**其他選項為何錯:**\n- A. macro vs micro 並非分數驟降的根本原因。\n- B. 過擬合會使表現偏好,但驟降不是過擬合的表現。\n- C. ✓ 正解\n- D. MSE 是迴歸指標,不適用分類。\n\n**記憶要點:** 跨域 / 跨語言 → Recall 通常先掉 → F1 隨之大降。","subject_code": "s3"},{"id": "exam-s3-114-2-q31","topic": "Modeling/Selection","question_text": "某能源公司利用歷史氣象與用電資料,開發長期電力需求預測模型,採用深度神經網路架構進行訓練。在訓練過程中,模型在訓練集上的損失值持續下降,但在驗證集上,損失在第 80 輪後開始波動,呈現週期性上升與下降。團隊懷疑模型受到季節性資料波動與隨機噪音影響,導致驗證損失難以穩定收斂。若要在此情境下合理運用早期停止法(Early Stopping)以確保模型具最佳泛化能力,下列哪一項策略最為適當?","options": {"A": "直接根據訓練集損失最低點停止訓練,以確保模型充分擬合所有樣本","B": "監控驗證集損失並設定適度的耐心值(Patience),在連續多輪未改善後再停止訓練","C": "改以測試集損失作為早停依據,以提升模型最終評估一致性","D": "將所有資料重新合併後訓練至收斂,避免因資料分割導致評估波動"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 7,"evidence": "answer column shows 'B' for question 31"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 標準 Early Stopping 流程:監控「驗證集」損失,設定 patience(如 10 epochs)避免短期震盪誤判停止;這正好應對題述驗證損失波動的情況。\n\n**其他選項為何錯:**\n- A. 訓練損失持續下降是過擬合徵兆,不能作為停止依據。\n- B. ✓ 正解\n- C. 測試集只能用於最終評估,不能參與訓練決策,否則造成資訊洩漏。\n- D. 合併資料無法評估泛化能力。\n\n**記憶要點:** Early Stopping = 監控 Validation Loss + Patience。","subject_code": "s3"},{"id": "exam-s3-114-2-q32","topic": "Feature/Selection","question_text": "某電信公司開發客戶流失預測模型,使用大量顧客行為特徵,例如通話時長、上網頻率、帳單金額、客服聯絡次數等。在訓練過程中,團隊發現部分特徵彼此高度相關,但同時也懷疑有些特徵對流失預測的貢獻有限。若希望模型在避免過擬合(Overfitting)的同時,能自動篩選出較具代表性的特徵,採用下列哪一種方法最為合適?","options": {"A": "使用早期停止法(Early Stopping)控制訓練回合數,避免過擬合","B": "同時移除多重共線性特徵並採用 L2 正則化(Ridge),以確保模型穩定收斂","C": "僅使用 L2 正則化(Ridge),抑制所有權重幅度但保留全部特徵","D": "採用 L1 正則化(Lasso),透過懲罰項使部分特徵係數縮為 0"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam.pdf","page": 8,"evidence": "answer column shows 'D' for question 32"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** L1 正則化(Lasso)的稀疏性會把不重要特徵的權重壓為 0,自動完成特徵選擇,同時抑制過擬合 — 完全對應題目「自動篩選有代表性特徵」需求。\n\n**其他選項為何錯:**\n- A. Early Stopping 只控制訓練輪數,不做特徵選擇。\n- B. 手動移除共線性 + L2 雖可,但「自動篩選」上 L1 更直接。\n- C. L2 不會把權重壓到 0,保留全部特徵。\n- D. ✓ 正解\n\n**記憶要點:** 自動特徵選擇 → Lasso (L1);只想穩定縮小權重 → Ridge (L2)。","subject_code": "s3"},{"id": "exam-s3-114-2-q33","topic": "ML/Algorithms","question_text": "某資料科學團隊正在開發一個客戶相似度比對系統,用於計算所有客戶之間的相似分數。若系統需逐一比對每一位客戶與其他所有客戶的資料組合,此時演算法的時間複雜度最可能為哪一種?其代表意義為何?","options": {"A": "O(n) — 執行時間與資料量成線性關係","B": "O(n²) — 執行時間與資料量平方成正比","C": "O(1) — 執行時間固定不變","D": "O(log n) — 執行時間與資料數呈對數成長關係"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 8,"evidence": "answer column shows 'B' for question 33"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 兩兩比對 n 個客戶,需要 C(n,2) ≈ n²/2 次計算,屬於 O(n²) 平方時間複雜度。\n\n**其他選項為何錯:**\n- A. O(n) 為線性,僅單次掃描。\n- B. ✓ 正解\n- C. O(1) 為常數時間,不隨資料量變化。\n- D. O(log n) 是二分搜尋或平衡樹查詢。\n\n**記憶要點:** All-pairs 比較 → O(n²);可用近似(LSH、聚類索引)降到接近 O(n log n)。","subject_code": "s3"},{"id": "exam-s3-114-2-q34","topic": "Training/Validation","question_text": "某醫療人工智慧團隊正在開發心臟病風險預測模型,資料量僅有 150 筆,其中陽性個案不到 8%。由於樣本稀少且類別分布極不平衡,團隊希望在有限資料下,仍能準確評估模型在不同資料上的表現穩定性,同時避免訓練資料被過度切分而影響模型效能。若團隊希望在有限樣本下,同時兼顧資料的利用率與各類別在驗證折中的比例一致性,最適合採用下列哪一種交叉驗證方法?","options": {"A": "5-Fold 交叉驗證(5-Fold Cross Validation)","B": "留一法交叉驗證(Leave-One-Out Cross Validation)","C": "隨機交叉驗證(Random Cross Validation)","D": "分層留一法交叉驗證(Stratified Leave-One-Out Cross Validation)"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam.pdf","page": 8,"evidence": "answer column shows 'D' for question 34"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 樣本極少(150 筆) + 嚴重不平衡(< 8% 陽性),需要 (1) 最大化資料利用率 → LOOCV(訓練用 N−1)、(2) 維持類別比例 → Stratified;兩者結合即 Stratified LOOCV,最符合需求。\n\n**其他選項為何錯:**\n- A. 5-fold 資料利用率較低,小樣本下每折更不穩。\n- B. 一般 LOOCV 不保證類別比例。\n- C. 「隨機」會把少數陽性樣本亂分佈。\n- D. ✓ 正解\n\n**記憶要點:** 小樣本 + 不平衡 → Stratified LOOCV。","subject_code": "s3"},{"id": "exam-s3-114-2-q35","topic": "Feature/Engineering","question_text": "某公司針對製程感測器資料進行主成分分析(PCA),經標準化與協方差矩陣分解後,得到三個主成分的特徵值如下:λ₁=6.0,λ₂=3.0,λ₃=1.0。若團隊決定僅保留能解釋至少 80% 總變量的主成分,以進行後續模型建構,下列哪一項敘述最合理且數據解讀正確?","options": {"A": "前兩個主成分合計解釋 90% 的總變量,因此可安全降維至二維,且仍保留大部分資訊","B": "第一主成分解釋 60% 的變量,表示資料結構呈現明顯線性關係,僅保留一維即可避免過擬合","C": "雖然前兩個主成分可解釋超過 80% 變量,但第二主成分仍貢獻高達 30%,不宜捨棄第三主成分","D": "三個特徵值相差不大,顯示各主成分變異均勻,降維可能導致資料損失"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam.pdf","page": 9,"evidence": "answer column shows 'A' for question 35"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 總變量 = 6+3+1 = 10;前兩個主成分 = (6+3)/10 = 90%,超過 80% 門檻,降至 2 維是合理選擇。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 第一主成分解釋 6/10 = 60%,但「線性結構」推論過頭;且只保一維會犧牲 40% 變異。\n- C. 第二主成分貢獻 30%,但前兩個合計 90%,捨第三是合理的(只損失 10%)。\n- D. λ₁=6 與 λ₃=1 差六倍,並非均勻。\n\n**記憶要點:** PCA 累積解釋變異 = Σλ_i / Σλ_total;通常取累積 ≥ 80%~95%。","subject_code": "s3"},{"id": "exam-s3-114-2-q36","topic": "Privacy/Compliance","question_text": "某銀行計畫與多家合作機構共同訓練一個 AI 信用風險預測模型,為避免客戶交易資料在傳輸與運算過程中外洩,技術團隊評估使用同態加密(Homomorphic Encryption)技術。下列何者最能正確描述同態加密在此應用中的關鍵特性?","options": {"A": "系統以隨機雜訊(Noise)干擾輸出,確保統計結果不洩漏個資","B": "各參與銀行透過安全通道交換私鑰,確保模型參數一致","C": "將原始資料壓縮並同時加密,以減少加密後資料量與運算時間","D": "資料在加密狀態下仍可進行數值運算,模型訓練可於未解密資料上完成"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam.pdf","page": 9,"evidence": "answer column shows 'D' for question 36"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 同態加密的核心特性就是「密文上可運算 + 解密後等同明文運算結果」,讓多方協作時不需互相分享明文資料即可訓練模型。\n\n**其他選項為何錯:**\n- A. 加噪聲是差分隱私(Differential Privacy)。\n- B. 私鑰交換並非同態加密本身的特性。\n- C. 同態加密通常會「擴大」資料量與運算時間,不是壓縮。\n- D. ✓ 正解\n\n**記憶要點:** Homomorphic Encryption = 密文可算;Differential Privacy = 加雜訊。","subject_code": "s3"},{"id": "exam-s3-114-2-q37","topic": "Privacy/Compliance","question_text": "某跨銀行風控平台希望整合多家銀行的用戶行為資料,用於訓練信用風險預測模型。由於競爭與法規限制,各銀行僅願意提供加密後資料,且資料在任何時間不得被平台解密。同時,平台需建立安全通訊協議以確保資料在傳輸過程未被竄改或重放。下列哪一組技術最能完整對應上述需求?","options": {"A": "對稱加密(Symmetric Encryption) + 單向雜湊(Hash Function) + 非對稱加密(Asymmetric Encryption) + 差分隱私(Differential Privacy)","B": "同態加密(Homomorphic Encryption) + 非對稱加密(Asymmetric Encryption) + 單向雜湊(One-way Hash Function) + 對稱加密(Symmetric Encryption)","C": "差分隱私(Differential Privacy) + 對稱加密(Symmetric Encryption) + 同態加密(Homomorphic Encryption) + 數位簽章(Digital Signature)","D": "同態加密(Homomorphic Encryption) + 安全多方計算(Secure Multi-party Computation, MPC) + 雜湊函數(Hash Function) + 對稱加密(Symmetric Encryption)"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 9,"evidence": "answer column shows 'B' for question 37"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 需求拆解:(1) 加密狀態仍能訓練 → 同態加密;(2) 安全金鑰交換 → 非對稱加密(公私鑰);(3) 傳輸完整性(防竄改、重放) → 單向雜湊(訊息摘要);(4) 大量資料加密效率 → 對稱加密。B 完整對應這四項。\n\n**其他選項為何錯:**\n- A. 沒有同態加密,無法在加密狀態下訓練。\n- B. ✓ 正解\n- C. 沒有非對稱加密(金鑰交換)組件較弱。\n- D. MPC 雖能達類似目的但題目強調的是「加密後資料」,且缺非對稱加密。\n\n**記憶要點:** 加密訓練 + 金鑰交換 + 完整性 + 高效加密 = HE + Asymmetric + Hash + Symmetric。","subject_code": "s3"},{"id": "exam-s3-114-2-q38","topic": "Eval/Metrics","question_text": "[此題包含附圖:Python 程式碼]\n\n```python\ndef metric(y_true, y_pred):\n    return sum((y_true - y_pred) ** 2) / len(y_true)\n```\n\n附圖程式碼所計算的是哪一類型的評估指標?","options": {"A": "MAE","B": "MSE","C": "RMSE","D": "R²"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 10,"evidence": "answer column shows 'B' for question 38"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 程式碼計算 Σ(y_true − y_pred)² / N,正是均方誤差(Mean Squared Error, MSE)的定義。\n\n**其他選項為何錯:**\n- A. MAE 用絕對值 |y_true − y_pred|,不是平方。\n- B. ✓ 正解\n- C. RMSE 是 MSE 再開根號,程式碼沒有 sqrt。\n- D. R² 公式涉及 SSE 與 SST 的比值,結構完全不同。\n\n**記憶要點:** 平方/N → MSE;再開根 → RMSE;絕對值/N → MAE。","image": "shared/images/exam-s3-114-2-q38-p10.png","subject_code": "s3"},{"id": "exam-s3-114-2-q39","topic": "DL/Optimization","question_text": "[此題包含附圖:Python 程式碼]\n\n```python\ndef forward(x, p, training=True):\n    if training:\n        mask = np.random.binomial(1, p, size=x.shape)\n        return x * mask / p\n    else:\n        return x\n```\n\n附圖程式碼實現的是哪一種正則化技術?","options": {"A": "L1 正則化","B": "L2 正則化","C": "Dropout","D": "Batch Normalization"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 10,"evidence": "answer column shows 'C' for question 39"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 訓練時隨機產生 0/1 mask(Bernoulli)並乘上輸入,再除以 p(inverted dropout 的縮放補償);測試時直接回傳輸入 — 完全是 Dropout 的標準實作。\n\n**其他選項為何錯:**\n- A. L1 是在 loss 加 |w|,與隨機 mask 無關。\n- B. L2 是在 loss 加 w²,亦無關。\n- C. ✓ 正解\n- D. Batch Norm 是按 batch 標準化激活值,結構完全不同。\n\n**記憶要點:** 隨機關閉神經元 + 訓練/推論不同行為 = Dropout(inverted dropout 除以 p)。","image": "shared/images/exam-s3-114-2-q39-p10.png","subject_code": "s3"},{"id": "exam-s3-114-2-q40","topic": "Math/LinAlg","question_text": "依據附圖程式碼進行資料處理,下列何者正確?\n\n```python\nimport numpy as np\nv1 = np.array([1, 2, 3])\nv2 = np.array([4, 5, 6])\nA = np.array([[1, 2], [3, 4]])\n```","options": {"A": "np.linalg.inv(A) 計算矩陣 A 的行列式","B": "v1 * v2 結果為 array([5, 7, 9])","C": "np.dot(v1, v2) 結果為 np.int64(32)","D": "np.linalg.eig(A) 計算矩陣 A 的反矩陣"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 10,"evidence": "answer column shows 'C' for question 40"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** np.dot(v1, v2) 計算向量內積 = 1·4 + 2·5 + 3·6 = 4+10+18 = 32,回傳值為 np.int64(32)。\n\n**其他選項為何錯:**\n- A. `np.linalg.inv(A)` 計算「反矩陣」,行列式是 `np.linalg.det(A)`。\n- B. `v1 * v2` 是 element-wise 乘法 = [4, 10, 18],不是 [5, 7, 9](那是加法)。\n- C. ✓ 正解\n- D. `np.linalg.eig(A)` 計算特徵值與特徵向量,不是反矩陣。\n\n**記憶要點:** NumPy:inv → 反矩陣;det → 行列式;eig → 特徵值;dot → 內積。","subject_code": "s3"},{"id": "exam-s3-114-2-q41","topic": "Math/Probability","question_text": "[此題包含附圖:擲骰子 Monte Carlo 程式碼]\n\n```python\nimport numpy as np\nnp.random.seed(123)\nn = 100000\ndice_rolls = np.random.randint(1, 7, size=n)\nA = (dice_rolls % 2 == 0)\nB = (dice_rolls > 3)\nA_and_B = A & B\n```\n\n事件 A:擲出偶數;事件 B:擲出大於 3。請問下列何者為條件機率 P(A|B) 的正確值?","options": {"A": "A_and_B.sum() / (A.sum() * B.sum())","B": "A_and_B.sum() / (A.sum() + B.sum())","C": "A_and_B.sum() / A.sum()","D": "A_and_B.sum() / B.sum()"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam.pdf","page": 10,"evidence": "answer column shows 'D' for question 41"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 條件機率定義 P(A|B) = P(A ∩ B) / P(B);Monte Carlo 估計分子 ≈ A_and_B.sum()/n、分母 ≈ B.sum()/n,n 消去後 = A_and_B.sum() / B.sum()。\n\n**其他選項為何錯:**\n- A. 此式為 P(A ∩ B) / (n · P(A)·P(B)),為獨立情況下的偏離指標,非條件機率。\n- B. 分母改為和,公式錯誤。\n- C. C 是 P(B|A),不是 P(A|B)。\n- D. ✓ 正解\n\n**記憶要點:** P(A|B) = P(A∩B)/P(B),條件以「B」為分母。","image": "shared/images/exam-s3-114-2-q41-p10.png","subject_code": "s3"},{"id": "exam-s3-114-2-q42","topic": "DL/CNN","question_text": "[此題包含 VGG16 模型結構附圖]\n\n在深度神經網路中,不同層的參數量(parameter count)差異極大。有些層雖然數量少但計算量大,有些則相反。了解參數分佈情形,有助於模型壓縮與遷移學習設計。請問在 VGG16 中,下列何者的參數量最多?","options": {"A": "卷積層(Conv2d)","B": "全連接層(Linear)","C": "ReLU 激活函數","D": "池化層(MaxPool2d, AdaptiveAvgPool2d)"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 13,"evidence": "answer column shows 'B' for question 42"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** VGG16 全連接層(尤其第一層 Linear-33 約 1.027 億參數)主導整體 138.36M 參數;卷積層因參數共享反而相對少。\n\n**其他選項為何錯:**\n- A. 卷積層參數量遠小於 FC(基於卷積核大小與通道,而非展平後的維度)。\n- B. ✓ 正解\n- C. ReLU 沒有可學習參數。\n- D. 池化層沒有可學習參數。\n\n**記憶要點:** VGG 系列參數爆炸點 = 第一個 FC(展平後 × 4096);現代設計改用 Global Avg Pool 避開。","image": "shared/images/exam-s3-114-2-q42-p13.png","subject_code": "s3"},{"id": "exam-s3-114-2-q43","topic": "DL/CNN","question_text": "在神經網路中,了解各層的運算量分佈,有助於模型壓縮與硬體加速的策略設計。請問在 VGG16 中,下列何者運算量(FLOPs)最多?","options": {"A": "卷積層(Conv2d)","B": "全連接層(Linear)","C": "ReLU 激活函數","D": "池化層(MaxPool2d, AdaptiveAvgPool2d)"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam.pdf","page": 11,"evidence": "answer column shows 'A' for question 43"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** VGG 中卷積層雖然參數量少,但每個卷積核要在大張特徵圖上滑動運算,FLOPs 遠遠超過 FC 層(FC 是矩陣乘法但輸入維度小)。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. FC 雖參數多,但只算一次矩陣乘,FLOPs 不及大張特徵圖上的卷積。\n- C. ReLU 是 element-wise 比較,FLOPs 很少。\n- D. Pooling 也是 element-wise 操作,FLOPs 少。\n\n**記憶要點:** CNN 參數量多 ≠ FLOPs 多;卷積層 FLOPs 大、FC 層參數量大,是典型分佈。","subject_code": "s3"},{"id": "exam-s3-114-2-q44","topic": "DL/CNN","question_text": "[此題基於 VGG16 模型表]\n\nVGG16 層數深且結構規則,由多層卷積、池化及全連接層組成。了解各層的輸入/輸出維度、參數量及記憶體需求,有助於掌握 CNN 模型的組成邏輯與實作技巧。根據 VGG16 的模型架構,下列敘述何者正確?","options": {"A": "AdaptiveAvgPool2d 的輸出會被攤平後傳入第一個全連接層;由於前一層池化輸出空間為 4×4,所以第一個線性層的輸入維度是 512×4×4 = 8192","B": "Linear-33(第一個全連接層)報出的 102,764,544 參數只包含權重,偏差(bias)沒有算在內","C": "根據列出的「Estimated Total Size (MB) = 624.98」,表示訓練此模型只需大約 625MB 的 GPU 記憶體(包含所有 optimizer state 與梯度),所以一張 1 GB 的 GPU 就足夠訓練","D": "VGG16 包含 13 層卷積(conv)與 3 層全連接層(FC),總參數數目約為 138,357,544(約 138.36M)"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam.pdf","page": 13,"evidence": "answer column shows 'D' for question 44"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** VGG16 標準架構就是 13 conv + 3 FC = 16 個權重層,總參數 ≈ 138.36M,與表底「Total params: 138,357,544」一致。\n\n**其他選項為何錯:**\n- A. 由表中 AdaptiveAvgPool2d 輸出為 [512, 7, 7],所以 FC 輸入 = 512·7·7 = 25088,而非 8192。\n- B. Linear 的參數計算 (in_features+1) × out_features,通常包含 bias;102,764,544 = 25088·4096 + 4096 已含偏差。\n- C. Estimated Total Size 只是前向/反向的記憶體估算,不含 optimizer state 與梯度;實際訓練需要更多。\n- D. ✓ 正解\n\n**記憶要點:** VGG16 = 16 個有權重層(13 conv + 3 FC),params ≈ 138M。","image": "shared/images/exam-s3-114-2-q44-p13.png","subject_code": "s3"},{"id": "exam-s3-114-2-q45","topic": "DL/CNN","question_text": "[此題包含 4 段 PyTorch 程式碼附圖] 在實務應用中,我們常使用遷移學習(transfer learning)技巧,即載入預訓練模型(如 VGG16),凍結部分層的參數,只針對特定任務重新訓練最後幾層,這種做法可節省訓練時間並提升模型效能。假設你要對 VGG16 進行遷移學習(transfer learning),希望凍結卷積層的參數,只訓練最後全連接層(classifier)。下列哪段程式碼寫法正確?","options": {"A": "對 model.parameters() 全部凍結後,再重新指定 classifier[6]","B": "對 model.features.parameters() 凍結後,重新指定 classifier[6] = nn.Linear(4096, 10)","C": "對 model.classifier.parameters() 凍結後,重新指定 classifier[6]","D": "對 model.requires_grad = False 後,重新指定 classifier[6]"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 13,"evidence": "answer column shows 'B' for question 45"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 凍結「卷積層」應只針對 `model.features.parameters()`(VGG 將卷積堆放在 `features` 子模組);classifier 保留可訓練,再覆寫 classifier[6] 為新任務的輸出層。\n\n**其他選項為何錯:**\n- A. 全部凍結後 classifier[6] 雖被替換成可訓練的新層,但仍可訓練;不過題目強調是「凍結卷積、訓練 classifier 全部」,A 雖部分對但不夠準確。\n- B. ✓ 正解\n- C. 反了:凍結了 classifier,反而訓練 features,不符合題意。\n- D. `model.requires_grad = False` 語法錯誤(此屬性是 tensor 級別,不是 model 級別)。\n\n**記憶要點:** Transfer Learning 標準步驟:凍結 features → 換 classifier 最後一層 → 訓練 classifier。","image": "shared/images/exam-s3-114-2-q45-p13.png","subject_code": "s3"},{"id": "exam-s3-114-2-q46","topic": "Feature/Engineering","question_text": "[此題包含 noisy 手寫數字 PCA 程式碼附圖]\n\n```\nfrom sklearn.decomposition import PCA  #程式碼A\npca = PCA()                            #程式碼B\npca.fit(noisy)                         #程式碼C\ncomponents = pca.transform(noisy)      #程式碼D\nfiltered = pca.inverse_transform(components)\n```\n\n假設研究人員已將含有雜訊的手寫數字影像存放在變數 noisy 中。他們嘗試使用 PCA 進行降噪,並希望能保留影像的主要特徵,同時去除影像中的雜訊。然而,當程式執行後,觀察到影像仍然含有明顯的雜訊。研究人員懷疑是程式中某個步驟的設定不正確,導致 PCA 沒有發揮降噪的作用,需要修改程式碼才能讓 PCA 對 noisy 影像有效去噪。請問哪一段程式碼需要修改,才能讓 PCA 對 noisy 影像有效去噪?","options": {"A": "程式碼 A","B": "程式碼 B","C": "程式碼 C","D": "程式碼 D"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 15,"evidence": "answer column shows 'B' for question 46"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** `PCA()` 不指定 `n_components` 時保留全部主成分,經 transform → inverse_transform 後幾乎完整還原原始(含雜訊)影像 — 沒有降維就沒有去噪。修正應為 `PCA(n_components=k)`(k < 原始維度),只保留前 k 個主成分後再重建,才能濾掉雜訊較大的高階成分。\n\n**其他選項為何錯:**\n- A. import 語法正確。\n- B. ✓ 正解\n- C. `fit` 用法正確。\n- D. `transform` 用法正確。\n\n**記憶要點:** PCA 降噪 = `PCA(n_components=k)` 保留前 k 個 + inverse_transform 重建。","image": "shared/images/exam-s3-114-2-q46-p15.png","subject_code": "s3"},{"id": "exam-s3-114-2-q47","topic": "Training/Validation","question_text": "[此題包含 4 段 KNN + Cross-Validation 程式碼附圖] 研究人員在對 digits 資料集進行分類時,決定使用 KNN 並搭配交叉驗證來評估模型準確率。他們撰寫了四組不同的程式碼來進行 KNN 訓練與交叉驗證,但不確定哪幾組程式碼能正確執行並輸出準確率。每組程式碼在資料切割、模型訓練、交叉驗證函式的使用上略有差異,研究人員希望找出可以正確完成任務的程式碼組合,以確保模型評估的可靠性。請問哪幾組程式碼能正確使用 KNN 搭配交叉驗證,對 digits 資料集進行訓練並輸出準確率?","options": {"A": "程式碼 A、程式碼 B、程式碼 C、程式碼 D","B": "程式碼 A、程式碼 C","C": "程式碼 A、程式碼 B","D": "程式碼 C、程式碼 D"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam.pdf","page": 15,"evidence": "answer column shows 'B' for question 47"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 題目要求「輸出準確率」(accuracy),scoring 必須設為 `\"accuracy\"`。\n- 程式碼 A:`scoring=\"accuracy\"` ✓\n- 程式碼 C:`scoring=\"accuracy\"` ✓\n- 程式碼 B、D:`scoring=\"f1\"`,且 f1 預設只支援二元;digits 是 10 類多分類,會報錯。\n\n**其他選項為何錯:**\n- A. 含 B、D(scoring 設為 f1 對多分類錯誤)。\n- B. ✓ 正解\n- C. 含 B(同上問題)。\n- D. 含 D(同上問題)。\n\n**記憶要點:** `cross_val_score` 的 `scoring` 要對應任務:分類用 'accuracy' / 'f1_macro' 等,多分類不能直接 'f1'。","image": "shared/images/exam-s3-114-2-q47-p15.png","subject_code": "s3"},{"id": "exam-s3-114-2-q48","topic": "Feature/Engineering","question_text": "[此題基於 Titanic 資料集標準化程式碼]\n\n```python\nX_train -= X_train.mean(axis=0)\nX_train /= X_train.std(axis=0)\nX_test -= X_test.mean(axis=0)\nX_test /= X_test.std(axis=0)\n```\n\nA:X_train -= X_train.mean(axis=0) 將每個訓練集特徵的平均值調整為 0\nB:X_train /= X_train.std(axis=0) 將每個訓練集特徵的標準差調整為 0\nC:X_train 處理結果會將資料壓縮到 0 和 1 之間\nD:標準化結果可防止梯度爆炸或消失\nE:標準化是屬於特徵選擇(Feature Selection)方法\nF:X_train 程式碼應修正為 X_train = X_train.std(axis=0), X_test 程式碼應修正為 X_test = X_test.std(axis=0)","options": {"A": "A、B、C、D","B": "A、E","C": "A、D","D": "A、C、F"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 17,"evidence": "answer column shows 'C' for question 48"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** \n- A 正確:減去 mean 後平均變為 0。\n- D 正確:Z-score 標準化讓特徵分佈穩定,有助梯度數值不致爆炸或消失。\n- B 錯誤:除以 std 後標準差變為 1,而非 0。\n- C 錯誤:Z-score 結果分佈於 0 附近,不限制於 [0,1](Min-Max 才會)。\n- E 錯誤:標準化是 Feature Scaling,不是 Feature Selection。\n- F 錯誤:把原本「除以」改成「等於 std」會破壞標準化。\n\n注意題目本身存在資料洩漏疑慮(測試集用自己的 mean/std),但本題只測這六項敘述對錯。\n\n**其他選項為何錯:**\n- A. 含錯誤敘述 B、C。\n- B. 含錯誤敘述 E。\n- C. ✓ 正解\n- D. 含錯誤敘述 C、F。\n\n**記憶要點:** Z-score:減 mean、除 std → 均值 0、std 1;非 0~1 區間。","image": "shared/images/exam-s3-114-2-q48-p17.png","subject_code": "s3"},{"id": "exam-s3-114-2-q49","topic": "DL/Basics","question_text": "[此題基於 Keras Sequential 模型 summary 結果,輸入維度為 9 (X_train.shape[1]=9),隱藏層為 dense(10)+dense(10)+dense(1)]\n\n```python\nmodel = Sequential()\nmodel.add(Input(shape=(X_train.shape[1],)))\nmodel.add(Dense(10, activation=\"relu\"))\nmodel.add(Dense(10, activation=\"relu\"))\nmodel.add(Dense(1, activation=\"sigmoid\"))\n```\n\n空格 1 (第一個 Dense 的參數量) 與空格 2 (第二個 Dense 的參數量) 為何?","options": {"A": "activation=\"relu\" 其數學式為 f(x) = 1/(1+e^-x)","B": "空格 1 值為 110,空格 2 值為 100","C": "空格 1 值為 100,空格 2 值為 110","D": "activation=\"sigmoid\" 一般用於多類別分類預測模型"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 18,"evidence": "answer column shows 'C' for question 49"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** \n- 第一個 Dense(10):輸入 9 → 10,參數 = 9·10 + 10 (bias) = 100。\n- 第二個 Dense(10):輸入 10 → 10,參數 = 10·10 + 10 = 110。\n\n**其他選項為何錯:**\n- A. `f(x) = 1/(1+e⁻ˣ)` 是 Sigmoid 的公式,不是 ReLU;ReLU 是 max(0, x)。\n- B. 數值顛倒。\n- C. ✓ 正解\n- D. Sigmoid 用於「二元」分類;多類別分類用 Softmax。\n\n**記憶要點:** Dense 參數 = (in × out) + out_bias。","image": "shared/images/exam-s3-114-2-q49-p18.png","subject_code": "s3"},{"id": "exam-s3-114-2-q50","topic": "Training/Validation","question_text": "[此題基於 Titanic Keras 訓練曲線:Training Loss 持續下降至 ~0.4,Validation Loss 在 0.45 附近震盪]\n\n```python\nhistory = model.fit(X_train, y_train, validation_split=0.2, epochs=100, batch_size=10)\nplt.plot(epochs, loss, 空格1, label=\"Training Loss\")\nplt.plot(epochs, val_loss, 空格2, label=\"Validation Loss\")\n```\n\nA:空格 1 須填入 \"b-\"\nB:空格 2 須填入 \"b--\"\nC:空格 1 須填入 \"r-\"\nD:空格 2 須填入 \"r--\"\nE:驗證損失明顯較訓練損失減少更明顯","options": {"A": "B、C","B": "A、C、D","C": "A、D","D": "C、D、E"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam.pdf","page": 18,"evidence": "answer column shows 'C' for question 50"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 由附圖可見:訓練損失為「藍實線(b-)」,驗證損失為「紅虛線(r--)」。\n- A 正確:空格 1 = \"b-\"。\n- D 正確:空格 2 = \"r--\"。\n- B 錯誤:Validation 是紅色虛線 \"r--\",不是 \"b--\"。\n- C 錯誤:Training 是藍色實線 \"b-\",不是 \"r-\"。\n- E 錯誤:由圖驗證損失早早平緩,訓練損失反而持續下降更明顯,典型過擬合徵兆。\n\n**其他選項為何錯:**\n- A. 含錯誤 B。\n- B. 含錯誤 C。\n- C. ✓ 正解\n- D. 含錯誤 C 與 E。\n\n**記憶要點:** matplotlib 顏色+樣式:b=blue, r=red;-=solid, --=dashed。","image": "shared/images/exam-s3-114-2-q50-p18.png","subject_code": "s3"},{"id": "exam-s3-115-1-q1","topic": "Math/Probability","question_text": "某量化投資團隊需估算某投資組合未來 30 日的風險值。由於衍生性金融商品的定價模型過於複雜,無法以解析解直接求得,工程師因此採用隨機模擬方式,產生大量市場情境模擬並估計損失分布。此方法屬於下列哪一種技術框架?","options": {"A": "馬可夫鏈(Markov Chain):以狀態轉移機率描述系統演變的隨機過程","B": "梯度下降最佳化(Gradient Descent):透過迭代更新參數以最小化損失函數","C": "蒙地卡羅方法(Monte Carlo Method):透過大量隨機抽樣近似機率分布或數值結果","D": "貝氏推論(Bayesian Inference):結合先驗分布與資料更新後驗機率"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 1,"evidence": "answer column shows 'C' for question 1"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 題目描述「產生大量市場情境模擬並估計損失分布」,正是蒙地卡羅方法(Monte Carlo Method)的定義——用大量隨機抽樣近似機率分布或數值結果,常用於無解析解的風險值(VaR)估算。\n\n**其他選項為何錯:**\n- A. 馬可夫鏈描述的是狀態依機率轉移的隨機過程,重點在轉移機率而非大量抽樣估計損失分布。\n- B. 梯度下降是迭代最佳化演算法,用於最小化損失函數以求解模型參數,與風險模擬無關。\n- C. ✓ 正解\n- D. 貝氏推論是用先驗分布結合觀測資料更新後驗機率,並非透過大量隨機抽樣模擬市場情境。\n\n**記憶要點:** 大量隨機抽樣、無解析解 → 想到 Monte Carlo Method。","subject_code": "s3"},{"id": "exam-s3-115-1-q2","topic": "ML/Supervised","question_text": "某工程師在建立房價預測模型時,訓練資料中存在少數豪宅(成交價超過一般物件 10 倍以上)。若工程師希望模型對這些極端高價物件的預測誤差更敏感,並在訓練時產生較大的梯度更新影響,應優先選擇下列哪種損失函數?","options": {"A": "平均絕對誤差(MAE):對誤差進行線性懲罰,對離群值較不敏感,梯度近似固定","B": "Huber 損失(Huber Loss):小誤差採平方懲罰,大誤差轉為線性懲罰,以降低離群值影響","C": "均方誤差(MSE):對誤差進行平方處理,使大誤差產生更大的懲罰與梯度","D": "交叉熵損失(Cross-Entropy Loss):用於分類問題的機率分布差異衡量"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 1,"evidence": "answer column shows 'C' for question 2"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 均方誤差(MSE)對誤差取平方,誤差越大懲罰與梯度越大,因此模型會被迫更關注這些少數極端高價物件,符合「對離群值更敏感、梯度更新更大」的需求。\n\n**其他選項為何錯:**\n- A. MAE 對誤差線性懲罰,梯度大小近似固定,不會因誤差變大而放大更新幅度,對離群值反而較不敏感。\n- B. Huber 損失刻意讓大誤差轉為線性懲罰,目的正是降低離群值影響,與題目需求相反。\n- C. ✓ 正解\n- D. 交叉熵損失用於分類機率分布衡量,不適用於連續數值的房價迴歸。\n\n**記憶要點:** 想放大離群值影響 → MSE(平方懲罰);想降低離群值影響 → MAE / Huber。","subject_code": "s3"},{"id": "exam-s3-115-1-q3","topic": "Math/LinAlg","question_text": "某工程師在撰寫 Transformer 的 Attention 層時,需手動驗證矩陣維度是否相容。輸入矩陣 Q 已攤平成形狀為(1, 10),Query 投影權重矩陣 W 形狀為(10, 64)。執 Q 行 Q x W 後輸出的形狀為何?Q","options": {"A": "(1, 64)","B": "(10, 10)","C": "(64, 1)","D": "維度不相容,無法相乘"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 1,"evidence": "answer column shows 'A' for question 3"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 矩陣相乘(m, n)x(n, p)的規則是「前矩陣行數需等於後矩陣列數」,結果形狀為(m, p)。Q 為(1, 10),W 為(10, 64),兩者中間維度 10 相符,可相乘,結果形狀為(1, 64)。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. (10, 10)不符合矩陣乘法規則,把兩個矩陣的「非共用維度」錯誤地組合在一起。\n- C. (64, 1)顛倒了正確結果的行列順序。\n- D. 中間維度 10 與 10 相符,矩陣是相容可相乘的,並非不相容。\n\n**記憶要點:** (m, n)×(n, p) = (m, p),中間的 n 要相等且會被「消掉」。","subject_code": "s3"},{"id": "exam-s3-115-1-q4","topic": "DL/CNN","question_text": "某 AI 團隊同時開發多個影像辨識系統,並在訓練流程中統一加入資料擴增策略(包含隨機水平翻轉)以提升模型泛化能力。實驗後發現,部分任務的測試表現明顯下降。下列哪一項任務最可能因該資料擴增策略引入語意錯誤(Semantic Inconsistency),使同一樣本在翻轉後對應不同類別標籤,進而影響模型學習?","options": {"A": "寵物監控中的貓狗分類","B": "車輛辨識中的車型分類","C": "手寫數字辨識","D": "道路場景中的行人偵測"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 1,"evidence": "answer column shows 'C' for question 4"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 手寫數字辨識中,部分數字(如 6 與 9)水平翻轉後會變成另一個合法但不同類別的數字,使同一張影像在翻轉前後對應不同標籤,產生語意錯誤(Semantic Inconsistency),因此最容易被隨機水平翻轉這種資料擴增策略破壞。\n\n**其他選項為何錯:**\n- A. 貓狗外觀左右不對稱但翻轉後仍是貓或狗,類別不會改變。\n- B. 車型分類的車輛翻轉後仍是同一車型,類別語意不變。\n- C. ✓ 正解\n- D. 行人翻轉後仍是行人,偵測類別不受影響。\n\n**記憶要點:** 資料擴增要先確認「翻轉/旋轉後標籤是否還成立」,數字、文字類最容易因對稱結構而變義。","subject_code": "s3"},{"id": "exam-s3-115-1-q5","topic": "Math/Statistics","question_text": "某工程師完成多元線性迴歸模型後,繪製殘差圖(Residual Plot),發現殘差隨預測值增大而呈現擴散現象(右側明顯比左側分散)。此現象最可能代表什麼問題?","options": {"A": "殘差之間存在關聯","B": "特徵之間高度相關","C": "殘差變異數不一致","D": "殘差不符合常態分布"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 1,"evidence": "answer column shows 'C' for question 5"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 殘差圖中若殘差隨預測值增大而擴散(變異程度不一致),代表誤差的變異數並非常數,即「殘差變異數不一致」(Heteroscedasticity),違反線性迴歸「等變異性」的基本假設。\n\n**其他選項為何錯:**\n- A. 殘差之間存在關聯(自相關)通常從時間序列殘差圖的規律型態判斷,與本題的擴散型態不同。\n- B. 特徵高度相關是共線性問題,需看特徵間相關係數或 VIF,殘差圖看不出來。\n- C. ✓ 正解\n- D. 殘差是否常態分布要用 Q-Q 圖或常態檢定判斷,「隨預測值擴散」反映的是變異數不均,不是分布形狀。\n\n**記憶要點:** 殘差圖呈現「喇叭狀」擴散 → 變異數不一致(Heteroscedasticity)。","subject_code": "s3"},{"id": "exam-s3-115-1-q6","topic": "Feature/Engineering","question_text": "某資料科學家欲對 512 維詞嵌入向量(共 10 萬筆)進行視覺化以探索群集結構,同時另一工程師需將 200 個製程特徵降維後作為 XGBoost 的輸入特徵。關於 t-SNE 與 PCA 選型,下列敘述何者最正確?","options": {"A": "t-SNE 保留全局線性結構,適合作為 XGBoost 的降維前處理","B": "t-SNE 保留局部鄰域結構,適合視覺化;但不保留全局結構,不適合作為模型輸入特徵","C": "PCA 為非線性降維方法,能保留複雜流形結構","D": "t-SNE 與 PCA 皆可直接對新資料進行線性外推"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 2,"evidence": "answer column shows 'B' for question 6"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** t-SNE 專注保留資料的局部鄰域結構,能呈現群集分離效果,適合視覺化;但它不保留全局距離/線性結構,且無法對新資料直接外推,因此不適合作為下游模型(如 XGBoost)的特徵輸入。\n\n**其他選項為何錯:**\n- A. t-SNE 保留的是局部結構而非全局線性結構,說反了。\n- B. ✓ 正解\n- C. PCA 是線性降維方法,只能捕捉線性結構,無法保留複雜非線性流形。\n- D. t-SNE 沒有明確的參數化映射,無法對新資料做線性外推;只有 PCA 具備此特性。\n\n**記憶要點:** t-SNE → 視覺化用(局部結構);PCA → 可作模型特徵(全局線性結構,能外推新資料)。","subject_code": "s3"},{"id": "exam-s3-115-1-q7","topic": "Feature/Selection","question_text": "某金融團隊建立信貸風險模型,特徵工程後共產生 200 個變數,其中「月收入」、「年收入」、「季收入」三者高度相關。模型上線後業務單位反映:每次重新訓練後,模型輸出的重要特徵清單在這些高度相關特徵間反覆變動,難以向審查單位解釋。請問下列何者為造成此現象最可能的原因?","options": {"A": "模型使用 L2 正則化,導致所有特徵係數被壓縮至接近零,重要性難以區分","B": "模型使用 L1 正則化,面對高度相關特徵時隨機保留其中之一,導致每次訓練保留的特徵不穩定","C": "模型未使用任何正則化,過擬合導致係數每次收斂至不同極值","D": "特徵數量過多導致梯度消失,應優先進行 PCA 降維再套用正則化"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 2,"evidence": "answer column shows 'B' for question 7"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** L1 正則化(Lasso)透過絕對值懲罰讓部分係數壓縮為零,具有稀疏化/特徵選擇效果;但面對高度相關的特徵組(月/年/季收入)時,每次訓練資料或最佳化路徑略有差異,L1 可能隨機保留其中一個、壓掉其他,導致每次訓練保留的特徵不穩定。\n\n**其他選項為何錯:**\n- A. L2 正則化是縮小所有係數但不會歸零,不會產生「反覆變動的重要特徵清單」現象。\n- B. ✓ 正解\n- C. 若真的完全未用正則化,現象通常是所有相關特徵的係數都不穩定亂跳,而非「反覆挑選其中之一」的特定型態。\n- D. 特徵數量多與梯度消失無直接關係,梯度消失是深層網路的現象,非此情境的成因。\n\n**記憶要點:** 高度相關特徵 + L1 正則化 → 挑選不穩定(每次保留誰是隨機的)。","subject_code": "s3"},{"id": "exam-s3-115-1-q8","topic": "DL/Optimization","question_text": "某深度學習工程師訓練 ResNet 時,發現模型在前幾個 Epoch 驗證損失快速下降,但從第 15 個 Epoch 起驗證損失開始上升,而訓練損失持續下降。工程師將學習率調高後,訓練損失反而開始明顯震盪。學習率過大最直接導致下列哪種現象?","options": {"A": "梯度消失(Gradient Vanishing):梯度在反向傳播中逐層縮小趨近於零,底層無法學習","B": "損失函數震盪或發散(Oscillation / Divergence):每次更新步伐過大,參數在最優點兩側反覆跳越,無法穩定收斂","C": "過擬合(Overfitting):模型記憶訓練資料的雜訊,泛化能力下降","D": "死亡 ReLU(Dying ReLU):大量神經元輸出永久為零,停止參與梯度更新"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 2,"evidence": "answer column shows 'B' for question 8"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 學習率過大時,每次參數更新的步伐超過最適點附近的合理範圍,導致參數在最優點兩側來回跳越,無法穩定收斂,表現為損失震盪甚至發散,與題目「調高學習率後訓練損失明顯震盪」完全吻合。\n\n**其他選項為何錯:**\n- A. 梯度消失是深層網路反向傳播時梯度逐層縮小趨近零,通常伴隨訓練停滯而非震盪加劇。\n- B. ✓ 正解\n- C. 過擬合是訓練損失持續下降、驗證損失上升的現象,與「訓練損失本身開始震盪」不同。\n- D. 死亡 ReLU 是神經元輸出恆為零而停止學習,不會直接造成損失震盪。\n\n**記憶要點:** 學習率太大 → 更新步伐過大 → 損失震盪 / 發散。","subject_code": "s3"},{"id": "exam-s3-115-1-q9","topic": "DL/Optimization","question_text": "某工程師訓練深度神經網路時發現損失函數震盪嚴重且收斂速度慢,改用 Adam 優化器後訓練變得穩定且收斂更快。下列何者為 Adam 能改善此問題的主要原因?","options": {"A": "同時結合一階動量(Momentum)與自適應學習率(Adaptive Learning Rate),為每個參數調整更新步長","B": "強制所有參數使用相同學習率(Learning Rate),避免梯度差異造成不穩定","C": "透過批次正規化(Batch Normalization)重新分布輸入資料","D": "將梯度裁剪為固定範圍以避免梯度爆炸(Gradient Explosion)"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 2,"evidence": "answer column shows 'A' for question 9"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** Adam 優化器結合一階動量(過去梯度方向的指數移動平均,平滑更新方向)與自適應學習率(依每個參數梯度平方的移動平均調整步長),使訓練在不同參數尺度下都能穩定且更快收斂。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. Adam 是「自適應」學習率,即每個參數各自調整,而非強制所有參數用相同學習率。\n- C. 批次正規化是獨立於優化器的網路層技巧,並非 Adam 的機制。\n- D. 梯度裁剪是另一種穩定訓練的技巧,與 Adam 的動量+自適應學習率設計無關。\n\n**記憶要點:** Adam = Momentum(一階動量)+ 自適應學習率(如 RMSProp 的概念)。","subject_code": "s3"},{"id": "exam-s3-115-1-q10","topic": "ML/Supervised","question_text": "某工程師同時開發兩個模型:一個預測使用者「隔日 App 使用時長(分鐘)」,另一個預測使用者「隔日是否流失(是/否)」。關於上述兩個任務,他應分別選擇哪種適當的損失函數?","options": {"A": "使用時長預測:均方誤差(MSE);流失預測:二元交叉熵(Binary Cross-Entropy)","B": "使用時長預測:交叉熵損失(Cross-Entropy);流失預測:均方誤差(MSE)","C": "使用時長預測:Hinge 損失(Hinge Loss);流失預測:MAE(平均絕對誤差)","D": "兩個任務均使用交叉熵損失,因為兩者的輸出都有不確定性"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 3,"evidence": "answer column shows 'A' for question 10"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 使用時長是連續數值的迴歸問題,適合以均方誤差(MSE)衡量預測值與實際值的差距;是否流失是二元分類問題,適合以二元交叉熵(Binary Cross-Entropy)衡量預測機率與真實標籤的差異。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 交叉熵損失是分類問題的機率衡量,不適合連續數值的使用時長預測;MSE 也不適合二元分類。\n- C. Hinge 損失多用於 SVM 分類問題,MAE 雖可用於迴歸但不是流失(分類)任務的合適選擇,整體配對錯誤。\n- D. 兩個任務性質不同(一個迴歸、一個分類),不應統一使用交叉熵損失。\n\n**記憶要點:** 連續數值輸出 → MSE/MAE;二元分類輸出 → Binary Cross-Entropy。","subject_code": "s3"},{"id": "exam-s3-115-1-q11","topic": "Math/Optimization","question_text": "某工程師在 A100 GPU 叢集上訓練大型語言模型,觀察到以下現象:全批次梯度下降時 GPU 利用率達 100%,但每次更新耗時 45 秒;隨機梯度下降(SGD)每次更新僅需 0.01 秒,但梯度極不穩定、訓練曲線震盪劇烈。為兼顧梯度穩定性與 GPU 吞吐量(Throughput),應採用下列哪種策略?","options": {"A": "全批次梯度下降(Full-batch GD):使用完整資料集計算梯度,更新穩定但每次更新耗時長","B": "隨機梯度下降(SGD):每次只用一個樣本,速度快但梯度雜訊大,收斂不穩定","C": "第二階梯度法(Newton's Method):利用 Hessian 矩陣精確估計曲率,大幅減少更新次數","D": "小批次梯度下降(Mini-batch GD):以適當批次大小(如 256-2048)平衡梯度估計穩定性與 GPU 平行效率,是深度學習的業界標準"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 3,"evidence": "answer column shows 'D' for question 11"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 小批次梯度下降(Mini-batch GD)以適中批次量(如 256~2048)計算梯度,兼顧梯度估計的統計穩定性與 GPU 平行運算效率,是深度學習訓練的業界標準做法,能同時緩解全批次的高延遲與 SGD 的梯度雜訊問題。\n\n**其他選項為何錯:**\n- A. 全批次梯度下降雖然梯度穩定,但每次更新要跑完整資料集,GPU 吞吐量與更新頻率都差,耗時過長。\n- B. SGD 更新快但每次只用一個樣本,梯度雜訊大導致訓練曲線劇烈震盪,穩定性不足。\n- C. 牛頓法需要計算與求逆 Hessian 矩陣,在大型深度模型上計算成本極高,不切實際。\n- D. ✓ 正解\n\n**記憶要點:** 兼顧穩定性與效率 → Mini-batch GD 是深度學習訓練的標準做法。","subject_code": "s3"},{"id": "exam-s3-115-1-q12","topic": "Eval/Metrics","question_text": "某醫院導入肺癌篩檢模型,資料集中正常病例佔 99%、肺癌陽性僅佔 1%。模型上線後,系統報告整體準確率(Accuracy)為 99.1%。醫師對此數字感到疑慮,認為不足以評估臨床價值,在漏診風險上可能存在重大問題。請問在此情境下,僅以 Accuracy 作為評估指標最嚴重的缺陷為何?","options": {"A": "Accuracy 對類別不平衡不敏感,可能無法反映模型對肺癌陽性的偵測能力","B": "Accuracy 的計算不包含模型對邊界樣本的分類結果,容易遺漏困難樣本","C": "Accuracy 無法處理多分類問題,在二元分類下需改用 AUC","D": "Accuracy 無法揭示模型的收斂速度,因此不適合用來選擇最終模型"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 3,"evidence": "answer column shows 'A' for question 12"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 當正常病例佔 99%、肺癌陽性僅佔 1% 時,模型只要「全部預測為正常」就能達到約 99% 準確率,Accuracy 對類別不平衡不敏感,無法反映模型真正抓出陽性(肺癌)病例的能力,可能隱藏極高的漏診率。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. Accuracy 的計算本身涵蓋所有樣本(含邊界樣本),問題不在「是否包含邊界樣本」。\n- C. Accuracy 可用於多分類與二元分類,並非「無法處理多分類」的問題;此處的核心缺陷是類別不平衡。\n- D. 收斂速度與 Accuracy 是否適合選模型是不同層面的問題,非本題情境的核心缺陷。\n\n**記憶要點:** 類別極度不平衡時,Accuracy 會失真 → 改看 Recall / Precision / F1 / AUC。","subject_code": "s3"},{"id": "exam-s3-115-1-q13","topic": "DL/Regularization","question_text": "某工程師訓練文本情感分類模型,訓練集 F1=0.96、驗證集 F1=0.71,落差明顯,顯示模型出現過擬合。下列哪一種策略能最直接從降低模型複雜度的角度緩解過擬合?","options": {"A": "增加訓練 Epoch 數至 200,讓模型充分學習訓練資料的所有細節","B": "引入更多原始文本特徵(包括原始 URL、HTML 標籤),增加特徵多樣性","C": "對 Embedding 層與全連結層加入 L2 權重衰減(Weight Decay),懲罰參數值","D": "移除驗證集並將其併入訓練集,以增加模型可見的訓練樣本數"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 3,"evidence": "answer column shows 'C' for question 13"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 訓練/驗證 F1 落差大是過擬合的典型徵兆;在 Embedding 層與全連結層加入 L2 權重衰減(Weight Decay)會懲罰過大的參數值,直接降低模型的有效複雜度,是從「降低模型複雜度」角度緩解過擬合的做法。\n\n**其他選項為何錯:**\n- A. 增加 Epoch 讓模型更充分記憶訓練細節,只會讓過擬合更嚴重。\n- B. 引入更多雜訊性原始特徵(URL、HTML 標籤)會增加模型可利用的雜訊,無助於降低複雜度。\n- C. ✓ 正解\n- D. 移除驗證集會讓模型失去獨立評估依據,也無法解決過擬合本身。\n\n**記憶要點:** 降低模型複雜度緩解過擬合 → L1/L2 正則化(Weight Decay)、減少參數/層數。","subject_code": "s3"},{"id": "exam-s3-115-1-q14","topic": "ML/Algorithms","question_text": "某電商平台使用樸素貝氏分類器(Naive Bayes Classifier)建立垃圾郵件過濾模型。訓練集準確率(Accuracy)達 92%,但上線後發現,包含「限時優惠、立即下單享折扣」等關鍵字的正常促銷郵件,常被誤判為垃圾信。經分析發現,這些詞彙在訓練資料中多出現在垃圾郵件中,導致其類別條件機率偏高。請問造成此現象的最主要原因與較適當的改善方式為何?","options": {"A": "應禁用 Naive Bayes,改用其他更先進演算法","B": "模型過擬合於訓練資料,應增加 Epoch 數以提升泛化能力","C": "類別條件機率受訓練資料分布影響,導致促銷關鍵字被視為垃圾信特徵,應重新平衡資料或調整先驗機率","D": "模型未進行特徵標準化(Feature Scaling),導致分類邊界偏移,應先進行正規化處理"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 4,"evidence": "answer column shows 'C' for question 14"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 樸素貝氏分類器的類別條件機率 P(詞彙|類別)完全由訓練資料的詞頻分布估計而來;若「限時優惠」等詞在訓練集中多出現於垃圾郵件,模型就會學到偏高的垃圾信機率,即使是正常促銷信件也可能被誤判,改善方式是重新平衡資料分布或調整先驗機率。\n\n**其他選項為何錯:**\n- A. 問題出在資料分布與機率估計,並非演算法本身不適用,禁用並非最適當的改善方式。\n- B. 訓練準確率已達 92%,現象是分布偏誤而非過擬合,增加 Epoch 對樸素貝氏(非迭代式模型)也無意義。\n- C. ✓ 正解\n- D. 樸素貝氏是機率模型,依賴的是詞頻/條件機率估計,不是靠特徵縮放調整分類邊界。\n\n**記憶要點:** Naive Bayes 的機率完全來自訓練資料分布 → 資料偏差會直接反映在類別條件機率上。","subject_code": "s3"},{"id": "exam-s3-115-1-q15","topic": "ML/Unsupervised","question_text": "某資料科學家將客戶資料進行分群,使用 K-means(K=5)後發現部分群集呈現半月形(非凸)結構,且資料中存在少數離群值(Outliers)。他同時觀察到每次執行結果略有不同。下列敘述何者最完整且準確地反映 K-means 在此情境中的已知限制?","options": {"A": "K-means 無法處理維度超過 10 的資料,在高維空間中距離計算失效","B": "K-means 假設群集為高斯分佈,無法處理任何非球形群集","C": "K-means 對 K 值敏感,但初始化不影響最終結果(演算法保證全局最優)","D": "K-means 需預先指定 K;以歐氏距離為基礎,難以處理非凸群集;對初始化與離群值敏感"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 4,"evidence": "answer column shows 'D' for question 15"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** K-means 需要事先指定群數 K;以歐氏距離衡量相似度,天生假設群集接近凸形(球狀),難以處理半月形等非凸結構;且結果對初始中心點與離群值都很敏感,不同初始化可能收斂到不同局部解,這正是題目觀察到「每次結果略有不同」的原因。\n\n**其他選項為何錯:**\n- A. K-means 本身沒有維度上限 10 的限制,只是高維度下距離度量效果可能變差,並非「失效」的絕對描述。\n- B. K-means 假設群集近似球狀(非嚴格高斯分布),但敘述「無法處理任何非球形群集」過於武斷,忽略了程度差異。\n- C. 事實相反:K-means 對初始化敏感,且不保證收斂到全局最優,只保證收斂到局部最優。\n- D. ✓ 正解\n\n**記憶要點:** K-means 三大限制:要先定 K、假設凸形群集(歐氏距離)、對初始化與離群值敏感。","subject_code": "s3"},{"id": "exam-s3-115-1-q16","topic": "ML/Ensemble","question_text": "某資料科學家在信用評分任務中使用 XGBoost 建立模型,發現模型在訓練集表現良好但驗證集出現過擬合跡象。他檢視其模型設計,發現 XGBoost 在目標函數(Objective Function)中引入額外的正則化機制以控制模型複雜度。相較於傳統梯度提升決策樹(GBDT),XGBoost 在其核心目標函數中加入了下列哪一種關鍵設計,使其具備更強的防過擬合能力?","options": {"A": "加入樹的複雜度懲罰項(包含深度、葉節點數量與葉節點權重的 L2 正則化)","B": "加入動態學習率(Dynamic Learning Rate)的強制衰減機制","C": "加入卷積運算(Convolution)以萃取特徵間的空間關係","D": "強制所有決策樹深度為 1(Decision Stumps)"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 4,"evidence": "answer column shows 'A' for question 16"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** XGBoost 的目標函數在傳統損失項之外,額外加入樹的複雜度懲罰項(涵蓋樹的深度、葉節點數量與葉節點權重的 L2 正則化),直接在訓練目標中限制樹的複雜度,是它相較傳統 GBDT 更能防止過擬合的核心設計。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. XGBoost 的學習率(shrinkage)是固定超參數,並非「動態強制衰減機制」。\n- C. 卷積運算是 CNN 的機制,樹模型(XGBoost)不涉及卷積。\n- D. XGBoost 允許樹有不同深度(由超參數控制),並未強制所有樹深度為 1。\n\n**記憶要點:** XGBoost 目標函數 = 損失項 + 樹複雜度正則化項(深度、葉節點數、葉權重 L2)。","subject_code": "s3"},{"id": "exam-s3-115-1-q17","topic": "DL/CNN","question_text": "某醫療新創團隊將原有 3 層 CNN 升級為 16 層架構以提升 CT 影像腫瘤偵測率,但發現訓練損失反而高於 3 層版本且收斂困難。工程師懷疑是網路深度造成的訓練問題,下列診斷與對策何者最正確?","options": {"A": "網路層數增加導致參數量過多,應減少每層卷積濾波器(Filters)數量以降低模型複雜度","B": "深層網路可能出現梯度消失問題,導致淺層權重難以更新;應採用 ResNet 的殘差連接(Skip Connection)以改善梯度傳遞","C": "16 層模型對 CT 影像而言仍過淺,應進一步增加網路深度以學習更高階特徵","D": "問題可能來自激活函數(Activation Function),將 ReLU 改為 Sigmoid 可改善梯度傳遞問題"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 5,"evidence": "answer column shows 'B' for question 17"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 深層網路在反向傳播時,梯度需要連續乘過多層,容易在傳遞過程中越乘越小,造成梯度消失(Vanishing Gradient),使淺層權重幾乎無法更新、訓練損失反而變差;ResNet 的殘差連接(Skip Connection)讓梯度能繞過中間層直接傳回淺層,有效改善這個問題。\n\n**其他選項為何錯:**\n- A. 單純減少濾波器數量只是降低參數量,無法解決深度增加帶來的梯度傳遞困難。\n- B. ✓ 正解\n- C. 16 層對 CT 影像而言已屬偏深,題目現象正是深度增加導致的訓練困難,而非模型過淺。\n- D. Sigmoid 的飽和區梯度比 ReLU 更小,改用 Sigmoid 會讓梯度消失問題更嚴重,而非改善。\n\n**記憶要點:** 網路變深、訓練損失反而變差 → 疑似梯度消失 → 用殘差連接(ResNet)改善。","subject_code": "s3"},{"id": "exam-s3-115-1-q18","topic": "DL/CNN","question_text": "某工程師設計用於醫療 X 光影像分類的 CNN,發現卷積層後直接接全連結層導致參數量高達 5,000 萬,訓練速度極慢。為降低模型參數量與計算成本,他在卷積層後加入池化層(Pooling Layer)。下列何者為池化層在此設計中最主要解決的問題?","options": {"A": "降低特徵圖空間維度,減少參數與計算量","B": "提供非線性表達能力,以提升模型學習複雜度","C": "改善梯度消失問題,以強化反向傳播穩定性","D": "提升模型泛化能力而不影響特徵維度"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 5,"evidence": "answer column shows 'A' for question 18"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 池化層(如 Max Pooling)對特徵圖做空間降採樣,縮小特徵圖的高與寬,大幅減少後續全連結層需要處理的參數量與計算量,直接對應題目「卷積層後接全連結層參數量高達 5000 萬」的問題。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 提供非線性能力是激活函數(如 ReLU)的工作,池化層本身是線性的降採樣操作。\n- C. 改善梯度消失通常靠殘差連接、Batch Normalization 等設計,不是池化層的主要功能。\n- D. 池化層正是透過改變(縮小)特徵維度來降低運算量,「不影響特徵維度」的敘述本身就矛盾。\n\n**記憶要點:** Pooling 的核心作用 = 降低特徵圖空間維度 → 減少參數與計算量。","subject_code": "s3"},{"id": "exam-s3-115-1-q19","topic": "DL/Transformer","question_text": "某團隊開發合約文件審查系統,需比對合約首頁的定義條款與第 20 頁的責任條款是否一致。工程師初版採用雙向長短期記憶(Bidirectional LSTM),但發現長文件的跨段落語義關聯捕捉效果不佳,且訓練時間隨文件長度明顯增加。改用 Transformer 架構後問題獲得改善,下列何者為最主要的原因?","options": {"A": "Transformer 參數量比 LSTM 少,因此訓練速度更快、不易過擬合","B": "Transformer 內建位置編碼,使模型天生理解文件的章節結構與段落順序","C": "LSTM 無法處理超過 512 個 token 的輸入,Transformer 無此硬性限制","D": "Transformer 的 Self-Attention 可讓任意 token 直接建立關聯,不受距離限制,且運算可平行化"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 5,"evidence": "answer column shows 'D' for question 19"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** Transformer 的 Self-Attention 讓序列中任兩個 token 都能直接計算關聯權重,不受距離遠近限制,能有效捕捉跨段落(如首頁與第 20 頁)的長距離語意關聯;且各 token 的注意力計算可平行處理,不像 LSTM 需要逐步遞迴,因此訓練時間不會隨文件長度線性暴增。\n\n**其他選項為何錯:**\n- A. 訓練速度提升的關鍵是可平行化運算,而非單純參數量比較;且題目重點在「跨段落語意捕捉」而非過擬合。\n- B. 位置編碼只提供 token 順序資訊,不等於模型「天生理解章節結構」,這是過度延伸。\n- C. LSTM 沒有像 Transformer 早期版本那樣的硬性 512 token 限制,此敘述不準確,且非本題核心原因。\n- D. ✓ 正解\n\n**記憶要點:** Self-Attention:任意距離直接關聯 + 可平行運算,是取代 RNN/LSTM 處理長文件的關鍵。","subject_code": "s3"},{"id": "exam-s3-115-1-q20","topic": "DL/Basics","question_text": "工程師在 PyTorch 中建構貓、狗、鳥三分類 CNN,並使用交叉熵損失函數(CrossEntropyLoss)作為訓練目標。由於此損失函數在內部已包含 Softmax 計算,輸出層的設計需特別注意。請問輸出層的激活函數(Activation Function)與輸出維度應如何設定?","options": {"A": "使用 ReLU 作為激活函數,輸出維度設為 1,直接輸出單一數值作為預測結果","B": "使用 Sigmoid 作為激活函數,輸出維度設為 3,使每個類別獨立輸出 0 到 1 的機率","C": "不使用任何激活函數,直接輸出未經正規化的 logits,輸出維度設為 3 對應三個類別","D": "使用 Softmax 作為激活函數,輸出維度設為 3,輸出為已正規化的機率分布"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 5,"evidence": "answer column shows 'C' for question 20"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** PyTorch 的 CrossEntropyLoss 內部已經整合 LogSoftmax 與負對數概似計算,因此輸出層不應再額外套用 Softmax,而應直接輸出未經正規化的原始分數(logits),維度對應類別數(此處為 3),讓損失函數自行處理機率轉換。\n\n**其他選項為何錯:**\n- A. ReLU 不是分類任務的輸出激活函數,輸出維度也應對應類別數而非單一數值。\n- B. Sigmoid 搭配獨立 0 到 1 機率是多標籤(Multi-label)分類的設計,不適合互斥的三分類問題;且若真的接了 Softmax 又搭配 CrossEntropyLoss,會等於做了兩次正規化。\n- C. ✓ 正解\n- D. 若輸出層已用 Softmax,CrossEntropyLoss 會再做一次 LogSoftmax,等於重複正規化,導致訓練效果錯誤。\n\n**記憶要點:** PyTorch CrossEntropyLoss 內建 Softmax → 輸出層只需輸出原始 logits,不要再加 Softmax。","subject_code": "s3"},{"id": "exam-s3-115-1-q21","topic": "DL/Compression","question_text": "某工程師將一個大型預訓練模型部署至資源受限的行動裝置,發現模型體積過大且推論效率不足。為降低模型大小並提升推論速度,他將原本 32-bit 浮點數權重轉換為 8-bit 整數。在不重新訓練模型的前提下,請問此過程稱為何?","options": {"A": "知識蒸餾(Knowledge Distillation)","B": "權重剪枝(Pruning)","C": "張量分解(Tensor Decomposition)","D": "模型量化(Quantization)"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 6,"evidence": "answer column shows 'D' for question 21"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 將已訓練完成的 32-bit 浮點數權重轉換為 8-bit 整數,在不重新訓練模型的前提下降低模型體積、加快推論速度,這正是模型量化(Quantization)的定義。\n\n**其他選項為何錯:**\n- A. 知識蒸餾是用大模型(教師)訓練小模型(學生)來壓縮模型,需要額外的訓練過程,並非單純轉換既有權重的數值精度。\n- B. 權重剪枝是移除(歸零)不重要的權重連結,改變的是網路結構的稀疏程度,不是數值精度。\n- C. 張量分解是將權重矩陣拆解為多個低秩矩陣的乘積以減少參數量,同樣不是精度轉換。\n- D. ✓ 正解\n\n**記憶要點:** 32-bit → 8-bit、不重新訓練 → 模型量化(Quantization)。","subject_code": "s3"},{"id": "exam-s3-115-1-q22","topic": "DL/Embeddings","question_text": "某工程師建置企業內部知識問答的 RAG 系統,上線後發現部分問題檢索結果與查詢語意不符。分析後確認問題出在向量搜尋的語意匹配不準確。於檢索階段,採取下列哪種方法最能直接改善此問題?","options": {"A": "將切片大小(Chunk Size)由 512tokens 縮小至 128tokens,以提升檢索精細度","B": "調整向量相似度閾值(Similarity Threshold),以過濾低相關檢索結果","C": "採用混合搜尋(Hybrid Search):結合語意向量搜尋與關鍵字搜尋(BM25),並以 RRF(Reciprocal Rank Fusion)融合排序","D": "將檢索結果隨機洗牌(Shuffle)後回傳給 LLM,避免位置偏誤(Position Bias)"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 6,"evidence": "answer column shows 'C' for question 22"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 純向量(語意)搜尋可能因 Embedding 模型對特定關鍵字、專有名詞不敏感而找不到精確匹配;混合搜尋(Hybrid Search)結合語意向量搜尋與關鍵字搜尋(BM25),再用 RRF(Reciprocal Rank Fusion)融合兩種排序結果,能同時兼顧語意相關性與關鍵字精確性,是改善檢索語意不符最直接有效的做法。\n\n**其他選項為何錯:**\n- A. 縮小切片大小只是改變檢索的顆粒度,不必然解決語意不匹配的根本問題,還可能讓片段失去完整脈絡。\n- B. 調整相似度閾值只是過濾結果的門檻,無法改善檢索本身「找不到語意相符內容」的問題。\n- C. ✓ 正解\n- D. 隨機洗牌檢索結果與檢索準確度無關,只影響 LLM 讀取結果的順序。\n\n**記憶要點:** RAG 檢索不準 → 混合搜尋(語意向量 + BM25)+ RRF 融合排序。","subject_code": "s3"},{"id": "exam-s3-115-1-q23","topic": "DL/Transformer","question_text": "某團隊開發法律文件生成系統,需根據合約前半段內容自動生成後半段條款。工程師分別使用 BERT 與 GPT-2 進行微調,但發現 BERT 的生成效果明顯較差,且即使增加訓練資料也無法改善。下列何者為最主要原因?","options": {"A": "BERT 缺乏法律領域知識,因此生成能力較差","B": "BERT 的分詞方式影響語意理解,導致生成效果不佳","C": "BERT 模型規模較小,因此生成能力不足","D": "BERT 無法根據前文逐步生成後續文字,較不適合此類任務"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 6,"evidence": "answer column shows 'D' for question 23"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** BERT 是雙向編碼器,以遮蔽語言模型(MLM)訓練,擅長理解整段文字的語意,但沒有「依序逐字生成下一個 token」的自回歸(Autoregressive)機制;GPT-2 則是單向自回歸模型,天生適合根據前文逐步生成後續文字,因此在生成任務上表現明顯優於 BERT,且此差異來自架構設計,無法單靠增加訓練資料彌補。\n\n**其他選項為何錯:**\n- A. BERT 缺乏法律知識可透過微調法律語料改善,但這不是它「無法生成」的根本原因。\n- B. 分詞方式(如 WordPiece)雙方都有子詞切分機制,不是生成能力差異的主因。\n- C. BERT-base 與 GPT-2 的模型規模相近,規模不是核心差異。\n- D. ✓ 正解\n\n**記憶要點:** BERT(雙向、理解型)不適合生成;GPT(單向自回歸)天生適合逐步生成文字。","subject_code": "s3"},{"id": "exam-s3-115-1-q24","topic": "Feature/Engineering","question_text": "某推薦系統工程師處理商品類別特徵,該特徵包含約 3,000 個不同商品項目,每一種商品或其規格皆視為一個獨立類別。請問在高基數(High Cardinality)的情境下,下列哪一種編碼方式最容易造成維度爆炸問題?","options": {"A": "目標編碼(Target Encoding)","B": "標籤編碼(Label Encoding)","C": "Embedding 層(Categorical Embedding)","D": "One-Hot 編碼(One-Hot Encoding)"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 6,"evidence": "answer column shows 'D' for question 24"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** One-Hot 編碼會為每個類別建立一個獨立維度,當類別數(基數)高達約 3000 種商品時,會產生 3000 維的極稀疏向量,造成維度爆炸(Curse of Dimensionality),是四個選項中最容易在高基數情境下出問題的編碼方式。\n\n**其他選項為何錯:**\n- A. 目標編碼用目標變數的統計量(如平均值)取代類別,無論類別數多少都只產生 1 個新欄位,不會維度爆炸。\n- B. 標籤編碼把類別轉成單一整數欄位,同樣只用 1 維表示,不會隨基數增加而膨脹維度。\n- C. Embedding 層將高基數類別映射到低維稠密向量(維度可控,如 8、16、32 維),正是為解決 One-Hot 維度爆炸而設計的方法。\n- D. ✓ 正解\n\n**記憶要點:** 高基數類別特徵 → One-Hot 會維度爆炸;改用 Embedding / Target Encoding 更合適。","subject_code": "s3"},{"id": "exam-s3-115-1-q25","topic": "Feature/Engineering","question_text": "某工程師建立房價預測模型,輸入特徵包含屋齡與距捷運站距離(公尺)。他發現距捷運站距離分布嚴重右偏,經對數(Log)轉換後模型表現明顯改善;但將同樣轉換套用於屋齡後,模型表現反而下降。下列何者為最可能的原因?","options": {"A": "屋齡與房價若呈線性關係,Log 轉換反而破壞此結構","B": "Log 轉換會壓縮所有特徵的變異數,導致模型失去鑑別能力","C": "Log 轉換不適用於有單位的連續變數,應改用 Box-Cox","D": "兩特徵須套用相同轉換,否則尺度不一致導致梯度不穩定"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 7,"evidence": "answer column shows 'A' for question 25"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 若屋齡與房價原本已接近線性關係,對它做 Log 轉換會把原本的線性結構扭曲成非線性關係,使線性迴歸等模型更難擬合,導致表現下降;而距捷運站距離嚴重右偏,Log 轉換能讓其分布更接近常態、關係更線性化,因此有幫助。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. Log 轉換是壓縮「數值尺度大的一端」,並非均勻壓縮所有特徵的變異數,此敘述過於籠統且不準確。\n- C. Log 轉換本身就常用於有單位的連續變數(如距離、金額),沒有這個限制;Box-Cox 是另一種可選方法而非必要替代。\n- D. 特徵是否套用相同轉換,取決於各自的分布與關係型態,並非「必須一致」的硬性規則。\n\n**記憶要點:** 轉換前要先看特徵與目標的關係型態:右偏 → Log 有幫助;本已線性 → Log 反而破壞關係。","subject_code": "s3"},{"id": "exam-s3-115-1-q26","topic": "ML/TimeSeries","question_text": "在時間序列資料的特徵工程中,工程師常使用滑動窗口(Sliding Window)方法,將過去多個時間點的觀測值組合為模型輸入。下列何者為此方法的主要目的?","options": {"A": "資料增強","B": "去除資料雜訊","C": "降低特徵維度","D": "建立滯後特徵"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 7,"evidence": "answer column shows 'D' for question 26"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 滑動窗口(Sliding Window)方法把過去多個時間點的觀測值(t-1, t-2, …)組合成模型的輸入特徵,本質上就是在建立滯後特徵(Lag Feature),讓模型能利用過去的歷史值來預測未來。\n\n**其他選項為何錯:**\n- A. 資料增強是產生新的訓練樣本(如影像旋轉、翻轉),滑動窗口是特徵建構手法,並非資料增強。\n- B. 滑動窗口組合過去觀測值不會主動去除雜訊,單純是重新排列既有數值成新特徵。\n- C. 滑動窗口反而是把多個時間點的值攤開組合成更多欄位,通常會增加而非降低特徵維度。\n- D. ✓ 正解\n\n**記憶要點:** 時間序列滑動窗口 = 把過去 t-1, t-2, … 的值變成滯後特徵(Lag Feature)。","subject_code": "s3"},{"id": "exam-s3-115-1-q27","topic": "Training/Validation","question_text": "某工程師建立零售商品銷量預測模型,初期以第 1 至 52 週資料作為訓練集、第 53 週作為測試集(固定時間切分)。半年後重新評估,發現模型對最新資料(如第 80 週)的預測明顯衰退,推測為時間演進導致行為模式改變。若重新設計驗證策略,應採用下列哪種方法,使每次訓練皆基於最新時間區間資料?","options": {"A": "K-fold 交叉驗證(K-fold Cross-Validation)","B": "分層 K-fold(Stratified K-fold)","C": "滾動窗口驗證(Rolling Window Validation / Time Series Split)","D": "留一驗證法(Leave-One-Out Cross-Validation)"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 7,"evidence": "answer column shows 'C' for question 27"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 滾動窗口驗證(Rolling Window Validation / Time Series Split)每次都以最新的時間區間資料作為訓練/驗證基礎,並隨時間推進不斷更新窗口,能反映資料隨時間演變(如行為模式改變、概念漂移)的情況,適合本題「模型對最新資料預測明顯衰退」的重新設計需求。\n\n**其他選項為何錯:**\n- A. K-fold 交叉驗證會隨機打亂資料切分,可能讓未來資料出現在訓練集、過去資料出現在驗證集,破壞時間序列的因果順序。\n- B. 分層 K-fold 是針對類別不平衡的抽樣策略,同樣會打亂時間順序,不適合時間序列。\n- C. ✓ 正解\n- D. 留一驗證法計算成本極高,且同樣不考慮時間先後順序,不是解決本題「跟上最新時間趨勢」的合適方法。\n\n**記憶要點:** 時間序列驗證要保持時間順序 → 用滾動窗口驗證(Rolling Window / Time Series Split),不能隨機切分。","subject_code": "s3"},{"id": "exam-s3-115-1-q28","topic": "ML/Algorithms","question_text": "某房仲平台要預測物件成交價,資料集含 50 個特徵,其中部分特徵與房價呈非線性關係,且業務單位要求模型須能提供整體特徵重要性以供稽核。下列哪一種模型選擇策略最符合需求?","options": {"A": "使用羅吉斯迴歸(Logistic Regression),透過線性係數解釋特徵影響,但無法有效建模非線性關係","B": "使用隨機森林迴歸(Random Forest Regression),可處理非線性關係,並提供整體特徵重要性(Feature Importance)作為解釋依據","C": "用 K-means 分群(K-means Clustering)後分別建立迴歸模型,以提升預測準確度並間接提升可解釋性","D": "使用支持向量迴歸(Support Vector Regression, SVR),透過核函數(Kernel Function)捕捉非線性關係,並以支持向量解釋模型決策"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 7,"evidence": "answer column shows 'B' for question 28"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 隨機森林迴歸(Random Forest Regression)由多棵決策樹組成,天生能捕捉特徵與目標間的非線性關係;同時可透過樹的分裂資訊計算整體特徵重要性(Feature Importance),提供可供稽核的整體解釋依據,同時滿足「非線性」與「可稽核的整體重要性」兩項需求。\n\n**其他選項為何錯:**\n- A. 羅吉斯迴歸是線性模型,雖可解釋係數,但無法有效建模非線性關係,不符合題目需求。\n- B. ✓ 正解\n- C. 先分群再各別建模是間接做法,不會直接提供整體特徵重要性,也不必然提升可解釋性。\n- D. SVR 搭配核函數雖能處理非線性,但其決策機制(支持向量、核空間)本身不易直接轉換成整體特徵重要性,可解釋性不如隨機森林直觀。\n\n**記憶要點:** 需要「非線性 + 整體特徵重要性可稽核」→ Random Forest 是標準答案。","subject_code": "s3"},{"id": "exam-s3-115-1-q29","topic": "ML/Anomaly","question_text": "某工廠設備監測系統需偵測馬達軸承的異常振動,但過去僅記錄了大量正常運作的振動時序資料,缺乏任何已確認故障的標註樣本。請問下列何種任務範疇最符合此情境下的異常偵測需求?","options": {"A": "監督式二元分類(Supervised Binary Classification)","B": "非監督或半監督異常偵測(Unsupervised / Semi-supervised Anomaly Detection)","C": "強化學習(Reinforcement Learning)","D": "自監督學習(Self-supervised Learning)"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 7,"evidence": "answer column shows 'B' for question 29"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 題目情境只有大量正常振動資料,完全沒有已標註的故障(異常)樣本,無法進行監督式訓練;這正是非監督式或半監督式異常偵測(Unsupervised / Semi-supervised Anomaly Detection)的典型應用場景——僅用正常資料學習「正常樣態」,再偵測偏離該樣態的異常。\n\n**其他選項為何錯:**\n- A. 監督式二元分類需要正常與異常兩類的標註樣本,題目缺乏異常標註,無法直接套用。\n- B. ✓ 正解\n- C. 強化學習需要明確的獎勵訊號與環境互動機制,與此處「偵測異常振動」的靜態資料情境不符。\n- D. 自監督學習是利用資料本身建構代理任務(pretext task)學習表徵,雖然某些異常偵測方法會用到自監督概念,但作為「任務範疇」的直接描述不如「非監督/半監督異常偵測」精確。\n\n**記憶要點:** 只有正常樣本、沒有異常標註 → 非監督 / 半監督異常偵測。","subject_code": "s3"},{"id": "exam-s3-115-1-q30","topic": "Eval/Bias","question_text": "某信用風險模型:訓練 AUC=0.97、驗證 AUC=0.72、少數違約樣本預測波動極大及不同 K-fold 切分結果差異明顯。下列何者為最可能的問題?","options": {"A": "高偏差","B": "高變異","C": "過擬合","D": "資料漂移"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 8,"evidence": "answer column shows 'B' for question 30"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 訓練 AUC 高(0.97)但驗證 AUC 明顯偏低(0.72),且不同 K-fold 切分結果差異明顯、少數類別預測波動大,代表模型對訓練資料的細節過度敏感、換一批資料結果就大幅改變,這是高變異(High Variance)的典型徵兆(過擬合是高變異的結果,但「高變異」更精確地描述題目中「不同切分結果差異明顯」這個現象)。\n\n**其他選項為何錯:**\n- A. 高偏差通常表現為訓練與驗證表現「都差」(欠擬合),與題目訓練 AUC 極高的情況相反。\n- B. ✓ 正解\n- C. 過擬合是描述現象的通稱,而「不同 K-fold 切分結果差異明顯」精確對應的統計性質是高變異,選項 B 更貼近題目強調的重點。\n- D. 資料漂移是指資料分布隨時間改變,題目描述的是同一批資料在不同切分下的表現不穩定,並非時間造成的分布改變。\n\n**記憶要點:** 訓練好、驗證差、換資料結果就大幅波動 → 高變異(High Variance)。","subject_code": "s3"},{"id": "exam-s3-115-1-q31","topic": "RL/RewardShaping","question_text": "某倉儲自動化公司以強化學習(Reinforcement Learning, RL)訓練機器手臂進行揀貨,獎勵函數設計為「每成功抓取一個貨品得+1 分」。部署後發現機器手臂學會反覆放開再抓取同一物品,以累積分數,但實際完成任務的效率極低。請問此現象的核心問題為何?應如何修正獎勵設計?","options": {"A": "獎勵塑形(Reward Shaping):將獎勵改為「成功完成一次揀貨任務」而非單次抓取行為","B": "策略退化(Policy Degradation):降低學習率以穩定訓練","C": "信用分配問題(Credit Assignment Problem):引入優勢函數(Advantage Function)","D": "災難性遺忘(Catastrophic Forgetting):加入經驗回放(Replay Buffer)"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 8,"evidence": "answer column shows 'A' for question 31"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 獎勵函數只獎勵「單次抓取動作」,機器手臂學會鑽漏洞——反覆放開再抓同一物品來刷分,而非真正完成揀貨任務,這是獎勵設計不當(Reward Hacking)的典型案例。正確做法是重新設計獎勵函數(獎勵塑形,Reward Shaping),改成獎勵「成功完成一次揀貨任務」這種真正對齊目標的行為,而非可被鑽漏洞的中間動作。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 現象的根源是獎勵函數設計錯誤,不是學習率造成的策略退化,降低學習率無法阻止機器手臂鑽獎勵漏洞。\n- C. 信用分配問題是指「難以判斷哪個動作對最終結果貢獻多少」,與本題「獎勵本身鼓勵了錯誤行為」的性質不同。\n- D. 災難性遺忘是指模型在學習新任務時忘記舊任務,與本題單一任務中的獎勵漏洞無關。\n\n**記憶要點:** Agent 鑽獎勵漏洞刷分、任務效率反而低 → 獎勵設計問題(Reward Hacking)→ 用獎勵塑形對齊真正目標。","subject_code": "s3"},{"id": "exam-s3-115-1-q32","topic": "Eval/Metrics","question_text": "某詐欺偵測模型需同時具備高精確率(Precision),以避免誤凍結正常帳號,並維持高召回率(Recall)表現,以確保不放過任何詐欺行為。然而工程師發現兩者之間存在取捨關係(Precision-Recall Tradeoff)。在此情境下,F1-score 最能反映何種特性?","options": {"A": "F1-score = (Precision + Recall) / 2,為算術平均","B": "F1-score 為 Precision 的加權平均","C": "F1-score 僅適用於類別平衡資料","D": "F1-score = 2 × (Precision×Recall)/(Precision+Recall),為調和平均,對較小值敏感"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 8,"evidence": "answer column shows 'D' for question 32"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** F1-score 定義為 Precision 與 Recall 的調和平均(Harmonic Mean)= 2×(Precision×Recall)/(Precision+Recall)。調和平均的特性是會被兩者中較小的值明顯拉低,因此只有當 Precision 與 Recall「同時都高」時 F1 才會高,能反映兩者的取捨平衡,不會被其中一項的高分數掩蓋另一項的低分數。\n\n**其他選項為何錯:**\n- A. (Precision+Recall)/2 是算術平均,算術平均對兩個數值一高一低時仍會給出中等分數,無法凸顯取捨劣勢,這不是 F1 的定義。\n- B. F1-score 是 Precision 與 Recall 的調和平均,不是「Precision 的加權平均」。\n- C. F1-score 在類別不平衡資料下反而是常用指標(比 Accuracy 更適合),並非僅適用於平衡資料。\n- D. ✓ 正解\n\n**記憶要點:** F1 = Precision 與 Recall 的調和平均,對較小值敏感,能反映兩者的取捨關係。","subject_code": "s3"},{"id": "exam-s3-115-1-q33","topic": "Eval/Bias","question_text": "某工程師的多元線性迴歸模型包含 150 個特徵,其中許多特徵高度相關(如「建坪」與「總面積」)。他同時希望控制過擬合且保留所有特徵的解釋能力,不讓任何特徵係數歸零,下列哪一項正則化方案最適當?","options": {"A": "Lasso 迴歸(L1 正則化):透過絕對值懲罰使部分係數歸零,具有特徵選擇效果","B": "Ridge 迴歸(L2 正則化):透過平方懲罰縮小所有係數,在共線性下穩定估計且不歸零","C": "Elastic Net(L1+L2):結合稀疏性與穩定性,但部分係數仍可能被壓為 0","D": "無正則化的 OLS 迴歸:不控制過擬合,在共線性下係數估計不穩定"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 8,"evidence": "answer column shows 'B' for question 33"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** Ridge 迴歸(L2 正則化)對係數做平方懲罰,會將所有相關特徵的係數一起「縮小」但不會逼近零,在共線性(如建坪與總面積高度相關)下能得到較穩定的係數估計,同時保留所有特徵的解釋能力,符合題目「控制過擬合且不讓任何係數歸零」的需求。\n\n**其他選項為何錯:**\n- A. Lasso(L1 正則化)會讓部分係數歸零、達到特徵選擇效果,與題目「不讓任何特徵係數歸零」的要求相反。\n- B. ✓ 正解\n- C. Elastic Net 結合 L1+L2,仍保有 L1 的稀疏化特性,部分係數仍可能被壓為 0,不完全符合題目要求。\n- D. 無正則化的 OLS 在高度共線性下係數估計會不穩定(變異數很大),無法達到「控制過擬合」的目的。\n\n**記憶要點:** 共線性下想保留所有特徵又控制過擬合 → Ridge(L2),不歸零、穩定估計。","subject_code": "s3"},{"id": "exam-s3-115-1-q34","topic": "Training/Tuning","question_text": "某工程師使用 XGBoost 模型進行調參,需對以下超參數進行網格搜尋(Grid Search):learning_rate(3 個候選值)、max_depth(4 個)、n_estimators(5 個)、subsample(3 個)、colsample_bytree(3 個)。每組參數組合皆需完整進行 5-Fold 交叉驗證。請問總共需要訓練幾個模型?","options": {"A": "3 + 4 + 5 + 3 + 3 = 18 個","B": "5 × 5 = 25 個","C": "max(3,4,5,3,3) × 5 = 25 個","D": "3 × 4 × 5 × 3 × 3 × 5 = 2,700 個"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 9,"evidence": "answer column shows 'D' for question 34"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** 網格搜尋(Grid Search)會窮舉所有超參數組合,總組合數是各超參數候選值數量的「相乘」而非相加:3×4×5×3×3 = 540 組參數組合;每組再各自完整跑 5-Fold 交叉驗證(即訓練 5 個模型),因此總訓練模型數為 540×5 = 2,700 個。\n\n**其他選項為何錯:**\n- A. 直接把候選值數量相加(3+4+5+3+3=18)是錯誤算法,網格搜尋是窮舉「所有組合」而非各自獨立嘗試。\n- B. 5×5=25 沒有正確反映五個超參數各自的候選值數量,計算方式錯誤。\n- C. 取最大候選值數量(max=5)乘以 5-Fold,同樣忽略了網格搜尋需窮舉所有超參數的「組合」。\n- D. ✓ 正解\n\n**記憶要點:** Grid Search 總模型數 = (各超參數候選值相乘的總組合數)× K-Fold 摺數。","subject_code": "s3"},{"id": "exam-s3-115-1-q35","topic": "DL/Transfer","question_text": "某團隊使用 LoRA 微調大型語言模型進行法律摘要任務,發現模型在複雜條款的摘要上常出現內容遺漏,但 GPU 顯存已接近上限。下列哪種調整方式最能在不明顯增加記憶體使用的前提下改善模型表現?","options": {"A": "提高 LoRA rank 以增強模型表達能力","B": "改用完整微調(Full Fine-tuning)以學習更多細節","C": "降低 LoRA rank 以釋放記憶體並增加 Batch Size","D": "降低 LoRA rank 但套用到更多層,保持 trainable 總參數不變"},"correct_answer": "D","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 9,"evidence": "answer column shows 'D' for question 35"},"verified": true,"verification_needed": null,"explanation": "**為什麼 D 是正解:** LoRA 的可訓練參數量取決於「rank 大小」與「套用的層數」兩者的乘積效果;降低 rank 可釋放記憶體,但若同時把節省下來的容量用於套用到更多層(涵蓋更多模型部位),可以在總可訓練參數量(進而總記憶體使用)大致不變的前提下,讓微調觸及模型更多層,藉此改善複雜任務(如條款摘要)容易遺漏內容的問題。\n\n**其他選項為何錯:**\n- A. 提高 rank 會直接增加可訓練參數與記憶體使用,與「不明顯增加記憶體」的限制矛盾。\n- B. 完整微調(Full Fine-tuning)需要更新全部模型參數,記憶體需求遠高於 LoRA,不符合 GPU 顯存已接近上限的情境。\n- C. 降低 rank 雖釋放記憶體,但單純用來增加 Batch Size 並不會擴大 LoRA 能學習的模型部位,對「內容遺漏」問題幫助有限。\n- D. ✓ 正解\n\n**記憶要點:** LoRA 調參:rank 影響「深度」、套用層數影響「廣度」;可用「降 rank + 加層數」在同樣參數預算下擴大涵蓋範圍。","subject_code": "s3"},{"id": "exam-s3-115-1-q36","topic": "Privacy/Compliance","question_text": "某金融機構的 AI 信用評分模型需上傳至第三方雲端服務商進行推論。法務部門要求:在不解密資料的前提下,由單一雲端服務商直接對加密資料進行模型運算。下列哪種隱私保護技術最符合此需求?","options": {"A": "聯邦學習(Federated Learning)","B": "同態加密(Homomorphic Encryption)","C": "差分隱私(Differential Privacy)","D": "安全多方計算(Secure Multi-Party Computation, MPC)"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 9,"evidence": "answer column shows 'B' for question 36"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 同態加密(Homomorphic Encryption)允許直接對「加密後」的資料進行數學運算,運算結果解密後與對原始明文運算的結果一致,因此雲端服務商全程不需要解密資料就能完成模型推論運算,完全符合題目「不解密、由單一雲端服務商直接運算」的需求。\n\n**其他選項為何錯:**\n- A. 聯邦學習是讓多個裝置/機構在本地訓練後只交換模型參數,而非把加密資料交給單一雲端服務商運算。\n- B. ✓ 正解\n- C. 差分隱私是透過加入雜訊來保護個體隱私,不是讓服務商能直接對加密資料運算的技術。\n- D. 安全多方計算通常需要「多方」共同參與計算協定,而非單一雲端服務商獨立完成運算,與題目情境不符。\n\n**記憶要點:** 資料全程加密、單一伺服器可直接運算 → 同態加密(Homomorphic Encryption)。","subject_code": "s3"},{"id": "exam-s3-115-1-q37","topic": "ML/Interpretability","question_text": "某銀行導入 AI 貸款審核系統,監管要求每筆被拒絕的申請須提供可理解的拒絕原因。技術主管評估以下方案,哪一種最能實現個別預測的局部可解釋性(Local Explainability)?","options": {"A": "SHAP(SHapley Additive exPlanations)值:計算每個特徵對單筆預測的貢獻","B": "全域特徵重要性(Global Feature Importance):說明整體特徵影響,無法解釋單一個案","C": "Grad-CAM(Gradient-weighted Class Activation Mapping):以熱力圖解釋影像模型","D": "混淆矩陣(Confusion Matrix):呈現整體分類表現"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 9,"evidence": "answer column shows 'A' for question 37"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** SHAP 值基於賽局理論的 Shapley Value,計算「每個特徵對單筆(個別)預測結果」的貢獻度,能針對每一筆被拒絕的貸款申請,個別說明是哪些特徵、貢獻多少導致該筆申請被拒,正是局部可解釋性(Local Explainability)的代表方法。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 全域特徵重要性說明的是整體模型層級的特徵影響力,無法針對「單一個案」提供解釋,題目明確要求逐筆解釋。\n- C. Grad-CAM 是用於解釋卷積神經網路(影像模型)的視覺化技術,不適用於貸款審核這類表格資料模型。\n- D. 混淆矩陣呈現的是模型整體分類表現的統計摘要,同樣不是針對單筆預測的解釋工具。\n\n**記憶要點:** 要解釋「單一個案」→ 局部可解釋性 → SHAP(或 LIME);要看「整體」→ 全域特徵重要性。","subject_code": "s3"},{"id": "exam-s3-115-1-q38","topic": "Bias/Fairness","question_text": "某公司導入 AI 履歷篩選系統,用於自動決定是否進入面試。模型對男性應徵者的面試通過率為 55%,對女性應徵者為 30%。在其他條件不變的情況下,工程師需評估模型是否符合統計均等(Statistical Parity)的公平性定義。下列何者最正確?","options": {"A": "符合統計均等,因為模型未使用性別作為輸入特徵","B": "符合統計均等,因為兩個族群皆有部分應徵者被錄取","C": "不符合統計均等,因為不同群體的正向決策比例(通過率)存在明顯差異","D": "不符合統計均等,因為女性族群的預測準確率較低"},"correct_answer": "C","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 10,"evidence": "answer column shows 'C' for question 38"},"verified": true,"verification_needed": null,"explanation": "**為什麼 C 是正解:** 統計均等(Statistical Parity / Demographic Parity)要求不同群體獲得正向決策(如通過面試)的比例應大致相等。男性通過率 55%、女性僅 30%,兩群體的正向決策比例存在明顯差異,因此不符合統計均等的公平性定義。\n\n**其他選項為何錯:**\n- A. 統計均等關注的是「決策結果比例」是否相近,與模型是否直接使用性別作為輸入特徵無關——即使沒用性別欄位,模型仍可能透過關聯特徵間接產生偏差。\n- B. 「兩族群都有人被錄取」不等於「錄取比例相近」,55% 與 30% 仍是明顯差異,不符合統計均等。\n- C. ✓ 正解\n- D. 統計均等看的是決策比例(通過率),不是預測準確率,選項描述的評估角度錯誤。\n\n**記憶要點:** 統計均等(Statistical Parity)= 各群體「正向決策比例」要相近,與是否用性別特徵、準確率高低無關。","subject_code": "s3"},{"id": "exam-s3-115-1-q39","topic": "Bias/Fairness","question_text": "某銀行信貸模型上線後稽核發現,女性申請者中「實際具有還款能力卻被模型拒絕」的比例顯著高於男性,但法務限制不允許在推論階段使用性別欄位調整輸出。下列去偏策略何者在此限制下仍可執行?","options": {"A": "訓練中(In-processing):在損失函數加入公平性懲罰項,降低不同群體的錯誤拒絕比例差異","B": "前處理(Pre-processing):僅於訓練資料進行重新採樣,無法直接修正既有模型在推論階段的偏誤","C": "後處理(Post-processing):依性別分組調整決策門檻,使不同群體的錯誤拒絕比例一致","D": "改用人口統計均等指標(Demographic Parity),錯誤拒絕比例差異將自動消失"},"correct_answer": "A","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 10,"evidence": "answer column shows 'A' for question 39"},"verified": true,"verification_needed": null,"explanation": "**為什麼 A 是正解:** 訓練中處理(In-processing)是在模型訓練階段的損失函數中加入公平性懲罰項,直接引導模型學習時降低不同群體間錯誤拒絕比例的差異;性別資訊只需在訓練資料中使用,推論階段模型不需要再讀取性別欄位即可運作,因此不違反「推論階段不允許使用性別欄位」的法務限制。\n\n**其他選項為何錯:**\n- A. ✓ 正解\n- B. 前處理僅調整訓練資料分布,對「已經上線、已訓練完成」的既有模型無法直接產生修正效果,題目情境是既有模型已上線稽核發現問題。\n- C. 後處理需要在推論階段依性別分組調整決策門檻,等於推論時仍要用到性別欄位,違反法務限制。\n- D. 改指標名稱(人口統計均等)不會自動改變模型的實際輸出結果,錯誤拒絕比例差異不會憑空消失。\n\n**記憶要點:** 推論階段不能用敏感屬性 → 只能靠訓練中處理(In-processing,如公平性正則項),後處理通常需要在推論時用到該屬性。","subject_code": "s3"},{"id": "exam-s3-115-1-q40","topic": "DL/Basics","question_text": "分析師準備建立一個能將手寫數字圖片(28x28 像素展平為 784 維度)分為 0~9 共 10 個類別的多層感知機(MLP),且標籤已轉為 One-Hot 編碼(One-Hot Encoding)。為符合 10 個類別的單標籤分類需求,下圖中的程式碼中(A)與(B)的函數應填入何者?","options": {"A": "sigmoid,mean_squared_error","B": "softmax,categorical_crossentropy","C": "relu,binary_crossentropy","D": "tanh,sparse_categorical_crossentropy"},"correct_answer": "B","source": {"file": "subjects/3-ml/past-exam-115-1.pdf","page": 11,"evidence": "answer column shows 'B' for question 40"},"verified": true,"verification_needed": null,"explanation": "**為什麼 B 是正解:** 圖中程式是 10 類別、One-Hot 編碼標籤的「單標籤多分類」問題。輸出層(A)應使用 softmax,將輸出轉換為總和為 1 的機率分布,對應 10 個互斥類別各自的機率;搭配 One-Hot 標籤時,(B)應使用 categorical_crossentropy 作為損失函數,衡量預測機率分布與 One-Hot 標籤之間的差異。\n\n**其他選項為何錯:**\n- A. sigmoid 搭配 mean_squared_error 是迴歸或多標籤情境的組合,不適合互斥的單標籤多分類任務。\n- B. ✓ 正解\n- C. relu 通常用於隱藏層,不適合作為多分類輸出層的激活函數;binary_crossentropy 是二元分類專用損失函數。\n- D. tanh 不是分類輸出層常用的激活函數;sparse_categorical_crossentropy 適用於「整數標籤」而非本題已轉換的 One-Hot 標籤格式。\n\n**記憶要點:** 單標籤多分類 + One-Hot 標籤 → 輸出層 softmax + 損失函數 categorical_crossentropy。","subject_code": "s3","image": "shared/images/exam-s3-115-1-q40-p11.png"},{"id": "exam-s3-115-1-q41","topic": "DL/CNN","question_text": "工程師使用 PyTorch 建立 OCR 訓練 pipeline,並對手寫字母資料集套用下圖程式進行資料增強(Transform)。模型在訓練過程中顯示驗證損失(Validation Loss)持續下降,但實際部署後
